<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Denizalp Aybak — Film</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;

    width: 100%;
    height: 100%;

    background: #fff;
    overflow: hidden;

    -webkit-text-size-adjust: 100%;
    text-size-adjust: 100%;
}

body {
    cursor: default;
}


/* =========================
   LEFT INFORMATION
   ========================= */

.info {
    position: fixed;

    top: 32px;
    left: 48px;

    z-index: 10;

    font-family: Arial, Helvetica, sans-serif;
    font-size: 15px;
    font-weight: 400;
    line-height: 1.15;
}


/* =========================
   LOGO
   ========================= */

.logo {
    position: relative;
    display: block;

    width: 190px;
    height: 52px;

    margin: 0;
    padding: 0;

    color: inherit;
    text-decoration: none;

    cursor: pointer;
}

.logo-name {
    position: absolute;

    top: 0;
    left: 0;

    font-family: Arial, Helvetica, sans-serif;
    font-size: 15px;
    font-weight: 400;
    line-height: 1.15;

    white-space: nowrap;
}

.logo-aybak {
    position: absolute;

    top: 17px;
    left: 0;

    font-family: Arial, Helvetica, sans-serif;
    font-size: 15px;
    font-weight: 400;
    line-height: 1.15;

    letter-spacing: normal;

    white-space: nowrap;
}

.logo-aybak span {
    display: inline;
}


/* =========================
   CONTACT / SOCIAL
   ========================= */

.contact {
    margin: 0;
    padding: 0;
}

.social {
    display: flex;
    flex-direction: column;
    gap: 0;

    margin: 0;
    padding: 0;
}

.info a {
    color: inherit;
    text-decoration: none;
    font-weight: 400;
}

.info a:hover {
    text-decoration: underline;
}


/* =========================
   SECTION SWITCH
   ========================= */

.section-switch {
    position: fixed;

    top: 32px;
    right: 48px;

    z-index: 20;

    color: #000;
    text-decoration: none;

    font-family: Arial, Helvetica, sans-serif;
    font-size: 15px;
    font-weight: 400;
    line-height: 1.15;

    white-space: nowrap;
}


/* =========================
   VIDEO STAGE
   ========================= */

#video-stage {
    position: fixed;
    inset: 0;

    width: 100vw;
    height: 100vh;

    display: flex;
    align-items: center;
    justify-content: center;

    pointer-events: none;
}


/* =========================
   VIDEO BLOCK
   ========================= */

#video-block {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;

    width: auto;
    height: auto;

    pointer-events: none;
}


/* =========================
   VIDEO
   ========================= */

#film-video {
    display: block;

    width: auto;
    height: auto;

    max-width: 64vw;
    max-height: 76vh;

    object-fit: contain;

    pointer-events: none;
}


/* =========================
   CONTROLS
   ========================= */

#controls {
    display: flex;

    /*
        JavaScript matches this exactly
        to the actual rendered video width.
    */

    width: auto;

    align-items: center;
    justify-content: space-between;

    margin-top: 10px;

    font-family: Arial, Helvetica, sans-serif;
    font-size: 15px;
    font-weight: 400;
    line-height: 1.15;

    white-space: nowrap;

    pointer-events: auto;
}

#controls button {
    appearance: none;
    -webkit-appearance: none;

    margin: 0;
    padding: 0;

    border: 0;
    outline: none;

    background: transparent;

    color: #000;

    font-family: Arial, Helvetica, sans-serif;
    font-size: 15px;
    font-weight: 400;
    line-height: 1.15;

    text-decoration: none;

    cursor: pointer;

    -webkit-tap-highlight-color: transparent;
}


/*
    Desktop only.

    This prevents touch browsers from
    keeping a sticky :hover state.
*/

@media (hover: hover) and (pointer: fine) {

    #controls button:hover {
        text-decoration: underline;
    }

}


/* =========================
   MOBILE
   ========================= */

@media (max-width: 600px) {

    .info {
        top: 20px;
        left: 24px;

        font-size: 13px;
    }

    .logo {
        width: 160px;
        height: 45px;
    }

    .logo-name {
        font-size: 13px;
    }

    .logo-aybak {
        top: 15px;

        font-size: 13px;
    }

    .section-switch {
        top: 20px;
        right: 24px;

        font-size: 13px;
    }

    #video-stage {
        top: 92px;
        bottom: 18px;

        height: auto;

        padding: 0 24px;
    }

    #video-block {
        width: 100%;
        max-width: 84vw;
    }

    #film-video {
        max-width: 84vw;
        max-height: 60vh;
    }

    #controls {
        width: auto;

        margin-top: 10px;

        font-size: 13px;
    }

    #controls button {
        font-size: 13px;

        text-decoration: none !important;
    }


    /*
        Mobile must never visually retain
        hover / focus / active underline.
    */

    #controls button:hover,
    #controls button:focus,
    #controls button:focus-visible,
    #controls button:active {
        text-decoration: none !important;
        outline: none;
    }

}


/* =========================
   SHORT LANDSCAPE
   ========================= */

@media (orientation: landscape) and (max-height: 700px) {

    .info {
        top: 20px;
        left: 24px;

        font-size: 13px;
    }

    .logo {
        width: 160px;
        height: 45px;
    }

    .logo-name,
    .logo-aybak {
        font-size: 13px;
    }

    .logo-aybak {
        top: 15px;
    }

    .section-switch {
        top: 20px;
        right: 24px;

        font-size: 13px;
    }


    /*
        Leave room for the information
        block on the left.
    */

    #video-stage {
        inset: 0;

        left: 190px;

        width: calc(100vw - 214px);
        height: 100vh;

        padding: 16px 24px;
    }

    #video-block {
        width: 100%;
        max-width: none;
    }

    #film-video {
        max-width: 62vw;
        max-height: 60vh;
    }

    #controls {
        width: auto;

        margin-top: 8px;

        font-size: 13px;
    }

    #controls button {
        font-size: 13px;
    }

}

</style>

</head>


<body>


<!-- =========================
     LEFT INFORMATION
     ========================= -->

<div class="info">

    <a
        class="logo"
        href="https://denizalpaybak.com/"
    >

        <span
            class="logo-name"
            id="logo-name"
        >
            Denizalp
        </span>

        <span class="logo-aybak">

            <span id="letter-a">a</span><span id="letter-y">y</span><span id="letter-b">b</span><span id="letter-a2">a</span><span id="letter-k">k</span>

        </span>

    </a>


    <div class="contact">

        <a
            href="mailto:d@denizalpaybak.com"
            target="_blank"
            rel="noopener"
        >
            d@denizalpaybak.com
        </a>

    </div>


    <div class="social">

        <a
            href="https://www.instagram.com/denizalpaybak/"
            target="_blank"
            rel="noopener"
        >
            instagram @denizalpaybak
        </a>

        <a
            href="https://models.com/people/denizalp-aybak"
            target="_blank"
            rel="noopener"
        >
            models.com
        </a>

    </div>

</div>


<!-- =========================
     SECTION SWITCH
     ========================= -->

<a
    class="section-switch"
    id="section-switch"
    href="https://photography.denizalpaybak.com/"
>
    <span id="section-switch-text">photography</span>
</a>


<!-- =========================
     VIDEO
     ========================= -->

<div id="video-stage">

    <div id="video-block">

        <video
            id="film-video"
            muted
            autoplay
            playsinline
            preload="auto"
        ></video>


        <div id="controls">

            <button
                id="previous-button"
                type="button"
            >
                previous
            </button>

            <button
                id="play-button"
                type="button"
            >
                pause
            </button>

            <button
                id="sound-button"
                type="button"
            >
                sound on
            </button>

            <button
                id="next-button"
                type="button"
            >
                next
            </button>

        </div>

    </div>

</div>


<script>


/* =========================
   R2 / FILMS.JSON
   ========================= */

const R2_BASE =
    "https://pub-14d397941aeb40e5bd3f66ac028fef80.r2.dev/";

let films = [];

let currentFilm = 0;

let soundEnabled = false;


/* =========================
   ELEMENTS
   ========================= */

const video =
    document.getElementById(
        "film-video"
    );

const controls =
    document.getElementById(
        "controls"
    );

const previousButton =
    document.getElementById(
        "previous-button"
    );

const playButton =
    document.getElementById(
        "play-button"
    );

const soundButton =
    document.getElementById(
        "sound-button"
    );

const nextButton =
    document.getElementById(
        "next-button"
    );


/* =========================
   DEVICE
   ========================= */

function isMobileLayout() {

    return window.matchMedia(
        "(max-width: 600px)"
    ).matches;

}


/* =========================
   MOBILE BUTTON BLUR
   ========================= */

/*
    Touch browsers can retain focus /
    hover styling after a tap.

    On mobile only, immediately remove
    focus after the button action.
*/

function clearMobileButtonFocus(
    button
) {

    if (
        !isMobileLayout()
    ) {

        return;

    }


    requestAnimationFrame(
        () => {

            button.blur();

        }
    );

}


/* =========================
   CONTROL WIDTH
   ========================= */

function syncControlsWidth() {

    const videoWidth =
        video
            .getBoundingClientRect()
            .width;


    if (
        videoWidth > 0
    ) {

        controls.style.width =
            `${videoWidth}px`;

    }

}


/* =========================
   FILM LIST
   ========================= */

async function loadFilmList() {

    try {

        const response =
            await fetch(
                "./films.json",
                {
                    cache: "no-store"
                }
            );


        if (
            !response.ok
        ) {

            throw new Error(
                "films.json could not be loaded"
            );

        }


        const data =
            await response.json();


        films =
            data.filter(
                item =>
                    typeof item ===
                    "string" &&
                    item.trim() !== ""
            );


        if (
            films.length === 0
        ) {

            return;

        }


        loadFilm(
            0,
            true
        );

    }

    catch (error) {

        console.error(
            error
        );

    }

}


/* =========================
   CONTROLS
   ========================= */

function updateControls() {

    playButton.textContent =
        video.paused
            ? "play"
            : "pause";


    soundButton.textContent =
        soundEnabled
            ? "sound off"
            : "sound on";

}


function applySoundState() {

    video.muted =
        !soundEnabled;

}


function toggleSound() {

    soundEnabled =
        !soundEnabled;


    applySoundState();

    updateControls();

}


function togglePlayback() {

    if (
        video.paused
    ) {

        video
            .play()
            .catch(
                () => {}
            );

    }

    else {

        video.pause();

    }


    updateControls();

}


/* =========================
   LOAD FILM
   ========================= */

function loadFilm(
    index,
    autoplay = true
) {

    if (
        films.length === 0
    ) {

        return;

    }


    if (
        index < 0
    ) {

        index =
            films.length - 1;

    }


    if (
        index >= films.length
    ) {

        index = 0;

    }


    currentFilm =
        index;


    video.pause();


    video.src =
        R2_BASE +
        films[currentFilm];


    video.load();


    applySoundState();


    /*
        Match controls to the newly
        rendered video.
    */

    setTimeout(
        syncControlsWidth,
        50
    );


    if (
        autoplay
    ) {

        video
            .play()
            .catch(
                () => {}
            );

    }


    updateControls();

}


/* =========================
   NEXT / PREVIOUS
   ========================= */

function nextFilm() {

    loadFilm(
        currentFilm + 1,
        true
    );

}


function previousFilm() {

    loadFilm(
        currentFilm - 1,
        true
    );

}


/* =========================
   BUTTONS
   ========================= */

previousButton.addEventListener(
    "click",
    () => {

        previousFilm();

        clearMobileButtonFocus(
            previousButton
        );

    }
);


nextButton.addEventListener(
    "click",
    () => {

        nextFilm();

        clearMobileButtonFocus(
            nextButton
        );

    }
);


playButton.addEventListener(
    "click",
    () => {

        togglePlayback();

        clearMobileButtonFocus(
            playButton
        );

    }
);


soundButton.addEventListener(
    "click",
    () => {

        toggleSound();

        clearMobileButtonFocus(
            soundButton
        );

    }
);


/* =========================
   VIDEO EVENTS
   ========================= */

video.addEventListener(
    "play",
    updateControls
);


video.addEventListener(
    "pause",
    updateControls
);


video.addEventListener(
    "ended",
    nextFilm
);


/*
    Keep control width synchronized
    to actual rendered video width.
*/

video.addEventListener(
    "loadedmetadata",
    syncControlsWidth
);


video.addEventListener(
    "loadeddata",
    syncControlsWidth
);


video.addEventListener(
    "canplay",
    syncControlsWidth
);


video.addEventListener(
    "resize",
    syncControlsWidth
);


window.addEventListener(
    "resize",
    () => {

        requestAnimationFrame(
            syncControlsWidth
        );

    }
);


window.addEventListener(
    "orientationchange",
    () => {

        setTimeout(
            syncControlsWidth,
            150
        );


        setTimeout(
            syncControlsWidth,
            400
        );

    }
);


/* =========================
   LOGO
   ========================= */

const logo =
    document.querySelector(
        ".logo"
    );

const logoName =
    document.getElementById(
        "logo-name"
    );

const letters = [

    document.getElementById(
        "letter-a"
    ),

    document.getElementById(
        "letter-y"
    ),

    document.getElementById(
        "letter-b"
    ),

    document.getElementById(
        "letter-a2"
    ),

    document.getElementById(
        "letter-k"
    )

];


const lowercase = [
    "a",
    "y",
    "b",
    "a",
    "k"
];


const uppercase = [
    "A",
    "Y",
    "B",
    "A",
    "K"
];


let logoState = 0;

let logoTarget = 0;

let logoTimer = null;


function setLogoState(
    state
) {

    logoState =
        state;


    logoName.textContent =
        state === 0
            ? "Denizalp"
            : "denizalp";


    for (
        let i = 0;
        i < letters.length;
        i++
    ) {

        letters[i]
            .textContent =
            i < state
                ? uppercase[i]
                : lowercase[i];

    }

}


function moveLogo() {

    if (
        logoState ===
        logoTarget
    ) {

        logoTimer =
            null;


        return;

    }


    setLogoState(

        logoState <
        logoTarget

            ? logoState + 1
            : logoState - 1

    );


    logoTimer =
        setTimeout(
            moveLogo,
            120
        );

}


function animateTo(
    target
) {

    logoTarget =
        target;


    if (
        logoTimer
    ) {

        clearTimeout(
            logoTimer
        );

    }


    moveLogo();

}


/* =========================
   DESKTOP LOGO
   ========================= */

logo.addEventListener(
    "mouseenter",
    () => {

        if (
            window.innerWidth >
            600
        ) {

            animateTo(
                5
            );

        }

    }
);


logo.addEventListener(
    "mouseleave",
    () => {

        if (
            window.innerWidth >
            600
        ) {

            animateTo(
                0
            );

        }

    }
);


/* =========================
   MOBILE LOGO
   ========================= */

function mobileLogoCycle() {

    setTimeout(
        () => {

            animateTo(
                5
            );


            setTimeout(
                () => {

                    animateTo(
                        0
                    );


                    setTimeout(
                        mobileLogoCycle,
                        2600
                    );

                },
                2600
            );

        },
        2000
    );

}


if (
    window.innerWidth <=
    600
) {

    setLogoState(
        0
    );


    mobileLogoCycle();

}


/* =========================
   SECTION SWITCH
   ========================= */

const sectionSwitch =
    document.getElementById(
        "section-switch"
    );

const sectionSwitchText =
    document.getElementById(
        "section-switch-text"
    );

const switchWord =
    "photography";

let switchState =
    0;

let switchTarget =
    0;

let switchTimer =
    null;


function renderSwitch() {

    let result =
        "";


    for (
        let i = 0;
        i < switchWord.length;
        i++
    ) {

        result +=
            i < switchState

                ? switchWord[i]
                    .toUpperCase()

                : switchWord[i]
                    .toLowerCase();

    }


    sectionSwitchText
        .textContent =
        result;

}


function moveSwitch() {

    if (
        switchState ===
        switchTarget
    ) {

        switchTimer =
            null;


        return;

    }


    switchState +=
        switchState <
        switchTarget
            ? 1
            : -1;


    renderSwitch();


    switchTimer =
        setTimeout(
            moveSwitch,
            120
        );

}


function animateSwitchTo(
    target
) {

    switchTarget =
        target;


    if (
        switchTimer
    ) {

        clearTimeout(
            switchTimer
        );

    }


    moveSwitch();

}


/* =========================
   DESKTOP SECTION SWITCH
   ========================= */

sectionSwitch.addEventListener(
    "mouseenter",
    () => {

        if (
            window.innerWidth >
            600
        ) {

            animateSwitchTo(
                switchWord.length
            );

        }

    }
);


sectionSwitch.addEventListener(
    "mouseleave",
    () => {

        if (
            window.innerWidth >
            600
        ) {

            animateSwitchTo(
                0
            );

        }

    }
);


renderSwitch();


/* =========================
   START
   ========================= */

setLogoState(
    0
);


applySoundState();


updateControls();


loadFilmList();

</script>

</body>
</html>
