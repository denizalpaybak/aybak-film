    indexPreviewVideo.pause();
    indexPreviewVideo.removeAttribute(
        "src"
    );
    indexPreviewVideo.removeAttribute(
        "poster"
    );
    indexPreviewVideo.load();

}


function resetIndexSelection() {

    selectedIndexProject =
        null;

    indexProjectRows.forEach(
        rowState => {
            rowState.titleCase.lower();
            rowState.dateCase.lower();
        }
    );

    indexPreview.classList.remove(
        "visible"
    );

    indexPreview.setAttribute(
        "aria-hidden",
        "true"
    );

    indexProjectAction.classList.remove(
        "visible"
    );

    indexProjectAction.setAttribute(
        "aria-hidden",
        "true"
    );

    stopIndexPreview();

    indexProjectCount.textContent =
        "";

    indexProjectCount.dataset.rawText =
        "";

    if (
        indexViewAllCase
    ) {
        indexViewAllCase.lower();
    }

}


function selectIndexProject(
    rowState
) {

    if (
        !rowState
    ) {
        return;
    }

    const previousSelection =
        selectedIndexProject;

    selectedIndexProject =
        rowState;

    indexProjectRows.forEach(
        state => {

            if (
                state === rowState
            ) {
                state.titleCase.upper();
                state.dateCase.upper();
            }
            else {
                state.titleCase.lower();
                state.dateCase.lower();
            }

        }
    );

    const project =
        rowState.project;

    const filename =
        project.videos[0];

    const nextPreviewSrc =
        previewVideoUrl(
            filename
        );

    const nextPoster =
        posterVideoUrl(
            filename
        );

    if (
        indexPreviewVideo.dataset.masterFilename !==
        filename
    ) {

        indexPreviewVideo.pause();
        indexPreviewVideo.dataset.masterFilename =
            filename;
        indexPreviewVideo.poster =
            nextPoster;
        indexPreviewVideo.src =
            nextPreviewSrc;
        indexPreviewVideo.muted =
            true;
        indexPreviewVideo.loop =
            true;
        indexPreviewVideo.load();

    }

    indexPreviewVideo
        .play()
        .catch(
            () => {}
        );

    indexPreview.classList.add(
        "visible"
    );

    indexPreview.setAttribute(
        "aria-hidden",
        "false"
    );

    const nextCountText =
        getFilmCountText(
            project.videos.length
        );

    if (
        previousSelection &&
        previousSelection !== rowState &&
        indexProjectCount.textContent
    ) {

        morphSequential(
            indexProjectCount,
            nextCountText,
            STATE_MORPH_DURATION
        ).catch(
            () => {}
        );

    }
    else {

        renderBaseTypography(
            indexProjectCount,
            nextCountText
        );

        indexProjectCount.dataset.rawText =
            nextCountText;

    }

    indexProjectAction.classList.add(
        "visible"
    );

    indexProjectAction.setAttribute(
        "aria-hidden",
        "false"
    );

    if (
        indexViewAllCase
    ) {
        indexViewAllCase.lower();
    }

}


/* =====================================================
   INDEX LAYOUT
   Desktop: no scrolling, add columns as needed.
   Phones: one column, responsive gaps, vertical scroll only
   when the minimum one-line gap no longer fits.
   ===================================================== */

function layoutTypographicIndex() {

    if (
        !indexGrid ||
        !indexScroller
    ) {
        return;
    }

    updateResponsiveBodyClasses();

    const total =
        indexProjectRows.length;

    if (
        total === 0
    ) {
        return;
    }

    const computed =
        getComputedStyle(
            document.documentElement
        );

    const fontSize =
        parseFloat(
            computed.getPropertyValue(
                "--font-size"
            )
        ) || 13;

    const lineHeightMultiplier =
        parseFloat(
            computed.getPropertyValue(
                "--line-height"
            )
        ) || 1.15;

    const lineHeight =
        fontSize *
        lineHeightMultiplier;

    const minimumGap =
        lineHeight;

    const edgeGap =
        lineHeight;

    indexProjectRows.forEach(
        state => {
            state.row.style.removeProperty(
                "grid-column"
            );
            state.row.style.removeProperty(
                "grid-row"
            );
        }
    );

    body.classList.remove(
        "index-needs-scroll"
    );

    if (
        isPhoneLayout()
    ) {

        const availableHeight =
            Math.max(
                1,
                indexScroller.clientHeight -
                edgeGap * 2
            );

        const rowHeights =
            indexProjectRows.map(
                state =>
                    Math.max(
                        state.row.scrollHeight,
                        lineHeight * 2
                    )
            );

        const occupiedHeight =
            rowHeights.reduce(
                (
                    sum,
                    value
                ) =>
                    sum + value,
                0
            );

        const gapCount =
            Math.max(
                0,
                total - 1
            );

        const idealGap =
            gapCount
                ? (
                    availableHeight -
                    occupiedHeight
                ) /
                gapCount
                : 0;

        const needsScroll =
            gapCount > 0 &&
            idealGap <
            minimumGap;

        const rowGap =
            gapCount
                ? (
                    needsScroll
                        ? minimumGap
                        : Math.max(
                            minimumGap,
                            idealGap
                        )
                )
                : 0;

        indexGrid.style.setProperty(
            "--index-row-gap",
            `${rowGap}px`
        );

        body.classList.toggle(
            "index-needs-scroll",
            needsScroll
        );

        indexScroller.scrollTop =
            Math.min(
                indexScroller.scrollTop,
                Math.max(
                    0,
                    indexScroller.scrollHeight -
                    indexScroller.clientHeight
                )
            );

        return;

    }

    /* Desktop/tablet: never scroll. Increase columns instead. */
    const availableHeight =
        Math.max(
            1,
            indexScroller.clientHeight -
            edgeGap * 2
        );

    const itemHeight =
        lineHeight * 2;

    const maxRowsByHeight =
        Math.max(
            1,
            Math.floor(
                (
                    availableHeight +
                    minimumGap
                ) /
                (
                    itemHeight +
                    minimumGap
                )
            )
        );

    /*
        Desktop/tablet: keep the text field visually connected to the
        right-side preview. With the current project count, target at
        least three columns instead of collapsing to two.
    */
    const minimumDesktopColumns =
        total >= 3
            ? 3
            : Math.max(
                1,
                total
            );

    const maxRowsForMinimumColumns =
        Math.max(
            1,
            Math.ceil(
                total /
                minimumDesktopColumns
            )
        );

    const rowCount =
        Math.max(
            1,
            Math.min(
                total,
                maxRowsByHeight,
                maxRowsForMinimumColumns
            )
        );

    const columnCount =
        Math.ceil(
            total /
            rowCount
        );

    const gapCount =
        Math.max(
            0,
            rowCount - 1
        );

    const occupiedHeight =
        rowCount *
        itemHeight;

    const rowGap =
        gapCount
            ? Math.max(
                minimumGap,
                (
                    availableHeight -
                    occupiedHeight
                ) /
                gapCount
            )
            : 0;

    const columnGap =
        Math.max(
            26,
            Math.min(
                72,
                indexScroller.clientWidth *
                0.06
            )
        );

    indexGrid.style.setProperty(
        "--index-row-count",
        String(
            rowCount
        )
    );

    indexGrid.style.setProperty(
        "--index-column-count",
        String(
            columnCount
        )
    );

    indexGrid.style.setProperty(
        "--index-row-gap",
        `${rowGap}px`
    );

    indexGrid.style.setProperty(
        "--index-column-gap",
        `${columnGap}px`
    );

    indexProjectRows.forEach(
        (
            state,
            itemIndex
        ) => {

            const columnIndex =
                Math.floor(
                    itemIndex /
                    rowCount
                );

            const localRow =
                itemIndex %
                rowCount;

            state.row.style.gridColumn =
                String(
                    columnIndex + 1
                );

            state.row.style.gridRow =
                String(
                    localRow + 1
                );

        }
    );

}


/* =====================================================
   BUILD TYPOGRAPHIC INDEX
   ===================================================== */

function resizeIndexCards() {

    if (
        indexMode
    ) {
        requestAnimationFrame(
            layoutTypographicIndex
        );
    }

}


function buildIndex() {

    indexGrid.innerHTML =
        "";

    indexProjectRows =
        [];

    resetIndexSelection();

    getChronologicalProjects()
        .forEach(
            item => {

                const project =
                    item.project;

                const originalIndex =
                    item.originalIndex;

                const row =
                    document.createElement(
                        "div"
                    );

                row.className =
                    "index-project-row";

                const titleButton =
                    document.createElement(
                        "button"
                    );

                titleButton.type =
                    "button";

                titleButton.className =
                    "index-project-title";

                const titleBase =
                    project.title
                        .toLowerCase();

                renderBaseTypography(
                    titleButton,
                    titleBase
                );

                const dateButton =
                    document.createElement(
                        "button"
                    );

                dateButton.type =
                    "button";

                dateButton.className =
                    "index-project-date";

                const dateBase =
                    (
                        project.date ||
                        ""
                    ).toLowerCase();

                renderBaseTypography(
                    dateButton,
                    dateBase
                );

                const rowState =
                    {
                        row,
                        project,
                        originalIndex,
                        titleButton,
                        dateButton,
                        titleCase:
                            createCaseController(
                                titleButton,
                                titleBase
                            ),
                        dateCase:
                            createCaseController(
                                dateButton,
                                dateBase
                            )
                    };

                indexProjectRows.push(
                    rowState
                );

                [
                    titleButton,
                    dateButton
                ].forEach(
                    button => {

                        button.addEventListener(
                            "mouseenter",
                            () => {

                                if (
                                    !hasHover()
                                ) {
                                    return;
                                }

                                selectIndexProject(
                                    rowState
                                );

                            }
                        );

                        button.addEventListener(
                            "focus",
                            () => {

                                if (
                                    !hasHover()
                                ) {
                                    return;
                                }

                                selectIndexProject(
                                    rowState
                                );

                            }
                        );

                        button.addEventListener(
                            "click",
                            async event => {

                                event.stopPropagation();

                                /* Desktop: one click. Phones: first tap
                                   selects/previews; second tap opens View All. */
                                if (
                                    !isPhoneLayout()
                                ) {

                                    selectIndexProject(
                                        rowState
                                    );

                                    await new Promise(
                                        resolve =>
                                            requestAnimationFrame(
                                                resolve
                                            )
                                    );

                                    await openSelectedIndexProjectAll();

                                }
                                else if (
                                    selectedIndexProject ===
                                    rowState
                                ) {

                                    await openSelectedIndexProjectAll();

                                }
                                else {

                                    selectIndexProject(
                                        rowState
                                    );

                                }

                            }
                        );

                    }
                );

                row.append(
                    titleButton,
                    dateButton
                );

                indexGrid.appendChild(
                    row
                );

            }
        );

    requestAnimationFrame(
        layoutTypographicIndex
    );

}


/* =====================================================
   INDEX WORD
   ===================================================== */

function renderIndexWord(
    state
) {

    indexWordState =
        state;

    const positions =
        getMorphPositions(
            indexWord
        );

    const activePositions =
        new Set(
            positions.slice(
                0,
                state
            )
        );

    renderInteractiveTypography(
        indexButton,
        renderCaseFromActivePositions(
            indexWord,
            activePositions
        ),
        activePositions
    );

}


function morphIndexTo(
    target
) {

    if (
        indexWordFrame !== null
    ) {
        cancelAnimationFrame(
            indexWordFrame
        );
    }

    const initial =
        indexWordState;

    if (
        initial === target
    ) {
        renderIndexWord(
            target
        );
        return Promise.resolve();
    }

    const start =
        performance.now();

    return new Promise(
        resolve => {

            function frame(
                now
            ) {

                const progress =
                    Math.min(
                        1,
                        (
                            now -
                            start
                        ) /
                        INDEX_TRANSITION_DURATION
                    );

                const state =
                    Math.round(
                        initial +
                        (
                            target -
                            initial
                        ) *
                        progress
                    );

                renderIndexWord(
                    state
                );

                if (
                    progress < 1
                ) {
                    indexWordFrame =
                        requestAnimationFrame(
                            frame
                        );
                }
                else {
                    renderIndexWord(
                        target
                    );
                    indexWordFrame =
                        null;
                    resolve();
                }

            }

            indexWordFrame =
                requestAnimationFrame(
                    frame
                );

        }
    );

}


indexButton.addEventListener(
    "mouseenter",
    () => {

        if (
            isPhoneLayout()
        ) {
            return;
        }

        morphIndexTo(
            indexMode
                ? 0
                : indexWord.length
        );

    }
);


indexButton.addEventListener(
    "mouseleave",
    () => {

        if (
            isPhoneLayout()
        ) {
            return;
        }

        morphIndexTo(
            indexMode
                ? indexWord.length
                : 0
        );

    }
);


/* =====================================================
   INDEX POSITION
   ===================================================== */

function saveIndexPosition() {

    savedIndexScrollTop =
        indexScroller.scrollTop;

}


function restoreIndexPosition() {

    requestAnimationFrame(
        () => {
            indexScroller.scrollTop =
                savedIndexScrollTop;
        }
    );

}


/* =====================================================
   ENTER / RETURN INDEX
   ===================================================== */

async function enterIndex(
    {
        preserveSelection = false,
        preserveAutoplayState = false
    } = {}
) {

    if (
        indexMode ||
        interfaceAnimating
    ) {
        return;
    }

    interfaceAnimating =
        true;

    if (
        !preserveAutoplayState
    ) {
        autoplayBeforeIndex =
            !video.paused;
    }

    video.pause();

    if (
        projectAllMode
    ) {

        projectAllOpenedFromIndex =
            false;

        await leaveProjectAll(
            {
                resume: false
            }
        );

    }

    updateResponsiveBodyClasses();

    indexMode =
        true;

    body.classList.add(
        "index-mode"
    );

    indexView.classList.add(
        "visible"
    );

    restoreIndexPosition();

    requestAnimationFrame(
        layoutTypographicIndex
    );

    if (
        !preserveSelection
    ) {
        resetIndexSelection();
    }
    else if (
        indexSelectionBeforeProjectAll
    ) {

        const preserved =
            indexProjectRows.find(
                state =>
                    state.originalIndex ===
                    indexSelectionBeforeProjectAll.originalIndex
            );

        if (
            preserved
        ) {
            selectIndexProject(
                preserved
            );
        }

    }

    morphIndexTo(
        indexWord.length
    );

    indexScroller.focus(
        {
            preventScroll: true
        }
    );

    interfaceAnimating =
        false;

}


async function returnFromIndex() {

    if (
        !indexMode ||
        interfaceAnimating
    ) {
        return;
    }

    interfaceAnimating =
        true;

    saveIndexPosition();

    resetIndexSelection();

    await morphIndexTo(
        0
    );

    indexView.classList.remove(
        "visible"
    );

    indexMode =
        false;

    body.classList.remove(
        "index-mode"
    );

    if (
        autoplayBeforeIndex
    ) {
        video
            .play()
            .catch(
                () => {}
            );
    }

    interfaceAnimating =
        false;

}


/* =====================================================
   INDEX -> VIEW ALL
   ===================================================== */

async function openSelectedIndexProjectAll() {

    if (
        !indexMode ||
        !selectedIndexProject ||
        interfaceAnimating ||
        projectViewAnimating
    ) {
        return;
    }

    interfaceAnimating =
        true;

    saveIndexPosition();

    projectAllOpenedFromIndex =
        true;

    indexSelectionBeforeProjectAll =
        selectedIndexProject;

    currentProjectIndex =
        normalizeProjectIndex(
            selectedIndexProject.originalIndex
        );

    currentVideoIndex =
        0;

    renderedProjectIndex =
        null;

    syncProjectUrl(
        "push"
    );

    await loadCurrentVideo(
        false
    );

    stopIndexPreview();

    await morphIndexTo(
        0
    );

    indexView.classList.remove(
        "visible"
    );

    indexMode =
        false;

    body.classList.remove(
        "index-mode"
    );

    interfaceAnimating =
        false;

    await enterProjectAll();

}


/* =====================================================
   INDEX PREVIEW / ACTION
   ===================================================== */

indexPreviewVideo.addEventListener(
    "click",
    async event => {

        event.stopPropagation();

        if (
            !selectedIndexProject
        ) {
            return;
        }

        await openSelectedIndexProjectAll();

    }
);


indexViewAllCase =
    createCaseController(
        indexProjectViewAll,
        "view all"
    );


indexProjectViewAll.addEventListener(
    "mouseenter",
    () => {

        if (
            !hasHover() ||
            !selectedIndexProject
        ) {
            return;
        }

        indexViewAllCase.upper();

    }
);


indexProjectViewAll.addEventListener(
    "mouseleave",
    () => {

        if (
            !hasHover()
        ) {
            return;
        }

        indexViewAllCase.lower();

    }
);


indexProjectViewAll.addEventListener(
    "click",
    async event => {

        event.stopPropagation();

        if (
            !selectedIndexProject
        ) {
            return;
        }

        await indexViewAllCase.upper();
        await openSelectedIndexProjectAll();

    }
);


/* =====================================================
   INDEX BUTTON
   ===================================================== */

indexButton.addEventListener(
    "click",
    async event => {

        event.stopPropagation();

        if (
            interfaceAnimating ||
            projectViewAnimating
        ) {
            return;
        }

        if (
            projectAllMode
        ) {

            projectAllOpenedFromIndex =
                false;

            await leaveProjectAll(
                {
                    resume: false
                }
            );

            await enterIndex();
            return;

        }

        if (
            indexMode
        ) {
            await returnFromIndex();
        }
        else {
            await enterIndex();
        }

    }
);


/* =====================================================
   INDEX SCROLL / AYBAK BOUNDARY
   ===================================================== */

const INDEX_BOUNDARY_WHEEL_THRESHOLD =
    48;

const INDEX_NEW_GESTURE_GAP =
    190;


function indexCanScrollVertically() {

    return (
        indexScroller.scrollHeight -
        indexScroller.clientHeight
    ) > 2;

}


function indexIsAtBottom() {

    return (
        indexScroller.scrollTop +
        indexScroller.clientHeight
    ) >= (
        indexScroller.scrollHeight -
        2
    );

}


indexScroller.addEventListener(
    "wheel",
    event => {

        if (
            !indexMode ||
            aybakEndCardActive
        ) {
            return;
        }

        if (
            Math.abs(
                event.deltaY
            ) <=
            Math.abs(
                event.deltaX
            )
        ) {
            return;
        }

        event.preventDefault();

        const now =
            performance.now();

        const newGesture =
            (
                now -
                indexLastWheelTime
            ) >
            INDEX_NEW_GESTURE_GAP;

        indexLastWheelTime =
            now;

        const canScroll =
            indexCanScrollVertically();

        const atBottomBefore =
            indexIsAtBottom();

        if (
            canScroll &&
            (
                event.deltaY < 0 ||
                !atBottomBefore
            )
        ) {

            indexScroller.scrollTop +=
                event.deltaY;

            indexBoundaryWheelAccumulator =
                0;

            return;

        }

        if (
            event.deltaY <= 0
        ) {
            indexBoundaryWheelAccumulator =
                0;
            return;
        }

        if (
            canScroll &&
            !newGesture
        ) {
            return;
        }

        clearTimeout(
            indexBoundaryWheelResetTimer
        );

        indexBoundaryWheelAccumulator +=
            event.deltaY;

        indexBoundaryWheelResetTimer =
            setTimeout(
                () => {
                    indexBoundaryWheelAccumulator =
                        0;
                },
                150
            );

        if (
            indexBoundaryWheelAccumulator >=
            INDEX_BOUNDARY_WHEEL_THRESHOLD
        ) {

            indexBoundaryWheelAccumulator =
                0;

            setAybakEndCard(
                true
            );

        }

    },
    {
        passive: false
    }
);


indexScroller.addEventListener(
    "touchstart",
    event => {

        if (
            !indexMode ||
            !event.changedTouches.length
        ) {
            return;
        }

        indexTouchStartY =
            event.changedTouches[0].clientY;

        indexTouchStartedAtBottom =
            !indexCanScrollVertically() ||
            indexIsAtBottom();

    },
    {
        passive: true
    }
);


indexScroller.addEventListener(
    "touchend",
    event => {

        if (
            !indexMode ||
            indexTouchStartY === null ||
            !event.changedTouches.length
        ) {
            return;
        }

        const endY =
            event.changedTouches[0].clientY;

        const deltaY =
            endY -
            indexTouchStartY;

        indexTouchStartY =
            null;

        if (
            indexTouchStartedAtBottom &&
            deltaY < -52
        ) {
            setAybakEndCard(
                true
            );
        }

    },
    {
        passive: true
    }
);


indexScroller.addEventListener(
    "keydown",
    event => {

        if (
            event.key === "ArrowDown" ||
            event.key === "PageDown" ||
            event.key === "End"
        ) {

            event.preventDefault();
            setAybakEndCard(
                true
            );

        }

    }
);


indexScroller.addEventListener(
    "scroll",
    () => {

        if (
            indexMode
        ) {
            savedIndexScrollTop =
                indexScroller.scrollTop;
        }

    },
    {
        passive: true
    }
);


/* =====================================================
   GLOBAL KEYBOARD
   ===================================================== */

document.addEventListener(
    "keydown",
    event => {

        const target =
            event.target;


        if (
            target &&
            [
                "INPUT",
                "TEXTAREA",
                "SELECT"
            ].includes(
                target.tagName
            )
        ) {

            return;

        }


        if (
            aybakEndCardActive
        ) {

            if (
                event.code === "Escape" ||
                event.code === "ArrowUp" ||
                event.code === "PageUp" ||
                event.code === "Home"
            ) {
                event.preventDefault();
                setAybakEndCard(
                    false
                );
            }

            return;

        }


        if (
            event.code ===
            "Escape"
        ) {

            if (
                projectAllMode
            ) {

                event.preventDefault();


                leaveProjectAll(
                    {
                        resume:
                            true
                    }
                );


                return;

            }


            if (
                indexMode
            ) {

                event.preventDefault();


                returnFromIndex();


                return;

            }

        }


        if (
            indexMode ||
            projectAllMode
        ) {

            return;

        }


        if (
            event.code ===
            "Space"
        ) {

            event.preventDefault();

            togglePlayback();

        }


        else if (
            event.code ===
            "ArrowRight"
        ) {

            event.preventDefault();

            nextFilm();

        }


        else if (
            event.code ===
            "ArrowLeft"
        ) {

            event.preventDefault();

            previousFilm();

        }

    }
);


/* =====================================================
   MOBILE SWIPE
   ===================================================== */

video.addEventListener(
    "touchstart",
    event => {

        if (
            event.touches.length !==
            1
        ) {

            return;

        }


        const touch =
            event.touches[
                0
            ];


        touchStartX =
            touch.clientX;


        touchStartY =
            touch.clientY;


        touchStartTime =
            performance.now();


        touchMoved =
            false;

    },
    {
        passive:
            true
    }
);


video.addEventListener(
    "touchmove",
    event => {

        if (
            event.touches.length !==
            1
        ) {

            return;

        }


        const touch =
            event.touches[
                0
            ];


        if (
            Math.abs(
                touch.clientX -
                touchStartX
            ) >
            10 ||
            Math.abs(
                touch.clientY -
                touchStartY
            ) >
            10
        ) {

            touchMoved =
                true;

        }

    },
    {
        passive:
            true
    }
);


video.addEventListener(
    "touchend",
    event => {

        if (
            !event.changedTouches.length
        ) {

            return;

        }


        const touch =
            event.changedTouches[
                0
            ];


        const dx =
            touch.clientX -
            touchStartX;


        const dy =
            touch.clientY -
            touchStartY;


        const elapsed =
            performance.now() -
            touchStartTime;


        const swipe =
            Math.abs(
                dx
            ) >=
            50 &&
            Math.abs(
                dx
            ) >
            Math.abs(
                dy
            ) *
            1.25 &&
            elapsed <
            700;


        if (
            swipe
        ) {

            if (
                dx <
                0
            ) {

                nextFilm();

            }

            else {

                previousFilm();

            }


            setTimeout(
                () => {

                    touchMoved =
                        false;

                },
                150
            );


            return;

        }


        setTimeout(
            () => {

                touchMoved =
                    false;

            },
            150
        );

    },
    {
        passive:
            true
    }
);


/* =====================================================
   INDEX PREWARM
   ===================================================== */

async function warmIndexPreviews() {

    /*
        Never prewarm the whole index.

        The old desktop path could create requests for every
        project's preview before the user had even opened INDEX.
        On slower mobile connections this strategy is much worse.

        We only prepare metadata for the first one or two cards
        during idle time. Everything else is visibility-driven.
    */

    const previews =
        [
            ...indexGrid
                .querySelectorAll(
                    "video[data-src]"
                )
        ];


    const count =
        isPhoneLayout()
            ? 3
            : 5;


    for (
        let i = 0;
        i < Math.min(
            count,
            previews.length
        );
        i++
    ) {

        const preview =
            previews[i];


        if (
            !preview.getAttribute(
                "src"
            )
        ) {

            preview.src =
                preview.dataset.src;


            preview.preload =
                "metadata";


            preview.load();

        }


        await wait(
            80
        );

    }

}


/* =====================================================
   LOAD PROJECTS
   ===================================================== */

async function loadProjects() {

    try {

        const response =
            await fetch(
                FILMS_JSON,
                {
                    /*
                        Do not force a fresh network transfer on every
                        mobile visit. Normal HTTP cache semantics make
                        repeat opens substantially faster while still
                        respecting the server's cache headers.
                    */
                    cache:
                        "default"
                }
            );


        if (
            !response.ok
        ) {

            throw new Error(
                "films.json could not be loaded"
            );

        }


        const data =
            await response.json();


        projects =
            data
                .filter(
                    project =>
                        project &&
                        typeof project.title ===
                            "string" &&
                        Array.isArray(
                            project.videos
                        ) &&
                        project.videos.length
                )
                .map(
                    prepareProject
                );


        if (
            !projects.length
        ) {

            return;

        }


        buildIndex();


        const deepLink =
            getDeepLinkRequest();


        const requestedProjectIndex =
            findProjectIndexById(
                deepLink.projectId
            );


        currentProjectIndex =
            requestedProjectIndex >= 0
                ? requestedProjectIndex
                : 0;


        const requestedProject =
            currentProject();


        let requestedRuntimeVideoIndex =
            -1;


        if (
            requestedProjectIndex >= 0 &&
            deepLink.videoNumber !==
                null
        ) {

            requestedRuntimeVideoIndex =
                getRuntimeVideoIndexFromOriginalNumber(
                    requestedProject,
                    deepLink.videoNumber
                );

        }


        /*
            A valid project + valid video opens the exact
            original JSON video.

            A project-only URL keeps the site's random
            opening-video behaviour.

            Invalid video numbers safely fall back to the
            project's runtime first video.
        */

        currentVideoIndex =
            requestedRuntimeVideoIndex >= 0
                ? requestedRuntimeVideoIndex
                : 0;


        ensureSeenNormalVideos();


        if (
            requestedProjectIndex >= 0
        ) {

            /*
                External/deep project links are deliberate project opens:
                continue through the remaining videos, then return to max-2.
            */
            fullProjectMode =
                true;


            fullProjectEndIndex =
                currentProject().videos.length - 1;

        }

        else {

            buildNormalProjectSequence(
                currentProjectIndex
            );


            normalSequencePosition =
                0;


            currentVideoIndex =
                normalSequenceVideos[0];


            markNormalVideoSeen(
                currentProjectIndex,
                currentVideoIndex
            );

        }


        if (
            deepLink.projectId &&
            requestedProjectIndex < 0
        ) {

            const cleanUrl =
                new URL(
                    window.location.href
                );


            cleanUrl.searchParams.delete(
                "project"
            );


            cleanUrl.searchParams.delete(
                "video"
            );


            window.history.replaceState(
                {},
                "",
                cleanUrl
            );

        }


        else if (
            requestedProjectIndex >= 0
        ) {

            /*
                Normalize the URL.

                - project-only links gain the exact video
                  number chosen for this visit.
                - invalid video numbers are replaced with
                  the valid fallback video's number.
            */

            syncProjectUrl(
                "replace"
            );

        }


        setSoundLabelImmediately();


        await loadCurrentVideo(
            true
        );


        /*
            Posters are cheap and should feel instant, so warm the
            first visible cluster immediately. Preview MP4 metadata
            remains an idle task.
        */

        warmVisibleIndexPosters();


        const warmIndexWhenIdle =
            () => {

                warmIndexPreviews();

            };


        if (
            "requestIdleCallback" in window
        ) {

            requestIdleCallback(
                warmIndexWhenIdle,
                {
                    timeout:
                        1800
                }
            );

        }

        else {

            setTimeout(
                warmIndexWhenIdle,
                700
            );

        }

    }

    catch (
        error
    ) {

        console.error(
            error
        );

    }

}


/* =====================================================
   BROWSER HISTORY / DEEP LINK NAVIGATION
   ===================================================== */

window.addEventListener(
    "popstate",
    async () => {

        if (
            !projects.length
        ) {

            return;

        }


        const deepLink =
            getDeepLinkRequest();


        const requestedProjectIndex =
            findProjectIndexById(
                deepLink.projectId
            );


        const targetProjectIndex =
            requestedProjectIndex >= 0
                ? requestedProjectIndex
                : 0;


        const targetProject =
            projects[
                targetProjectIndex
            ];


        let targetVideoIndex =
            0;


        if (
            requestedProjectIndex >= 0 &&
            deepLink.videoNumber !==
                null
        ) {

            const resolved =
                getRuntimeVideoIndexFromOriginalNumber(
                    targetProject,
                    deepLink.videoNumber
                );


            if (
                resolved >= 0
            ) {

                targetVideoIndex =
                    resolved;

            }

        }


        if (
            targetProjectIndex ===
                currentProjectIndex &&
            targetVideoIndex ===
                currentVideoIndex &&
            !indexMode &&
            !projectAllMode
        ) {

            return;

        }


        stopAllPreviews();


        indexMode =
            false;


        projectAllMode =
            false;


        body.classList.remove(
            "index-mode",
            "project-all-mode"
        );


        indexView.classList.remove(
            "visible"
        );


        currentProjectIndex =
            targetProjectIndex;


        currentVideoIndex =
            targetVideoIndex;


        renderedProjectIndex =
            null;


        await loadCurrentVideo(
            true
        );

    }
);


/* =====================================================
   RESIZE / ORIENTATION
   ===================================================== */

let resizeTimer =
    null;


window.addEventListener(
    "resize",
    () => {

        if (
            resizeTimer
        ) {

            clearTimeout(
                resizeTimer
            );

        }


        resizeTimer =
            setTimeout(
                () => {

                    fitMainVideo();


                    resizeIndexCards();


                    if (
                        projectAllMode
                    ) {

                        layoutProjectAllGrid();

                    }

                },
                120
            );

    }
);


/* =====================================================
   VISIBILITY
   ===================================================== */

document.addEventListener(
    "visibilitychange",
    () => {

        if (
            document.hidden
        ) {

            resumeAfterVisibility =
                !video.paused &&
                !video.ended &&
                !indexMode &&
                !projectAllMode;


            video.pause();


            stopAllPreviews();


            return;

        }


        if (
            resumeAfterVisibility &&
            !indexMode &&
            !projectAllMode
        ) {

            video
                .play()
                .catch(
                    () => {}
                );

        }


        resumeAfterVisibility =
            false;


        if (
            indexMode
        ) {

            activatePreviewsIn(
                indexGrid
            );

        }


        if (
            projectAllMode
        ) {

            activatePreviewsIn(
                projectAllGrid
            );

        }

    }
);


/* =====================================================
   INIT
   ===================================================== */

updateResponsiveBodyClasses();

fitAybakEndCardWord();

renderIndexWord(
    0
);


loadProjects();



window.addEventListener(
    "resize",
    () => {

        syncIndexToSoundCenter();

    }
);


window.addEventListener(
    "orientationchange",
    () => {

        setTimeout(
            syncIndexToSoundCenter,
            80
        );

    }
);

</script>
