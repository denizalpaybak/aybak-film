<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Denizalp Aybak — Film</title>

<style>

    * {
        box-sizing: border-box;
    }

    html,
    body {
        margin: 0;
        padding: 0;

        width: 100%;
        height: 100%;

        background: transparent;
        overflow: hidden;
    }

    body {
        cursor: pointer;
    }


    /* =========================
       LEFT INFORMATION
       ========================= */

    .info {
        position: fixed;

        top: 32px;
        left: 48px;

        z-index: 10;

        font-family: Arial, Helvetica, sans-serif;
        font-size: 15px;
        font-weight: 400;
        line-height: 1.15;
    }


    /* =========================
       LOGO
       ========================= */

    .logo {
        position: relative;
        display: block;

        width: 190px;
        height: 52px;

        margin: 0;
        padding: 0;

        color: inherit;
        text-decoration: none;

        cursor: pointer;
    }


    .logo-name {
        position: absolute;

        top: 0;
        left: 0;

        font-family: Arial, Helvetica, sans-serif;
        font-size: 15px;
        font-weight: 400;
        line-height: 1.15;

        white-space: nowrap;
    }


    .logo-aybak {
        position: absolute;

        top: 17px;
        left: 0;

        font-family: Arial, Helvetica, sans-serif;
        font-size: 15px;
        font-weight: 400;
        line-height: 1.15;

        letter-spacing: normal;

        white-space: nowrap;
    }


    .logo-aybak span {
        display: inline;
    }


    /* =========================
       CONTACT / SOCIAL
       ========================= */

    .contact {
        margin: 0;
        padding: 0;
    }


    .social {
        display: flex;
        flex-direction: column;
        gap: 0;

        margin: 0;
        padding: 0;
    }


    .info a {
        color: inherit;
        text-decoration: none;
        font-weight: 400;
    }


    .info a:hover {
        text-decoration: underline;
    }


    /* =========================
       VIDEO
       ========================= */

    #video-stage {
        position: fixed;
        inset: 0;

        width: 100vw;
        height: 100vh;

        display: flex;
        align-items: center;
        justify-content: center;

        z-index: 1;

        pointer-events: none;
    }


    #video-block {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;

        width: auto;
        height: auto;

        pointer-events: none;
    }


    #film-video {
        display: block;

        width: auto;
        height: auto;

        /*
            Slightly smaller than Photography
            so it cannot collide with the
            left information block.
        */

        max-width: 64vw;
        max-height: 78vh;

        object-fit: contain;

        cursor: pointer;

        user-select: none;
        -webkit-user-select: none;

        pointer-events: auto;
    }


    /* =========================
       MOBILE CONTROLS
       ========================= */

    #mobile-controls {
        display: none;
    }


    /* =========================
       MOBILE
       ========================= */

    @media (max-width: 600px) {

        .info {
            top: 20px;
            left: 24px;

            font-size: 13px;
        }


        .logo {
            width: 160px;
            height: 45px;

            margin-bottom: 0;
        }


        .logo-name {
            font-size: 13px;
        }


        .logo-aybak {
            top: 15px;

            font-size: 13px;

            letter-spacing: normal;
        }


        #video-stage {
            /*
                Use the available space below
                the information block instead of
                pushing the video too far down.
            */

            top: 92px;
            bottom: 18px;

            height: auto;

            align-items: center;
            justify-content: center;

            padding: 0 24px;
        }


        #video-block {
            width: 100%;
            max-width: 84vw;
        }


        #film-video {
            max-width: 84vw;
            max-height: 62vh;

            pointer-events: auto;
        }


        #mobile-controls {
            display: flex;

            width: 84vw;

            align-items: center;
            justify-content: space-between;

            margin-top: 10px;

            font-family: Arial, Helvetica, sans-serif;
            font-size: 13px;
            font-weight: 400;
            line-height: 1.15;

            white-space: nowrap;

            pointer-events: auto;
        }


        #mobile-controls button {
            appearance: none;
            -webkit-appearance: none;

            margin: 0;
            padding: 0;

            border: 0;
            background: transparent;

            color: #000;

            font-family: Arial, Helvetica, sans-serif;
            font-size: 13px;
            font-weight: 400;
            line-height: 1.15;

            cursor: pointer;
        }

    }

</style>

</head>


<body>


<!-- =========================
     LEFT INFORMATION
     ========================= -->

<div class="info">


    <a
        class="logo"
        href="https://denizalpaybak.com/"
        target="_self"
    >

        <span
            class="logo-name"
            id="logo-name"
        >
            Denizalp
        </span>


        <span class="logo-aybak">

            <span id="letter-a">a</span><span id="letter-y">y</span><span id="letter-b">b</span><span id="letter-a2">a</span><span id="letter-k">k</span>

        </span>

    </a>


    <div class="contact">

        <a
            href="mailto:d@denizalpaybak.com"
            target="_blank"
            rel="noopener"
        >
            d@denizalpaybak.com
        </a>

    </div>


    <div class="social">

        <a
            href="https://www.instagram.com/denizalpaybak/"
            target="_blank"
            rel="noopener"
        >
            instagram @denizalpaybak
        </a>


        <a
            href="https://models.com/people/denizalp-aybak"
            target="_blank"
            rel="noopener"
        >
            models.com
        </a>

    </div>


</div>


<!-- =========================
     VIDEO
     ========================= -->

<div id="video-stage">

    <div id="video-block">

        <video
            id="film-video"
            muted
            autoplay
            playsinline
            preload="auto"
        ></video>


        <!-- MOBILE ONLY -->

        <div id="mobile-controls">

            <button
                id="previous-button"
                type="button"
            >
                &lt; previous
            </button>


            <button
                id="play-button"
                type="button"
            >
                pause
            </button>


            <button
                id="sound-button"
                type="button"
            >
                sound on
            </button>


            <button
                id="next-button"
                type="button"
            >
                next &gt;
            </button>

        </div>

    </div>

</div>


<script>


    /* =====================================================
       R2
       ===================================================== */

    const R2_BASE =
        "https://pub-14d397941aeb40e5bd3f66ac028fef80.r2.dev/";


    /*
        Temporary list.

        films.json comes next.
    */

    const films = [
        "001.mp4"
    ];


    /* =====================================================
       STATE
       ===================================================== */

    let currentFilm = 0;


    /*
        Desktop browsers usually refuse to
        enable audio from hover before the
        page has received a genuine click.

        After the first click, hover audio
        becomes active.
    */

    let desktopAudioUnlocked = false;

    let desktopHoveringVideo = false;


    /*
        Mobile sound is controlled explicitly
        by the visible sound button.
    */

    let mobileSoundEnabled = false;


    /*
        Used so a swipe does not also trigger
        the normal mobile tap/click action.
    */

    let suppressMobileClickUntil = 0;


    /* =====================================================
       ELEMENTS
       ===================================================== */

    const video =
        document.getElementById(
            "film-video"
        );


    const previousButton =
        document.getElementById(
            "previous-button"
        );


    const playButton =
        document.getElementById(
            "play-button"
        );


    const soundButton =
        document.getElementById(
            "sound-button"
        );


    const nextButton =
        document.getElementById(
            "next-button"
        );


    /* =====================================================
       DEVICE
       ===================================================== */

    function isMobile() {

        return window.matchMedia(
            "(max-width: 600px)"
        ).matches;

    }


    /* =====================================================
       SOUND STATE
       ===================================================== */

    function applySoundState() {

        /*
            MOBILE

            Sound is determined only by
            the visible sound button.
        */

        if (isMobile()) {

            video.muted =
                !mobileSoundEnabled;

            return;

        }


        /*
            DESKTOP

            Before the first click:
            always muted.

            Afterwards:
            hover = sound on
            outside = sound off.
        */

        if (
            desktopAudioUnlocked &&
            desktopHoveringVideo
        ) {

            video.muted = false;

        }

        else {

            video.muted = true;

        }

    }


    /* =====================================================
       MOBILE LABELS
       ===================================================== */

    function updateMobileControls() {

        playButton.textContent =
            video.paused
                ? "play"
                : "pause";


        soundButton.textContent =
            mobileSoundEnabled
                ? "sound off"
                : "sound on";

    }


    video.addEventListener(
        "play",
        updateMobileControls
    );


    video.addEventListener(
        "pause",
        updateMobileControls
    );


    /* =====================================================
       LOAD FILM
       ===================================================== */

    function loadFilm(
        index,
        autoplay = true
    ) {

        if (
            films.length === 0
        ) {
            return;
        }


        if (
            index < 0
        ) {

            index =
                films.length - 1;

        }


        if (
            index >= films.length
        ) {

            index = 0;

        }


        currentFilm = index;


        video.pause();


        video.src =
            R2_BASE +
            films[currentFilm];


        video.load();


        /*
            Preserve the user's sound state.

            Desktop:
            depends on hover + audio unlock.

            Mobile:
            depends on sound button.
        */

        applySoundState();


        if (
            autoplay
        ) {

            const promise =
                video.play();


            if (
                promise !== undefined
            ) {

                promise.catch(
                    () => {}
                );

            }

        }


        updateMobileControls();

    }


    /* =====================================================
       NEXT
       ===================================================== */

    function nextFilm() {

        currentFilm++;


        if (
            currentFilm >=
            films.length
        ) {

            currentFilm = 0;

        }


        loadFilm(
            currentFilm,
            true
        );

    }


    /* =====================================================
       PREVIOUS
       ===================================================== */

    function previousFilm() {

        currentFilm--;


        if (
            currentFilm < 0
        ) {

            currentFilm =
                films.length - 1;

        }


        loadFilm(
            currentFilm,
            true
        );

    }


    /* =====================================================
       PLAY / PAUSE
       ===================================================== */

    function togglePlayback() {

        if (
            video.paused
        ) {

            const promise =
                video.play();


            if (
                promise !== undefined
            ) {

                promise.catch(
                    () => {}
                );

            }

        }

        else {

            video.pause();

        }


        updateMobileControls();

    }


    /* =====================================================
       VIDEO END
       ===================================================== */

    video.addEventListener(
        "ended",
        () => {

            nextFilm();

        }
    );


    /* =====================================================
       DESKTOP HOVER — SOUND ONLY
       ===================================================== */

    video.addEventListener(
        "mouseenter",
        () => {

            if (
                isMobile()
            ) {
                return;
            }


            desktopHoveringVideo =
                true;


            /*
                Do NOT attempt to unmute before
                a genuine click has unlocked audio.

                This fixes the first-hover issue
                where some browsers stop playback.
            */

            applySoundState();

        }
    );


    video.addEventListener(
        "mouseleave",
        () => {

            if (
                isMobile()
            ) {
                return;
            }


            desktopHoveringVideo =
                false;


            /*
                Mouse leaves actual video:
                sound immediately off.

                Playback is untouched.
            */

            applySoundState();

        }
    );


    /* =====================================================
       DESKTOP CLICK ZONES
       ===================================================== */

    video.addEventListener(
        "click",
        (event) => {

            if (
                isMobile()
            ) {

                /*
                    Mobile click is handled separately.
                */

                return;

            }


            /*
                The first real click grants the page
                permission to use audio.

                Because the pointer is currently over
                the video, hover sound becomes active.
            */

            desktopAudioUnlocked =
                true;


            applySoundState();


            const rect =
                video.getBoundingClientRect();


            const x =
                event.clientX -
                rect.left;


            const percentage =
                x /
                rect.width;


            /*
                LEFT 25%
                PREVIOUS
            */

            if (
                percentage < 0.25
            ) {

                previousFilm();

                return;

            }


            /*
                RIGHT 25%
                NEXT
            */

            if (
                percentage > 0.75
            ) {

                nextFilm();

                return;

            }


            /*
                CENTER 50%

                ONLY PLAY / PAUSE.

                It does not change sound.
            */

            togglePlayback();

        }
    );


    /* =====================================================
       MOBILE BUTTONS
       ===================================================== */

    previousButton.addEventListener(
        "click",
        (event) => {

            event.stopPropagation();

            previousFilm();

        }
    );


    nextButton.addEventListener(
        "click",
        (event) => {

            event.stopPropagation();

            nextFilm();

        }
    );


    playButton.addEventListener(
        "click",
        (event) => {

            event.stopPropagation();

            togglePlayback();

        }
    );


    soundButton.addEventListener(
        "click",
        (event) => {

            event.stopPropagation();


            mobileSoundEnabled =
                !mobileSoundEnabled;


            /*
                This click is a genuine user
                gesture, so browsers can safely
                enable audio here.
            */

            applySoundState();


            /*
                If sound is enabled while the
                video was paused, do NOT force
                it to play.

                Sound and playback remain separate.
            */

            updateMobileControls();

        }
    );


    /* =====================================================
       MOBILE VIDEO TAP
       ===================================================== */

    video.addEventListener(
        "click",
        () => {

            if (
                !isMobile()
            ) {
                return;
            }


            /*
                Ignore the synthetic click that
                follows a swipe.
            */

            if (
                Date.now() <
                suppressMobileClickUntil
            ) {

                return;

            }


            /*
                Simple tap on the image itself
                = play / pause.

                Sound remains controlled by
                the visible sound button.
            */

            togglePlayback();

        }
    );


    /* =====================================================
       MOBILE SWIPE
       ===================================================== */

    let touchStartX = 0;
    let touchStartY = 0;


    video.addEventListener(
        "touchstart",
        (event) => {

            if (
                !isMobile()
            ) {
                return;
            }


            const touch =
                event.changedTouches[0];


            touchStartX =
                touch.clientX;


            touchStartY =
                touch.clientY;

        },
        {
            passive: true
        }
    );


    video.addEventListener(
        "touchend",
        (event) => {

            if (
                !isMobile()
            ) {
                return;
            }


            const touch =
                event.changedTouches[0];


            const deltaX =
                touch.clientX -
                touchStartX;


            const deltaY =
                touch.clientY -
                touchStartY;


            const threshold = 50;


            if (
                Math.abs(deltaX) >
                    threshold &&
                Math.abs(deltaX) >
                    Math.abs(deltaY)
            ) {

                /*
                    Stop the click generated
                    immediately after this swipe.
                */

                suppressMobileClickUntil =
                    Date.now() + 450;


                /*
                    SWIPE LEFT
                    NEXT
                */

                if (
                    deltaX < 0
                ) {

                    nextFilm();

                }


                /*
                    SWIPE RIGHT
                    PREVIOUS
                */

                else {

                    previousFilm();

                }

            }

        },
        {
            passive: true
        }
    );


    /* =====================================================
       LOGO ANIMATION
       Same logic as Photography
       ===================================================== */

    const logo =
        document.querySelector(
            ".logo"
        );


    const logoName =
        document.getElementById(
            "logo-name"
        );


    const letters = [

        document.getElementById(
            "letter-a"
        ),

        document.getElementById(
            "letter-y"
        ),

        document.getElementById(
            "letter-b"
        ),

        document.getElementById(
            "letter-a2"
        ),

        document.getElementById(
            "letter-k"
        )

    ];


    const lowercase = [
        "a",
        "y",
        "b",
        "a",
        "k"
    ];


    const uppercase = [
        "A",
        "Y",
        "B",
        "A",
        "K"
    ];


    let logoState = 0;

    let logoTarget = 0;

    let logoTimer = null;


    function setLogoState(
        state
    ) {

        logoState = state;


        if (
            state === 0
        ) {

            logoName.textContent =
                "Denizalp";

        }

        else {

            logoName.textContent =
                "denizalp";

        }


        for (
            let i = 0;
            i < letters.length;
            i++
        ) {

            if (
                i < state
            ) {

                letters[i]
                    .textContent =
                    uppercase[i];

            }

            else {

                letters[i]
                    .textContent =
                    lowercase[i];

            }

        }

    }


    function cancelLogoAnimation() {

        if (
            logoTimer !== null
        ) {

            clearTimeout(
                logoTimer
            );


            logoTimer = null;

        }

    }


    function moveLogo() {

        if (
            logoState ===
            logoTarget
        ) {

            logoTimer = null;

            return;

        }


        if (
            logoState <
            logoTarget
        ) {

            setLogoState(
                logoState + 1
            );

        }

        else {

            setLogoState(
                logoState - 1
            );

        }


        logoTimer =
            setTimeout(
                moveLogo,
                120
            );

    }


    function animateTo(
        target
    ) {

        logoTarget =
            target;


        cancelLogoAnimation();


        moveLogo();

    }


    /* =====================================================
       DESKTOP LOGO
       ===================================================== */

    logo.addEventListener(
        "mouseenter",
        () => {

            if (
                window.matchMedia(
                    "(min-width: 601px)"
                ).matches
            ) {

                animateTo(5);

            }

        }
    );


    logo.addEventListener(
        "mouseleave",
        () => {

            if (
                window.matchMedia(
                    "(min-width: 601px)"
                ).matches
            ) {

                animateTo(0);

            }

        }
    );


    /* =====================================================
       MOBILE LOGO
       ===================================================== */

    let mobileCycleTimer =
        null;


    function startMobileCycle() {

        mobileCycleTimer =
            setTimeout(
                () => {

                    animateTo(5);


                    mobileCycleTimer =
                        setTimeout(
                            () => {

                                animateTo(0);


                                mobileCycleTimer =
                                    setTimeout(
                                        () => {

                                            startMobileCycle();

                                        },
                                        600 + 2000
                                    );

                            },
                            600 + 2000
                        );

                },
                2000
            );

    }


    if (
        window.matchMedia(
            "(max-width: 600px)"
        ).matches
    ) {

        setLogoState(0);

        startMobileCycle();

    }


    /* =====================================================
       START
       ===================================================== */

    setLogoState(0);

    updateMobileControls();

    loadFilm(
        0,
        true
    );


</script>

</body>
</html>
