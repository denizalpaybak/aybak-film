<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Denizalp Aybak — Film</title>

<style>

    * {
        box-sizing: border-box;
    }

    html,
    body {
        margin: 0;
        padding: 0;

        width: 100%;
        height: 100%;

        background: transparent;
        overflow: hidden;
    }

    body {
        cursor: default;
    }


    /* =========================
       LEFT INFORMATION
       ========================= */

    .info {
        position: fixed;

        top: 32px;
        left: 48px;

        z-index: 10;

        font-family: Arial, Helvetica, sans-serif;
        font-size: 15px;
        font-weight: 400;
        line-height: 1.15;
    }


    /* =========================
       LOGO
       ========================= */

    .logo {
        position: relative;
        display: block;

        width: 190px;
        height: 52px;

        margin: 0;
        padding: 0;

        color: inherit;
        text-decoration: none;

        cursor: pointer;
    }


    .logo-name {
        position: absolute;

        top: 0;
        left: 0;

        font-family: Arial, Helvetica, sans-serif;
        font-size: 15px;
        font-weight: 400;
        line-height: 1.15;

        white-space: nowrap;
    }


    .logo-aybak {
        position: absolute;

        top: 17px;
        left: 0;

        font-family: Arial, Helvetica, sans-serif;
        font-size: 15px;
        font-weight: 400;
        line-height: 1.15;

        letter-spacing: normal;

        white-space: nowrap;
    }


    .logo-aybak span {
        display: inline;
    }


    /* =========================
       CONTACT / SOCIAL
       ========================= */

    .contact {
        margin: 0;
        padding: 0;
    }


    .social {
        display: flex;
        flex-direction: column;
        gap: 0;

        margin: 0;
        padding: 0;
    }


    .info a {
        color: inherit;
        text-decoration: none;
        font-weight: 400;
    }


    .info a:hover {
        text-decoration: underline;
    }


    /* =========================
       VIDEO STAGE
       ========================= */

    #video-stage {
        position: fixed;
        inset: 0;

        width: 100vw;
        height: 100vh;

        display: flex;
        align-items: center;
        justify-content: center;

        z-index: 1;

        pointer-events: none;
    }


    #video-block {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;

        width: auto;
        height: auto;

        pointer-events: none;
    }


    #film-video {
        display: block;

        width: auto;
        height: auto;

        max-width: 64vw;
        max-height: 76vh;

        object-fit: contain;

        user-select: none;
        -webkit-user-select: none;

        pointer-events: none;
    }


    /* =========================
       CONTROLS
       ========================= */

    #controls {
        display: flex;

        width: 64vw;

        align-items: center;
        justify-content: space-between;

        margin-top: 10px;

        font-family: Arial, Helvetica, sans-serif;
        font-size: 15px;
        font-weight: 400;
        line-height: 1.15;

        white-space: nowrap;

        pointer-events: auto;
    }


    #controls button {
        appearance: none;
        -webkit-appearance: none;

        margin: 0;
        padding: 0;

        border: 0;
        background: transparent;

        color: #000;

        font-family: Arial, Helvetica, sans-serif;
        font-size: 15px;
        font-weight: 400;
        line-height: 1.15;

        cursor: pointer;
    }


    #controls button:hover {
        text-decoration: underline;
    }


    /* =========================
       MOBILE
       ========================= */

    @media (max-width: 600px) {

        .info {
            top: 20px;
            left: 24px;

            font-size: 13px;
        }


        .logo {
            width: 160px;
            height: 45px;

            margin-bottom: 0;
        }


        .logo-name {
            font-size: 13px;
        }


        .logo-aybak {
            top: 15px;

            font-size: 13px;

            letter-spacing: normal;
        }


        #video-stage {
            top: 92px;
            bottom: 18px;

            height: auto;

            padding: 0 24px;
        }


        #video-block {
            width: 100%;
            max-width: 84vw;
        }


        #film-video {
            max-width: 84vw;
            max-height: 60vh;
        }


        #controls {
            width: 84vw;

            margin-top: 10px;

            font-size: 13px;
        }


        #controls button {
            font-size: 13px;
        }

    }

</style>

</head>


<body>


<!-- =========================
     LEFT INFORMATION
     ========================= -->

<div class="info">

    <a
        class="logo"
        href="https://denizalpaybak.com/"
        target="_self"
    >

        <span
            class="logo-name"
            id="logo-name"
        >
            Denizalp
        </span>

        <span class="logo-aybak">

            <span id="letter-a">a</span><span id="letter-y">y</span><span id="letter-b">b</span><span id="letter-a2">a</span><span id="letter-k">k</span>

        </span>

    </a>


    <div class="contact">

        <a
            href="mailto:d@denizalpaybak.com"
            target="_blank"
            rel="noopener"
        >
            d@denizalpaybak.com
        </a>

    </div>


    <div class="social">

        <a
            href="https://www.instagram.com/denizalpaybak/"
            target="_blank"
            rel="noopener"
        >
            instagram @denizalpaybak
        </a>

        <a
            href="https://models.com/people/denizalp-aybak"
            target="_blank"
            rel="noopener"
        >
            models.com
        </a>

    </div>

</div>


<!-- =========================
     VIDEO
     ========================= -->

<div id="video-stage">

    <div id="video-block">

        <video
            id="film-video"
            muted
            autoplay
            playsinline
            preload="auto"
        ></video>


        <div id="controls">

            <button
                id="previous-button"
                type="button"
            >
                previous
            </button>


            <button
                id="play-button"
                type="button"
            >
                pause
            </button>


            <button
                id="sound-button"
                type="button"
            >
                sound on
            </button>


            <button
                id="next-button"
                type="button"
            >
                next
            </button>

        </div>

    </div>

</div>


<script>


    /* =====================================================
       R2
       ===================================================== */

    const R2_BASE =
        "https://pub-14d397941aeb40e5bd3f66ac028fef80.r2.dev/";


    /* =====================================================
       FILM LIST
       Loaded from films.json
       ===================================================== */

    let films = [];


    /* =====================================================
       STATE
       ===================================================== */

    let currentFilm = 0;

    let soundEnabled = false;


    /* =====================================================
       ELEMENTS
       ===================================================== */

    const video =
        document.getElementById(
            "film-video"
        );


    const previousButton =
        document.getElementById(
            "previous-button"
        );


    const playButton =
        document.getElementById(
            "play-button"
        );


    const soundButton =
        document.getElementById(
            "sound-button"
        );


    const nextButton =
        document.getElementById(
            "next-button"
        );


    /* =====================================================
       LOAD FILMS.JSON
       ===================================================== */

    async function loadFilmList() {

        try {

            const response =
                await fetch(
                    "./films.json",
                    {
                        cache: "no-store"
                    }
                );


            if (
                !response.ok
            ) {

                throw new Error(
                    "films.json could not be loaded."
                );

            }


            const data =
                await response.json();


            if (
                !Array.isArray(data) ||
                data.length === 0
            ) {

                throw new Error(
                    "films.json contains no films."
                );

            }


            /*
                Only keep valid strings.
            */

            films =
                data.filter(
                    item =>
                        typeof item === "string" &&
                        item.trim() !== ""
                );


            if (
                films.length === 0
            ) {

                throw new Error(
                    "films.json contains no valid film filenames."
                );

            }


            /*
                Start with the first film
                listed in films.json.
            */

            loadFilm(
                0,
                true
            );

        }

        catch (error) {

            console.error(
                "Could not load film list:",
                error
            );

        }

    }


    /* =====================================================
       LABELS
       ===================================================== */

    function updateControls() {

        playButton.textContent =
            video.paused
                ? "play"
                : "pause";


        soundButton.textContent =
            soundEnabled
                ? "sound off"
                : "sound on";

    }


    /* =====================================================
       SOUND
       ===================================================== */

    function applySoundState() {

        video.muted =
            !soundEnabled;

    }


    function toggleSound() {

        soundEnabled =
            !soundEnabled;


        applySoundState();

        updateControls();

    }


    /* =====================================================
       PLAY / PAUSE
       ===================================================== */

    function togglePlayback() {

        if (
            video.paused
        ) {

            const promise =
                video.play();


            if (
                promise !== undefined
            ) {

                promise.catch(
                    () => {}
                );

            }

        }

        else {

            video.pause();

        }


        updateControls();

    }


    /* =====================================================
       LOAD FILM
       ===================================================== */

    function loadFilm(
        index,
        autoplay = true
    ) {

        if (
            films.length === 0
        ) {

            return;

        }


        if (
            index < 0
        ) {

            index =
                films.length - 1;

        }


        if (
            index >= films.length
        ) {

            index = 0;

        }


        currentFilm =
            index;


        video.pause();


        video.src =
            R2_BASE +
            films[currentFilm];


        video.load();


        /*
            Preserve sound state when
            moving between films.
        */

        applySoundState();


        if (
            autoplay
        ) {

            const promise =
                video.play();


            if (
                promise !== undefined
            ) {

                promise.catch(
                    () => {}
                );

            }

        }


        updateControls();

    }


    /* =====================================================
       NEXT
       ===================================================== */

    function nextFilm() {

        if (
            films.length === 0
        ) {

            return;

        }


        currentFilm++;


        if (
            currentFilm >=
            films.length
        ) {

            currentFilm = 0;

        }


        loadFilm(
            currentFilm,
            true
        );

    }


    /* =====================================================
       PREVIOUS
       ===================================================== */

    function previousFilm() {

        if (
            films.length === 0
        ) {

            return;

        }


        currentFilm--;


        if (
            currentFilm < 0
        ) {

            currentFilm =
                films.length - 1;

        }


        loadFilm(
            currentFilm,
            true
        );

    }


    /* =====================================================
       BUTTONS
       ===================================================== */

    previousButton.addEventListener(
        "click",
        () => {

            previousFilm();

        }
    );


    nextButton.addEventListener(
        "click",
        () => {

            nextFilm();

        }
    );


    playButton.addEventListener(
        "click",
        () => {

            togglePlayback();

        }
    );


    soundButton.addEventListener(
        "click",
        () => {

            toggleSound();

        }
    );


    /* =====================================================
       VIDEO EVENTS
       ===================================================== */

    video.addEventListener(
        "play",
        updateControls
    );


    video.addEventListener(
        "pause",
        updateControls
    );


    /*
        When a film finishes naturally,
        automatically move to the next film.
    */

    video.addEventListener(
        "ended",
        () => {

            nextFilm();

        }
    );


    /* =====================================================
       LOGO ANIMATION
       ===================================================== */

    const logo =
        document.querySelector(
            ".logo"
        );


    const logoName =
        document.getElementById(
            "logo-name"
        );


    const letters = [

        document.getElementById(
            "letter-a"
        ),

        document.getElementById(
            "letter-y"
        ),

        document.getElementById(
            "letter-b"
        ),

        document.getElementById(
            "letter-a2"
        ),

        document.getElementById(
            "letter-k"
        )

    ];


    const lowercase = [
        "a",
        "y",
        "b",
        "a",
        "k"
    ];


    const uppercase = [
        "A",
        "Y",
        "B",
        "A",
        "K"
    ];


    let logoState = 0;

    let logoTarget = 0;

    let logoTimer = null;


    function setLogoState(
        state
    ) {

        logoState =
            state;


        if (
            state === 0
        ) {

            logoName.textContent =
                "Denizalp";

        }

        else {

            logoName.textContent =
                "denizalp";

        }


        for (
            let i = 0;
            i < letters.length;
            i++
        ) {

            if (
                i < state
            ) {

                letters[i]
                    .textContent =
                    uppercase[i];

            }

            else {

                letters[i]
                    .textContent =
                    lowercase[i];

            }

        }

    }


    function cancelLogoAnimation() {

        if (
            logoTimer !== null
        ) {

            clearTimeout(
                logoTimer
            );


            logoTimer =
                null;

        }

    }


    function moveLogo() {

        if (
            logoState ===
            logoTarget
        ) {

            logoTimer =
                null;


            return;

        }


        if (
            logoState <
            logoTarget
        ) {

            setLogoState(
                logoState + 1
            );

        }

        else {

            setLogoState(
                logoState - 1
            );

        }


        logoTimer =
            setTimeout(
                moveLogo,
                120
            );

    }


    function animateTo(
        target
    ) {

        logoTarget =
            target;


        cancelLogoAnimation();


        moveLogo();

    }


    /* =====================================================
       DESKTOP LOGO
       ===================================================== */

    logo.addEventListener(
        "mouseenter",
        () => {

            if (
                window.matchMedia(
                    "(min-width: 601px)"
                ).matches
            ) {

                animateTo(5);

            }

        }
    );


    logo.addEventListener(
        "mouseleave",
        () => {

            if (
                window.matchMedia(
                    "(min-width: 601px)"
                ).matches
            ) {

                animateTo(0);

            }

        }
    );


    /* =====================================================
       MOBILE LOGO
       ===================================================== */

    let mobileCycleTimer =
        null;


    function startMobileCycle() {

        mobileCycleTimer =
            setTimeout(
                () => {

                    animateTo(5);


                    mobileCycleTimer =
                        setTimeout(
                            () => {

                                animateTo(0);


                                mobileCycleTimer =
                                    setTimeout(
                                        () => {

                                            startMobileCycle();

                                        },
                                        2600
                                    );

                            },
                            2600
                        );

                },
                2000
            );

    }


    if (
        window.matchMedia(
            "(max-width: 600px)"
        ).matches
    ) {

        setLogoState(0);

        startMobileCycle();

    }


    /* =====================================================
       START
       ===================================================== */

    setLogoState(0);

    applySoundState();

    updateControls();


    /*
        Fetch films.json and start
        the first film.
    */

    loadFilmList();


</script>

</body>
</html>
