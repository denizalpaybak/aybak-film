/* =====================================================
   PREVIEW VIDEO
   ===================================================== */

function createPreviewVideo(
    filename,
    {
        eagerMetadata =
            false
    } = {}
) {

    const preview =
        document.createElement(
            "video"
        );


    preview.dataset.masterSrc =
        videoUrl(
            filename
        );


    preview.dataset.src =
        previewVideoUrl(
            filename
        );


    /*
        Poster-first loading:

        The JPG appears immediately, before MP4 metadata or
        decoded video frames are ready. The browser keeps the
        poster visible until the preview has a drawable frame.
    */

    preview.poster =
        posterVideoUrl(
            filename
        );


    preview.dataset.usingFallback =
        "0";


    preview.muted =
        true;


    preview.defaultMuted =
        true;


    preview.playsInline =
        true;


    /*
        The files in /film-previews/ are already six-second
        web previews, so native loop is both simpler and
        smoother than seeking currentTime back to zero from
        a timeupdate handler.
    */

    preview.loop =
        true;


    preview.preload =
        eagerMetadata
            ? "metadata"
            : "none";


    preview.disablePictureInPicture =
        true;


    preview.setAttribute(
        "aria-hidden",
        "true"
    );


    /*
        Safety fallback:

        If one preview was accidentally not uploaded or was
        named differently, that one tile can still fall back
        to the original master instead of remaining blank.

        This should normally never run.
    */

    preview.addEventListener(
        "error",
        () => {

            if (
                preview.dataset.usingFallback ===
                "1"
            ) {

                return;

            }


            preview.dataset.usingFallback =
                "1";


            preview.dataset.src =
                preview.dataset.masterSrc;


            preview.dataset.previewReady =
                "0";


            preview.dataset.previewQueued =
                "0";


            preview.removeAttribute(
                "src"
            );


            preview.load();


            if (
                preview.dataset.previewWanted ===
                "1"
            ) {

                activatePreview(
                    preview
                );

            }

        }
    );


    if (
        eagerMetadata
    ) {

        preview.src =
            preview.dataset.src;


        preview.load();

    }


    return preview;

}


/* =====================================================
   POSTER PRELOAD
   ===================================================== */

const posterWarmCache =
    new Set();


function warmPoster(
    filename
) {

    const url =
        posterVideoUrl(
            filename
        );


    if (
        posterWarmCache.has(
            url
        )
    ) {

        return;

    }


    posterWarmCache.add(
        url
    );


    const image =
        new Image();


    image.decoding =
        "async";


    image.src =
        url;

}


function warmVisibleIndexPosters() {

    if (
        !projects.length
    ) {

        return;

    }


    const visibleCount =
        isPhoneLayout()
            ? 4
            : 7;


    getChronologicalProjects()
        .slice(
            0,
            visibleCount
        )
        .forEach(
            ({ project }) => {

                warmPoster(
                    project.videos[0]
                );

            }
        );

}


/* =====================================================
   PREVIEW ACTIVATION MANAGER
   ===================================================== */

/*
    The old site could ask many full-resolution MP4 files
    to initialise at the same moment.

    That is particularly expensive on mobile Safari:
    network range requests, metadata parsing and video
    decoder startup all compete with each other.

    We now limit only the EXPENSIVE INITIALISATION step.

    Once a preview is ready it can keep playing, but new
    previews enter through a small queue.
*/

const PREVIEW_INIT_CONCURRENCY =
    isPhoneLayout()
        ? 3
        : 6;


let previewInitActive =
    0;


const previewInitQueue =
    [];


function releasePreviewInitSlot() {

    previewInitActive =
        Math.max(
            0,
            previewInitActive - 1
        );


    processPreviewInitQueue();

}


function processPreviewInitQueue() {

    while (
        previewInitActive <
            PREVIEW_INIT_CONCURRENCY &&
        previewInitQueue.length
    ) {

        const preview =
            previewInitQueue.shift();


        if (
            preview
        ) {

            preview.dataset.previewQueued =
                "0";

        }


        if (
            !preview ||
            preview.dataset.previewWanted !==
                "1"
        ) {

            continue;

        }


        if (
            preview.dataset.previewReady ===
            "1"
        ) {

            preview
                .play()
                .catch(
                    () => {}
                );


            continue;

        }


        previewInitActive++;


        let released =
            false;


        const release =
            () => {

                if (
                    released
                ) {

                    return;

                }


                released =
                    true;


                preview.dataset.previewReady =
                    "1";


                releasePreviewInitSlot();

            };


        const onReady =
            () => {

                release();


                if (
                    preview.dataset.previewWanted ===
                    "1"
                ) {

                    preview
                        .play()
                        .catch(
                            () => {}
                        );

                }

            };


        const onError =
            () => {

                release();

            };


        preview.addEventListener(
            "canplay",
            onReady,
            {
                once: true
            }
        );


        preview.addEventListener(
            "error",
            onError,
            {
                once: true
            }
        );


        if (
            !preview.getAttribute(
                "src"
            )
        ) {

            preview.src =
                preview.dataset.src;

        }


        /*
            "auto" matters here.

            On the previous mobile implementation we often
            switched an intersecting preview only to
            preload="metadata" and immediately called play().
            Some browsers then took a long time before enough
            media bytes were fetched to actually display motion.
        */

        preview.preload =
            "auto";


        preview.load();


        /*
            Avoid a blocked queue forever on an unusually slow
            / failed media request.
        */

        setTimeout(
            release,
            isPhoneLayout()
                ? 2200
                : 1600
        );

    }

}


function activatePreview(
    preview
) {

    preview.dataset.previewWanted =
        "1";


    if (
        preview.dataset.previewReady ===
        "1"
    ) {

        preview
            .play()
            .catch(
                () => {}
            );


        return;

    }


    if (
        preview.dataset.previewQueued ===
        "1"
    ) {

        return;

    }


    preview.dataset.previewQueued =
        "1";


    previewInitQueue.push(
        preview
    );


    processPreviewInitQueue();

}


function deactivatePreview(
    preview
) {

    preview.dataset.previewWanted =
        "0";


    preview.pause();

}


function activatePreviewsIn(
    container
) {

    container
        .querySelectorAll(
            "video[data-src]"
        )
        .forEach(
            activatePreview
        );

}


function stopAllPreviews() {

    document
        .querySelectorAll(
            "#index-view video, #project-all-view video"
        )
        .forEach(
            deactivatePreview
        );

}


/* =====================================================
   PREVIEW OBSERVER
   ===================================================== */

const previewObserver =
    new IntersectionObserver(
        entries => {

            entries.forEach(
                entry => {

                    const preview =
                        entry.target;


                    const allowed =
                        (
                            indexMode &&
                            indexView.contains(
                                preview
                            )
                        ) ||
                        (
                            projectAllMode &&
                            projectAllView.contains(
                                preview
                            )
                        );


                    if (
                        entry.isIntersecting &&
                        allowed
                    ) {

                        activatePreview(
                            preview
                        );

                    }

                    else {

                        deactivatePreview(
                            preview
                        );

                    }

                }
            );

        },
        {
            /*
                Wake only near-visible videos.

                Desktop gets a little more look-ahead;
                phones keep this tight to save bandwidth.
            */
            rootMargin:
                isPhoneLayout()
                    ? "80px"
                    : "260px"
        }
    );


function observePreview(
    preview
) {

    previewObserver.observe(
        preview
    );

}


/* =====================================================
   VIEW ALL BOUNDS
   ===================================================== */

function syncProjectAllBounds() {

    if (
        !projectAllMode
    ) {

        return;

    }


    /*
        LANDSCAPE:
        match photography's broad central field.

        Previews are allowed to spread almost edge-to-edge
        horizontally. The info block remains above them,
        while the title/date + all/close row remains below.
    */

    if (
        isPhoneLandscape()
    ) {

        const infoRect =
            info.getBoundingClientRect();


        const metaRect =
            projectMeta.getBoundingClientRect();


        const top =
            Math.ceil(
                infoRect.bottom + 8
            );


        const bottom =
            Math.floor(
                metaRect.top - 8
            );


        projectAllView.style.left =
            "24px";


        projectAllView.style.right =
            "24px";


        projectAllView.style.top =
            `${top}px`;


        projectAllView.style.height =
            `${Math.max(
                82,
                bottom - top
            )}px`;


        return;

    }


    const infoRect =
        info
            .getBoundingClientRect();


    const metaRect =
        projectMeta
            .getBoundingClientRect();


    const side =
        parseFloat(
            getComputedStyle(
                document.documentElement
            ).getPropertyValue(
                "--side"
            )
        ) || 48;


    const topGap =
        isPhonePortrait()
            ? 10
            : 14;


    const bottomGap =
        isPhonePortrait()
            ? 10
            : 14;


    const top =
        Math.ceil(
            infoRect.bottom +
            topGap
        );


    const bottom =
        Math.floor(
            metaRect.top -
            bottomGap
        );


    projectAllView.style.left =
        `${side}px`;


    projectAllView.style.right =
        `${side}px`;


    projectAllView.style.top =
        `${top}px`;


    projectAllView.style.height =
        `${Math.max(
            80,
            bottom -
            top
        )}px`;

}


/* =====================================================
   VIEW ALL RATIOS
   ===================================================== */

function getProjectAllRatios() {

    return [
        ...projectAllGrid
            .querySelectorAll(
                "video"
            )
    ].map(
        preview => {

            const storedRatio =
                Number.parseFloat(
                    preview.dataset.ratio ||
                    ""
                );


            if (
                Number.isFinite(
                    storedRatio
                ) &&
                storedRatio > 0
            ) {

                return storedRatio;

            }


            if (
                preview.videoWidth &&
                preview.videoHeight
            ) {

                return (
                    preview.videoWidth /
                    preview.videoHeight
                );

            }


            return 16 / 9;

        }
    );

}


/* =====================================================
   SMART VIEW ALL LAYOUT
   ===================================================== */

/*
    VIEW ALL no longer uses equal-size CSS grid cells.

    Equal cells waste a lot of mobile space because a contained
    landscape video sitting inside a tall cell can only use a small
    fraction of that cell's width. Instead, we test every contiguous
    row grouping while preserving the film order.

    Inside a row all thumbnails share one visible height and keep
    their real aspect ratio. A row therefore behaves like a strip of
    contact-sheet frames rather than a set of empty boxes.

    Example with three landscape clips on a portrait phone:

        old: 3 equal-height grid rows -> narrow videos in the middle
        new: 1 full-width clip + 2 half-width clips

    The chosen arrangement is the one that gives the greatest total
    visible video area inside the available View All field.
*/

function getProjectAllGap() {

    return isPhoneLayout()
        ? 5
        : 7;

}


function getContiguousRowPartitions(
    count
) {

    if (
        count <= 0
    ) {

        return [];

    }


    const partitions =
        [];


    const breakCount =
        count - 1;


    const combinations =
        1 << breakCount;


    for (
        let mask = 0;
        mask < combinations;
        mask++
    ) {

        const rows =
            [];


        let start =
            0;


        for (
            let i = 0;
            i < breakCount;
            i++
        ) {

            if (
                mask &
                (1 << i)
            ) {

                rows.push(
                    [
                        start,
                        i + 1
                    ]
                );


                start =
                    i + 1;

            }

        }


        rows.push(
            [
                start,
                count
            ]
        );


        partitions.push(
            rows
        );

    }


    return partitions;

}


function calculateProjectAllLayout() {

    const rect =
        projectAllView
            .getBoundingClientRect();


    const ratios =
        getProjectAllRatios();


    const count =
        ratios.length;


    if (
        !count ||
        rect.width <= 0 ||
        rect.height <= 0
    ) {

        return null;

    }


    const gap =
        getProjectAllGap();


    /*
        Exhaustive row grouping is tiny for portfolio-sized projects,
        but keep a safe fallback if a future project contains many clips.
    */
    const partitions =
        count <= 12
            ? getContiguousRowPartitions(
                count
            )
            : [
                Array.from(
                    {
                        length:
                            Math.ceil(
                                count / 3
                            )
                    },
                    (_, rowIndex) => [
                        rowIndex * 3,
                        Math.min(
                            count,
                            rowIndex * 3 + 3
                        )
                    ]
                )
            ];


    let best =
        null;


    partitions.forEach(
        rows => {

            const rowData =
                rows.map(
                    ([start, end]) => {

                        const rowRatios =
                            ratios.slice(
                                start,
                                end
                            );


                        const horizontalGaps =
                            gap *
                            Math.max(
                                0,
                                rowRatios.length - 1
                            );


                        const availableRowWidth =
                            Math.max(
                                1,
                                rect.width -
                                horizontalGaps
                            );


                        const ratioSum =
                            rowRatios.reduce(
                                (
                                    sum,
                                    ratio
                                ) =>
                                    sum + ratio,
                                0
                            );


                        const fullWidthHeight =
                            availableRowWidth /
                            ratioSum;


                        return {
                            start,
                            end,
                            ratios:
                                rowRatios,
                            horizontalGaps,
                            fullWidthHeight
                        };

                    }
                );


            const verticalGaps =
                gap *
                Math.max(
                    0,
                    rowData.length - 1
                );


            const availableHeight =
                Math.max(
                    1,
                    rect.height -
                    verticalGaps
                );


            const naturalHeight =
                rowData.reduce(
                    (
                        sum,
                        row
                    ) =>
                        sum +
                        row.fullWidthHeight,
                    0
                );


            const scale =
                Math.min(
                    1,
                    availableHeight /
                    naturalHeight
                );


            let occupiedArea =
                0;


            let smallestHeight =
                Infinity;


            rowData.forEach(
                row => {

                    const height =
                        row.fullWidthHeight *
                        scale;


                    smallestHeight =
                        Math.min(
                            smallestHeight,
                            height
                        );


                    row.ratios.forEach(
                        ratio => {

                            occupiedArea +=
                                ratio *
                                height *
                                height;

                        }
                    );

                }
            );


            /*
                Area is the main goal. The tiny secondary term avoids
                pathological solutions containing an almost microscopic row
                when two layouts have practically identical visible area.
            */
            const score =
                occupiedArea +
                smallestHeight *
                0.01;


            if (
                !best ||
                score > best.score
            ) {

                best = {
                    rows:
                        rowData,
                    scale,
                    gap,
                    score,
                    verticalGaps
                };

            }

        }
    );


    if (
        !best
    ) {

        return null;

    }


    const usedHeight =
        best.rows.reduce(
            (
                sum,
                row
            ) =>
                sum +
                row.fullWidthHeight *
                best.scale,
            0
        ) +
        best.verticalGaps;


    let y =
        Math.max(
            0,
            (
                rect.height -
                usedHeight
            ) / 2
        );


    const items =
        new Array(
            count
        );


    best.rows.forEach(
        row => {

            const height =
                row.fullWidthHeight *
                best.scale;


            const visibleWidths =
                row.ratios.map(
                    ratio =>
                        ratio *
                        height
                );


            const rowWidth =
                visibleWidths.reduce(
                    (
                        sum,
                        width
                    ) =>
                        sum + width,
                    0
                ) +
                row.horizontalGaps;


            let x =
                Math.max(
                    0,
                    (
                        rect.width -
                        rowWidth
                    ) / 2
                );


            visibleWidths.forEach(
                (
                    width,
                    localIndex
                ) => {

                    const index =
                        row.start +
                        localIndex;


                    items[index] = {
                        left:
                            x,
                        top:
                            y,
                        width,
                        height
                    };


                    x +=
                        width +
                        best.gap;

                }
            );


            y +=
                height +
                best.gap;

        }
    );


    return {
        items
    };

}

/* =====================================================
   BUILD VIEW ALL
   ===================================================== */

function buildProjectAllGrid() {

    const project =
        currentProject();


    projectAllGrid.innerHTML =
        "";


    project.videos.forEach(
        (
            filename,
            index
        ) => {

            const button =
                document.createElement(
                    "button"
                );


            button.type =
                "button";


            button.className =
                "project-all-thumb";


            const preview =
                createPreviewVideo(
                    filename,
                    {
                        /*
                            These are now lightweight /film-previews/
                            files. Resolve metadata immediately so View
                            All knows the real aspect ratios before it
                            chooses its grid.
                        */
                        eagerMetadata:
                            true
                    }
                );


            const posterProbe =
                new Image();


            posterProbe.decoding =
                "async";


            posterProbe.addEventListener(
                "load",
                () => {

                    if (
                        posterProbe.naturalWidth &&
                        posterProbe.naturalHeight
                    ) {

                        preview.dataset.ratio =
                            String(
                                posterProbe.naturalWidth /
                                posterProbe.naturalHeight
                            );


                        if (
                            projectAllMode
                        ) {

                            layoutProjectAllGrid();

                        }

                    }

                },
                {
                    once: true
                }
            );


            posterProbe.src =
                preview.poster;


            preview.addEventListener(
                "loadedmetadata",
                () => {

                    if (
                        preview.videoWidth &&
                        preview.videoHeight
                    ) {

                        preview.dataset.ratio =
                            String(
                                preview.videoWidth /
                                preview.videoHeight
                            );

                    }

                    if (
                        projectAllMode
                    ) {

                        layoutProjectAllGrid();

                    }

                }
            );


            button.appendChild(
                preview
            );


            button.addEventListener(
                "click",
                async event => {

                    event.stopPropagation();


                    await leaveProjectAll(
                        {
                            selectedIndex:
                                index,

                            resume:
                                false
                        }
                    );


                    loadCurrentVideo(
                        true
                    );

                }
            );


            projectAllGrid.appendChild(
                button
            );


            observePreview(
                preview
            );

        }
    );

}

/* =====================================================
   INDEX ORDER
   ===================================================== */

function getChronologicalProjects() {

    return projects
        .map(
            (
                project,
                originalIndex
            ) => ({

                project,

                originalIndex

            })
        )
        .sort(
            (
                a,
                b
            ) => {

                const orderA =
                    Number.isFinite(
                        a.project.indexOrder
                    )
                        ? a.project.indexOrder
                        : 999;


                const orderB =
                    Number.isFinite(
                        b.project.indexOrder
                    )
                        ? b.project.indexOrder
                        : 999;


                return (
                    orderA -
                    orderB
                ) ||
                (
                    a.originalIndex -
                    b.originalIndex
                );

            }
        );

}


/* =====================================================
   INDEX GEOMETRY
   ===================================================== */

/*
    DO NOT read CSS clamp() strings here.

    All dimensions are now returned as actual pixel
    numbers, which fixes the desktop giant-portrait bug.
*/

function getIndexGeometry() {

    /* -------------------------------------------------
       MOBILE PORTRAIT
       ------------------------------------------------- */

    if (
        isPhonePortrait()
    ) {

        return {

            mediaHeight:
                clamp(
                    window.innerHeight * 0.255,
                    205,
                    235
                ),

            maxLandscapeWidth:
                window.innerWidth * 0.47,

            gap:
                54,

            leftPadding:
                24,

            rightPadding:
                24

        };

    }


    /* -------------------------------------------------
       MOBILE LANDSCAPE

       Photography reference:
       thumbnails are intentionally much smaller than
       portrait-mobile thumbnails and separated by
       generous horizontal air. Several projects remain
       visible at once.
       ------------------------------------------------- */

    if (
        isPhoneLandscape()
    ) {

        return {

            /*
                Mirror the portrait-index relationship:
                portrait videos can use the full common
                media stage, while landscape videos are
                width-limited and therefore visibly shorter.
            */

            mediaHeight:
                clamp(
                    window.innerHeight * 0.405,
                    136,
                    166
                ),

            /*
                Landscape clips stay visibly shorter than portrait
                clips and both are centered in the same media stage.
                The slightly smaller scale also leaves enough room
                for the complete two-line caption underneath.
            */
            maxLandscapeWidth:
                Math.min(
                    window.innerWidth * 0.19,
                    174
                ),

            gap:
                clamp(
                    window.innerWidth * 0.06,
                    46,
                    62
                ),

            leftPadding:
                24,

            rightPadding:
                24

        };

    }


    /* -------------------------------------------------
       DESKTOP

       Same visual logic as portrait mobile, simply
       scaled to desktop.

       The old version allowed portrait work to become
       disproportionately huge. That is removed.
       ------------------------------------------------- */

    return {

        mediaHeight:
            clamp(
                window.innerHeight * 0.34,
                280,
                365
            ),

        maxLandscapeWidth:
            Math.min(
                window.innerWidth * 0.29,
                480
            ),

        gap:
            clamp(
                window.innerWidth * 0.03,
                44,
                64
            ),

        leftPadding:
            48,

        rightPadding:
            48

    };

}


/* =====================================================
   INDEX ITEM METRICS
   ===================================================== */

/*
    Common invisible stage height:
        geometry.mediaHeight

    Portrait:
        generally uses full stage height.

    Landscape:
        is constrained by maximum width and therefore
        becomes shorter.

    It remains vertically centered in the stage.

    Copy ALWAYS starts after stage height.
*/

function getIndexItemMetrics(
    ratio
) {

    const geometry =
        getIndexGeometry();


    let displayHeight =
        geometry.mediaHeight;


    let displayWidth =
        displayHeight *
        ratio;


    if (
        displayWidth >
        geometry.maxLandscapeWidth
    ) {

        displayWidth =
            geometry.maxLandscapeWidth;


        displayHeight =
            displayWidth /
            ratio;

    }


    return {

        mediaHeight:
            geometry.mediaHeight,

        displayWidth,

        displayHeight

    };

}


/* =====================================================
   SYNC INDEX CARD
   ===================================================== */

function syncIndexCardSize(
    preview,
    button,
    wrap
) {

    if (
        !preview.videoWidth ||
        !preview.videoHeight
    ) {

        return;

    }


    const ratio =
        preview.videoWidth /
        preview.videoHeight;


    const metrics =
        getIndexItemMetrics(
            ratio
        );


    const width =
        Math.max(
            1,
            Math.round(
                metrics.displayWidth
            )
        );


    const height =
        Math.max(
            1,
            Math.round(
                metrics.displayHeight
            )
        );


    const mediaHeight =
        Math.max(
            height,
            Math.round(
                metrics.mediaHeight
            )
        );


    /*
        Explicit dimensions only.
        No clamp string.
        No percentage sizing.
        No browser ambiguity.
    */

    /*
        Landscape-mobile needs a card width that is not
        dictated by an extremely narrow portrait video.
        The visual stays centered inside that card, so the
        caption remains readable without changing portrait
        mobile or desktop behavior.
    */

    const cardWidth =
        isPhoneLandscape()
            ? Math.max(
                width,
                clamp(
                    window.innerWidth * 0.175,
                    178,
                    204
                )
            )
            : width;


    button.style.width =
        `${cardWidth}px`;


    button.style.flex =
        `0 0 ${cardWidth}px`;


    button.style.minWidth =
        `${cardWidth}px`;


    button.style.maxWidth =
        `${cardWidth}px`;


    if (
        isPhoneLandscape()
    ) {

        const previewOffset =
            Math.max(
                0,
                (
                    cardWidth -
                    width
                ) /
                2
            );


        /*
            Store the visible thumbnail's true left edge on
            the card itself. This works even when video
            metadata resolves before .card-copy has been
            appended to the DOM.
        */
        button.style.setProperty(
            "--landscape-preview-offset",
            `${previewOffset}px`
        );

    }


    wrap.style.width =
        `${cardWidth}px`;


    wrap.style.height =
        `${mediaHeight}px`;


    wrap.style.flexBasis =
        `${mediaHeight}px`;


    preview.style.width =
        `${width}px`;


    preview.style.height =
        `${height}px`;


    preview.style.minWidth =
        `${width}px`;


    preview.style.maxWidth =
        `${width}px`;


    preview.style.minHeight =
        `${height}px`;


    preview.style.maxHeight =
        `${height}px`;


    if (
        isPhoneLandscape()
    ) {

        /*
            Flex centering removes the small optical Y drift
            that occurred with absolute-positioned previews.
        */

        preview.style.position =
            "static";


        preview.style.top =
            "auto";


        preview.style.left =
            "auto";


        preview.style.transform =
            "none";

    }

    else {

        preview.style.position =
            "absolute";


        preview.style.top =
            "50%";


        preview.style.left =
            "0";


        preview.style.transform =
            "translateY(-50%)";

    }


    /*
        Landscape-mobile cards deliberately keep a wider
        invisible card than very narrow portrait previews so
        the caption has room to breathe. The caption itself,
        however, must visually belong to the thumbnail: its
        LEFT EDGE now starts exactly where the visible preview
        starts. It may extend to the right when the title/date
        needs more room.
    */

    if (
        isPhoneLandscape()
    ) {

        const copy =
            button.querySelector(
                ".card-copy"
            );


        if (
            copy
        ) {

            copy.style.marginLeft =
                `var(--landscape-preview-offset, 0px)`;


            copy.style.width =
                `${Math.max(
                    width,
                    190
                )}px`;


            copy.style.minWidth =
                `${Math.max(
                    width,
                    190
                )}px`;

        }

    }

}

/* =====================================================
   INDEX CASE
   ===================================================== */

function createCaseController(
    element,
    baseText
) {

    const base =
        String(
            baseText
        ).toLowerCase();


    const positions =
        getMorphPositions(
            base
        );


    const total =
        positions.length;


    let state =
        0;


    let frameId =
        null;


    function render() {

        const activePositions =
            new Set(
                positions.slice(
                    0,
                    state
                )
            );


        renderInteractiveTypography(
            element,
            renderCaseFromActivePositions(
                base,
                activePositions
            ),
            activePositions
        );

    }


    function animateTo(
        target
    ) {

        if (
            frameId !== null
        ) {

            cancelAnimationFrame(
                frameId
            );

        }


        const startState =
            state;


        if (
            startState === target
        ) {

            render();


            return;

        }


        const start =
            performance.now();


        function frame(
            now
        ) {

            const progress =
                Math.min(
                    1,
                    (
                        now -
                        start
                    ) /
                    CASE_DURATION
                );


            state =
                Math.round(
                    startState +
                    (
                        target -
                        startState
                    ) *
                    progress
                );


            render();


            if (
                progress < 1
            ) {

                frameId =
                    requestAnimationFrame(
                        frame
                    );

            }

            else {

                state =
                    target;


                render();


                frameId =
                    null;

            }

        }


        frameId =
            requestAnimationFrame(
                frame
            );

    }


    render();


    return {

        upper() {

            animateTo(
                total
            );

        },

        lower() {

            animateTo(
                0
            );

        }

    };

}

   BUILD INDEX

function resetIndexSelection() {

function getFilmCountText(total) {
    return `${total} ${total === 1 ? "film" : "films"}`;
}

function updateResponsiveMode() {
    body.classList.toggle("phone-portrait", isPhonePortrait());
    body.classList.toggle("phone-landscape", isPhoneLandscape());
}

function layoutTypographicIndex() {
    updateResponsiveMode();
    if (!indexProjectRows.length || !indexScroller) return;

    const styles = getComputedStyle(document.documentElement);
    const fontSize = parseFloat(styles.getPropertyValue("--font-size")) || 15;
    const lineHeightFactor = parseFloat(styles.getPropertyValue("--line-height")) || 1.15;
    const lineHeight = fontSize * lineHeightFactor;
    const edgeGap = lineHeight;
    const minimumGap = lineHeight;

    indexGrid.style.setProperty("--index-list-edge-gap", `${edgeGap}px`);

    if (isPhoneLayout()) {
        const total = indexProjectRows.length;
        const availableHeight = Math.max(1, indexScroller.clientHeight - edgeGap * 2);
        const itemHeight = lineHeight * 2;
        const occupied = total * itemHeight;
        const gaps = Math.max(0, total - 1);
        const ideal = gaps ? (availableHeight - occupied) / gaps : 0;
        const needsScroll = gaps > 0 && ideal < minimumGap;
        const gap = gaps ? (needsScroll ? minimumGap : Math.max(minimumGap, ideal)) : 0;
        indexGrid.style.setProperty("--index-portrait-gap", `${gap}px`);
        body.classList.toggle("index-needs-scroll", needsScroll);
        return;
    }

    const total = indexProjectRows.length;
    const rect = indexScroller.getBoundingClientRect();
    const preferredColumnWidth = 220;
    const columnGap = Math.max(32, Math.min(72, window.innerWidth * .04));
    const maxColumnsByWidth = Math.max(1, Math.floor((rect.width + columnGap)/(preferredColumnWidth + columnGap)));
    const minimumColumns = total > 1 && maxColumnsByWidth >= 2 ? 2 : 1;
    const columnCount = Math.max(minimumColumns, Math.min(total, maxColumnsByWidth));
    const rowCount = Math.ceil(total / columnCount);
    const itemHeight = lineHeight * 2;
    const availableHeight = Math.max(1,indexScroller.clientHeight-edgeGap*2);
    const occupiedHeight = rowCount * itemHeight;
    const gapCount = Math.max(0,rowCount-1);
    const idealGap = gapCount ? (availableHeight-occupiedHeight)/gapCount : 0;
    const needsScroll = gapCount>0 && idealGap<minimumGap;
    const rowGap = gapCount ? (needsScroll?minimumGap:Math.max(minimumGap,idealGap)) : 0;
    indexGrid.style.setProperty("--index-row-count",String(rowCount));
    indexGrid.style.setProperty("--index-column-count",String(columnCount));
    indexGrid.style.setProperty("--index-column-gap",`${columnGap}px`);
    indexGrid.style.setProperty("--index-row-gap",`${rowGap}px`);
    body.classList.toggle("index-needs-scroll",needsScroll);
    indexProjectRows.forEach((state,itemIndex)=>{
        const columnIndex=Math.floor(itemIndex/rowCount);
        const localRow=itemIndex%rowCount;
        state.row.style.gridColumn=String(columnIndex+1);
        state.row.style.gridRow=String(localRow+1);
    });
}

function selectIndexProject(rowState) {
    if (!rowState) return;
    const previous = selectedIndexProject;
    selectedIndexProject = rowState;
    indexProjectRows.forEach(state=>{
        if (state===rowState) { state.titleCase.upper(); state.dateCase.upper(); }
        else { state.titleCase.lower(); state.dateCase.lower(); }
    });
    const project=rowState.project;
    const filename=project.videos[0];
    const previewSrc=previewVideoUrl(filename);
    if (indexPreviewVideo.dataset.src!==previewSrc) {
        indexPreviewVideo.pause();
        indexPreviewVideo.dataset.src=previewSrc;
        indexPreviewVideo.poster=posterVideoUrl(filename);
        indexPreviewVideo.src=previewSrc;
        indexPreviewVideo.load();
    }
    indexPreviewVideo.muted=true;
    indexPreviewVideo.play().catch(()=>{});
    indexPreview.classList.add("visible");
    indexPreview.setAttribute("aria-hidden","false");
    const text=getFilmCountText(project.videos.length);
    if (previous && previous!==rowState && indexProjectCount.textContent) {
        morphSequential(indexProjectCount,text,STATE_MORPH_DURATION).catch(()=>{});
    } else {
        renderBaseTypography(indexProjectCount,text);
        indexProjectCount.dataset.rawText=text;
    }
    indexProjectAction.classList.add("visible");
    indexProjectAction.setAttribute("aria-hidden","false");
    if (indexViewAllCase) indexViewAllCase.lower();
}

async function openSelectedIndexProjectAll() {
    if (!indexMode || !selectedIndexProject || interfaceAnimating || projectViewAnimating) return;
    interfaceAnimating=true;
    saveIndexPosition();
    projectAllOpenedFromIndex=true;
    indexSelectionBeforeProjectAll=selectedIndexProject;
    currentProjectIndex=normalizeProjectIndex(selectedIndexProject.originalIndex);
    currentVideoIndex=0;
    fullProjectMode=true;
    fullProjectEndIndex=currentProject().videos.length-1;
    normalSequenceProjectIndex=null;
    normalSequenceVideos=[];
    normalSequencePosition=-1;
    syncProjectUrl("push");
    renderedProjectIndex=null;
    await loadCurrentVideo(false);
    await morphIndexTo(0);
    indexPreviewVideo.pause();
    indexView.classList.remove("visible");
    indexMode=false;
    body.classList.remove("index-mode");
    interfaceAnimating=false;
    await enterProjectAll();
}

async function returnProjectAllToIndex() {
    if (!projectAllMode || projectViewAnimating) return;
    projectAllOpenedFromIndex=false;
    await leaveProjectAll({resume:false});
    await enterIndex({preserveSelection:true});
}

function buildIndex() {
    indexGrid.innerHTML="";
    indexProjectRows=[];
    resetIndexSelection();
    getChronologicalProjects().forEach(item=>{
        const project=item.project;
        const row=document.createElement("div");
        row.className="index-project-row";
        const title=document.createElement("button");
        title.type="button"; title.className="index-project-title";
        const date=document.createElement("button");
        date.type="button"; date.className="index-project-date";
        const titleBase=project.title.toLowerCase();
        const dateBase=(project.date||"").toLowerCase();
        renderBaseTypography(title,titleBase); renderBaseTypography(date,dateBase);
        const state={row,project,originalIndex:item.originalIndex,titleButton:title,dateButton:date,
            titleCase:createCaseController(title,titleBase), dateCase:createCaseController(date,dateBase)};
        indexProjectRows.push(state);
        [title,date].forEach(button=>{
            button.addEventListener("mouseenter",()=>{ if(hasHover()) selectIndexProject(state); });
            button.addEventListener("focus",()=>{ if(hasHover()) selectIndexProject(state); });
            button.addEventListener("click",async event=>{
                event.preventDefault(); event.stopPropagation();
                if (Date.now()<suppressClickUntil) return;
                if (!isPhoneLayout()) {
                    selectIndexProject(state);
                    await new Promise(resolve=>requestAnimationFrame(resolve));
                    await openSelectedIndexProjectAll();
                } else if (selectedIndexProject===state) {
                    await openSelectedIndexProjectAll();
                } else {
                    selectIndexProject(state);
                }
            });
        });
        row.append(title,date); indexGrid.appendChild(row);
    });
    requestAnimationFrame(layoutTypographicIndex);
}

/* =====================================================
   RESIZE INDEX CARDS
   ===================================================== */

function resizeIndexCards() {
    layoutTypographicIndex();
}

/* =====================================================
   INDEX WORD
   ===================================================== */

function renderIndexWord(
    state
) {

    indexWordState =
        state;


    const positions =
        getMorphPositions(
            indexWord
        );


    const activePositions =
        new Set(
            positions.slice(
                0,
                state
            )
        );


    renderInteractiveTypography(
        indexButton,
        renderCaseFromActivePositions(
            indexWord,
            activePositions
        ),
        activePositions
    );

}


/* =====================================================
   INDEX MORPH
   ===================================================== */

function morphIndexTo(
    target
) {

    if (
        indexWordFrame !==
        null
    ) {

        cancelAnimationFrame(
            indexWordFrame
        );

    }


    const initial =
        indexWordState;


    if (
        initial ===
        target
    ) {

        renderIndexWord(
            target
        );


        return Promise.resolve();

    }


    const start =
        performance.now();


    return new Promise(
        resolve => {

            function frame(
                now
            ) {

                const progress =
                    Math.min(
                        1,
                        (
                            now -
                            start
                        ) /
                        INDEX_TRANSITION_DURATION
                    );


                const state =
                    Math.round(
                        initial +
                        (
                            target -
                            initial
                        ) *
                        progress
                    );


                renderIndexWord(
                    state
                );


                if (
                    progress <
                    1
                ) {

                    indexWordFrame =
                        requestAnimationFrame(
                            frame
                        );

                }

                else {

                    renderIndexWord(
                        target
                    );


                    indexWordFrame =
                        null;


                    resolve();

                }

            }


            indexWordFrame =
                requestAnimationFrame(
                    frame
                );

        }
    );

}


/* =====================================================
   INDEX HOVER
   ===================================================== */

indexButton.addEventListener(
    "mouseenter",
    () => {

        if (
            isPhoneLayout()
        ) {

            return;

        }


        morphIndexTo(
            indexMode
                ? 0
                : indexWord.length
        );

    }
);


indexButton.addEventListener(
    "mouseleave",
    () => {

        if (
            isPhoneLayout()
        ) {

            return;

        }


        morphIndexTo(
            indexMode
                ? indexWord.length
                : 0
        );

    }
);


/* =====================================================
   INDEX POSITION
   ===================================================== */

function saveIndexPosition() { savedIndexScrollTop = indexScroller.scrollTop; }

function restoreIndexPosition() { requestAnimationFrame(()=>{ indexScroller.scrollTop=savedIndexScrollTop; }); }


/* =====================================================
   ENTER INDEX
   ===================================================== */

async function enterIndex({preserveSelection=false}={}) {
    if (indexMode || interfaceAnimating) return;
    interfaceAnimating=true;
    autoplayBeforeIndex=!video.paused;
    video.pause();
    if (projectAllMode) await leaveProjectAll({resume:false});
    updateResponsiveMode();
    indexMode=true;
    body.classList.add("index-mode");
    indexView.classList.add("visible");
    restoreIndexPosition();
    layoutTypographicIndex();
    if (!preserveSelection) resetIndexSelection();
    else if (selectedIndexProject) selectIndexProject(selectedIndexProject);
    morphIndexTo(indexWord.length);
    indexScroller.focus({preventScroll:true});
    interfaceAnimating=false;
}

/* =====================================================
   RETURN INDEX
   ===================================================== */

async function returnFromIndex() {
    if (!indexMode || interfaceAnimating) return;
    interfaceAnimating=true;
    saveIndexPosition();
    resetIndexSelection();
    await morphIndexTo(0);
    indexView.classList.remove("visible");
    indexMode=false;
    body.classList.remove("index-mode");
    if (autoplayBeforeIndex) video.play().catch(()=>{});
    interfaceAnimating=false;
}

/* =====================================================
   INDEX -> PROJECT
   ===================================================== */

async function exitIndexToProject(
    targetProjectIndex
) {

    if (
        !indexMode ||
        interfaceAnimating
    ) {

        return;

    }


    interfaceAnimating =
        true;


    saveIndexPosition();


    await morphIndexTo(
        0
    );


    stopAllPreviews();


    indexView.classList.remove(
        "visible"
    );


    indexMode =
        false;


    body.classList.remove(
        "index-mode"
    );


    currentProjectIndex =
        targetProjectIndex;


    currentVideoIndex =
        0;


    /*
        INDEX opens the complete project from its first runtime video.
        Only after the project ends do we return to max-2 rotation.
    */
    fullProjectMode =
        true;


    fullProjectEndIndex =
        currentProject().videos.length - 1;


    normalSequenceProjectIndex =
        null;


    normalSequenceVideos =
        [];


    normalSequencePosition =
        -1;


    syncProjectUrl(
        "push"
    );


    renderedProjectIndex =
        null;


    await loadCurrentVideo(
        true
    );


    interfaceAnimating =
        false;

}


/* =====================================================
   INDEX CLICK
   ===================================================== */

indexButton.addEventListener(
    "click",
    async event => {
        event.stopPropagation();
        if (interfaceAnimating || projectViewAnimating) return;
        if (projectAllMode) {
            if (projectAllOpenedFromIndex) await returnProjectAllToIndex();
            else { await leaveProjectAll({resume:false}); await enterIndex(); }
            return;
        }
        if (indexMode) await returnFromIndex();
        else await enterIndex();
    }
);

window.addEventListener("resize",()=>{ updateResponsiveMode(); if(indexMode) requestAnimationFrame(layoutTypographicIndex); requestAnimationFrame(fitAybakEndCardWord); },{passive:true});
window.addEventListener("orientationchange",()=>{ updateResponsiveMode(); requestAnimationFrame(()=>{ if(indexMode) layoutTypographicIndex(); fitAybakEndCardWord(); }); },{passive:true});

/* =====================================================
   INDEX SCROLL / AYBAK BOUNDARY
   ===================================================== */
let indexTouchStartY=null;
let indexTouchStartedAtBottom=false;
function indexCanScrollVertically(){ return (indexScroller.scrollHeight-indexScroller.clientHeight)>2; }
function indexIsAtBottom(){ return indexScroller.scrollTop+indexScroller.clientHeight>=indexScroller.scrollHeight-2; }
indexScroller.addEventListener("touchstart",event=>{
    if(!indexMode||!event.changedTouches.length)return;
    indexTouchStartY=event.changedTouches[0].clientY;
    indexTouchStartedAtBottom=!indexCanScrollVertically()||indexIsAtBottom();
},{passive:true});
indexScroller.addEventListener("touchend",event=>{
    if(!indexMode||indexTouchStartY===null||!event.changedTouches.length)return;
    const dy=event.changedTouches[0].clientY-indexTouchStartY; indexTouchStartY=null;
    if(indexTouchStartedAtBottom&&dy<-52){ suppressClickUntil=Date.now()+500; setAybakEndCard(true); }
},{passive:true});
indexScroller.addEventListener("scroll",()=>{ if(indexMode)savedIndexScrollTop=indexScroller.scrollTop; },{passive:true});

/* =====================================================
   VISIBILITY
   ===================================================== */

document.addEventListener(
    "visibilitychange",
    () => {

        if (
            document.hidden
        ) {

            resumeAfterVisibility =
                !video.paused &&
                !video.ended &&
                !indexMode &&
                !projectAllMode;


            video.pause();


            stopAllPreviews();


            return;

        }


        if (
            resumeAfterVisibility &&
            !indexMode &&
            !projectAllMode
        ) {

            video
                .play()
                .catch(
                    () => {}
                );

        }


        resumeAfterVisibility =
            false;


        if (
            indexMode
        ) {

            activatePreviewsIn(
                indexGrid
            );

        }


        if (
            projectAllMode
        ) {

            activatePreviewsIn(
                projectAllGrid
            );

        }

    }
);


/* =====================================================
   INIT
   ===================================================== */

renderIndexWord(
    0
);


loadProjects();



window.addEventListener(
    "resize",
    () => {

        syncIndexToSoundCenter();

    }
);


window.addEventListener(
    "orientationchange",
    () => {

        setTimeout(
            syncIndexToSoundCenter,
            80
        );

    }
);



/* =====================================================
   PHOTO-SITE END CARD + INDEX PREVIEW INTERACTIONS
   ===================================================== */

updateResponsiveMode();

indexViewAllCase=createCaseController(indexProjectViewAll,"view all");
indexProjectViewAll.addEventListener("mouseenter",()=>{ if(hasHover()&&selectedIndexProject) indexViewAllCase.upper(); });
indexProjectViewAll.addEventListener("mouseleave",()=>{ if(hasHover()) indexViewAllCase.lower(); });
indexProjectViewAll.addEventListener("click",async event=>{ event.stopPropagation(); if(!selectedIndexProject)return; await openSelectedIndexProjectAll(); });
indexPreviewVideo.addEventListener("click",async event=>{ event.stopPropagation(); if(!selectedIndexProject)return; await openSelectedIndexProjectAll(); });

function fitAybakEndCardWord(){
    const canvas=document.getElementById("aybak-end-card-word");
    if(!canvas||!aybakEndCard)return;
    const vw=Math.max(1,aybakEndCard.clientWidth), vh=Math.max(1,aybakEndCard.clientHeight);
    const contact=aybakEndCard.querySelector(".aybak-end-card-contact"), section=aybakEndCard.querySelector(".aybak-end-card-film");
    const cr=contact?contact.getBoundingClientRect():null, sr=section?section.getBoundingClientRect():null;
    const cs=getComputedStyle(document.documentElement);
    const side=parseFloat(cs.getPropertyValue("--side"))||0;
    const top=parseFloat(cs.getPropertyValue("--top"))||0;
    const left=cr?cr.left:side, right=sr?sr.right:vw-side;
    const sample=1000, trackingEm=-.045, tracking=trackingEm*sample, pad=320;
    const mc=document.createElement("canvas"), c0=mc.getContext("2d");
    c0.font=`400 ${sample}px "Times New Roman", Times, serif`;
    const letters=[..."AYBAK"], advances=letters.map(l=>c0.measureText(l).width);
    const advance=advances.reduce((a,b)=>a+b,0)+tracking*(letters.length-1);
    mc.width=Math.ceil(advance+pad*2); mc.height=sample+pad*2;
    const ctx=mc.getContext("2d",{willReadFrequently:true});
    ctx.font=`400 ${sample}px "Times New Roman", Times, serif`; ctx.textBaseline="alphabetic"; ctx.fillStyle="#fff";
    const ox=pad, by=pad+sample; let x=ox;
    letters.forEach((l,i)=>{ctx.fillText(l,x,by); x+=advances[i]+(i<letters.length-1?tracking:0);});
    const data=ctx.getImageData(0,0,mc.width,mc.height).data;
    let minX=mc.width,maxX=-1,maxY=-1;
    for(let y=0;y<mc.height;y++)for(let xx=0;xx<mc.width;xx++){if(data[(y*mc.width+xx)*4+3]>8){if(xx<minX)minX=xx;if(xx>maxX)maxX=xx;if(y>maxY)maxY=y;}}
    if(maxX<minX)return;
    const inkLeft=minX-ox, inkWidth=maxX-minX+1, inkBottom=maxY-by;
    const fontSize=Math.max(1,right-left)*sample/inkWidth, scale=fontSize/sample;
    const originX=left-inkLeft*scale, baselineY=vh-Math.max(0,top)-inkBottom*scale;
    const dpr=Math.max(1,window.devicePixelRatio||1);
    canvas.width=Math.round(vw*dpr); canvas.height=Math.round(vh*dpr); canvas.style.width=`${vw}px`; canvas.style.height=`${vh}px`;
    const out=canvas.getContext("2d"); out.setTransform(dpr,0,0,dpr,0,0); out.clearRect(0,0,vw,vh);
    out.font=`400 ${fontSize}px "Times New Roman", Times, serif`; out.textBaseline="alphabetic"; out.fillStyle="#fff";
    let dx=originX; const ft=trackingEm*fontSize;
    letters.forEach((l,i)=>{out.fillText(l,dx,baselineY); dx+=out.measureText(l).width+(i<letters.length-1?ft:0);});
}

fitAybakEndCardWord();
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(fitAybakEndCardWord);

function setAybakEndCard(active){
    const next=Boolean(active);
    if(next===aybakEndCardActive)return;
    if(next){ aybakResumeVideo=!video.paused; video.pause(); indexPreviewVideo.pause(); }
    aybakEndCardActive=next;
    body.classList.toggle("aybak-end-card-active",next);
    document.documentElement.classList.toggle("aybak-end-card-active",next);
    aybakEndCard.setAttribute("aria-hidden",next?"false":"true");
    if(!next){
        if(indexMode&&selectedIndexProject) indexPreviewVideo.play().catch(()=>{});
        else if(aybakResumeVideo&&!projectAllMode) video.play().catch(()=>{});
    }
}

let aybakWheel=0, aybakWheelTimer=null, aybakTouchX=null, aybakTouchY=null, aybakTouchInScroller=false;
window.addEventListener("wheel",event=>{
    if(Math.abs(event.deltaY)<=Math.abs(event.deltaX))return;
    if(!aybakEndCardActive && indexMode && indexScroller.contains(event.target))return;
    if(!aybakEndCardActive && (interfaceAnimating||projectViewAnimating))return;
    event.preventDefault(); clearTimeout(aybakWheelTimer); aybakWheel+=event.deltaY;
    aybakWheelTimer=setTimeout(()=>aybakWheel=0,140);
    if(!aybakEndCardActive&&aybakWheel>=48){setAybakEndCard(true);aybakWheel=0;}
    else if(aybakEndCardActive&&aybakWheel<=-48){setAybakEndCard(false);aybakWheel=0;}
},{passive:false});
window.addEventListener("touchstart",event=>{
    if(!event.changedTouches.length)return; const touch=event.changedTouches[0];
    aybakTouchX=touch.clientX; aybakTouchY=touch.clientY;
    aybakTouchInScroller=Boolean(indexMode&&indexScroller.contains(event.target));
},{passive:true});
window.addEventListener("touchend",event=>{
    if(aybakTouchX===null||aybakTouchY===null||!event.changedTouches.length)return;
    const touch=event.changedTouches[0], dx=touch.clientX-aybakTouchX, dy=touch.clientY-aybakTouchY;
    aybakTouchX=aybakTouchY=null;
    if(Math.abs(dy)<=Math.abs(dx)||Math.abs(dy)<52)return;
    if(!aybakEndCardActive&&aybakTouchInScroller){aybakTouchInScroller=false;return;}
    aybakTouchInScroller=false; suppressClickUntil=Date.now()+500;
    if(!aybakEndCardActive&&dy<0)setAybakEndCard(true);
    else if(aybakEndCardActive&&dy>0)setAybakEndCard(false);
},{passive:true});

document.addEventListener("keydown",event=>{
    if(aybakEndCardActive){
        if(["ArrowUp","Escape","PageUp","Home"].includes(event.key)){event.preventDefault();setAybakEndCard(false);} return;
    }
    if(["ArrowDown","PageDown","End"].includes(event.key)&&!event.target.closest("input,textarea,select")){
        event.preventDefault(); setAybakEndCard(true);
    }
});

aybakEndCard.addEventListener("click",event=>event.stopPropagation());

</script>
