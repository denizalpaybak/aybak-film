<style>

html,
body {

/* =========================
   SECTION SWITCH
   ========================= */

    position: fixed;

    top: 32px;
    right: 48px;

    z-index: 20;

    color: #000;
    text-decoration: none;

    font-family: Arial, Helvetica, sans-serif;
    font-size: 15px;
    font-weight: 400;
    line-height: 1.15;
}


/* =========================
   VIDEO
   ========================= */

#video-stage {
    position: fixed;
    inset: 0;

    width: 100vw;
    height: 100vh;

    display: flex;
    align-items: center;
    justify-content: center;

    pointer-events: none;
}

#video-block {
    display: flex;

    width: auto;

/* =========================
   CONTROLS

    display: flex;

    width: 64vw;

    justify-content: space-between;

/* =========================
   MOBILE
   ========================= */

@media (max-width: 600px) {

    .info {
        top: 20px;

    }

    .logo {

    }

    .logo-name {
        font-size: 13px;
    }

    .logo-aybak {
        top: 15px;

    }

        top: 20px;

    }

        top: 92px;

        height: auto;

        padding: 0 24px;
    }

    #video-block {
        width: 100%;
        max-width: 84vw;
    }

    #film-video {
        max-width: 84vw;
        max-height: 60vh;
    }

    #controls {
        width: 84vw;

        font-size: 13px;
    }

    #controls button {
        font-size: 13px;
    }

}

</style>

</head>


<body>


<!-- LEFT -->

<div class="info">

    <a
        class="logo"
        href="https://denizalpaybak.com/"
    >

        <span
            class="logo-name"
            id="logo-name"
        >
            Denizalp
        </span>

        <span class="logo-aybak">

            <span id="letter-a">a</span><span id="letter-y">y</span><span id="letter-b">b</span><span id="letter-a2">a</span><span id="letter-k">k</span>

        </span>

    </a>


    <div class="contact">

        <a
            href="mailto:d@denizalpaybak.com"
            target="_blank"
            rel="noopener"
        >
            d@denizalpaybak.com
        </a>

    </div>


    <div class="social">

        <a
            href="https://www.instagram.com/denizalpaybak/"
            target="_blank"
            rel="noopener"
        >
            instagram @denizalpaybak
        </a>

        <a
            href="https://models.com/people/denizalp-aybak"
            target="_blank"
            rel="noopener"
        >
            models.com
        </a>

    </div>

</div>


<!-- RIGHT SWITCH -->

<a
    class="section-switch"
    id="section-switch"
    href="https://photography.denizalpaybak.com/"
>
    <span id="section-switch-text">photography</span>
</a>


<!-- VIDEO -->

<div id="video-stage">

    <div id="video-block">

        <video
            id="film-video"
            muted
            autoplay
            playsinline
            preload="auto"
        ></video>


        <div id="controls">

            <button id="previous-button">
                previous
            </button>

            <button id="play-button">
                pause
            </button>

            <button id="sound-button">
                sound on
            </button>

            <button id="next-button">
                next
            </button>

        </div>

    </div>

</div>


<script>

/* =====================================================
   R2 / FILMS.JSON
   ===================================================== */

const R2_BASE =
    "https://pub-14d397941aeb40e5bd3f66ac028fef80.r2.dev/";

let films = [];

let currentFilm = 0;

let soundEnabled = false;


const video =
    document.getElementById(
        "film-video"
    );

const previousButton =
    document.getElementById(
        "previous-button"
    );

const playButton =
    document.getElementById(
        "play-button"
    );

const soundButton =
    document.getElementById(
        "sound-button"
    );

const nextButton =
    document.getElementById(
        "next-button"
    );


/* =====================================================
   FILM LIST
   ===================================================== */

async function loadFilmList() {

    try {

        const response =
            await fetch(
                "./films.json",
                {
                    cache: "no-store"
                }
            );


        if (
            !response.ok
        ) {

            throw new Error(
                "films.json could not be loaded"
            );

        }


        films =
            (await response.json())
            .filter(
                item =>
                    typeof item ===
                    "string"
            );


        if (
            films.length === 0
        ) {

            return;

        }


        loadFilm(
            0,
            true
        );

    }

    catch (error) {

        console.error(
            error
        );

    }

}


/* =====================================================
   CONTROLS
   ===================================================== */

function updateControls() {

    playButton.textContent =
        video.paused
            ? "play"
            : "pause";


    soundButton.textContent =
        soundEnabled
            ? "sound off"
            : "sound on";

}


function applySoundState() {

    video.muted =
        !soundEnabled;

}


function toggleSound() {

    soundEnabled =
        !soundEnabled;


    applySoundState();

    updateControls();

}


function togglePlayback() {

    if (
        video.paused
    ) {

        video.play().catch(
            () => {}
        );

    }

    else {

        video.pause();

    }


    updateControls();

}


/* =====================================================
   LOAD
   ===================================================== */

function loadFilm(
    index,
    autoplay = true
) {

    if (
        films.length === 0
    ) {

        return;

    }


    if (
        index < 0
    ) {

        index =
            films.length - 1;

    }


    if (
        index >= films.length
    ) {

        index = 0;

    }


    currentFilm =
        index;


    video.pause();


    video.src =
        R2_BASE +
        films[currentFilm];


    video.load();


    applySoundState();


    if (
        autoplay
    ) {

        video.play().catch(
            () => {}
        );

    }


    updateControls();

}


function nextFilm() {

    loadFilm(
        currentFilm + 1,
        true
    );

}


function previousFilm() {

    loadFilm(
        currentFilm - 1,
        true
    );

}


previousButton.onclick =
    previousFilm;

nextButton.onclick =
    nextFilm;

playButton.onclick =
    togglePlayback;

soundButton.onclick =
    toggleSound;


video.addEventListener(
    "play",
    updateControls
);

video.addEventListener(
    "pause",
    updateControls
);

video.addEventListener(
    "ended",
    nextFilm
);


/* =====================================================
   LOGO ANIMATION
   ===================================================== */

const logo =
    document.querySelector(
        ".logo"
    );

const logoName =
    document.getElementById(
        "logo-name"
    );

const letters = [
    document.getElementById("letter-a"),
    document.getElementById("letter-y"),
    document.getElementById("letter-b"),
    document.getElementById("letter-a2"),
    document.getElementById("letter-k")
];

const lowercase = [
    "a",
    "y",
    "b",
    "a",
    "k"
];

const uppercase = [
    "A",
    "Y",
    "B",
    "A",
    "K"
];

let logoState = 0;

let logoTarget = 0;

let logoTimer = null;


function setLogoState(state) {

    logoState = state;


    logoName.textContent =
        state === 0
            ? "Denizalp"
            : "denizalp";


    for (
        let i = 0;
        i < letters.length;
        i++
    ) {

        letters[i].textContent =
            i < state
                ? uppercase[i]
                : lowercase[i];

    }

}


function moveLogo() {

    if (
        logoState ===
        logoTarget
    ) {

        logoTimer = null;

        return;

    }


    setLogoState(
        logoState <
        logoTarget
            ? logoState + 1
            : logoState - 1
    );


    logoTimer =
        setTimeout(
            moveLogo,
            120
        );

}


function animateTo(target) {

    logoTarget = target;


    if (
        logoTimer
    ) {

        clearTimeout(
            logoTimer
        );

    }


    moveLogo();

}


/* DESKTOP */

logo.addEventListener(
    "mouseenter",
    () => {

        if (
            window.innerWidth >
            600
        ) {

            animateTo(5);

        }

    }
);


logo.addEventListener(
    "mouseleave",
    () => {

        if (
            window.innerWidth >
            600
        ) {

            animateTo(0);

        }

    }
);


/* MOBILE */

function mobileLogoCycle() {

    setTimeout(
        () => {

            animateTo(5);


            setTimeout(
                () => {

                    animateTo(0);


                    setTimeout(
                        mobileLogoCycle,
                        2600
                    );

                },
                2600
            );

        },
        2000
    );

}


if (
    window.innerWidth <=
    600
) {

    setLogoState(0);

    mobileLogoCycle();

}


/* =====================================================
   SECTION SWITCH
   DESKTOP HOVER ONLY
   ===================================================== */

const sectionSwitch =
    document.getElementById(
        "section-switch"
    );

const sectionSwitchText =
    document.getElementById(
        "section-switch-text"
    );

const switchWord =
    "photography";

let switchState = 0;

let switchTarget = 0;

let switchTimer = null;


function renderSwitch() {

    let result = "";


    for (
        let i = 0;
        i < switchWord.length;
        i++
    ) {

        result +=
            i < switchState
                ? switchWord[i]
                    .toUpperCase()
                : switchWord[i]
                    .toLowerCase();

    }


    sectionSwitchText
        .textContent =
        result;

}


function moveSwitch() {

    if (
        switchState ===
        switchTarget
    ) {

        switchTimer = null;

        return;

    }


    switchState +=
        switchState <
        switchTarget
            ? 1
            : -1;


    renderSwitch();


    switchTimer =
        setTimeout(
            moveSwitch,
            120
        );

}


function animateSwitchTo(
    target
) {

    switchTarget =
        target;


    if (
        switchTimer
    ) {

        clearTimeout(
            switchTimer
        );

    }


    moveSwitch();

}


sectionSwitch.addEventListener(
    "mouseenter",
    () => {

        if (
            window.innerWidth >
            600
        ) {

            animateSwitchTo(
                switchWord.length
            );

        }

    }
);


sectionSwitch.addEventListener(
    "mouseleave",
    () => {

        if (
            window.innerWidth >
            600
        ) {

            animateSwitchTo(0);

        }

    }
);


renderSwitch();


/* =====================================================
   START
   ===================================================== */

setLogoState(0);

applySoundState();

updateControls();

loadFilmList();

</script>

</body>
</html>
