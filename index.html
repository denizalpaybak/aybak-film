<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>

<title>Denizalp Aybak — Film</title>

<link rel="preconnect" href="https://library.denizalpaybak.com" crossorigin>
<link rel="dns-prefetch" href="//library.denizalpaybak.com">


<style>

/* =====================================================
   RESET
   ===================================================== */

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;

    width: 100%;
    height: 100%;

    overflow: hidden;

    background: #fff;
    color: #000;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    -webkit-text-size-adjust: 100%;
    text-size-adjust: 100%;
}

button {
    font: inherit;
}


/* =====================================================
   VARIABLES
   ===================================================== */

:root {

    --font-size: 15px;
    --line-height: 1.15;

    /*
        NUMERAL ACTIVE STATE
        Digits cannot uppercase, so during the same morph state
        they gain a subtle amount of tracking instead.
    */
    --active-number-tracking: 0.055em;

    --side: 48px;
    --top: 32px;

    --index-bottom: 24px;

    /*
        INDEX follows the actual horizontal center of SOUND ON/OFF.
        JS updates this value from soundButton.getBoundingClientRect().
    */
    --index-center-x: 50%;

    --meta-gap: 6px;
    --meta-top-gap: 10px;

    --index-gap: 54px;

}


/* =====================================================
   BODY
   ===================================================== */

body {
    cursor: default;
}


/* =====================================================
   INFO
   ===================================================== */

.info {
    position: fixed;

    top: var(--top);
    left: var(--side);

    z-index: 500;

    font-size: var(--font-size);
    line-height: var(--line-height);
}


/* =====================================================
   LOGO
   ===================================================== */

.logo {
    position: relative;

    display: block;

    width: 190px;
    height: 52px;

    color: inherit;
    text-decoration: none;

    cursor: pointer;

    -webkit-tap-highlight-color: transparent;
}

.logo-name {
    position: absolute;

    top: 0;
    left: 0;

    white-space: nowrap;
}

.logo-aybak {
    position: absolute;

    top: 17px;
    left: 0;

    white-space: nowrap;
}


/* =====================================================
   CONTACT
   ===================================================== */

.contact,
.social {
    margin: 0;
    padding: 0;
}

.social {
    display: flex;
    flex-direction: column;
}

.info a {
    color: inherit;
    text-decoration: none;
}

.contact a:hover,
.social a:hover {
    text-decoration: underline;
}


/* =====================================================
   PHOTOGRAPHY
   ===================================================== */

.section-switch {
    position: fixed;

    top: var(--top);
    right: var(--side);

    z-index: 500;

    color: #000;
    text-decoration: none;

    font-size: var(--font-size);
    line-height: var(--line-height);

    -webkit-tap-highlight-color: transparent;
}


/* =====================================================
   VIDEO STAGE
   ===================================================== */

#video-stage {
    position: fixed;

    inset: 0;

    z-index: 10;

    pointer-events: none;
}


/* =====================================================
   VIDEO BLOCK
   ===================================================== */

#video-block {
    position: absolute;

    top: 50%;
    left: 50%;

    transform:
        translate(-50%, -50%);

    display: flex;
    flex-direction: column;

    align-items: stretch;

    pointer-events: none;
}


/*
    Media gets its own holder.

    This is important because on landscape phones a
    portrait film may be narrow, but the controls must
    NOT inherit that tiny width.
*/

#media-holder {
    display: flex;

    align-items: center;
    justify-content: center;

    width: 100%;

    pointer-events: none;
}


/* =====================================================
   MAIN VIDEO
   ===================================================== */

#film-video {
    display: block;

    width: auto;
    height: auto;

    max-width: 100%;
    max-height: 100%;

    object-fit: contain;

    background: transparent;

    cursor: pointer;

    pointer-events: auto;

    -webkit-tap-highlight-color: transparent;
}


/* =====================================================
   PROJECT META
   ===================================================== */

#project-meta {
    position: relative;

    z-index: 60;

    display: grid;

    grid-template-columns:
        minmax(0, 1fr)
        auto;

    grid-template-rows:
        auto
        auto;

    width: 100%;

    margin-top:
        var(--meta-top-gap);

    font-size:
        var(--font-size);

    line-height:
        var(--line-height);

    pointer-events: none;
}

#project-title {
    grid-column: 1;
    grid-row: 1;

    min-width: 0;

    white-space: nowrap;
}

#project-date {
    grid-column: 1;
    grid-row: 2;

    min-width: 0;

    white-space: nowrap;
}

#project-counter {
    grid-column: 2;
    grid-row: 1;

    justify-self: end;

    padding-left: 28px;

    white-space: nowrap;
}

#view-all-button {
    grid-column: 2;
    grid-row: 2;

    justify-self: end;

    appearance: none;
    -webkit-appearance: none;

    margin: 0;
    padding: 0;

    border: 0;
    outline: 0;

    background: transparent;
    color: inherit;

    line-height: inherit;

    text-align: right;

    white-space: nowrap;

    cursor: pointer;

    pointer-events: auto;

    -webkit-tap-highlight-color: transparent;
}


/* =====================================================
   CONTROLS
   ===================================================== */

#controls {
    display: grid;

    grid-template-columns:
        1fr
        auto
        1fr;

    align-items: center;

    width: 100%;

    margin-top: 10px;

    font-size:
        var(--font-size);

    line-height:
        var(--line-height);

    pointer-events: auto;
}

#controls button {
    appearance: none;
    -webkit-appearance: none;

    margin: 0;
    padding: 0;

    border: 0;
    outline: 0;

    background: transparent;
    color: #000;

    line-height: inherit;

    cursor: pointer;

    white-space: nowrap;

    -webkit-tap-highlight-color: transparent;
}

#previous-button {
    justify-self: start;
}

#sound-button {
    justify-self: center;
}

#next-button {
    justify-self: end;
}


/* =====================================================
   VIEW ALL MODE
   ===================================================== */

body.project-all-mode #media-holder {
    visibility: hidden;
}

body.project-all-mode #controls {
    visibility: hidden;
}


/* =====================================================
   VIEW ALL
   ===================================================== */

#project-all-view {
    position: fixed;

    z-index: 30;

    display: none;

    overflow: hidden;

    pointer-events: auto;
}

body.project-all-mode #project-all-view {
    display: block;
}


/* =====================================================
   VIEW ALL GRID
   ===================================================== */

#project-all-grid {
    position: relative;

    display: block;

    width: 100%;
    height: 100%;
}


/* =====================================================
   VIEW ALL THUMB
   ===================================================== */

.project-all-thumb {
    appearance: none;
    -webkit-appearance: none;

    position: absolute;

    display: flex;

    align-items: center;
    justify-content: center;

    width: 0;
    height: 0;

    min-width: 0;
    min-height: 0;

    margin: 0;
    padding: 0;

    border: 0;

    background: transparent;

    cursor: pointer;

    overflow: hidden;

    -webkit-tap-highlight-color: transparent;
}

.project-all-thumb video {
    display: block;

    width: auto;
    height: auto;

    max-width: 100%;
    max-height: 100%;

    object-fit: contain;

    pointer-events: none;
}


/*
    Preview videos use their JPG poster as the immediate visual.
    No fade is added: poster simply gives way to the first decoded
    video frame, preserving the site's crisp motion language.
*/

.project-all-thumb video,
.card-video-wrap video {
    background: transparent;
}


/* =====================================================
   INDEX BUTTON
   ===================================================== */

#index-button {
    position: fixed;

    left: var(--index-center-x);

    bottom:
        calc(
            var(--index-bottom) +
            env(safe-area-inset-bottom)
        );

    z-index: 600;

    transform:
        translateX(-50%);

    appearance: none;
    -webkit-appearance: none;

    margin: 0;
    padding: 0;

    border: 0;
    outline: 0;

    background: transparent;
    color: #000;

    font-size:
        var(--font-size);

    line-height:
        var(--line-height);

    white-space: nowrap;

    cursor: pointer;

    -webkit-tap-highlight-color: transparent;
}


/* =====================================================
   INDEX VIEW
   ===================================================== */

#index-view {
    position: fixed;

    inset: 0;

    z-index: 100;

    display: none;

    background: #fff;
}

#index-view.visible {
    display: block;
}

body.index-mode #video-stage {
    visibility: hidden;
}


/* =====================================================
   INDEX SCROLLER
   ===================================================== */

#index-scroller {
    position: absolute;

    left: 0;
    right: 0;

    top: 130px;

    bottom:
        calc(
            var(--index-bottom) +
            env(safe-area-inset-bottom) +
            34px
        );

    display: flex;

    align-items: center;

    overflow-x: auto;
    overflow-y: hidden;

    scrollbar-width: none;

    -webkit-overflow-scrolling: touch;

    user-select: none;

    cursor: grab;

    outline: none;

    pointer-events: auto;
}

#index-scroller::-webkit-scrollbar {
    display: none;
}

#index-scroller.dragging {
    cursor: grabbing;
}


/* =====================================================
   INDEX RAIL
   ===================================================== */

#index-grid {
    display: flex;

    flex-direction: row;
    flex-wrap: nowrap;

    align-items: flex-start;

    gap:
        var(--index-gap);

    width: max-content;

    padding-left:
        var(--side);

    padding-right:
        var(--side);
}


/* =====================================================
   INDEX CARD
   ===================================================== */

.project-card {
    appearance: none;
    -webkit-appearance: none;

    flex: 0 0 auto;

    display: flex;
    flex-direction: column;

    align-items: flex-start;

    margin: 0;
    padding: 0;

    border: 0;

    background: transparent;
    color: #000;

    text-align: left;

    cursor: pointer;

    -webkit-tap-highlight-color: transparent;
}


/* =====================================================
   INDEX MEDIA STAGE

   All cards get the SAME invisible media height.

   A landscape video is centered vertically inside it.

   A portrait video can use almost all of the height.

   Copy always begins AFTER this wrapper, therefore all
   project titles/dates remain aligned.
   ===================================================== */

.card-video-wrap {
    position: relative;

    display: block;

    flex: 0 0 auto;

    overflow: visible;

    pointer-events: none;
}

.card-video-wrap video {
    position: absolute;

    top: 50%;
    left: 0;

    display: block;

    transform:
        translateY(-50%);

    margin: 0;

    object-fit: contain;

    pointer-events: none;
}


/* =====================================================
   INDEX COPY
   ===================================================== */

.card-copy {
    display: flex;
    flex-direction: column;

    align-items: flex-start;

    width: 100%;

    margin-top:
        var(--meta-gap);

    font-size:
        var(--font-size);

    line-height:
        var(--line-height);

    text-align: left;

    pointer-events: none;
}

.card-title,
.card-date {
    display: block;

    margin: 0;
    padding: 0;

    max-width: 100%;

    text-align: left;

    white-space: nowrap;

    overflow: hidden;
}


/* =====================================================
   TABLET
   ===================================================== */

@media
    (min-width: 601px)
    and (max-width: 1366px) {

    :root {
        --index-gap: 48px;
    }

}


/* =====================================================
   PHONE
   ===================================================== */

@media
    (max-width: 600px) {

    :root {

        --font-size: 13px;

        --side: 24px;
        --top: 20px;

        --index-bottom: 18px;

        --meta-gap: 5px;

        --index-gap: 54px;

    }


    .logo {
        width: 160px;
        height: 45px;
    }


    .logo-aybak {
        top: 15px;
    }

}


/* =====================================================
   PHONE PORTRAIT
   ===================================================== */

@media
    (max-width: 600px)
    and (orientation: portrait) {

    #video-block {
        transform:
            translateX(-50%);
    }


    /*
        On phone portrait the project metadata is a viewport UI bar,
        not a caption tied to the current video's width.

        This keeps the title/date fixed to the left safe edge and
        counter/view-all fixed to the right safe edge even when the
        current film is a narrow portrait clip.
    */
    #project-meta {
        width: calc(100vw - (var(--side) * 2));
        align-self: center;
    }


    #controls {
        margin-top: 9px;
    }


    #project-all-grid {
        gap: 5px;
    }


    #index-scroller {
        top: 190px;

        bottom:
            calc(
                var(--index-bottom) +
                env(safe-area-inset-bottom) +
                54px
            );

        align-items: center;
    }


    #index-grid {
        padding-left: 24px;
        padding-right: 24px;

        gap: 54px;
    }

}


/* =====================================================
   PHONE LANDSCAPE
   ===================================================== */

@media
    (max-height: 650px)
    and (orientation: landscape)
    and (max-width: 1000px) {

    :root {

        --font-size: 13px;

        --side: 24px;
        --top: 18px;

        --index-bottom: 14px;

        /*
            Photography-site rhythm:
            relatively small works + generous horizontal air.
        */

        --index-gap: 92px;

    }


    .logo {
        width: 155px;
        height: 42px;
    }


    .logo-aybak {
        top: 15px;
    }


    /*
        LANDSCAPE SLIDE

        The photography site does not treat the left info
        block and the artwork as two rigid columns.

        Instead:
        - identity/contact stays in the upper-left
        - content remains visually centered in the viewport
        - title/date anchors to the lower-left
        - counter/view-all anchors to the lower-right
        - INDEX remains centered at the bottom

        Film keeps its extra previous / sound / next row,
        but that row also spans the viewport rather than
        collapsing to the current video's width.
    */

    #video-block {
        width:
            calc(
                100vw -
                var(--side) * 2
            );

        height: 100%;

        max-width: none;
    }


    #media-holder {
        position: absolute;

        left: 0;
        right: 0;

        top: 18px;
        bottom: 118px;

        width: 100%;

        display: flex;

        align-items: center;
        justify-content: center;
    }


    #project-meta {
        position: absolute;

        left: 0;
        right: 0;

        /* Restore the breathing room used in the other modes. */
        bottom: 112px;

        width: 100%;

        margin: 0;

        grid-template-columns:
            minmax(0, 1fr)
            auto;

        font-size: 13px;
        line-height: 1.15;
    }


    #project-title,
    #project-date {
        overflow: visible;

        text-overflow: clip;

        white-space: nowrap;
    }


    #project-counter {
        padding-left: 24px;
    }


    #controls {
        position: absolute;

        left: 0;
        right: 0;

        /*
            Keep a real gap both above this row and below it.
            INDEX remains a separate third row, as in portrait.
        */
        bottom: 72px;

        width: 100%;

        margin: 0;

        font-size: 13px;
        line-height: 1.15;
    }


    /*
        VIEW ALL uses the same broad horizontal field as
        photography. The actual top/bottom bounds are
        calculated in JS from the info and metadata.
    */

    #project-all-grid {
        gap: 5px;
    }


    /*
        INDEX should feel like the photography landscape
        index: small works, common visual height, generous
        horizontal spacing, captions aligned below.
    */

    #index-scroller {
        left: 0;
        right: 0;

        align-items: center;
    }


    #index-grid {
        align-items: flex-start;
    }


    /*
        Landscape index follows portrait-mobile logic:
        every card owns the same invisible media stage;
        the actual video is centered inside that stage.
        Caption width is independent from a very narrow
        portrait thumbnail so title + date stay readable.
    */

    .card-video-wrap {
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .card-copy {
        /*
            Caption width must not collapse to the width of a
            very narrow portrait film. Smaller thumbnails + a
            stable copy width make both title and date readable.

            The margin is the exact visible-thumbnail offset
            calculated by JS, so title/date always begin on the
            thumbnail's actual left edge.
        */
        margin-left: var(--landscape-preview-offset, 0px);
        min-width: 178px;
        width: 100%;
        overflow: visible;
    }

    .card-title,
    .card-date {
        overflow: visible;
        text-overflow: clip;
        white-space: nowrap;
    }

}


/* =====================================================
   REDUCED MOTION
   ===================================================== */

@media
    (prefers-reduced-motion: reduce) {

    * {
        scroll-behavior:
            auto !important;
    }

}



/* =====================================================
   PHOTO-SITE UI PORT — FILM
   Only the requested meta/index/end-card layers are overridden.
   ===================================================== */

/* Slide: VIEW ALL over total film count. View All mode: ALL (...) over CLOSE. */
#view-all-button {
    grid-column: 2 !important;
    grid-row: 1 !important;
}

#project-counter {
    grid-column: 2 !important;
    grid-row: 2 !important;
    padding-left: 28px;
    text-align: right;
}

body.project-all-mode #project-counter {
    grid-row: 1 !important;
}

body.project-all-mode #view-all-button {
    grid-row: 2 !important;
}


/* White page keeps only Denizalp Aybak at left and INDEX at right. */
#index-button {
    position: fixed !important;
    top: var(--top) !important;
    right: var(--side) !important;
    left: auto !important;
    bottom: auto !important;
    transform: none !important;
    z-index: 600;
    cursor: pointer;
}


/* =====================================================
   TYPOGRAPHIC INDEX
   ===================================================== */

#index-view {
    position: fixed;
    inset: 0;
    z-index: 100;
    display: none;
    overflow: hidden;
    background: #fff;
}

#index-view.visible {
    display: block;
}

body.index-mode #video-stage {
    visibility: hidden;
}

#index-scroller {
    position: absolute !important;
    top: calc(var(--top) + 72px) !important;
    left: var(--side) !important;
    right: calc(var(--side) + min(36vw, 560px) + clamp(34px, 4vw, 76px)) !important;
    bottom: var(--top) !important;
    display: block !important;
    overflow: hidden !important;
    scrollbar-width: none !important;
    -ms-overflow-style: none !important;
    overscroll-behavior: contain;
    outline: none;
    cursor: default !important;
    user-select: none;
}

#index-scroller::-webkit-scrollbar {
    display: none !important;
}

#index-grid {
    --index-row-gap: calc(var(--font-size) * var(--line-height));
    --index-column-gap: clamp(32px, 4vw, 72px);

    position: relative;
    display: grid !important;
    grid-auto-flow: column !important;
    grid-template-rows:
        repeat(
            var(--index-row-count, 1),
            calc(var(--font-size) * var(--line-height) * 2)
        ) !important;
    grid-template-columns:
        repeat(
            var(--index-column-count, 2),
            max-content
        ) !important;
    column-gap: var(--index-column-gap) !important;
    row-gap: var(--index-row-gap) !important;
    align-content: start !important;
    width: max-content !important;
    min-width: 100%;
    min-height: 100%;
    padding:
        calc(var(--font-size) * var(--line-height))
        0 !important;
    transform: none !important;
}

.index-project-row {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    min-width: 0;
    min-height: 0;
    margin: 0;
    padding: 0;
    font-size: var(--font-size);
    line-height: var(--line-height);
    overflow: visible;
}

.index-project-title,
.index-project-date {
    appearance: none;
    -webkit-appearance: none;
    display: block;
    width: max-content;
    max-width: none;
    margin: 0;
    padding: 0;
    border: 0;
    outline: 0;
    background: transparent;
    color: #000;
    font: inherit;
    line-height: inherit;
    white-space: nowrap;
    text-align: left;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
}

#index-preview {
    position: fixed;
    right: var(--side);
    top: 50%;
    width: min(36vw, 560px);
    transform: translateY(-50%);
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
    transition: opacity 150ms ease, visibility 0s linear 150ms;
}

#index-preview.visible {
    opacity: 1;
    visibility: visible;
    pointer-events: auto;
    transition: opacity 150ms ease, visibility 0s linear 0s;
}

#index-preview-video {
    display: block;
    width: auto;
    height: auto;
    max-width: 100%;
    max-height: 54vh;
    object-fit: contain;
    background: transparent;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
}

#index-project-action {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    width: 100%;
    margin-top: calc(var(--font-size) * .75);
    font-size: var(--font-size);
    line-height: var(--line-height);
    text-align: right;
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
}

#index-project-action.visible {
    opacity: 1;
    visibility: visible;
    pointer-events: auto;
}

#index-project-view-all {
    appearance: none;
    -webkit-appearance: none;
    margin: 0;
    padding: 0;
    border: 0;
    outline: 0;
    background: transparent;
    color: #000;
    font: inherit;
    line-height: inherit;
    text-align: right;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
}

#index-project-count {
    display: block;
    width: 100%;
    text-align: right;
}


/* Phones: one text column with the preview/action fixed at right.
   The list scrolls only when one-line minimum spacing no longer fits. */
body.phone-portrait #index-scroller,
body.phone-landscape #index-scroller {
    top: calc(var(--top) + 58px) !important;
    left: var(--side) !important;
    right: calc(var(--side) + min(42vw, 320px) + 18px) !important;
    bottom: calc(var(--top) + env(safe-area-inset-bottom)) !important;
    overflow-x: hidden !important;
    overflow-y: auto !important;
    touch-action: pan-y !important;
    -webkit-overflow-scrolling: touch;
}

body.phone-landscape #index-scroller {
    top: calc(var(--top) + 46px) !important;
    right: calc(var(--side) + min(34vw, 300px) + 20px) !important;
}

body.phone-portrait #index-grid,
body.phone-landscape #index-grid {
    display: flex !important;
    flex-direction: column !important;
    flex-wrap: nowrap !important;
    width: 100% !important;
    min-width: 0 !important;
    height: auto !important;
    min-height: 100% !important;
    padding:
        calc(var(--font-size) * var(--line-height))
        0 !important;
    gap: var(--index-row-gap) !important;
}

body.phone-portrait .index-project-row,

<script>

/* =====================================================
   AYBAK END CARD — TWO-STATE VERTICAL NAVIGATION
   ===================================================== */

const aybakEndCard =
    document.getElementById(
        "aybak-end-card"
    );

let aybakEndCardActive =
    false;

let aybakResumeVideo =
    false;

let aybakTouchStartX =
    null;

let aybakTouchStartY =
    null;

let aybakTouchStartedInIndexScroller =
    false;

let aybakWheelAccumulator =
    0;

let aybakWheelResetTimer =
    null;

const AYBAK_WHEEL_THRESHOLD =
    48;

const AYBAK_SWIPE_THRESHOLD =
    52;


function fitAybakEndCardWord() {

    const canvas =
        document.getElementById(
            "aybak-end-card-word"
        );

    if (
        !canvas ||
        !aybakEndCard
    ) {
        return;
    }

    const viewportWidth =
        Math.max(
            1,
            aybakEndCard.clientWidth
        );

    const viewportHeight =
        Math.max(
            1,
            aybakEndCard.clientHeight
        );

    const contactAnchor =
        aybakEndCard.querySelector(
            ".aybak-end-card-contact"
        );

    const sectionAnchor =
        aybakEndCard.querySelector(
            ".aybak-end-card-section"
        );

    const contactRect =
        contactAnchor
            ? contactAnchor.getBoundingClientRect()
            : null;

    const sectionRect =
        sectionAnchor
            ? sectionAnchor.getBoundingClientRect()
            : null;

    const computedStyle =
        getComputedStyle(
            document.documentElement
        );

    const computedSide =
        parseFloat(
            computedStyle.getPropertyValue(
                "--side"
            )
        ) || 0;

    const computedTop =
        parseFloat(
            computedStyle.getPropertyValue(
                "--top"
            )
        ) || 0;

    const targetInkLeft =
        contactRect
            ? contactRect.left
            : computedSide;

    const targetInkRight =
        sectionRect
            ? sectionRect.right
            : viewportWidth -
                computedSide;

    const bottomGap =
        Math.max(
            0,
            computedTop
        );

    const sampleSize =
        1000;

    const trackingEm =
        -0.045;

    const trackingPx =
        trackingEm *
        sampleSize;

    const padding =
        320;

    const measureCanvas =
        document.createElement(
            "canvas"
        );

    const measureContext =
        measureCanvas.getContext(
            "2d"
        );

    measureContext.font =
        `400 ${sampleSize}px "Times New Roman", Times, serif`;

    const letters =
        Array.from(
            "AYBAK"
        );

    const advances =
        letters.map(
            letter =>
                measureContext.measureText(
                    letter
                ).width
        );

    const advance =
        advances.reduce(
            (
                sum,
                width
            ) =>
                sum + width,
            0
        ) +
        trackingPx *
        Math.max(
            0,
            letters.length - 1
        );

    measureCanvas.width =
        Math.ceil(
            advance +
            padding * 2
        );

    measureCanvas.height =
        sampleSize +
        padding * 2;

    const measureDrawContext =
        measureCanvas.getContext(
            "2d",
            {
                willReadFrequently: true
            }
        );

    measureDrawContext.font =
        `400 ${sampleSize}px "Times New Roman", Times, serif`;

    measureDrawContext.textBaseline =
        "alphabetic";

    measureDrawContext.fillStyle =
        "#fff";

    const sampleOriginX =
        padding;

    const sampleBaselineY =
        padding +
        sampleSize;

    let sampleDrawX =
        sampleOriginX;

    letters.forEach(
        (
            letter,
            index
        ) => {

            measureDrawContext.fillText(
                letter,
                sampleDrawX,
                sampleBaselineY
            );

            sampleDrawX +=
                advances[index];

            if (
                index <
                letters.length - 1
            ) {
                sampleDrawX +=
                    trackingPx;
            }

        }
    );

    const imageData =
        measureDrawContext.getImageData(
            0,
            0,
            measureCanvas.width,
            measureCanvas.height
        );

    const data =
        imageData.data;

    let minX =
        measureCanvas.width;

    let maxX =
        -1;

    let maxY =
        -1;

    for (
        let y = 0;
        y < measureCanvas.height;
        y++
    ) {

        for (
            let x = 0;
            x < measureCanvas.width;
            x++
        ) {

            const alpha =
                data[
                    (
                        y *
                        measureCanvas.width +
                        x
                    ) *
                    4 +
                    3
                ];

            if (
                alpha > 8
            ) {
                minX =
                    Math.min(
                        minX,
                        x
                    );
                maxX =
                    Math.max(
                        maxX,
                        x
                    );
                maxY =
                    Math.max(
                        maxY,
                        y
                    );
            }

        }

    }

    if (
        maxX < minX ||
        maxY < 0
    ) {
        return;
    }

    const sampleInkLeft =
        minX -
        sampleOriginX;

    const sampleInkWidth =
        maxX -
        minX +
        1;

    const sampleInkBottom =
        maxY -
        sampleBaselineY;

    const targetInkWidth =
        Math.max(
            1,
            targetInkRight -
            targetInkLeft
        );

    const fontSize =
        targetInkWidth *
        sampleSize /
        sampleInkWidth;

    const scale =
        fontSize /
        sampleSize;

    const originX =
        targetInkLeft -
        sampleInkLeft *
        scale;

    const baselineY =
        viewportHeight -
        bottomGap -
        sampleInkBottom *
        scale;

    const pixelRatio =
        Math.max(
            1,
            window.devicePixelRatio || 1
        );

    canvas.width =
        Math.max(
            1,
            Math.round(
                viewportWidth *
                pixelRatio
            )
        );

    canvas.height =
        Math.max(
            1,
            Math.round(
                viewportHeight *
                pixelRatio
            )
        );

    canvas.style.width =
        `${viewportWidth}px`;

    canvas.style.height =
        `${viewportHeight}px`;

    const context =
        canvas.getContext(
            "2d"
        );

    context.setTransform(
        pixelRatio,
        0,
        0,
        pixelRatio,
        0,
        0
    );

    context.clearRect(
        0,
        0,
        viewportWidth,
        viewportHeight
    );

    context.font =
        `400 ${fontSize}px "Times New Roman", Times, serif`;

    context.textBaseline =
        "alphabetic";

    context.fillStyle =
        "#fff";

    const finalTracking =
        trackingEm *
        fontSize;

    let drawX =
        originX;

    letters.forEach(
        (
            letter,
            index
        ) => {

            context.fillText(
                letter,
                drawX,
                baselineY
            );

            drawX +=
                context.measureText(
                    letter
                ).width;

            if (
                index <
                letters.length - 1
            ) {
                drawX +=
                    finalTracking;
            }

        }
    );

}


function setAybakEndCard(
    active
) {

    const nextActive =
        Boolean(
            active
        );

    if (
        nextActive ===
        aybakEndCardActive
    ) {
        return;
    }

    if (
        nextActive
    ) {
        aybakResumeVideo =
            !video.paused &&
            !indexMode &&
            !projectAllMode;
        video.pause();
    }

    aybakEndCardActive =
        nextActive;

    body.classList.toggle(
        "aybak-end-card-active",
        aybakEndCardActive
    );

    document.documentElement.classList.toggle(
        "aybak-end-card-active",
        aybakEndCardActive
    );

    aybakEndCard.setAttribute(
        "aria-hidden",
        aybakEndCardActive
            ? "false"
            : "true"
    );

    if (
        aybakEndCardActive
    ) {
        requestAnimationFrame(
            fitAybakEndCardWord
        );
    }
    else if (
        aybakResumeVideo &&
        !indexMode &&
        !projectAllMode
    ) {
        video
            .play()
            .catch(
                () => {}
            );
    }

    aybakWheelAccumulator =
        0;

}


window.addEventListener(
    "wheel",
    event => {

        if (
            Math.abs(
                event.deltaY
            ) <=
            Math.abs(
                event.deltaX
            )
        ) {
            return;
        }

        if (
            !aybakEndCardActive &&
            indexMode &&
            indexScroller.contains(
                event.target
            )
        ) {
            return;
        }

        event.preventDefault();

        clearTimeout(
            aybakWheelResetTimer
        );

        aybakWheelAccumulator +=
            event.deltaY;

        aybakWheelResetTimer =
            setTimeout(
                () => {
                    aybakWheelAccumulator =
                        0;
                },
                140
            );

        if (
            !aybakEndCardActive &&
            aybakWheelAccumulator >=
            AYBAK_WHEEL_THRESHOLD
        ) {
            setAybakEndCard(
                true
            );
            return;
        }

        if (
            aybakEndCardActive &&
            aybakWheelAccumulator <=
            -AYBAK_WHEEL_THRESHOLD
        ) {
            setAybakEndCard(
                false
            );
        }

    },
    {
        passive: false
    }
);


window.addEventListener(
    "touchstart",
    event => {

        if (
            !event.changedTouches.length
        ) {
            return;
        }

        const touch =
            event.changedTouches[0];

        aybakTouchStartX =
            touch.clientX;

        aybakTouchStartY =
            touch.clientY;

        aybakTouchStartedInIndexScroller =
            Boolean(
                indexMode &&
                indexScroller.contains(
                    event.target
                )
            );

    },
    {
        passive: true
    }
);


window.addEventListener(
    "touchend",
    event => {

        if (
            aybakTouchStartX === null ||
            aybakTouchStartY === null ||
            !event.changedTouches.length
        ) {
            return;
        }

        const touch =
            event.changedTouches[0];

        const deltaX =
            touch.clientX -
            aybakTouchStartX;

        const deltaY =
            touch.clientY -
            aybakTouchStartY;

        aybakTouchStartX =
            null;

        aybakTouchStartY =
            null;

        if (
            Math.abs(
                deltaY
            ) <=
            Math.abs(
                deltaX
            ) ||
            Math.abs(
                deltaY
            ) <
            AYBAK_SWIPE_THRESHOLD
        ) {
            return;
        }

        if (
            !aybakEndCardActive &&
            indexMode &&
            aybakTouchStartedInIndexScroller
        ) {
            aybakTouchStartedInIndexScroller =
                false;
            return;
        }

/* =====================================================

   ===================================================== */

/*
    Stable URL structure:

        ?project=vogue-260113&video=2

    IMPORTANT:
    "video=2" refers to the video's ORIGINAL position in
    films.json, not its runtime position after random cover
    rotation.

    Example JSON order:
        1, 2, 3, 4

    Random runtime order:
        3, 4, 1, 2

    Deep link:
        video=2

    still opens the ORIGINAL second video.

    This keeps PDF / external links permanent even though
    the site's opening video changes randomly.
*/

function getDeepLinkRequest() {

    const params =
        new URLSearchParams(
            window.location.search
        );


    const projectId =
        params.get(
            "project"
        );


    const rawVideo =
        params.get(
            "video"
        );


    let videoNumber =
        null;


    if (
        rawVideo !==
        null
    ) {

        const parsed =
            Number.parseInt(
                rawVideo,
                10
            );


        if (
            Number.isFinite(
                parsed
            ) &&
            parsed >= 1
        ) {

            videoNumber =
                parsed;

        }

    }


    return {
        projectId,
        videoNumber
    };

}


function getProjectIdFromUrl() {

    return getDeepLinkRequest()
        .projectId;

}

/* =====================================================
   RANDOM PROJECT START / COVER
   ===================================================== */

/*
    Film follows the same logic as Photography:

    We do NOT fully shuffle a project's videos.

    We choose one starting video and ROTATE the existing
    sequence around it.

    Example:
        1, 2, 3, 4

    random start = 3

        3, 4, 1, 2

    This preserves the relationship between neighbouring
    edits while removing the need to manually choose a
    cover / opening video.

    Optional JSON override:

        "coverOverride": "filename.mp4"

    When present, that video always becomes the first video
    of that project and therefore the moving INDEX cover.
*/

function rotateVideosFromIndex(
    videos,
    startIndex
) {

    if (
        videos.length <= 1 ||
        startIndex <= 0
    ) {

        return videos.slice();

    }


    return [
        ...videos.slice(
            startIndex
        ),
        ...videos.slice(
            0,
            startIndex
        )
    ];

}


function prepareProject(
    project
) {

    /*
        Normalize NU–LOOK typography everywhere.
    */
    project = {
        ...project,
        title:
            String(
                project.title || ""
            ).replace(
                /nu-look/gi,
                "nu–look"
            )
    };


    const originalVideos =
        project.videos.slice();


    let startIndex =
        0;


    if (
        project.coverOverride
    ) {

        const overrideIndex =
            originalVideos.indexOf(
                project.coverOverride
            );


        if (
            overrideIndex >= 0
        ) {

            startIndex =
                overrideIndex;

        }

        else {

            console.warn(
                `coverOverride "${project.coverOverride}" was not found in`,
                project.title
            );


            startIndex =
                Math.floor(
                    Math.random() *
                    originalVideos.length
                );

        }

    }

    else {

        startIndex =
            Math.floor(
                Math.random() *
                originalVideos.length
            );

    }


    return {
        ...project,

        /*
            Keep an immutable copy of films.json order for
            permanent deep-link numbering.
        */
        originalVideos:
            originalVideos.slice(),

        videos:
            rotateVideosFromIndex(
                originalVideos,
                startIndex
            )
    };

}

/* =====================================================
   TYPOGRAPHY
   ===================================================== */

function renderInteractiveTypography(
    element,
    text,
    activePositions =
        new Set()
) {

    const fragment =
        document.createDocumentFragment();


    Array.from(
        String(
            text
        )
    ).forEach(
        (
            character,
            index
        ) => {

            const span =
                document.createElement(
                    "span"
                );


            span.textContent =
                character;


            const isDigit =
                /[0-9]/.test(
                    character
                );


            const isActiveDigit =
                isDigit &&
                activePositions.has(
                    index
                );


            /*
                Keep Helvetica/Arial throughout.
                Active digits only gain spacing; no font swap.
            */
            if (
                isActiveDigit
            ) {

                span.style.letterSpacing =
                    "var(--active-number-tracking)";

            }


            fragment.appendChild(
                span
            );

        }
    );


    element.replaceChildren(
        fragment
    );

}


function renderBaseTypography(
    element,
    text
) {

    renderInteractiveTypography(
        element,
        text,
        new Set()
    );

}


function getMorphPositions(
    text
) {

    return Array.from(
        String(
            text
        )
    )
        .map(
            (
                character,
                index
            ) => {

                const isLetter =
                    character.toLowerCase() !==
                    character.toUpperCase();


                const isDigit =
                    /[0-9]/.test(
                        character
                    );


                return (
                    isLetter ||
                    isDigit
                )
                    ? index
                    : -1;

            }
        )
        .filter(
            index =>
                index >= 0
        );

}


function renderCaseFromActivePositions(
    baseText,
    activePositions
) {

    return String(
        baseText
    )
        .split(
            ""
        )
        .map(
            (
                character,
                index
            ) => {

                const isLetter =
                    character.toLowerCase() !==
                    character.toUpperCase();


                return (
                    isLetter &&
                    activePositions.has(
                        index
                    )
                )
                    ? character.toUpperCase()
                    : character.toLowerCase();

            }
        )
        .join(
            ""
        );

}


/* =====================================================
   LETTER HELPERS
   ===================================================== */

function getLetterPositions(
    text
) {

    const positions =
        [];


    for (
        let i = 0;
        i < text.length;
        i++
    ) {

        const character =
            text[i];


        if (
            character.toLowerCase() !==
            character.toUpperCase()
        ) {

            positions.push(
                i
            );

        }

    }


    return positions;

}


function renderPrefixCase(
    baseText,
    upperCount
) {

    const positions =
        getLetterPositions(
            baseText
        );


    const uppercasePositions =
        new Set(
            positions.slice(
                0,
                upperCount
            )
        );


    return baseText
        .split("")
        .map(
            (
                character,
                index
            ) => {

                return uppercasePositions
                    .has(
                        index
                    )
                        ? character
                            .toUpperCase()
                        : character
                            .toLowerCase();

            }
        )
        .join("");

}


function currentUpperPrefixCount(
    element,
    baseText
) {

    const positions =
        getLetterPositions(
            baseText
        );


    const current =
        element.textContent;


    let count =
        0;


    for (
        const position
        of positions
    ) {

        const character =
            current[
                position
            ];


        if (
            character &&
            character ===
                character.toUpperCase() &&
            character !==
                character.toLowerCase()
        ) {

            count++;

        }

        else {

            break;

        }

    }


    return count;

}


/* =====================================================
   CASE ANIMATION
   ===================================================== */

function animateCase(
    element,
    baseText,
    toUpper,
    duration =
        CASE_DURATION
) {

    const base =
        String(
            baseText
        ).toLowerCase();


    const positions =
        getMorphPositions(
            base
        );


    const total =
        positions.length;


    let initial =
        0;


    const children =
        Array.from(
            element.children
        );


    if (
        children.length ===
        base.length
    ) {

        for (
            let i = 0;
            i < positions.length;
            i++
        ) {

            const position =
                positions[i];


            const character =
                base[
                    position
                ];


            const span =
                children[
                    position
                ];


            const isDigit =
                /[0-9]/.test(
                    character
                );


            const isLetter =
                character.toLowerCase() !==
                character.toUpperCase();


            const active =
                isDigit
                    ? (
                        span &&
                        !!span.style.letterSpacing
                    )
                    : (
                        isLetter &&
                        span &&
                        span.textContent ===
                            character.toUpperCase()
                    );


            if (
                active
            ) {

                initial++;

            }

            else {

                break;

            }

        }

    }

    else {

        const currentText =
            element.textContent;


        for (
            let i = 0;
            i < positions.length;
            i++
        ) {

            const position =
                positions[i];


            const character =
                base[
                    position
                ];


            const isLetter =
                character.toLowerCase() !==
                character.toUpperCase();


            if (
                isLetter &&
                currentText[
                    position
                ] ===
                    character.toUpperCase()
            ) {

                initial++;

            }

            else {

                break;

            }

        }

    }


    const target =
        toUpper
            ? total
            : 0;


    function renderState(
        state
    ) {

        const activePositions =
            new Set(
                positions.slice(
                    0,
                    state
                )
            );


        renderInteractiveTypography(
            element,
            renderCaseFromActivePositions(
                base,
                activePositions
            ),
            activePositions
        );

    }


    if (
        initial ===
        target
    ) {

        renderState(
            target
        );


        return Promise.resolve();

    }


    const start =
        performance.now();


    return new Promise(
        resolve => {

            function frame(
                now
            ) {

                const progress =
                    Math.min(
                        1,
                        (
                            now -
                            start
                        ) /
                        duration
                    );


                const state =
                    Math.round(
                        initial +
                        (
                            target -
                            initial
                        ) *
                        progress
                    );


                renderState(
                    state
                );


                if (
                    progress <
                    1
                ) {

                    requestAnimationFrame(
                        frame
                    );

                }

                else {

                    renderState(
                        target
                    );


                    resolve();

                }

            }


            requestAnimationFrame(
                frame
            );

        }
    );

}


/* =====================================================
   SEQUENTIAL MORPH
   ===================================================== */

function morphSequential(
    element,
    nextText,
    duration =
        TEXT_MORPH_DURATION
) {

    const oldText =
        element.dataset.rawText !==
        undefined
            ? element.dataset.rawText
            : element.textContent;


    if (
        oldText ===
        nextText
    ) {

        renderBaseTypography(
            element,
            nextText
        );


        element.dataset.rawText =
            nextText;


        return Promise.resolve();

    }


    const length =
        Math.max(
            oldText.length,
            nextText.length
        );


    const from =
        oldText
            .padEnd(
                length,
                " "
            )
            .split("");


    const to =
        nextText
            .padEnd(
                length,
                " "
            )
            .split("");


    const changed =
        [];


    for (
        let i = 0;
        i < length;
        i++
    ) {

        if (
            from[i] !==
            to[i]
        ) {

            changed.push(
                i
            );

        }

    }


    const start =
        performance.now();


    return new Promise(
        resolve => {

            function frame(
                now
            ) {

                const progress =
                    Math.min(
                        1,
                        (
                            now -
                            start
                        ) /
                        duration
                    );


                const completed =
                    Math.floor(
                        progress *
                        (
                            changed.length +
                            1
                        )
                    );


                const current =
                    from.slice();


                for (
                    let i = 0;
                    i < completed;
                    i++
                ) {

                    const position =
                        changed[
                            i
                        ];


                    if (
                        position !==
                        undefined
                    ) {

                        current[
                            position
                        ] =
                            to[
                                position
                            ];

                    }

                }


                renderBaseTypography(
                    element,
                    current
                        .join("")
                        .trimEnd()
                );


                if (
                    progress <
                    1
                ) {

                    requestAnimationFrame(
                        frame
                    );

                }

                else {

                    renderBaseTypography(
                        element,
                        nextText
                    );


                    element.dataset.rawText =
                        nextText;


                    resolve();

                }

            }


            requestAnimationFrame(
                frame
            );

        }
    );

}

function setLogoState(
    state
) {

    logoState =
        state;


    logoName.textContent =
        state ===
        0
            ? "Denizalp"
            : "denizalp";


    logoLetters.forEach(
        (
            element,
            index
        ) => {

            element.textContent =
                index <
                state
                    ? logoUpper[
                        index
                    ]
                    : logoLower[
                        index
                    ];

        }
    );

}


function animateLogoTo(
    target
) {

    return new Promise(
        resolve => {

            logoTarget =
                target;


            if (
                logoTimer !==
                null
            ) {

                clearTimeout(
                    logoTimer
                );

            }


            function step() {

                if (
                    logoState ===
                    logoTarget
                ) {

                    logoTimer =
                        null;

                    resolve();

                    return;

                }


                setLogoState(
                    logoState <
                    logoTarget
                        ? logoState + 1
                        : logoState - 1
                );


                logoTimer =
                    setTimeout(
                        step,
                        LOGO_STEP_DURATION
                    );

            }


            step();

        }
    );

}

/* =====================================================
   PHONE PORTRAIT SLIDE BOUNDS
   ===================================================== */

function getPhonePortraitSlideBounds() {

    const infoRect =
        info.getBoundingClientRect();


    const indexRect =
        indexButton.getBoundingClientRect();


    const top =
        infoRect.bottom +
        20;


    const bottom =
        indexRect.top -
        14;


    return {

        top,

        bottom,

        height:
            Math.max(
                0,
                bottom -
                top
            )

    };

}


/* =====================================================
   LANDSCAPE CONTENT AREA
   ===================================================== */

/*
    Landscape is treated as a genuine two-zone layout:

    left  = identity/contact
    right = film / index / view-all

    This removes every overlap visible in the supplied
    landscape screenshots.
*/

function getPhoneLandscapeArea() {

    /*
        Photography landscape reference:

        The media field lives BETWEEN the real contact block
        and the photography switch. This puts the artwork
        visually farther right than the old full-viewport
        centering while preserving the left identity block.
    */

    const infoRect =
        info.getBoundingClientRect();


    const switchRect =
        sectionSwitch.getBoundingClientRect();


    const indexRect =
        indexButton.getBoundingClientRect();


    const left =
        Math.max(
            24,
            infoRect.right + 24
        );


    const right =
        Math.min(
            window.innerWidth - 24,
            switchRect.left - 24
        );


    const top =
        14;


    const bottom =
        Math.min(
            window.innerHeight - 12,
            indexRect.top - 16
        );


    return {

        left,

        right,

        top,

        bottom,

        width:
            Math.max(
                1,
                right - left
            ),

        height:
            Math.max(
                1,
                bottom - top
            )

    };

}


/* =====================================================
   INDEX / SOUND EXACT ALIGNMENT
   ===================================================== */

/*
    INDEX must share the exact visual center of SOUND ON/OFF.

    Measuring the SOUND button itself is more reliable than deriving
    the center from #video-block: the block can shift/resize across
    desktop, laptop, portrait and landscape responsive geometries.
*/
function syncIndexToSoundCenter() {

    requestAnimationFrame(
        () => {

            const rect =
                soundButton.getBoundingClientRect();


            if (
                !rect.width
            ) {

                return;

            }


            const centerX =
                rect.left +
                rect.width / 2;


            document
                .documentElement
                .style
                .setProperty(
                    "--index-center-x",
                    `${centerX}px`
                );

        }
    );

}


/* =====================================================
   FIT MAIN VIDEO
   ===================================================== */

function fitMainVideo() {

    const ratio =
        (
            video.videoWidth &&
            video.videoHeight
        )
            ? video.videoWidth /
                video.videoHeight
            : currentPosterRatio;


    if (
        !ratio ||
        !Number.isFinite(
            ratio
        )
    ) {

        return;

    }


    const vw =
        window.innerWidth;


    const vh =
        window.innerHeight;


    const side =
        parseFloat(
            getComputedStyle(
                document.documentElement
            ).getPropertyValue(
                "--side"
            )
        ) || 48;


    let mediaWidth;
    let mediaHeight;
    let blockWidth;


    /* =================================================
       PHONE PORTRAIT
       ================================================= */

    if (
        isPhonePortrait()
    ) {

        const bounds =
            getPhonePortraitSlideBounds();


        const maxMediaWidth =
            vw -
            side * 2;


        const interfaceHeight =
            projectMeta.offsetHeight +
            controls.offsetHeight +
            25;


        const maxMediaHeight =
            Math.max(
                100,
                bounds.height -
                interfaceHeight
            );


        mediaWidth =
            maxMediaWidth;


        mediaHeight =
            mediaWidth /
            ratio;


        if (
            mediaHeight >
            maxMediaHeight
        ) {

            mediaHeight =
                maxMediaHeight;


            mediaWidth =
                mediaHeight *
                ratio;

        }


        /*
            Allow portrait video to become large, while
            INDEX still remains safely below controls.
        */

        if (
            ratio <
            1
        ) {

            mediaHeight =
                Math.min(
                    maxMediaHeight,
                    vh * 0.70
                );


            mediaWidth =
                mediaHeight *
                ratio;


            if (
                mediaWidth >
                maxMediaWidth
            ) {

                mediaWidth =
                    maxMediaWidth;


                mediaHeight =
                    mediaWidth /
                    ratio;

            }

        }


        blockWidth =
            mediaWidth;


        videoBlock.style.height =
            "";


        videoBlock.style.width =
            `${blockWidth}px`;


        mediaHolder.style.width =
            `${blockWidth}px`;


        mediaHolder.style.height =
            `${mediaHeight}px`;


        video.style.width =
            `${mediaWidth}px`;


        video.style.height =
            `${mediaHeight}px`;


        requestAnimationFrame(
            () => {

                const blockHeight =
                    videoBlock
                        .getBoundingClientRect()
                        .height;


                const free =
                    Math.max(
                        0,
                        bounds.height -
                        blockHeight
                    );


                const top =
                    bounds.top +
                    free * 0.46;


                videoBlock.style.left =
                    "50%";


                videoBlock.style.top =
                    `${Math.round(
                        top
                    )}px`;


                videoBlock.style.transform =
                    "translateX(-50%)";

            }
        );


        return;

    }


    /* =================================================
       PHONE LANDSCAPE
       ================================================= */

    if (
        isPhoneLandscape()
    ) {

        const area =
            getPhoneLandscapeArea();


        /*
            Match photography landscape:

            - center media inside the interval between
              contact and photography
            - keep metadata / controls full safe-width
            - allow the video to extend lower so its bottom
              visually meets the view-all row
        */

        const metaRect =
            projectMeta.getBoundingClientRect();


        /*
            Use the ENTIRE horizontal interval between the
            contact block and the photography switch.

            Vertically, the media may grow from the safe top
            boundary all the way down to just above the
            title / counter / view-all row. This is the same
            space-efficiency visible in the photography
            landscape reference.
        */

        const mediaTopBoundary =
            18;


        /*
            Photography landscape lets the artwork continue
            vertically alongside the outer metadata columns.
            Therefore the media does NOT need to stop above
            the metadata row. Its lower edge may reach the
            bottom of the view-all row itself. This uses the
            otherwise empty centre area without creating a
            collision, because title/date and counter/view-all
            live at the far left and far right.
        */

        const mediaBottomBoundary =
            Math.min(
                window.innerHeight - 54,
                metaRect.bottom + 2
            );


        const maxMediaWidth =
            area.width;


        const maxMediaHeight =
            Math.max(
                120,
                mediaBottomBoundary -
                mediaTopBoundary
            );


        mediaWidth =
            maxMediaWidth;


        mediaHeight =
            mediaWidth /
            ratio;


        if (
            mediaHeight >
            maxMediaHeight
        ) {

            mediaHeight =
                maxMediaHeight;


            mediaWidth =
                mediaHeight *
                ratio;

        }


        if (
            ratio <
            1
        ) {

            mediaHeight =
                Math.min(
                    maxMediaHeight,
                    window.innerHeight * 0.73
                );


            mediaWidth =
                mediaHeight *
                ratio;


            if (
                mediaWidth >
                maxMediaWidth
            ) {

                mediaWidth =
                    maxMediaWidth;


                mediaHeight =
                    mediaWidth /
                    ratio;

            }

        }


        blockWidth =
            window.innerWidth -
            48;


        videoBlock.style.width =
            `${blockWidth}px`;


        videoBlock.style.height =
            "100%";


        mediaHolder.style.width =
            `${area.width}px`;


        mediaHolder.style.height =
            `${mediaHeight}px`;


        mediaHolder.style.left =
            `${area.left - 24}px`;


        mediaHolder.style.right =
            "auto";


        /*
            Anchor the holder so the video's lower boundary
            sits directly above the metadata/view-all row.
        */

        mediaHolder.style.top =
            `${Math.max(
                mediaTopBoundary,
                mediaBottomBoundary -
                mediaHeight
            )}px`;


        mediaHolder.style.bottom =
            "auto";


        video.style.width =
            `${mediaWidth}px`;


        video.style.height =
            `${mediaHeight}px`;


        videoBlock.style.left =
            "24px";


        videoBlock.style.top =
            "0px";


        videoBlock.style.transform =
            "none";


        return;

    }


    /* =================================================
       DESKTOP / LAPTOP
       ================================================= */

    /*
        Keep the film inside the real horizontal safe field between
        the left identity/contact block and the photography switch.

        Wide desktops remain visually centred. On narrower laptop
        screens a wide film shrinks and recentres inside the available
        field instead of running underneath the contact information.
    */

    const infoRect =
        info.getBoundingClientRect();


    const switchRect =
        sectionSwitch.getBoundingClientRect();


    const safeGap =
        Math.max(
            24,
            side * 0.5
        );


    const safeLeft =
        Math.max(
            side,
            infoRect.right + safeGap
        );


    const safeRight =
        Math.min(
            vw - side,
            switchRect.left - safeGap
        );


    const safeWidth =
        Math.max(
            120,
            safeRight - safeLeft
        );


    const safeCenterX =
        safeLeft +
        safeWidth / 2;


    const maxMediaWidth =
        Math.min(
            vw * 0.76,
            safeWidth
        );


    const maxMediaHeight =
        vh * 0.72;


    mediaWidth =
        maxMediaWidth;


    mediaHeight =
        mediaWidth /
        ratio;


    if (
        mediaHeight >
        maxMediaHeight
    ) {

        mediaHeight =
            maxMediaHeight;


        mediaWidth =
            mediaHeight *
            ratio;

    }


    blockWidth =
        mediaWidth;


    videoBlock.style.height =
        "";


    videoBlock.style.width =
        `${blockWidth}px`;


    mediaHolder.style.width =
        `${blockWidth}px`;


    mediaHolder.style.height =
        `${mediaHeight}px`;


    /*
        Remove any inline geometry left by phone-landscape mode when
        crossing responsive breakpoints or rotating the device.
    */
    mediaHolder.style.left =
        "";


    mediaHolder.style.right =
        "";


    mediaHolder.style.top =
        "";


    mediaHolder.style.bottom =
        "";


    video.style.width =
        `${mediaWidth}px`;


    video.style.height =
        `${mediaHeight}px`;


    videoBlock.style.left =
        `${safeCenterX}px`;


    videoBlock.style.top =
        "50%";


    videoBlock.style.transform =
        "translate(-50%, -50%)";



    syncIndexToSoundCenter();

}


/* =====================================================
   LOAD MAIN VIDEO
   ===================================================== */

async function loadCurrentVideo(
    autoplay =
        true
) {

    const filename =
        currentFilename();


    if (
        !filename
    ) {

        return;

    }


    video.pause();


    /*
        Put the poster on screen BEFORE asking the browser to decode
        the master MP4. This guarantees a real visual fallback on
        slow mobile connections instead of a blank white stage.
    */
    const posterUrl =
        posterVideoUrl(
            filename
        );


    const posterToken =
        ++currentPosterRequestToken;


    currentPosterRatio =
        null;


    video.poster =
        posterUrl;


    const posterImage =
        new Image();


    posterImage.decoding =
        "async";


    posterImage.addEventListener(
        "load",
        () => {

            if (
                posterToken !==
                currentPosterRequestToken
            ) {

                return;

            }


            if (
                posterImage.naturalWidth &&
                posterImage.naturalHeight
            ) {

                currentPosterRatio =
                    posterImage.naturalWidth /
                    posterImage.naturalHeight;


                fitMainVideo();

            }

        },
        {
            once: true
        }
    );


    posterImage.src =
        posterUrl;


    video.src =
        videoUrl(
            filename
        );


    video.load();


    video.muted =
        !soundEnabled;


    await updateMetadata(
        currentProjectIndex,
        currentVideoIndex
    );


    const fit =
        () => {

            fitMainVideo();

        };


    if (
        video.readyState >=
        1
    ) {

        fit();

    }

    else {

        video.addEventListener(
            "loadedmetadata",
            fit,
            {
                once: true
            }
        );

    }


    if (
        autoplay
    ) {

        const play =
            () => {

                video
                    .play()
                    .catch(
                        () => {}
                    );


                /*
                    Wait until the important current movie is
                    already playable before spending bandwidth
                    on the next slide.
                */

                if (
                    "requestIdleCallback" in window
                ) {

                    requestIdleCallback(
                        warmNextSlideVideo,
                        {
                            timeout:
                                1200
                        }
                    );

                }

                else {

                    setTimeout(
                        warmNextSlideVideo,
                        450
                    );

                }

            };


        if (
            video.readyState >=
            2
        ) {

            play();

        }

        else {

            video.addEventListener(
                "canplay",
                play,
                {
                    once: true
                }
            );

        }

    }

}


/* =====================================================
   NORMAL MAX-2 PROJECT ROTATION
   ===================================================== */

function ensureSeenNormalVideos() {

    if (
        seenNormalVideos.length !==
        projects.length
    ) {

        seenNormalVideos =
            projects.map(
                project =>
                    new Set()
            );

    }

}


function buildNormalProjectSequence(
    projectIndex,
    {
        includeVideo =
            null
    } = {}
) {

    ensureSeenNormalVideos();


    const normalized =
        normalizeProjectIndex(
            projectIndex
        );


    const project =
        projects[
            normalized
        ];


    const total =
        project.videos.length;


    const limit =
        Math.min(
            NORMAL_PROJECT_VIDEO_LIMIT,
            total
        );


    const seen =
        seenNormalVideos[
            normalized
        ];


    const unseen =
        [];


    const alreadySeen =
        [];


    for (
        let i = 0;
        i < total;
        i++
    ) {

        if (
            seen.has(
                i
            )
        ) {

            alreadySeen.push(
                i
            );

        }

        else {

            unseen.push(
                i
            );

        }

    }


    function shuffled(
        values
    ) {

        const copy =
            values.slice();


        for (
            let i =
                copy.length - 1;
            i > 0;
            i--
        ) {

            const j =
                Math.floor(
                    Math.random() *
                    (
                        i + 1
                    )
                );


            [
                copy[i],
                copy[j]
            ] =
                [
                    copy[j],
                    copy[i]
                ];

        }


        return copy;

    }


    let selected =
        [];


    if (
        includeVideo !==
            null &&
        includeVideo >= 0 &&
        includeVideo < total
    ) {

        selected.push(
            includeVideo
        );

    }


    const unseenPool =
        shuffled(
            unseen.filter(
                index =>
                    !selected.includes(
                        index
                    )
            )
        );


    while (
        selected.length <
            limit &&
        unseenPool.length
    ) {

        selected.push(
            unseenPool.shift()
        );

    }


    const seenPool =
        shuffled(
            alreadySeen.filter(
                index =>
                    !selected.includes(
                        index
                    )
            )
        );


    while (
        selected.length <
            limit &&
        seenPool.length
    ) {

        selected.push(
            seenPool.shift()
        );

    }


    if (
        selected.length <
        limit
    ) {

        const anyPool =
            shuffled(
                Array.from(
                    {
                        length:
                            total
                    },
                    (
                        _,
                        index
                    ) =>
                        index
                ).filter(
                    index =>
                        !selected.includes(
                            index
                        )
                )
            );


        while (
            selected.length <
                limit &&
            anyPool.length
        ) {

            selected.push(
                anyPool.shift()
            );

        }

    }


    /*
        Selection is random; playback order is not.
        Example: chosen 05 + 02 -> shown 02 + 05.
    */
    selected.sort(
        (
            a,
            b
        ) =>
            a - b
    );


    normalSequenceProjectIndex =
        normalized;


    normalSequenceVideos =
        selected;


    normalSequencePosition =
        includeVideo !== null
            ? normalSequenceVideos.indexOf(
                includeVideo
            )
            : -1;

}


function markNormalVideoSeen(
    projectIndex,
    videoIndex
) {

    ensureSeenNormalVideos();


    seenNormalVideos[
        normalizeProjectIndex(
            projectIndex
        )
    ].add(
        videoIndex
    );

}


/* =====================================================
   NEXT / PREVIOUS
   ===================================================== */

function nextFilm() {

    if (
        projectAllMode ||
        indexMode ||
        !projects.length
    ) {

        return;

    }


    /*
        INDEX / VIEW ALL opens a full-project run.
        Keep walking that project's remaining videos in order.
    */
    if (
        fullProjectMode
    ) {

        const project =
            currentProject();


        if (
            currentVideoIndex <
            fullProjectEndIndex
        ) {

            currentVideoIndex++;

        }

        else {

            fullProjectMode =
                false;


            fullProjectEndIndex =
                null;


            currentProjectIndex =
                normalizeProjectIndex(
                    currentProjectIndex + 1
                );


            buildNormalProjectSequence(
                currentProjectIndex
            );


            normalSequencePosition =
                0;


            currentVideoIndex =
                normalSequenceVideos[0];


            markNormalVideoSeen(
                currentProjectIndex,
                currentVideoIndex
            );

        }

    }

    else {

        if (
            normalSequenceProjectIndex !==
                currentProjectIndex ||
            !normalSequenceVideos.length ||
            normalSequencePosition < 0
        ) {

            buildNormalProjectSequence(
                currentProjectIndex,
                {
                    includeVideo:
                        currentVideoIndex
                }
            );

        }


        if (
            normalSequencePosition <
            normalSequenceVideos.length - 1
        ) {

            normalSequencePosition++;


            currentVideoIndex =
                normalSequenceVideos[
                    normalSequencePosition
                ];


            markNormalVideoSeen(
                currentProjectIndex,
                currentVideoIndex
            );

        }

        else {

            currentProjectIndex =
                normalizeProjectIndex(
                    currentProjectIndex + 1
                );


            buildNormalProjectSequence(
                currentProjectIndex
            );


            normalSequencePosition =
                0;


            currentVideoIndex =
                normalSequenceVideos[0];


            markNormalVideoSeen(
                currentProjectIndex,
                currentVideoIndex
            );

        }

    }


    syncProjectUrl(
        "push"
    );


    loadCurrentVideo(
        true
    );

}


function previousFilm() {

    if (
        projectAllMode ||
        indexMode ||
        !projects.length
    ) {

        return;

    }


    if (
        currentVideoIndex >
        0
    ) {

        currentVideoIndex--;

    }

    else {

        currentProjectIndex =
            normalizeProjectIndex(
                currentProjectIndex - 1
            );


        currentVideoIndex =
            projects[
                currentProjectIndex
            ].videos.length - 1;

    }


    syncProjectUrl(
        "push"
    );


    loadCurrentVideo(
        true
    );

}
