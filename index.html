<!DOCTYPE html>
<html lang="en">
<head>

<style>

/* =====================================================
   RESET
   ===================================================== */

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;

    width: 100%;
    height: 100%;

    overflow: hidden;

    background: #fff;
    color: #000;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    -webkit-text-size-adjust: 100%;
    text-size-adjust: 100%;
}

button {
    font: inherit;
}


/* =====================================================
   VARIABLES
   ===================================================== */

:root {

    --font-size: 15px;
    --line-height: 1.15;

    --side: 48px;
    --top: 32px;

    --index-bottom: 24px;

    --meta-gap: 6px;
    --meta-top-gap: 10px;

    --index-gap: 54px;

}


/* =====================================================
   BODY
   ===================================================== */

body {
    cursor: default;
}


/* =====================================================
   INFO
   ===================================================== */

.info {
    position: fixed;

    top: var(--top);
    left: var(--side);

    z-index: 500;

    font-size: var(--font-size);
    line-height: var(--line-height);
}


/* =====================================================
   LOGO
   ===================================================== */

.logo {
    position: relative;

    display: block;

    width: 190px;
    height: 52px;

    color: inherit;
    text-decoration: none;

    cursor: pointer;

    -webkit-tap-highlight-color: transparent;
}

.logo-name {
    position: absolute;

    top: 0;
    left: 0;

    white-space: nowrap;
}

.logo-aybak {
    position: absolute;

    top: 17px;
    left: 0;

    white-space: nowrap;
}


/* =====================================================
   CONTACT
   ===================================================== */

.contact,
.social {
    margin: 0;
    padding: 0;
}

.social {
    display: flex;
    flex-direction: column;
}

.info a {
    color: inherit;
    text-decoration: none;
}

.contact a:hover,
.social a:hover {
    text-decoration: underline;
}


/* =====================================================
   PHOTOGRAPHY
   ===================================================== */

.section-switch {
    position: fixed;

    top: var(--top);
    right: var(--side);

    z-index: 500;

    color: #000;
    text-decoration: none;

    font-size: var(--font-size);
    line-height: var(--line-height);

    -webkit-tap-highlight-color: transparent;
}


/* =====================================================
   VIDEO STAGE
   ===================================================== */

#video-stage {
    position: fixed;

    inset: 0;

    z-index: 10;

    pointer-events: none;
}


/* =====================================================
   VIDEO BLOCK
   ===================================================== */

#video-block {
    position: absolute;

    top: 50%;
    left: 50%;

    transform:
        translate(-50%, -50%);

    display: flex;
    flex-direction: column;

    align-items: stretch;

    pointer-events: none;
}


/*
    Media gets its own holder.

    This is important because on landscape phones a
    portrait film may be narrow, but the controls must
    NOT inherit that tiny width.
*/

#media-holder {
    display: flex;

    align-items: center;
    justify-content: center;

    width: 100%;

    pointer-events: none;
}


/* =====================================================
   MAIN VIDEO
   ===================================================== */

#film-video {
    display: block;

    width: auto;
    height: auto;

    max-width: 100%;
    max-height: 100%;

    object-fit: contain;

    background: transparent;

    cursor: pointer;

    pointer-events: auto;

    -webkit-tap-highlight-color: transparent;
}


/* =====================================================
   PROJECT META
   ===================================================== */

#project-meta {
    position: relative;

    z-index: 60;

    display: grid;

    grid-template-columns:
        minmax(0, 1fr)
        auto;

    grid-template-rows:
        auto
        auto;

    width: 100%;

    margin-top:
        var(--meta-top-gap);

    font-size:
        var(--font-size);

    line-height:
        var(--line-height);

    pointer-events: none;
}

#project-title {
    grid-column: 1;
    grid-row: 1;

    min-width: 0;

    white-space: nowrap;
}

#project-date {
    grid-column: 1;
    grid-row: 2;

    min-width: 0;

    white-space: nowrap;
}

#project-counter {
    grid-column: 2;
    grid-row: 1;

    justify-self: end;

    padding-left: 28px;

    white-space: nowrap;
}

#view-all-button {
    grid-column: 2;
    grid-row: 2;

    justify-self: end;

    appearance: none;
    -webkit-appearance: none;

    margin: 0;
    padding: 0;

    border: 0;
    outline: 0;

    background: transparent;
    color: inherit;

    line-height: inherit;

    text-align: right;

    white-space: nowrap;

    cursor: pointer;

    pointer-events: auto;

    -webkit-tap-highlight-color: transparent;
}


/* =====================================================
   CONTROLS
   ===================================================== */

#controls {
    display: grid;

    grid-template-columns:
        1fr
        auto
        1fr;

    align-items: center;

    width: 100%;

    margin-top: 10px;

    font-size:
        var(--font-size);

    line-height:
        var(--line-height);

    pointer-events: auto;
}

#controls button {
    appearance: none;
    -webkit-appearance: none;

    margin: 0;
    padding: 0;

    border: 0;
    outline: 0;

    background: transparent;
    color: #000;

    line-height: inherit;

    cursor: pointer;

    white-space: nowrap;

    -webkit-tap-highlight-color: transparent;
}

#previous-button {
    justify-self: start;
}

#sound-button {
    justify-self: center;
}

#next-button {
    justify-self: end;
}


/* =====================================================
   VIEW ALL MODE
   ===================================================== */

body.project-all-mode #media-holder {
    visibility: hidden;
}

body.project-all-mode #controls {
    visibility: hidden;
}


/* =====================================================
   VIEW ALL
   ===================================================== */

#project-all-view {
    position: fixed;

    z-index: 30;

    display: none;

    overflow: hidden;

    pointer-events: auto;
}

body.project-all-mode #project-all-view {
    display: block;
}


/* =====================================================
   VIEW ALL GRID
   ===================================================== */

#project-all-grid {
    display: grid;

    width: 100%;
    height: 100%;

    align-items: center;
    justify-items: center;

    place-content: center;

    gap: 7px;
}


/* =====================================================
   VIEW ALL THUMB
   ===================================================== */

.project-all-thumb {
    appearance: none;
    -webkit-appearance: none;

    display: flex;

    align-items: center;
    justify-content: center;

    width: 100%;
    height: 100%;

    min-width: 0;
    min-height: 0;

    margin: 0;
    padding: 0;

    border: 0;

    background: transparent;

    cursor: pointer;

    overflow: hidden;

    -webkit-tap-highlight-color: transparent;
}

.project-all-thumb video {
    display: block;

    width: auto;
    height: auto;

    max-width: 100%;
    max-height: 100%;

    object-fit: contain;

    pointer-events: none;
}


/* =====================================================
   INDEX BUTTON
   ===================================================== */

#index-button {
    position: fixed;

    left: 50%;

    bottom:
        calc(
            var(--index-bottom) +
            env(safe-area-inset-bottom)
        );

    z-index: 600;

    transform:
        translateX(-50%);

    appearance: none;
    -webkit-appearance: none;

    margin: 0;
    padding: 0;

    border: 0;
    outline: 0;

    background: transparent;
    color: #000;

    font-size:
        var(--font-size);

    line-height:
        var(--line-height);

    white-space: nowrap;

    cursor: pointer;

    -webkit-tap-highlight-color: transparent;
}


/* =====================================================
   INDEX VIEW
   ===================================================== */

#index-view {
    position: fixed;

    inset: 0;

    z-index: 100;

    display: none;

    background: #fff;
}

#index-view.visible {
    display: block;
}

body.index-mode #video-stage {
    visibility: hidden;
}


/* =====================================================
   INDEX SCROLLER
   ===================================================== */

#index-scroller {
    position: absolute;

    left: 0;
    right: 0;

    top: 130px;

    bottom:
        calc(
            var(--index-bottom) +
            env(safe-area-inset-bottom) +
            34px
        );

    display: flex;

    align-items: center;

    overflow-x: auto;
    overflow-y: hidden;

    scrollbar-width: none;

    -webkit-overflow-scrolling: touch;

    user-select: none;

    cursor: grab;

    outline: none;

    pointer-events: auto;
}

#index-scroller::-webkit-scrollbar {
    display: none;
}

#index-scroller.dragging {
    cursor: grabbing;
}


/* =====================================================
   INDEX RAIL
   ===================================================== */

#index-grid {
    display: flex;

    flex-direction: row;
    flex-wrap: nowrap;

    align-items: flex-start;

    gap:
        var(--index-gap);

    width: max-content;

    padding-left:
        var(--side);

    padding-right:
        var(--side);
}


/* =====================================================
   INDEX CARD
   ===================================================== */

.project-card {
    appearance: none;
    -webkit-appearance: none;

    flex: 0 0 auto;

    display: flex;
    flex-direction: column;

    align-items: flex-start;

    margin: 0;
    padding: 0;

    border: 0;

    background: transparent;
    color: #000;

    text-align: left;

    cursor: pointer;

    -webkit-tap-highlight-color: transparent;
}


/* =====================================================
   INDEX MEDIA STAGE

   All cards get the SAME invisible media height.

   A landscape video is centered vertically inside it.

   A portrait video can use almost all of the height.

   Copy always begins AFTER this wrapper, therefore all
   project titles/dates remain aligned.
   ===================================================== */

.card-video-wrap {
    position: relative;

    display: block;

    flex: 0 0 auto;

    overflow: visible;

    pointer-events: none;
}

.card-video-wrap video {
    position: absolute;

    top: 50%;
    left: 0;

    display: block;

    transform:
        translateY(-50%);

    margin: 0;

    object-fit: contain;

    pointer-events: none;
}


/* =====================================================
   INDEX COPY
   ===================================================== */

.card-copy {
    display: flex;
    flex-direction: column;

    align-items: flex-start;

    width: 100%;

    margin-top:
        var(--meta-gap);

    font-size:
        var(--font-size);

    line-height:
        var(--line-height);

    text-align: left;

    pointer-events: none;
}

.card-title,
.card-date {
    display: block;

    margin: 0;
    padding: 0;

    max-width: 100%;

    text-align: left;

    white-space: nowrap;

    overflow: hidden;
}


/* =====================================================
   TABLET
   ===================================================== */

@media
    (min-width: 601px)
    and (max-width: 1366px) {

    :root {
        --index-gap: 48px;
    }

}


/* =====================================================
   PHONE
   ===================================================== */

@media
    (max-width: 600px) {

    :root {

        --font-size: 13px;

        --side: 24px;
        --top: 20px;

        --index-bottom: 18px;

        --meta-gap: 5px;

        --index-gap: 54px;

    }


    .logo {
        width: 160px;
        height: 45px;
    }


    .logo-aybak {
        top: 15px;
    }

}


/* =====================================================
   PHONE PORTRAIT
   ===================================================== */

@media
    (max-width: 600px)
    and (orientation: portrait) {

    #video-block {
        transform:
            translateX(-50%);
    }


    #controls {
        margin-top: 9px;
    }


    #project-all-grid {
        gap: 5px;
    }


    #index-scroller {
        top: 190px;

        bottom:
            calc(
                var(--index-bottom) +
                env(safe-area-inset-bottom) +
                54px
            );

        align-items: center;
    }


    #index-grid {
        padding-left: 24px;
        padding-right: 24px;

        gap: 54px;
    }

}


/* =====================================================
   PHONE LANDSCAPE
   ===================================================== */

@media
    (max-height: 650px)
    and (orientation: landscape)
    and (max-width: 1000px) {

    :root {

        --font-size: 13px;

        --side: 24px;
        --top: 18px;

        --index-bottom: 14px;

        /*
            Photography-site rhythm:
            relatively small works + generous horizontal air.
        */

        --index-gap: 92px;

    }


    .logo {
        width: 155px;
        height: 42px;
    }


    .logo-aybak {
        top: 15px;
    }


    /*
        LANDSCAPE SLIDE

        The photography site does not treat the left info
        block and the artwork as two rigid columns.

        Instead:
        - identity/contact stays in the upper-left
        - content remains visually centered in the viewport
        - title/date anchors to the lower-left
        - counter/view-all anchors to the lower-right
        - INDEX remains centered at the bottom

        Film keeps its extra previous / sound / next row,
        but that row also spans the viewport rather than
        collapsing to the current video's width.
    */

    #video-block {
        width:
            calc(
                100vw -
                var(--side) * 2
            );

        height: 100%;

        max-width: none;
    }


    #media-holder {
        position: absolute;

        left: 0;
        right: 0;

        top: 18px;
        bottom: 88px;

        width: 100%;

        display: flex;

        align-items: center;
        justify-content: center;
    }


    #project-meta {
        position: absolute;

        left: 0;
        right: 0;

        bottom: 58px;

        width: 100%;

        margin: 0;

        grid-template-columns:
            minmax(0, 1fr)
            auto;

        font-size: 13px;
        line-height: 1.15;
    }


    #project-title,
    #project-date {
        overflow: visible;

        text-overflow: clip;

        white-space: nowrap;
    }


    #project-counter {
        padding-left: 24px;
    }


    #controls {
        position: absolute;

        left: 0;
        right: 0;

        bottom: 32px;

        width: 100%;

        margin: 0;

        font-size: 13px;
        line-height: 1.15;
    }


    /*
        VIEW ALL uses the same broad horizontal field as
        photography. The actual top/bottom bounds are
        calculated in JS from the info and metadata.
    */

    #project-all-grid {
        gap: 5px;
    }


    /*
        INDEX should feel like the photography landscape
        index: small works, common visual height, generous
        horizontal spacing, captions aligned below.
    */

    #index-scroller {
        left: 0;
        right: 0;

        align-items: center;
    }


    #index-grid {
        align-items: flex-start;
    }

}


/* =====================================================
   REDUCED MOTION
   ===================================================== */

@media
    (prefers-reduced-motion: reduce) {

    * {
        scroll-behavior:
            auto !important;
    }

}

</style>

/* =====================================================

function wait(
    milliseconds
) {

    return new Promise(
        resolve =>
            setTimeout(
                resolve,
                milliseconds
            )
    );

}


function hasHover() {

    return window
        .matchMedia(
            "(hover: hover) and (pointer: fine)"
        )
        .matches;

}


function isPhonePortrait() {

    return (
        window.innerWidth <= 600 &&
        window.innerHeight >=
        window.innerWidth
    );

}


function isPhoneLandscape() {

    return (
        window.innerHeight <= 650 &&
        window.innerWidth >
        window.innerHeight &&
        window.innerWidth <= 1000
    );

}


function isPhoneLayout() {

    return (
        isPhonePortrait() ||
        isPhoneLandscape()
    );

}


function isDesktop() {

    return !isPhoneLayout();

}


function clamp(
    value,
    min,
    max
) {

    return Math.min(
        max,
        Math.max(
            min,
            value
        )
    );

        R2_BASE +
        filename
            .split("/")
            .map(
                encodeURIComponent
            )
            .join("/")
    );

}


function currentProject() {

    return projects[
        currentProjectIndex
    ];

}


function currentFilename() {

    const project =
        currentProject();


    if (
        !project
    ) {

        return null;

    }


    return project.videos[
        currentVideoIndex
    ];

}


function normalizeProjectIndex(
    index
) {

    return (
        (
            index %
            projects.length
        ) +
        projects.length
    ) %
    projects.length;

}


/* =====================================================
   COUNTERS
   ===================================================== */

function getCounterText(
    index,
    total
) {

    return (
        String(

            2,
            "0"
        ) +
        " / " +
        String(
            total
        ).padStart(
            2,
            "0"
        )

}


function getAllCounterText(

        ) +
        ")"
    );

}


/* =====================================================
   LETTER HELPERS
   ===================================================== */

function getLetterPositions(
    text
) {

    const positions =
        [];


    for (
        let i = 0;
        i < text.length;
        i++
    ) {

        const character =
            text[i];


        if (
            character.toLowerCase() !==
            character.toUpperCase()
        ) {

            positions.push(
                i
            );

        }

    }


    return positions;

}


function renderPrefixCase(
    baseText,
    upperCount
) {

    const positions =
        getLetterPositions(
            baseText
        );


    const uppercasePositions =
        new Set(
            positions.slice(
                0,
                upperCount
            )
        );


    return baseText
        .split("")
        .map(
            (
                character,
                index
            ) => {

                return uppercasePositions
                    .has(
                        index
                    )
                        ? character
                            .toUpperCase()
                        : character
                            .toLowerCase();

            }
        )
        .join("");

}


function currentUpperPrefixCount(
    element,
    baseText
) {

    const positions =
        getLetterPositions(
            baseText
        );


    const current =
        element.textContent;


    let count =
        0;


    for (
        const position
        of positions
    ) {

        const character =
            current[
                position
            ];


        if (
            character &&
            character ===
                character.toUpperCase() &&
            character !==
                character.toLowerCase()
        ) {

            count++;

        }

        else {

            break;

        }

    }


    return count;

}


/* =====================================================
   CASE ANIMATION
   ===================================================== */

function animateCase(
    element,
    baseText,
    toUpper,
    duration =
        CASE_DURATION
) {

    const base =
        baseText
            .toLowerCase();


    const total =
        getLetterPositions(
            base
        ).length;


    const initial =
        currentUpperPrefixCount(
            element,
            base
        );


    const target =
        toUpper
            ? total
            : 0;


    if (
        initial ===
        target
    ) {

        element.textContent =
            renderPrefixCase(
                base,
                target
            );


        return Promise.resolve();

    }


    const start =
        performance.now();


    return new Promise(
        resolve => {

            function frame(
                now
            ) {

                const progress =
                    Math.min(
                        1,
                        (
                            now -
                            start
                        ) /
                        duration
                    );


                const state =
                    Math.round(
                        initial +
                        (
                            target -
                            initial
                        ) *
                        progress
                    );


                element.textContent =
                    renderPrefixCase(
                        base,
                        state
                    );


                if (
                    progress <
                    1
                ) {

                    requestAnimationFrame(
                        frame
                    );

                }

                else {

                    element.textContent =
                        renderPrefixCase(
                            base,
                            target
                        );


                    resolve();

                }

            }


            requestAnimationFrame(
                frame
            );

        }
    );

}


/* =====================================================
   SEQUENTIAL MORPH
   ===================================================== */

function morphSequential(
    element,
    nextText,
    duration =
        TEXT_MORPH_DURATION
) {

    const oldText =
        element.dataset.rawText !==
        undefined
            ? element.dataset.rawText
            : element.textContent;


    if (
        oldText ===
        nextText
    ) {

        element.textContent =
            nextText;


        element.dataset.rawText =
            nextText;


        return Promise.resolve();

    }


    const length =
        Math.max(
            oldText.length,
            nextText.length
        );


    const from =
        oldText
            .padEnd(
                length,
                " "
            )
            .split("");


    const to =
        nextText
            .padEnd(
                length,
                " "
            )
            .split("");


    const changed =
        [];


    for (
        let i = 0;
        i < length;
        i++
    ) {

        if (
            from[i] !==
            to[i]
        ) {

            changed.push(
                i
            );

        }

    }


    const start =
        performance.now();


    return new Promise(
        resolve => {

            function frame(
                now
            ) {

                const progress =
                    Math.min(
                        1,
                        (
                            now -
                            start
                        ) /
                        duration
                    );


                const completed =
                    Math.floor(
                        progress *
                        (
                            changed.length +
                            1
                        )
                    );


                const current =
                    from.slice();


                for (
                    let i = 0;
                    i < completed;
                    i++
                ) {

                    const position =
                        changed[
                            i
                        ];


                    if (
                        position !==
                        undefined
                    ) {

                        current[
                            position
                        ] =
                            to[
                                position
                            ];

                    }

                }


                element.textContent =
                    current
                        .join("")
                        .trimEnd();


                if (
                    progress <
                    1
                ) {

                    requestAnimationFrame(
                        frame
                    );

                }

                else {

                    element.textContent =
                        nextText;


                    element.dataset.rawText =
                        nextText;


                    resolve();

                }

            }


            requestAnimationFrame(
                frame
            );

        }
    );

}

function animateLogoTo(
    target
) {

    return new Promise(
        resolve => {

            logoTarget =
                target;


            if (
                logoTimer !==
                null
            ) {

                clearTimeout(
                    logoTimer
                );

            }


            function step() {

                if (
                    logoState ===
                    logoTarget
                ) {

                    logoTimer =
                        null;

                    resolve();

                    return;

                }


                setLogoState(
                    logoState <
                    logoTarget
                        ? logoState + 1
                        : logoState - 1
                );


                logoTimer =
                    setTimeout(
                        step,
                        LOGO_STEP_DURATION
                    );

            }


            step();

        }
    );

}

async function updateMetadata(
    projectIndex,
    videoIndex
) {

    const project =
        projects[

    projectCounter.textContent =
        getCounterText(
            videoIndex,
            project.videos.length
        );


    projectCounter.dataset.rawText =
        projectCounter.textContent;


    if (
        renderedProjectIndex !==
        projectIndex
    ) {

        await Promise.all(
            [

                morphSequential(
                    projectTitle,
                    project.title
                        .toLowerCase()
                ),

                morphSequential(
                    projectDate,
                    (
                        project.date ||
                        ""
                    ).toLowerCase()
                )

            ]
        );

    }


    renderedProjectIndex =
        projectIndex;

}

/* =====================================================
   PHONE PORTRAIT SLIDE BOUNDS
   ===================================================== */

function getPhonePortraitSlideBounds() {

    const infoRect =
        info.getBoundingClientRect();


    const indexRect =
        indexButton.getBoundingClientRect();


    const top =
        infoRect.bottom +
        20;


    const bottom =
        indexRect.top -
        14;


    return {

        top,

        bottom,

        height:
            Math.max(
                0,
                bottom -
                top
            )

    };

}


/* =====================================================
   LANDSCAPE CONTENT AREA
   ===================================================== */

/*
    Landscape is treated as a genuine two-zone layout:

    left  = identity/contact
    right = film / index / view-all

    This removes every overlap visible in the supplied
    landscape screenshots.
*/

function getPhoneLandscapeArea() {

    /*
        Photography-landscape reference:

        The content is NOT pushed into a rigid right column.
        The useful field is almost the entire viewport.

        The info block simply occupies the upper-left portion
        of that field, while media can remain centered.
    */

    const indexRect =
        indexButton.getBoundingClientRect();


    const top =
        14;


    const bottom =
        Math.min(
            window.innerHeight - 12,
            indexRect.top - 8
        );


    return {

        left:
            24,

        right:
            window.innerWidth - 24,

        top,

        bottom,

        width:
            Math.max(
                1,
                window.innerWidth - 48
            ),

        height:
            Math.max(
                1,
                bottom - top
            )

    };

}


/* =====================================================
   FIT MAIN VIDEO
   ===================================================== */

function fitMainVideo() {

    if (
        !video.videoWidth ||
        !video.videoHeight
    ) {

        return;

    }


    const ratio =
        video.videoWidth /
        video.videoHeight;


    const vw =
        window.innerWidth;


    const vh =
        window.innerHeight;


    const side =
        parseFloat(
            getComputedStyle(
                document.documentElement
            ).getPropertyValue(
                "--side"
            )
        ) || 48;


    let mediaWidth;
    let mediaHeight;
    let blockWidth;


    /* =================================================
       PHONE PORTRAIT
       ================================================= */

    if (
        isPhonePortrait()
    ) {

        const bounds =
            getPhonePortraitSlideBounds();


        const maxMediaWidth =
            vw -
            side * 2;


        const interfaceHeight =
            projectMeta.offsetHeight +
            controls.offsetHeight +
            25;


        const maxMediaHeight =
            Math.max(
                100,
                bounds.height -
                interfaceHeight
            );


        mediaWidth =
            maxMediaWidth;


        mediaHeight =
            mediaWidth /
            ratio;


        if (
            mediaHeight >
            maxMediaHeight
        ) {

            mediaHeight =
                maxMediaHeight;


            mediaWidth =
                mediaHeight *
                ratio;

        }


        /*
            Allow portrait video to become large, while
            INDEX still remains safely below controls.
        */

        if (
            ratio <
            1
        ) {

            mediaHeight =
                Math.min(
                    maxMediaHeight,
                    vh * 0.70
                );


            mediaWidth =
                mediaHeight *
                ratio;


            if (
                mediaWidth >
                maxMediaWidth
            ) {

                mediaWidth =
                    maxMediaWidth;


                mediaHeight =
                    mediaWidth /
                    ratio;

            }

        }


        blockWidth =
            mediaWidth;


        videoBlock.style.height =
            "";


        videoBlock.style.width =
            `${blockWidth}px`;


        mediaHolder.style.width =
            `${blockWidth}px`;


        mediaHolder.style.height =
            `${mediaHeight}px`;


        video.style.width =
            `${mediaWidth}px`;


        video.style.height =
            `${mediaHeight}px`;


        requestAnimationFrame(
            () => {

                const blockHeight =
                    videoBlock
                        .getBoundingClientRect()
                        .height;


                const free =
                    Math.max(
                        0,
                        bounds.height -
                        blockHeight
                    );


                const top =
                    bounds.top +
                    free * 0.46;


                videoBlock.style.left =
                    "50%";


                videoBlock.style.top =
                    `${Math.round(
                        top
                    )}px`;


                videoBlock.style.transform =
                    "translateX(-50%)";

            }
        );


        return;

    }


    /* =================================================
       PHONE LANDSCAPE
       ================================================= */

    if (
        isPhoneLandscape()
    ) {

        const area =
            getPhoneLandscapeArea();


        /*
            Match photography landscape:

            - the video is centered in the viewport
            - it does NOT inherit the left contact column
            - portrait / landscape videos are both allowed
              to become substantial
            - metadata and controls span the full safe width
              independently from the video's own aspect ratio
        */

        const maxMediaWidth =
            Math.min(
                area.width * 0.54,
                window.innerWidth * 0.54
            );


        const maxMediaHeight =
            Math.min(
                window.innerHeight * 0.72,
                area.height * 0.80
            );


        mediaWidth =
            maxMediaWidth;


        mediaHeight =
            mediaWidth /
            ratio;


        if (
            mediaHeight >
            maxMediaHeight
        ) {

            mediaHeight =
                maxMediaHeight;


            mediaWidth =
                mediaHeight *
                ratio;

        }


        /*
            Portrait video:
            use more of the vertical field, like a portrait
            image on photography.denizalpaybak.com.
        */

        if (
            ratio <
            1
        ) {

            mediaHeight =
                maxMediaHeight;


            mediaWidth =
                mediaHeight *
                ratio;


            if (
                mediaWidth >
                maxMediaWidth
            ) {

                mediaWidth =
                    maxMediaWidth;


                mediaHeight =
                    mediaWidth /
                    ratio;

            }

        }


        blockWidth =
            area.width;


        videoBlock.style.width =
            `${blockWidth}px`;


        videoBlock.style.height =
            "100%";


        mediaHolder.style.width =
            "100%";


        mediaHolder.style.height =
            "";


        video.style.width =
            `${mediaWidth}px`;


        video.style.height =
            `${mediaHeight}px`;


        videoBlock.style.left =
            "24px";


        videoBlock.style.top =
            "0px";


        videoBlock.style.transform =
            "none";


        return;

    }


    /* =================================================
       DESKTOP
       ================================================= */

    const maxMediaWidth =
        Math.min(
            vw * 0.76,
            vw -
            side * 2
        );


    const maxMediaHeight =
        vh * 0.72;


    mediaWidth =
        maxMediaWidth;


    mediaHeight =
        mediaWidth /
        ratio;


    if (
        mediaHeight >
        maxMediaHeight
    ) {

        mediaHeight =
            maxMediaHeight;


        mediaWidth =
            mediaHeight *
            ratio;

    }


    blockWidth =
        mediaWidth;


    videoBlock.style.height =
        "";


    videoBlock.style.width =
        `${blockWidth}px`;


    mediaHolder.style.width =
        `${blockWidth}px`;


    mediaHolder.style.height =
        `${mediaHeight}px`;


    video.style.width =
        `${mediaWidth}px`;


    video.style.height =
        `${mediaHeight}px`;


    videoBlock.style.left =
        "50%";


    videoBlock.style.top =
        "50%";


    videoBlock.style.transform =
        "translate(-50%, -50%)";

}


/* =====================================================
   LOAD MAIN VIDEO
   ===================================================== */

async function loadCurrentVideo(
    autoplay =
        true
) {

    const filename =
        currentFilename();


    if (
        !filename
    ) {

        return;

    }


    video.pause();


    video.src =
        videoUrl(
            filename
        );


    video.load();


    video.muted =
        !soundEnabled;


    await updateMetadata(
        currentProjectIndex,
        currentVideoIndex
    );


    const fit =
        () => {

            fitMainVideo();

        };


    if (
        video.readyState >=
        1
    ) {

        fit();

    }

    else {

        video.addEventListener(
            "loadedmetadata",
            fit,
            {
                once: true
            }
        );

    }


    if (
        autoplay
    ) {

        const play =
            () => {

                video
                    .play()
                    .catch(
                        () => {}
                    );

            };


        if (
            video.readyState >=
            2
        ) {

            play();

        }

        else {

            video.addEventListener(
                "canplay",
                play,
                {
                    once: true
                }
            );

        }

    }

}


/* =====================================================
   NEXT / PREVIOUS
   ===================================================== */

function nextFilm() {

    if (
        projectAllMode ||
        indexMode ||
        !projects.length
    ) {

        return;

    }


    const project =
        currentProject();


    if (
        currentVideoIndex <
        project.videos.length - 1
    ) {

        currentVideoIndex++;

    }

    else {

        currentProjectIndex =
            normalizeProjectIndex(
                currentProjectIndex + 1
            );


        currentVideoIndex =
            0;

    }


    loadCurrentVideo(
        true
    );

}


function previousFilm() {

    if (
        projectAllMode ||
        indexMode ||
        !projects.length
    ) {

        return;

    }


    if (
        currentVideoIndex >
        0
    ) {

        currentVideoIndex--;

    }

    else {

        currentProjectIndex =
            normalizeProjectIndex(
                currentProjectIndex - 1
            );


        currentVideoIndex =
            projects[
                currentProjectIndex
            ].videos.length - 1;

    }


    loadCurrentVideo(
        true
    );

}

/* =====================================================
   PREVIEW VIDEO
   ===================================================== */

function createPreviewVideo(
    filename,
    {
        eagerMetadata =
            false
    } = {}
) {

    const preview =
        document.createElement(
            "video"
        );


    preview.dataset.src =
        videoUrl(
            filename
        );


    preview.muted =
        true;


    preview.defaultMuted =
        true;


    preview.playsInline =
        true;


    preview.preload =
        eagerMetadata
            ? "metadata"
            : "none";


    preview.disablePictureInPicture =
        true;


    preview.setAttribute(
        "aria-hidden",
        "true"
    );


    preview.addEventListener(
        "timeupdate",
        () => {

            if (
                preview.currentTime >=
                PREVIEW_DURATION
            ) {

                preview.currentTime =
                    0;


                preview
                    .play()
                    .catch(
                        () => {}
                    );

            }

        }
    );


    if (
        eagerMetadata
    ) {

        preview.src =
            preview.dataset.src;


        preview.load();

    }


    return preview;

}


/* =====================================================
   PREVIEW ACTIVATION
   ===================================================== */

function activatePreview(
    preview
) {

    if (
        !preview.getAttribute(
            "src"
        )
    ) {

        preview.src =
            preview.dataset.src;


        preview.preload =
            "auto";


        preview.load();

    }


    preview
        .play()
        .catch(
            () => {}
        );

}


function activatePreviewsIn(
    container
) {

    container
        .querySelectorAll(
            "video[data-src]"
        )
        .forEach(

}


function stopAllPreviews() {

        )
        .forEach(
            preview => {

                preview.pause();

            }
        );

/* =====================================================
   PREVIEW OBSERVER
   ===================================================== */

const previewObserver =
    new IntersectionObserver(
        entries => {

            entries.forEach(
                entry => {

                    const preview =
                        entry.target;


                    const allowed =
                        (
                            indexMode &&
                            indexView.contains(
                                preview
                            )
                        ) ||
                        (
                            projectAllMode &&
                            projectAllView.contains(
                                preview
                            )
                        );


                    if (
                        entry.isIntersecting &&
                        allowed
                    ) {

                        activatePreview(
                            preview
                        );

                    }

                    else {

                        preview.pause();

                    }

                }
            );

        },
        {
            rootMargin:
                "220px"
        }
    );


function observePreview(
    preview
) {

    previewObserver.observe(
        preview
    );

}


/* =====================================================
   VIEW ALL BOUNDS
   ===================================================== */

function syncProjectAllBounds() {

    if (
        !projectAllMode
    ) {

        return;

    }


    /*
        LANDSCAPE:
        match photography's broad central field.

        Previews are allowed to spread almost edge-to-edge
        horizontally. The info block remains above them,
        while the title/date + all/close row remains below.
    */

    if (
        isPhoneLandscape()
    ) {

        const infoRect =
            info.getBoundingClientRect();


        const metaRect =
            projectMeta.getBoundingClientRect();


        const top =
            Math.ceil(
                infoRect.bottom + 8
            );


        const bottom =
            Math.floor(
                metaRect.top - 8
            );


        projectAllView.style.left =
            "24px";


        projectAllView.style.right =
            "24px";


        projectAllView.style.top =
            `${top}px`;


        projectAllView.style.height =
            `${Math.max(
                82,
                bottom - top
            )}px`;


        return;

    }


    const infoRect =
        info
            .getBoundingClientRect();


    const metaRect =
        projectMeta
            .getBoundingClientRect();


    const side =
        parseFloat(
            getComputedStyle(
                document.documentElement
            ).getPropertyValue(
                "--side"
            )
        ) || 48;


    const topGap =
        isPhonePortrait()
            ? 10
            : 14;


    const bottomGap =
        isPhonePortrait()
            ? 10
            : 14;


    const top =
        Math.ceil(
            infoRect.bottom +
            topGap
        );


    const bottom =
        Math.floor(
            metaRect.top -
            bottomGap
        );


    projectAllView.style.left =
        `${side}px`;


    projectAllView.style.right =
        `${side}px`;


    projectAllView.style.top =
        `${top}px`;


    projectAllView.style.height =
        `${Math.max(
            80,
            bottom -
            top
        )}px`;

}


/* =====================================================
   VIEW ALL RATIOS
   ===================================================== */

function getProjectAllRatios() {

    return [
        ...projectAllGrid
            .querySelectorAll(
                "video"
            )
    ].map(
        preview => {

            if (
                preview.videoWidth &&
                preview.videoHeight
            ) {

                return (
                    preview.videoWidth /
                    preview.videoHeight
                );

            }


            return 16 / 9;

        }
    );

}


/* =====================================================
   CONTAIN
   ===================================================== */

function calculateContainedSize(
    ratio,
    boxWidth,
    boxHeight
) {

    let width =
        boxWidth;


    let height =
        width /
        ratio;


    if (
        height >
        boxHeight
    ) {

        height =
            boxHeight;


        width =
            height *
            ratio;

    }


    return {

        width,

        height,

        area:
            width *
            height

    };

}


/* =====================================================
   SMART VIEW ALL LAYOUT
   ===================================================== */

/*
    Every possible row/column layout is evaluated using
    the ACTUAL aspect ratios.

    There is no rule such as:
        4 films = 2x2

    But four horizontal films on a portrait phone will
    naturally choose 2x2 because it produces substantially
    larger visible films than 1x4.
*/

function calculateProjectAllLayout() {

    const rect =
        projectAllView
            .getBoundingClientRect();


    const ratios =
        getProjectAllRatios();


    const count =
        ratios.length;


    if (
        !count ||
        rect.width <= 0 ||
        rect.height <= 0
    ) {

        return null;

    }


    const gap =
        isPhoneLandscape()
            ? 5
            : (
                isPhonePortrait()
                    ? 5
                    : 7
            );


    let best =
        null;


    for (
        let columns = 1;
        columns <= count;
        columns++
    ) {

        const rows =
            Math.ceil(
                count /
                columns
            );


        const usableWidth =
            rect.width -
            gap *
            (
                columns - 1
            );


        const usableHeight =
            rect.height -
            gap *
            (
                rows - 1
            );


        if (
            usableWidth <= 0 ||
            usableHeight <= 0
        ) {

            continue;

        }


        const cellWidth =
            usableWidth /
            columns;


        const cellHeight =
            usableHeight /
            rows;


        let occupiedArea =
            0;


        let minimumFill =
            1;


        ratios.forEach(
            ratio => {

                const fitted =
                    calculateContainedSize(
                        ratio,
                        cellWidth,
                        cellHeight
                    );


                occupiedArea +=
                    fitted.area;


                minimumFill =
                    Math.min(
                        minimumFill,
                        fitted.area /
                        (
                            cellWidth *
                            cellHeight
                        )
                    );

            }
        );


        const totalCells =
            columns *
            rows;


        const emptyCells =
            totalCells -
            count;


        const emptyPenalty =
            1 -
            (
                emptyCells /
                totalCells
            ) *
            0.14;


        const balancePenalty =
            0.88 +
            minimumFill *
            0.12;


        /*
            Mildly discourage a ridiculous ultra-thin
            single-column result when more balanced
            arrangements use almost the same total area.
        */

        const shape =
            cellWidth /
            cellHeight;


        const cellShapePenalty =
            shape < 0.28
                ? 0.78
                : 1;


        const score =
            occupiedArea *
            emptyPenalty *
            balancePenalty *
            cellShapePenalty;


        if (
            !best ||
            score >
            best.score
        ) {

            best = {

                columns,

                rows,

                score

            };

        }

    }


    return best;

}


/* =====================================================
   APPLY VIEW ALL
   ===================================================== */

function layoutProjectAllGrid() {

    syncProjectAllBounds();


    const layout =
        calculateProjectAllLayout();


    if (
        !layout
    ) {

        return;

    }


    projectAllGrid.style
        .gridTemplateColumns =
            `repeat(${layout.columns}, minmax(0, 1fr))`;


    projectAllGrid.style
        .gridTemplateRows =
            `repeat(${layout.rows}, minmax(0, 1fr))`;

}

/* =====================================================
   INDEX ORDER
   ===================================================== */

function getChronologicalProjects() {

    return projects
        .map(
            (
                project,
                originalIndex
            ) => ({

                project,

                originalIndex

            })
        )
        .sort(
            (
                a,
                b
            ) => {

                const orderA =
                    Number.isFinite(
                        a.project.indexOrder
                    )
                        ? a.project.indexOrder
                        : 999;


                const orderB =
                    Number.isFinite(
                        b.project.indexOrder
                    )
                        ? b.project.indexOrder
                        : 999;


                return (
                    orderA -
                    orderB
                ) ||
                (
                    a.originalIndex -
                    b.originalIndex
                );

            }
        );

}


/* =====================================================
   INDEX GEOMETRY
   ===================================================== */

/*
    DO NOT read CSS clamp() strings here.

    All dimensions are now returned as actual pixel
    numbers, which fixes the desktop giant-portrait bug.
*/

function getIndexGeometry() {

    /* -------------------------------------------------
       MOBILE PORTRAIT
       ------------------------------------------------- */

    if (
        isPhonePortrait()
    ) {

        return {

            mediaHeight:
                clamp(
                    window.innerHeight * 0.255,
                    205,
                    235
                ),

            maxLandscapeWidth:
                window.innerWidth * 0.47,

            gap:
                54,

            leftPadding:
                24,

            rightPadding:
                24

        };

    }


    /* -------------------------------------------------
       MOBILE LANDSCAPE

       Photography reference:
       thumbnails are intentionally much smaller than
       portrait-mobile thumbnails and separated by
       generous horizontal air. Several projects remain
       visible at once.
       ------------------------------------------------- */

    if (
        isPhoneLandscape()
    ) {

        return {

            mediaHeight:
                clamp(
                    window.innerHeight * 0.30,
                    96,
                    126
                ),

            maxLandscapeWidth:
                Math.min(
                    window.innerWidth * 0.24,
                    210
                ),

            gap:
                clamp(
                    window.innerWidth * 0.105,
                    72,
                    100
                ),

            leftPadding:
                24,

            rightPadding:
                24

        };

    }


    /* -------------------------------------------------
       DESKTOP

       Same visual logic as portrait mobile, simply
       scaled to desktop.

       The old version allowed portrait work to become
       disproportionately huge. That is removed.
       ------------------------------------------------- */

    return {

        mediaHeight:
            clamp(
                window.innerHeight * 0.34,
                280,
                365
            ),

        maxLandscapeWidth:
            Math.min(
                window.innerWidth * 0.29,
                480
            ),

        gap:
            clamp(
                window.innerWidth * 0.03,
                44,
                64
            ),

        leftPadding:
            48,

        rightPadding:
            48

    };

}


/* =====================================================
   INDEX ITEM METRICS
   ===================================================== */

/*
    Common invisible stage height:
        geometry.mediaHeight

    Portrait:
        generally uses full stage height.

    Landscape:
        is constrained by maximum width and therefore
        becomes shorter.

    It remains vertically centered in the stage.

    Copy ALWAYS starts after stage height.
*/

function getIndexItemMetrics(
    ratio
) {

    const geometry =
        getIndexGeometry();


    let displayHeight =
        geometry.mediaHeight;


    let displayWidth =
        displayHeight *
        ratio;


    if (
        displayWidth >
        geometry.maxLandscapeWidth
    ) {

        displayWidth =
            geometry.maxLandscapeWidth;


        displayHeight =
            displayWidth /
            ratio;

    }


    return {

        mediaHeight:
            geometry.mediaHeight,

        displayWidth,

        displayHeight

    };

}


/* =====================================================
   SYNC INDEX CARD
   ===================================================== */

function syncIndexCardSize(
    preview,
    button,
    wrap
) {

    if (
        !preview.videoWidth ||
        !preview.videoHeight
    ) {

        return;

    }


    const ratio =
        preview.videoWidth /
        preview.videoHeight;


    const metrics =
        getIndexItemMetrics(
            ratio
        );


    const width =
        Math.max(
            1,
            Math.round(
                metrics.displayWidth
            )
        );


    const height =
        Math.max(
            1,
            Math.round(
                metrics.displayHeight
            )
        );


    const mediaHeight =
        Math.max(
            height,
            Math.round(
                metrics.mediaHeight
            )
        );


    /*
        Explicit dimensions only.
        No clamp string.
        No percentage sizing.
        No browser ambiguity.
    */

    button.style.width =
        `${width}px`;


    button.style.flex =
        `0 0 ${width}px`;


    button.style.minWidth =
        `${width}px`;


    button.style.maxWidth =
        `${width}px`;


    wrap.style.width =
        `${width}px`;


    wrap.style.height =
        `${mediaHeight}px`;


    wrap.style.flexBasis =
        `${mediaHeight}px`;


    preview.style.width =
        `${width}px`;


    preview.style.height =
        `${height}px`;


    preview.style.minWidth =
        `${width}px`;


    preview.style.maxWidth =
        `${width}px`;


    preview.style.minHeight =
        `${height}px`;


    preview.style.maxHeight =
        `${height}px`;


    preview.style.top =
        "50%";


    preview.style.left =
        "0";


    preview.style.transform =
        "translateY(-50%)";

}


/* =====================================================
   INDEX SCROLLER GEOMETRY
   ===================================================== */

function layoutIndexViewport() {

    const geometry =
        getIndexGeometry();


    indexGrid.style.gap =
        `${geometry.gap}px`;


    indexGrid.style.paddingLeft =
        `${geometry.leftPadding}px`;


    indexGrid.style.paddingRight =
        `${geometry.rightPadding}px`;


    /* -------------------------------------------------
       PHONE LANDSCAPE
       ------------------------------------------------- */

    if (
        isPhoneLandscape()
    ) {

        const infoRect =
            info.getBoundingClientRect();


        const indexRect =
            indexButton.getBoundingClientRect();


        /*
            Same full-width rail logic as photography:
            start below the identity/contact block,
            finish safely above INDEX.
        */

        indexScroller.style.left =
            "0px";


        indexScroller.style.right =
            "0px";


        indexScroller.style.top =
            `${Math.ceil(
                infoRect.bottom + 10
            )}px`;


        indexScroller.style.bottom =
            `${Math.max(
                34,
                Math.ceil(
                    window.innerHeight -
                    indexRect.top +
                    24
                )
            )}px`;


        return;

    }


    /* -------------------------------------------------
       PORTRAIT
       ------------------------------------------------- */

    if (
        isPhonePortrait()
    ) {

        indexScroller.style.left =
            "0px";


        indexScroller.style.right =
            "0px";


        indexScroller.style.top =
            "190px";


        indexScroller.style.bottom =
            `${
                54 +
                parseFloat(
                    getComputedStyle(
                        document.documentElement
                    ).getPropertyValue(
                        "--index-bottom"
                    )
                )
            }px`;


        return;

    }


    /* -------------------------------------------------
       DESKTOP
       ------------------------------------------------- */

    indexScroller.style.left =
        "0px";


    indexScroller.style.right =
        "0px";


    indexScroller.style.top =
        "130px";


    indexScroller.style.bottom =
        "58px";

}


/* =====================================================
   INDEX CASE

function createCaseController(

            );

/* =====================================================
   BUILD INDEX
   ===================================================== */

function buildIndex() {

    indexGrid.innerHTML =
        "";


    const geometry =
        getIndexGeometry();


    getChronologicalProjects()
        .forEach(
            ({
                project,
                originalIndex
            }) => {

                const button =
                    document.createElement(
                        "button"
                    );


                button.type =
                    "button";


                button.className =
                    "project-card";


                /*
                    Stable placeholder before metadata.

                    It intentionally resembles a medium
                    portrait card rather than using an
                    arbitrary percentage of viewport.
                */

                const fallbackWidth =
                    Math.round(
                        geometry.mediaHeight *
                        0.72
                    );


                button.style.width =
                    `${fallbackWidth}px`;


                button.style.flex =
                    `0 0 ${fallbackWidth}px`;


                button.style.minWidth =
                    `${fallbackWidth}px`;


                const wrap =
                    document.createElement(
                        "span"
                    );


                wrap.className =
                    "card-video-wrap";


                wrap.style.width =
                    `${fallbackWidth}px`;


                wrap.style.height =
                    `${geometry.mediaHeight}px`;


                const preview =
                    createPreviewVideo(
                        project.videos[0],
                        {
                            eagerMetadata:
                                true
                        }
                    );


                wrap.appendChild(
                    preview
                );


                preview.addEventListener(
                    "loadedmetadata",
                    () => {

                        syncIndexCardSize(
                            preview,
                            button,
                            wrap
                        );

                    }
                );


                if (
                    preview.readyState >=
                    1
                ) {

                    syncIndexCardSize(
                        preview,
                        button,
                        wrap
                    );

                }


                const copy =
                    document.createElement(
                        "span"
                    );


                copy.className =
                    "card-copy";


                const title =
                    document.createElement(
                        "span"
                    );


                title.className =
                    "card-title";


                title.textContent =
                    project.title
                        .toLowerCase();


                const date =
                    document.createElement(
                        "span"
                    );


                date.className =
                    "card-date";


                date.textContent =
                    (
                        project.date ||
                        ""
                    ).toLowerCase();


                copy.append(
                    title,
                    date
                );


                button.append(
                    wrap,
                    copy
                );


                const titleCase =
                    createCaseController(
                        title,
                        project.title
                    );


                const dateCase =
                    createCaseController(
                        date,
                        project.date || ""
                    );


                button.addEventListener(
                    "mouseenter",
                    () => {

                        if (
                            !hasHover()
                        ) {

                            return;

                        }


                        titleCase.upper();

                        dateCase.upper();

                    }
                );


                button.addEventListener(
                    "mouseleave",
                    () => {

                        if (
                            !hasHover()
                        ) {

                            return;

                        }


                        titleCase.lower();

                        dateCase.lower();

                    }
                );


                button.addEventListener(
                    "click",
                    async event => {

                        if (
                            indexDragMoved
                        ) {

                            event.preventDefault();

                            event.stopPropagation();

                            return;

                        }


                        event.preventDefault();

                        event.stopPropagation();


                        await exitIndexToProject(
                            originalIndex
                        );

                    }
                );


                indexGrid.appendChild(
                    button
                );


                observePreview(
                    preview
                );

            }
        );


    layoutIndexViewport();

}


/* =====================================================
   RESIZE INDEX CARDS
   ===================================================== */

function resizeIndexCards() {

    layoutIndexViewport();


    document
        .querySelectorAll(
            ".project-card"
        )
        .forEach(
            card => {

                const preview =
                    card.querySelector(
