                    preview.videoHeight
                ) {

                    syncIndexCardSize(
                        preview,
                        card,
                        wrap
                    );

                }

            }
        );

}


/* =====================================================
   INDEX WORD
   ===================================================== */

function renderIndexWord(
    state
) {

    indexWordState =
        state;


    indexButton.textContent =
        renderPrefixCase(
            indexWord,
            state
        );

}


/* =====================================================
   INDEX MORPH
   ===================================================== */

function morphIndexTo(
    target
) {

    if (
        indexWordFrame !==
        null
    ) {

        cancelAnimationFrame(
            indexWordFrame
        );

    }


    const initial =
        indexWordState;


    if (
        initial ===
        target
    ) {

        renderIndexWord(
            target
        );


        return Promise.resolve();

    }


    const start =
        performance.now();


    return new Promise(
        resolve => {

            function frame(
                now
            ) {

                const progress =
                    Math.min(
                        1,
                        (
                            now -
                            start
                        ) /
                        INDEX_TRANSITION_DURATION
                    );


                const state =
                    Math.round(
                        initial +
                        (
                            target -
                            initial
                        ) *
                        progress
                    );


                renderIndexWord(
                    state
                );


                if (
                    progress <
                    1
                ) {

                    indexWordFrame =
                        requestAnimationFrame(
                            frame
                        );

                }

                else {

                    renderIndexWord(
                        target
                    );


                    indexWordFrame =
                        null;


                    resolve();

                }

            }


            indexWordFrame =
                requestAnimationFrame(
                    frame
                );

        }
    );

}


/* =====================================================
   INDEX HOVER
   ===================================================== */

indexButton.addEventListener(
    "mouseenter",
    () => {

        if (
            isPhoneLayout()
        ) {

            return;

        }


        morphIndexTo(
            indexMode
                ? 0
                : indexWord.length
        );

    }
);


indexButton.addEventListener(
    "mouseleave",
    () => {

        if (
            isPhoneLayout()
        ) {

            return;

        }


        morphIndexTo(
            indexMode
                ? indexWord.length
                : 0
        );

    }
);


/* =====================================================
   INDEX POSITION
   ===================================================== */

function saveIndexPosition() {

    savedIndexScrollLeft =
        indexScroller.scrollLeft;

}


function restoreIndexPosition() {

    requestAnimationFrame(
        () => {

            indexScroller.scrollLeft =
                savedIndexScrollLeft;

        }
    );

}


/* =====================================================
   ENTER INDEX
   ===================================================== */

async function enterIndex() {

    if (
        indexMode ||
        interfaceAnimating
    ) {

        return;

    }


    interfaceAnimating =
        true;


    autoplayBeforeIndex =
        !video.paused;


    video.pause();


    if (
        projectAllMode
    ) {

        await leaveProjectAll(
            {
                resume:
                    false
            }
        );

    }


    /*
        Recalculate before displaying.
        Important after orientation changes.
    */

    resizeIndexCards();


    indexMode =
        true;


    body.classList.add(
        "index-mode"
    );


    indexView.classList.add(
        "visible"
    );


    restoreIndexPosition();


    requestAnimationFrame(
        () => {

            activatePreviewsIn(
                indexGrid
            );

        }
    );


    await morphIndexTo(
        indexWord.length
    );


    interfaceAnimating =
        false;

}


/* =====================================================
   RETURN INDEX
   ===================================================== */

async function returnFromIndex() {

    if (
        !indexMode ||
        interfaceAnimating
    ) {

        return;

    }


    interfaceAnimating =
        true;


    saveIndexPosition();


    await morphIndexTo(
        0
    );


    stopAllPreviews();


    indexView.classList.remove(
        "visible"
    );


    indexMode =
        false;


    body.classList.remove(
        "index-mode"
    );


    if (
        autoplayBeforeIndex
    ) {

        video
            .play()
            .catch(
                () => {}
            );

    }


    interfaceAnimating =
        false;

}


/* =====================================================
   INDEX -> PROJECT
   ===================================================== */

async function exitIndexToProject(
    targetProjectIndex
) {

    if (
        !indexMode ||
        interfaceAnimating
    ) {

        return;

    }


    interfaceAnimating =
        true;


    saveIndexPosition();


    await morphIndexTo(
        0
    );


    stopAllPreviews();


    indexView.classList.remove(
        "visible"
    );


    indexMode =
        false;


    body.classList.remove(
        "index-mode"
    );


    currentProjectIndex =
        targetProjectIndex;


    currentVideoIndex =
        0;


    renderedProjectIndex =
        null;


    await loadCurrentVideo(
        true
    );


    interfaceAnimating =
        false;

}


/* =====================================================
   INDEX CLICK
   ===================================================== */

indexButton.addEventListener(
    "click",
    async event => {

        event.stopPropagation();


        if (
            interfaceAnimating ||
            projectViewAnimating
        ) {

            return;

        }


        if (
            projectAllMode
        ) {

            await leaveProjectAll(
                {
                    resume:
                        false
                }
            );


            await enterIndex();


            return;

        }


        if (
            indexMode
        ) {

            await returnFromIndex();

        }

        else {

            await enterIndex();

        }

    }
);


/* =====================================================
   INDEX WHEEL
   ===================================================== */

indexScroller.addEventListener(
    "wheel",
    event => {

        if (
            !indexMode
        ) {

            return;

        }


        event.preventDefault();


        const movement =
            Math.abs(
                event.deltaX
            ) >
            Math.abs(
                event.deltaY
            )
                ? event.deltaX
                : event.deltaY;


        indexScroller.scrollLeft +=
            movement *
            INDEX_WHEEL_MULTIPLIER;

    },
    {
        passive:
            false
    }
);


/* =====================================================
   INDEX DRAG
   ===================================================== */

let indexDragging =
    false;

let indexDragStartX =
    0;

let indexDragStartScroll =
    0;

let indexDragDistance =
    0;


indexScroller.addEventListener(
    "mousedown",
    event => {

        if (
            event.button !==
            0
        ) {

            return;

        }


        indexDragging =
            true;


        indexDragMoved =
            false;


        indexDragDistance =
            0;


        indexDragStartX =
            event.clientX;


        indexDragStartScroll =
            indexScroller.scrollLeft;


        indexScroller.classList.add(
            "dragging"
        );

    }
);


window.addEventListener(
    "mousemove",
    event => {

        if (
            !indexDragging
        ) {

            return;

        }


        const delta =
            event.clientX -
            indexDragStartX;


        indexDragDistance =
            Math.max(
                indexDragDistance,
                Math.abs(
                    delta
                )
            );


        if (
            indexDragDistance >
            6
        ) {

            indexDragMoved =
                true;

        }


        indexScroller.scrollLeft =
            indexDragStartScroll -
            delta;

    }
);


window.addEventListener(
    "mouseup",
    () => {

        if (
            !indexDragging
        ) {

            return;

        }


        indexDragging =
            false;


        indexScroller.classList.remove(
            "dragging"
        );


        if (
            indexDragMoved
        ) {

            setTimeout(
                () => {

                    indexDragMoved =
                        false;

                },
                0
            );

        }

    }
);


/* =====================================================
   INDEX KEYBOARD
   ===================================================== */

indexScroller.addEventListener(
    "keydown",
    event => {

        if (
            event.key ===
            "ArrowRight"
        ) {

            event.preventDefault();


            indexScroller.scrollBy(
                {
                    left:
                        INDEX_KEY_STEP,

                    behavior:
                        "smooth"
                }
            );

        }


        else if (
            event.key ===
            "ArrowLeft"
        ) {

            event.preventDefault();


            indexScroller.scrollBy(
                {
                    left:
                        -INDEX_KEY_STEP,

                    behavior:
                        "smooth"
                }
            );

        }

    }
);


/* =====================================================
   GLOBAL KEYBOARD
   ===================================================== */

document.addEventListener(
    "keydown",
    event => {

        const target =
            event.target;


        if (
            target &&
            [
                "INPUT",
                "TEXTAREA",
                "SELECT"
            ].includes(
                target.tagName
            )
        ) {

            return;

        }


        if (
            event.code ===
            "Escape"
        ) {

            if (
                projectAllMode
            ) {

                event.preventDefault();


                leaveProjectAll(
                    {
                        resume:
                            true
                    }
                );


                return;

            }


            if (
                indexMode
            ) {

                event.preventDefault();


                returnFromIndex();


                return;

            }

        }


        if (
            indexMode ||
            projectAllMode
        ) {

            return;

        }


        if (
            event.code ===
            "Space"
        ) {

            event.preventDefault();

            togglePlayback();

        }


        else if (
            event.code ===
            "ArrowRight"
        ) {

            event.preventDefault();

            nextFilm();

        }


        else if (
            event.code ===
            "ArrowLeft"
        ) {

            event.preventDefault();

            previousFilm();

        }

    }
);


/* =====================================================
   MOBILE SWIPE
   ===================================================== */

video.addEventListener(
    "touchstart",
    event => {

        if (
            event.touches.length !==
            1
        ) {

            return;

        }


        const touch =
            event.touches[
                0
            ];


        touchStartX =
            touch.clientX;


        touchStartY =
            touch.clientY;


        touchStartTime =
            performance.now();


        touchMoved =
            false;

    },
    {
        passive:
            true
    }
);


video.addEventListener(
    "touchmove",
    event => {

        if (
            event.touches.length !==
            1
        ) {

            return;

        }


        const touch =
            event.touches[
                0
            ];


        if (
            Math.abs(
                touch.clientX -
                touchStartX
            ) >
            10 ||
            Math.abs(
                touch.clientY -
                touchStartY
            ) >
            10
        ) {

            touchMoved =
                true;

        }

    },
    {
        passive:
            true
    }
);


video.addEventListener(
    "touchend",
    event => {

        if (
            !event.changedTouches.length
        ) {

            return;

        }


        const touch =
            event.changedTouches[
                0
            ];


        const dx =
            touch.clientX -
            touchStartX;


        const dy =
            touch.clientY -
            touchStartY;


        const elapsed =
            performance.now() -
            touchStartTime;


        const swipe =
            Math.abs(
                dx
            ) >=
            50 &&
            Math.abs(
                dx
            ) >
            Math.abs(
                dy
            ) *
            1.25 &&
            elapsed <
            700;


        if (
            swipe
        ) {

            if (
                dx <
                0
            ) {

                nextFilm();

            }

            else {

                previousFilm();

            }


            setTimeout(
                () => {

                    touchMoved =
                        false;

                },
                150
            );


            return;

        }


        setTimeout(
            () => {

                touchMoved =
                    false;

            },
            150
        );

    },
    {
        passive:
            true
    }
);


/* =====================================================
   INDEX PREWARM
   ===================================================== */

async function warmIndexPreviews() {

    const previews =
        [
            ...indexGrid
                .querySelectorAll(
                    "video[data-src]"
                )
        ];


    for (
        let i = 0;
        i < previews.length;
        i++
    ) {

        const preview =
            previews[
                i
            ];


        if (
            !preview.getAttribute(
                "src"
            )
        ) {

            preview.src =
                preview.dataset.src;


            preview.preload =
                i <
                4
                    ? "auto"
                    : "metadata";


            preview.load();

        }


        if (
            i %
            2 ===
            1
        ) {

            await wait(
                90
            );

        }

    }

}


/* =====================================================
   LOAD PROJECTS
   ===================================================== */

async function loadProjects() {

    try {

        const response =
            await fetch(
                FILMS_JSON,
                {
                    cache:
                        "no-store"
                }
            );


        if (
            !response.ok
        ) {

            throw new Error(
                "films.json could not be loaded"
            );

        }


        const data =
            await response.json();


        projects =
            data.filter(
                project =>
                    project &&
                    typeof project.title ===
                        "string" &&
                    Array.isArray(
                        project.videos
                    ) &&
                    project.videos.length
            );


        if (
            !projects.length
        ) {

            return;

        }


        buildIndex();


        currentProjectIndex =
            0;


        currentVideoIndex =
            0;


        setSoundLabelImmediately();


        await loadCurrentVideo(
            true
        );


        requestAnimationFrame(
            () => {

                warmIndexPreviews();

            }
        );

    }

    catch (
        error
    ) {

        console.error(
            error
        );

    }

}


/* =====================================================
   RESIZE / ORIENTATION
   ===================================================== */

let resizeTimer =
    null;


window.addEventListener(
    "resize",
    () => {

        if (
            resizeTimer
        ) {

            clearTimeout(
                resizeTimer
            );

        }


        resizeTimer =
            setTimeout(
                () => {

                    fitMainVideo();


                    resizeIndexCards();


                    if (
                        projectAllMode
                    ) {

                        layoutProjectAllGrid();

                    }

                },
                120
            );

    }
);


/* =====================================================
   VISIBILITY
   ===================================================== */

document.addEventListener(
    "visibilitychange",
    () => {

        if (
            document.hidden
        ) {

            resumeAfterVisibility =
                !video.paused &&
                !video.ended &&
                !indexMode &&
                !projectAllMode;


            video.pause();


            stopAllPreviews();


            return;

        }


        if (
            resumeAfterVisibility &&
            !indexMode &&
            !projectAllMode
        ) {

            video
                .play()
                .catch(
                    () => {}
                );

        }


        resumeAfterVisibility =
            false;


        if (
            indexMode
        ) {

            activatePreviewsIn(
                indexGrid
            );

        }


        if (
            projectAllMode
        ) {

            activatePreviewsIn(
                projectAllGrid
            );

        }

    }
);


/* =====================================================
   INIT
   ===================================================== */

renderIndexWord(
    0
);


loadProjects();

</script>
