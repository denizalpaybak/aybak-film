* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #fff;
    color: #000;
    font-family: Arial, Helvetica, sans-serif;

button {
    font: inherit;

:root {
    --font-size: 15px;

    --top: 32px;

}

body {
    cursor: default;
}


/* =====================================================
   INFO
   ===================================================== */

.info {
    position: fixed;
    top: var(--top);
    left: var(--side);
    z-index: 500;

    font-size: var(--font-size);
    line-height: var(--line-height);
}


/* =====================================================
   LOGO
   ===================================================== */

.logo {
    position: relative;
    display: block;

    width: 190px;
    height: 52px;

    color: inherit;
    text-decoration: none;

    cursor: pointer;

    -webkit-tap-highlight-color: transparent;
}

.logo-name {
    position: absolute;
    top: 0;
    left: 0;

    white-space: nowrap;
}

.logo-aybak {
    position: absolute;
    top: 17px;
    left: 0;

    white-space: nowrap;
}


/* =====================================================
   CONTACT
   ===================================================== */

.contact,
.social {
    margin: 0;
    padding: 0;
}

.social {
    display: flex;
    flex-direction: column;
}

.info a {
    color: inherit;
    text-decoration: none;
}

.contact a:hover,
.social a:hover {
    text-decoration: underline;
}


/* =====================================================
   PHOTOGRAPHY SWITCH
   ===================================================== */

.section-switch {
    position: fixed;

    top: var(--top);
    right: var(--side);

    z-index: 500;

    color: #000;
    text-decoration: none;

    font-size: var(--font-size);
    line-height: var(--line-height);

    -webkit-tap-highlight-color: transparent;
}


/* =====================================================
   VIDEO STAGE
   ===================================================== */

#video-stage {
    position: fixed;
    inset: 0;

    z-index: 10;

    pointer-events: none;
}


/*
    The block width is set dynamically from the actual
    video's aspect ratio.

    This means the metadata and controls below always
    align with the real left and right edges of the film.
*/

#video-block {
    position: absolute;

    top: 50%;
    left: 50%;

    transform: translate(-50%, -50%);

    display: flex;
    flex-direction: column;

    align-items: stretch;

    pointer-events: none;

    max-width:
        calc(
            100vw -
            var(--side) * 2
        );
}


/* =====================================================
   MAIN VIDEO
   ===================================================== */

#film-video {
    display: block;

    width: 100%;
    height: auto;

    object-fit: contain;

    background: transparent;

    cursor: pointer;

    pointer-events: auto;

    -webkit-tap-highlight-color: transparent;
}


/* =====================================================
   PROJECT META
   ===================================================== */

#project-meta {
    position: relative;

    z-index: 60;

    display: grid;

    grid-template-columns:
        minmax(0, 1fr)
        auto;

    grid-template-rows:
        auto
        auto;

    width: 100%;

    margin-top:
        var(--meta-top-gap);

    font-size:
        var(--font-size);

    line-height:
        var(--line-height);

    pointer-events: none;
}

#project-title {
    grid-column: 1;
    grid-row: 1;

    white-space: nowrap;
}

#project-date {
    grid-column: 1;
    grid-row: 2;

    white-space: nowrap;
}

#project-counter {
    grid-column: 2;
    grid-row: 1;

    justify-self: end;

    padding-left: 28px;

    white-space: nowrap;
}

#view-all-button {
    grid-column: 2;
    grid-row: 2;

    justify-self: end;

    appearance: none;
    -webkit-appearance: none;

    margin: 0;
    padding: 0;

    border: 0;
    outline: 0;

    background: transparent;
    color: inherit;

    line-height: inherit;

    text-align: right;

    white-space: nowrap;

    cursor: pointer;

    pointer-events: auto;

    -webkit-tap-highlight-color: transparent;
}


/* =====================================================
   CONTROLS
   ===================================================== */

#controls {
    display: grid;

    grid-template-columns:
        1fr
        auto
        1fr;

    align-items: center;

    width: 100%;

    margin-top: 10px;

    font-size:
        var(--font-size);

    line-height:
        var(--line-height);

    pointer-events: auto;
}

#controls button {

    -webkit-appearance: none;

    margin: 0;
    padding: 0;

    border: 0;
    outline: 0;

    background: transparent;
    color: #000;

    line-height: inherit;

    cursor: pointer;

    white-space: nowrap;

    -webkit-tap-highlight-color: transparent;
}

#previous-button {
    justify-self: start;
}

#sound-button {
    justify-self: center;
}

#next-button {
    justify-self: end;
}


/* =====================================================
   VIEW ALL MODE
   ===================================================== */

body.project-all-mode #film-video {
    visibility: hidden;
}

body.project-all-mode #controls {
    visibility: hidden;
}


/* =====================================================
   VIEW ALL
   ===================================================== */

#project-all-view {
    position: fixed;

    z-index: 30;

    display: none;

    overflow: hidden;

    pointer-events: auto;
}

body.project-all-mode #project-all-view {
    display: block;
}


/* =====================================================
   VIEW ALL GRID
   ===================================================== */

#project-all-grid {
    display: grid;

    width: 100%;
    height: 100%;

    place-content: center;

    align-items: center;
    justify-items: center;

    gap: 7px;
}

.project-all-thumb {

    -webkit-appearance: none;

    display: flex;

    align-items: center;
    justify-content: center;

    width: 100%;
    height: 100%;

    margin: 0;
    padding: 0;

    border: 0;

    background: transparent;

    cursor: pointer;

    overflow: hidden;

    -webkit-tap-highlight-color: transparent;
}

.project-all-thumb video {
    display: block;

    max-width: 100%;
    max-height: 100%;

    width: auto;
    height: auto;

    object-fit: contain;

    pointer-events: none;
}


/* =====================================================
   INDEX BUTTON
   ===================================================== */

#index-button {
    position: fixed;

    left: 50%;

    bottom:
        calc(
            var(--index-bottom) +
            env(safe-area-inset-bottom)
        );

    z-index: 600;

    transform:
        translateX(-50%);

    appearance: none;
    -webkit-appearance: none;

    margin: 0;
    padding: 0;

    border: 0;
    outline: 0;

    background: transparent;
    color: #000;

    font-size:
        var(--font-size);

    line-height:
        var(--line-height);

    white-space: nowrap;

    cursor: pointer;

    -webkit-tap-highlight-color: transparent;
}


/* =====================================================
   INDEX VIEW
   ===================================================== */

#index-view {
    position: fixed;

    inset: 0;

    z-index: 100;

    display: none;

    background: #fff;
}

#index-view.visible {
    display: block;
}

body.index-mode #video-stage {
    visibility: hidden;
}


/* =====================================================
   INDEX SCROLLER
   ===================================================== */

#index-scroller {
    position: absolute;

    top:
        var(--index-content-top);

    left: 0;
    right: 0;

    bottom:
        calc(
            var(--index-bottom) +
            env(safe-area-inset-bottom) +
            34px
        );

    display: flex;

    align-items: center;

    overflow-x: auto;
    overflow-y: hidden;

    scrollbar-width: none;

    -webkit-overflow-scrolling: touch;

    user-select: none;

    cursor: grab;

    outline: none;

    pointer-events: auto;
}

#index-scroller::-webkit-scrollbar {
    display: none;
}

#index-scroller.dragging {
    cursor: grabbing;
}


/* =====================================================
   INDEX RAIL
   ===================================================== */

#index-grid {
    display: flex;

    flex-direction: row;
    flex-wrap: nowrap;

    align-items: center;

    gap:
        var(--index-gap);

    width: max-content;

    padding-left:
        var(--side);

    padding-right:
        var(--side);

    transform:
        translateY(-8px);
}


/* =====================================================
   INDEX CARD
   ===================================================== */

.project-card {

    -webkit-appearance: none;

    flex-direction: column;

/* =====================================================

   ===================================================== */

/* =====================================================

   ===================================================== */

@media
    (prefers-reduced-motion: reduce) {

    * {
        scroll-behavior:

function wait(

) {

    return new Promise(

}


function hasHover() {

    return window

        )

}


function isPhonePortrait() {

    return (
        window.innerWidth <= 600 &&
        window.innerHeight >=

    );

}


function isPhoneLandscape() {

    return (
        window.innerHeight <= 650 &&
        window.innerWidth >

        window.innerWidth <= 1000
    );

}


function isPhoneLayout() {

    return (
        isPhonePortrait() ||

    );

function getCounterText(

/* =====================================================
   CASE HELPERS
   ===================================================== */

function getLetterPositions(
    text
) {

    const result =
        [];


    for (
        let i = 0;
        i < text.length;
        i++
    ) {

        const character =
            text[i];


        if (
            character.toLowerCase() !==
            character.toUpperCase()
        ) {

            result.push(
                i
            );

        }

    }


    return result;

}


function renderPrefixCase(
    baseText,
    upperCount
) {

    const positions =
        getLetterPositions(
            baseText
        );


    const upper =
        new Set(
            positions.slice(
                0,
                upperCount
            )
        );


    return baseText
        .split("")
        .map(
            (
                character,
                index
            ) =>

                upper.has(
                    index
                )
                    ? character.toUpperCase()
                    : character.toLowerCase()
        )
        .join("");

}


function currentUpperPrefixCount(
    element,
    base
) {

    const positions =
        getLetterPositions(
            base
        );


    const text =
        element.textContent;


    let result =
        0;


    for (
        const position
        of positions
    ) {

        const character =
            text[
                position
            ];


        if (
            character &&
            character ===
                character.toUpperCase() &&
            character !==
                character.toLowerCase()
        ) {

            result++;

        }

        else {

            break;

        }

    }


    return result;

/* =====================================================
   CASE ANIMATION
   ===================================================== */

function animateCase(
    element,
    baseText,
    toUpper,
    duration =
        CASE_DURATION
) {

    const base =
        baseText.toLowerCase();


    const total =
        getLetterPositions(
            base
        ).length;


    const startState =
        currentUpperPrefixCount(
            element,
            base
        );


    const target =
        toUpper
            ? total
            : 0;


    if (
        startState ===
        target
    ) {

        element.textContent =
            renderPrefixCase(
                base,
                target
            );


        return Promise.resolve();

    }


    const started =
        performance.now();


    return new Promise(
        resolve => {

            function frame(
                now
            ) {

                const progress =
                    Math.min(
                        1,
                        (
                            now -
                            started
                        ) /
                        duration
                    );


                const state =
                    Math.round(
                        startState +
                        (
                            target -
                            startState
                        ) *
                        progress
                    );


                element.textContent =
                    renderPrefixCase(
                        base,
                        state
                    );


                if (
                    progress <
                    1
                ) {

                    requestAnimationFrame(
                        frame
                    );

                }

                else {

                    element.textContent =
                        renderPrefixCase(
                            base,
                            target
                        );


                    resolve();

                }

            }


            requestAnimationFrame(
                frame
            );

        }
    );

}


/* =====================================================
   SEQUENTIAL TEXT MORPH
   ===================================================== */

function morphSequential(
    element,
    nextText,
    duration =
        TEXT_MORPH_DURATION
) {

    const oldText =
        element.dataset.rawText !==
        undefined
            ? element.dataset.rawText
            : element.textContent;


    if (
        oldText ===
        nextText
    ) {

        element.textContent =
            nextText;


        element.dataset.rawText =
            nextText;


        return Promise.resolve();

    }


    const length =
        Math.max(
            oldText.length,
            nextText.length
        );


    const from =
        oldText
            .padEnd(
                length,
                " "
            )
            .split("");


    const to =
        nextText
            .padEnd(
                length,
                " "
            )
            .split("");


    const changed =
        [];


    for (
        let i = 0;
        i < length;
        i++
    ) {

        if (
            from[i] !==
            to[i]
        ) {

            changed.push(
                i
            );

        }

    }


    const started =
        performance.now();


    return new Promise(
        resolve => {

            function frame(
                now
            ) {

                const progress =
                    Math.min(
                        1,
                        (
                            now -
                            started
                        ) /
                        duration
                    );


                const completed =
                    Math.floor(
                        progress *
                        (
                            changed.length +
                            1
                        )
                    );


                const current =
                    from.slice();


                for (
                    let i = 0;
                    i < completed;
                    i++
                ) {

                    const position =
                        changed[
                            i
                        ];


                    if (
                        position !==
                        undefined
                    ) {

                        current[
                            position
                        ] =
                            to[
                                position
                            ];

                    }

                }


                element.textContent =
                    current
                        .join("")
                        .trimEnd();


                if (
                    progress <
                    1
                ) {

                    requestAnimationFrame(
                        frame
                    );

                }

                else {

                    element.textContent =
                        nextText;


                    element.dataset.rawText =
                        nextText;


                    resolve();

                }

            }


            requestAnimationFrame(
                frame
            );

        }
    );

}

function animateLogoTo(
    target
) {

    return new Promise(
        resolve => {

            logoTarget =
                target;


            if (
                logoTimer !==
                null

                clearTimeout(
                    logoTimer
                );

            }


            function step() {

                if (
                    logoState ===

                        : logoState - 1
                );


                logoTimer =
                    setTimeout(
                        step,
                        LOGO_STEP_DURATION
                    );

            }


            step();

        }
    );

}

/* =====================================================
   MAIN VIDEO FIT
   ===================================================== */

/*
    The main slide no longer lives inside a forced
    16:9 element.

    The video's intrinsic ratio controls the width.

    Desktop:
    - vertical position stays fixed
    - width contracts/expands with media
    - metadata and controls inherit exactly that width

    Mobile portrait:
    - portrait videos are allowed to use much more height
    - no more tiny vertical image inside a 16:9 box
*/

function fitMainVideo() {

    if (
        !video.videoWidth ||
        !video.videoHeight
    ) {

        return;

    }


    const ratio =
        video.videoWidth /
        video.videoHeight;


    const viewportWidth =
        window.innerWidth;


    const viewportHeight =
        window.innerHeight;


    const side =
        parseFloat(
            getComputedStyle(
                document.documentElement
            ).getPropertyValue(
                "--side"
            )
        ) || 48;


    let maxWidth;
    let maxHeight;


    if (
        isPhonePortrait()
    ) {

        maxWidth =
            viewportWidth -
            side * 2;


        maxHeight =
            viewportHeight *
            0.60;

    }


    else if (
        isPhoneLandscape()
    ) {

        maxWidth =
            viewportWidth *
            0.62;


        maxHeight =
            viewportHeight *
            0.66;

    }


    else {

        maxWidth =
            Math.min(
                viewportWidth *
                0.76,

                viewportWidth -
                side * 2
            );


        maxHeight =
            viewportHeight *
            0.72;

    }


    let width =
        maxWidth;


    let height =
        width /
        ratio;


    if (
        height >
        maxHeight
    ) {

        height =
            maxHeight;


        width =
            height *
            ratio;

    }


    /*
        Give portrait film substantially more vertical
        presence on a portrait phone.
    */

    if (
        isPhonePortrait() &&
        ratio <
        1
    ) {

        height =
            Math.min(
                viewportHeight *
                0.64,

                maxHeight +
                viewportHeight *
                0.04
            );


        width =
            height *
            ratio;


        if (
            width >
            maxWidth
        ) {

            width =
                maxWidth;


            height =
                width /
                ratio;

        }

    }


    videoBlock.style.width =
        `${Math.max(
            1,
            width
        )}px`;


    video.style.width =
        "100%";


    video.style.height =
        "auto";

}


/* =====================================================
   LOAD MAIN VIDEO
   ===================================================== */

async function loadCurrentVideo(
    autoplay =
        true
) {

    const filename =
        currentFilename();


    if (
        !filename
    ) {

        return;

    }


    video.pause();


    video.src =
        videoUrl(
            filename
        );


    video.load();


    applySoundState();


    await updateMetadata(
        currentProjectIndex,
        currentVideoIndex
    );


    const onMetadata =
        () => {

            fitMainVideo();


            video.removeEventListener(
                "loadedmetadata",
                onMetadata
            );

        };


    if (
        video.readyState >=
        1
    ) {

        fitMainVideo();

    }

    else {

        video.addEventListener(
            "loadedmetadata",
            onMetadata
        );

    }


    if (
        autoplay
    ) {

        const play =
            () => {

                video
                    .play()
                    .catch(
                        () => {}
                    );

            };


        if (
            video.readyState >=
            2
        ) {

            play();

        }

        else {

            video.addEventListener(
                "canplay",
                play,
                {
                    once: true
                }
            );

        }

    }

}

/* =====================================================
   PREVIEW VIDEO
   ===================================================== */

function createPreviewVideo(
    filename,
    {
        eagerMetadata =
            false
    } = {}
) {

    const preview =
        document.createElement(
            "video"
        );


    preview.dataset.src =
        videoUrl(
            filename
        );


    preview.muted =
        true;


    preview.defaultMuted =
        true;


    preview.playsInline =
        true;


    preview.preload =
        eagerMetadata
            ? "metadata"
            : "none";


    preview.disablePictureInPicture =
        true;


    preview.setAttribute(
        "aria-hidden",
        "true"
    );


    preview.addEventListener(
        "timeupdate",
        () => {

            if (
                preview.currentTime >=
                PREVIEW_DURATION
            ) {

                preview.currentTime =
                    0;


                preview
                    .play()
                    .catch(
                        () => {}
                    );

            }

        }
    );


    /*
        Index metadata begins loading before the user
        opens Index.

        This is important on mobile because the card
        width can be known before the rail is shown,
        avoiding collapsed / overlapping cards.
    */

    if (
        eagerMetadata
    ) {

        preview.src =
            preview.dataset.src;


        preview.load();

    }


    return preview;

}


/* =====================================================
   PREVIEW ACTIVATION
   ===================================================== */

function activatePreview(
    preview
) {

    if (
        !preview.getAttribute(
            "src"
        )
    ) {

        preview.src =
            preview.dataset.src;


        preview.preload =
            "auto";


        preview.load();

    }


    preview
        .play()
        .catch(
            () => {}
        );

}


function activatePreviewsIn(
    container
) {

    container
        .querySelectorAll(
            "video[data-src]"
        )
        .forEach(
            activatePreview
        );

}


function stopAllPreviews() {

    document
        .querySelectorAll(
            "#index-view video, #project-all-view video"
        )
        .forEach(
            preview => {

                preview.pause();

            }
        );

}


/* =====================================================
   PREVIEW OBSERVER
   ===================================================== */

const previewObserver =
    new IntersectionObserver(
        entries => {

            entries.forEach(
                entry => {

                    const preview =
                        entry.target;


                    const allowed =
                        (
                            indexMode &&
                            indexView.contains(
                                preview
                            )
                        ) ||
                        (
                            projectAllMode &&
                            projectAllView.contains(
                                preview
                            )
                        );


                    if (
                        entry.isIntersecting &&
                        allowed
                    ) {

                        activatePreview(
                            preview
                        );

                    }

                    else {

                        preview.pause();

                    }

                }
            );

        },
        {
            rootMargin:
                "220px"
        }
    );


function observePreview(
    preview
) {

    previewObserver.observe(
        preview
    );

}


/* =====================================================
   VIEW ALL BOUNDS
   ===================================================== */

function syncProjectAllBounds() {

    if (
        !projectAllMode
    ) {

        return;

    }


    const infoRect =
        info.getBoundingClientRect();


    const metaRect =
        projectMeta.getBoundingClientRect();


    const side =
        parseFloat(
            getComputedStyle(
                document.documentElement
            ).getPropertyValue(
                "--side"
            )
        ) || 48;


    const topGap =
        isPhoneLandscape()
            ? 4
            : (
                isPhonePortrait()
                    ? 10
                    : 14
            );


    const bottomGap =
        isPhoneLandscape()
            ? 6
            : (
                isPhonePortrait()
                    ? 10
                    : 14
            );


    const top =
        Math.ceil(
            infoRect.bottom +
            topGap
        );


    const bottom =
        Math.floor(
            metaRect.top -
            bottomGap
        );


    projectAllView.style.left =
        `${side}px`;


    projectAllView.style.right =
        `${side}px`;


    projectAllView.style.top =
        `${top}px`;


    projectAllView.style.height =
        `${Math.max(
            80,
            bottom -
            top
        )}px`;

}


/* =====================================================
   VIEW ALL GRID
   ===================================================== */

function calculateProjectAllLayout(
    count
) {

    const rect =
        projectAllView
            .getBoundingClientRect();


    const gap =
        isPhoneLandscape()
            ? 4
            : (
                isPhonePortrait()
                    ? 5
                    : 7
            );


    let best =
        {
            columns: 1,
            rows: count,
            score: 0
        };


    for (
        let columns = 1;
        columns <= count;
        columns++
    ) {

        const rows =
            Math.ceil(
                count /
                columns
            );


        const usableWidth =
            rect.width -
            gap *
            (
                columns -
                1
            );


        const usableHeight =
            rect.height -
            gap *
            (
                rows -
                1
            );


        if (
            usableWidth <= 0 ||
            usableHeight <= 0
        ) {

            continue;

        }


        const cellWidth =
            usableWidth /
            columns;


        const cellHeight =
            usableHeight /
            rows;


        const visibleWidth =
            Math.min(
                cellWidth,
                cellHeight *
                16 / 9
            );


        const visibleHeight =
            Math.min(
                cellHeight,
                cellWidth *
                9 / 16
            );


        const score =
            visibleWidth *
            visibleHeight;


        if (
            score >
            best.score
        ) {

            best =
                {
                    columns,
                    rows,
                    score
                };

        }

    }


    return best;

}


function layoutProjectAllGrid() {

    syncProjectAllBounds();


    const project =
        currentProject();


    if (
        !project
    ) {

        return;

    }


    const layout =
        calculateProjectAllLayout(
            project.videos.length
        );


    projectAllGrid.style
        .gridTemplateColumns =
            `repeat(${layout.columns}, minmax(0, 1fr))`;


    projectAllGrid.style
        .gridTemplateRows =
            `repeat(${layout.rows}, minmax(0, 1fr))`;

}


/* =====================================================
   BUILD VIEW ALL
   ===================================================== */

function buildProjectAllGrid() {

    const project =
        currentProject();


    projectAllGrid.innerHTML =
        "";


    project.videos.forEach(
        (
            filename,
            index
        ) => {

            const button =
                document.createElement(
                    "button"
                );


            button.type =
                "button";


            button.className =
                "project-all-thumb";


            /*
                View All only contains a few films, so
                metadata is fetched immediately.

                This reduces the mobile delay considerably.
            */

            const preview =
                createPreviewVideo(
                    filename,
                    {
                        eagerMetadata:
                            true
                    }
                );


            button.appendChild(
                preview
            );


            button.addEventListener(
                "click",
                async event => {

                    event.stopPropagation();


                    await leaveProjectAll(
                        {
                            selectedIndex:
                                index,

                            resume:
                                false
                        }
                    );


                    loadCurrentVideo(
                        true
                    );

                }
            );


            projectAllGrid.appendChild(
                button
            );


            observePreview(
                preview
            );

        }
    );

}

            animateCase(

            ),

            animateCase(
                projectDate,
                project.date ||
                "",
                true
            ),

            morphSequential(
                projectCounter,
                getAllCounterText(
                    project.videos.length
                ),
                STATE_MORPH_DURATION
            ),

            morphSequential(
                viewAllButton,
                buttonTarget,
                STATE_MORPH_DURATION
            )

        ]
    );


    projectViewAnimating =
        false;

}


/* =====================================================
   LEAVE VIEW ALL
   ===================================================== */

async function leaveProjectAll(
    {
        selectedIndex =
            null,

        resume =
            true
    } = {}
) {

    if (
        !projectAllMode ||
        projectViewAnimating
    ) {

        return;

    }


    projectViewAnimating =
        true;


    stopAllPreviews();


    const project =
        currentProject();


    if (
        selectedIndex !==
        null
    ) {

        currentVideoIndex =
            selectedIndex;

    }


    const buttonTarget =
        (
            hasHover() &&
            viewButtonHovered
        )
            ? "VIEW ALL"
            : "view all";


    await Promise.all(
        [

            animateCase(
                projectTitle,
                project.title,
                false
            ),

            animateCase(
                projectDate,
                project.date ||
                "",
                false
            ),

            morphSequential(
                projectCounter,
                getCounterText(
                    currentVideoIndex,
                    project.videos.length
                ),
                STATE_MORPH_DURATION
            ),

            morphSequential(
                viewAllButton,
                buttonTarget,
                STATE_MORPH_DURATION
            )

        ]
    );


    projectAllMode =
        false;


    body.classList.remove(
        "project-all-mode"
    );


    projectAllGrid.innerHTML =
        "";


    projectViewAnimating =
        false;


    if (
        resume &&
        autoplayBeforeProjectAll
    ) {

        video
            .play()
            .catch(
                () => {}
            );

    }

}


viewAllButton.addEventListener(
    "click",
    async event => {

        event.stopPropagation();


        if (
            projectViewAnimating
        ) {

            return;

        }


        if (
            projectAllMode
        ) {

            await leaveProjectAll(
                {
                    resume:
                        true
                }
            );

        }

        else {

            await enterProjectAll();

        }

    }
);


/* =====================================================
   INDEX ORDER
   ===================================================== */

function getChronologicalProjects() {

    return projects
        .map(
            (
                project,
                originalIndex
            ) => ({
                project,
                originalIndex
            })
        )
        .sort(
            (
                a,
                b
            ) => {

                const orderA =
                    Number.isFinite(
                        a.project.indexOrder
                    )
                        ? a.project.indexOrder
                        : 999;


                const orderB =
                    Number.isFinite(
                        b.project.indexOrder
                    )
                        ? b.project.indexOrder
                        : 999;


                return (
                    orderA -
                    orderB
                ) ||
                (
                    a.originalIndex -
                    b.originalIndex
                );

            }
        );

}


/* =====================================================
   INDEX DIMENSIONS
   ===================================================== */

/*
    Mobile:
    landscape thumbnails are allowed to scale down if
    their natural width would exceed the available screen.

    This prevents cards from collapsing / overlapping.

    Desktop:
    portrait clips receive an 18% height boost because
    equal-height portrait cards read visually much smaller
    than landscape cards.
*/

function getIndexMetrics(
    ratio
) {

    const root =
        getComputedStyle(
            document.documentElement
        );


    let height =
        parseFloat(
            root.getPropertyValue(
                "--index-video-height"
            )
        ) || 365;


    let maxWidth =
        Infinity;


    if (
        isPhonePortrait()
    ) {

        maxWidth =
            window.innerWidth -
            48;

    }


    else if (
        isPhoneLandscape()
    ) {

        maxWidth =
            window.innerWidth *
            0.72;

    }


    if (
        maxWidth <
        Infinity &&
        height *
        ratio >
        maxWidth
    ) {

        height =
            maxWidth /
            ratio;

    }


    if (
        !isPhoneLayout() &&
        ratio <
        0.9
    ) {

        height *=
            1.18;

    }


    return {
        height,

        width:
            height *
            ratio
    };

}


function syncIndexCardSize(
    preview,
    button,
    wrap
) {

    if (
        !preview.videoWidth ||
        !preview.videoHeight
    ) {

        return;

    }


    const ratio =
        preview.videoWidth /
        preview.videoHeight;


    const metrics =
        getIndexMetrics(
            ratio
        );


    button.style.width =
        `${metrics.width}px`;


    button.style.flexBasis =
        `${metrics.width}px`;


    button.style.minWidth =
        `${metrics.width}px`;


    wrap.style.width =
        `${metrics.width}px`;


    wrap.style.height =
        `${metrics.height}px`;


    preview.style.height =
        `${metrics.height}px`;


    preview.style.width =
        `${metrics.width}px`;

}


/* =====================================================
   INDEX CASE CONTROLLER
   ===================================================== */

function createCaseController(
    element,
    baseText
) {

    const base =
        baseText.toLowerCase();


    return {

        upper() {

            animateCase(
                element,
                base,
                true
            );

        },


        lower() {

            animateCase(
                element,
                base,
                false
            );

        }

    };

}


/* =====================================================
   BUILD INDEX
   ===================================================== */

function buildIndex() {

    indexGrid.innerHTML =
        "";


    getChronologicalProjects()
        .forEach(
            ({
                project,
                originalIndex
            }) => {

                const button =
                    document.createElement(
                        "button"
                    );


                button.type =
                    "button";


                button.className =
                    "project-card";


                /*
                    Reserve real space BEFORE metadata is
                    available.

                    This fixes the mobile overlap where
                    several zero-width cards temporarily
                    occupied the same position.
                */

                button.style.width =
                    isPhoneLayout()
                        ? "72vw"
                        : "285px";


                button.style.flexBasis =
                    button.style.width;


                button.style.minWidth =
                    button.style.width;


                const wrap =
                    document.createElement(
                        "span"
                    );


                wrap.className =
                    "card-video-wrap";


                wrap.style.width =
                    "100%";


                /*
                    Start fetching metadata while the user
                    is still on the slide page.

                    This improves mobile Index startup and
                    also gives us the aspect ratio early.
                */

                const preview =
                    createPreviewVideo(
                        project.videos[0],
                        {
                            eagerMetadata:
                                true
                        }
                    );


                wrap.appendChild(
                    preview
                );


                preview.addEventListener(
                    "loadedmetadata",
                    () => {

                        syncIndexCardSize(
                            preview,
                            button,
                            wrap
                        );

                    }
                );


                if (
                    preview.readyState >=
                    1
                ) {

                    syncIndexCardSize(
                        preview,
                        button,
                        wrap
                    );

                }


                const copy =
                    document.createElement(
                        "span"
                    );


                copy.className =
                    "card-copy";


                const title =
                    document.createElement(
                        "span"
                    );


                title.className =
                    "card-title";


                title.textContent =
                    project.title
                        .toLowerCase();


                const date =
                    document.createElement(
                        "span"
                    );


                date.className =
                    "card-date";


                date.textContent =
                    (
                        project.date ||
                        ""
                    ).toLowerCase();


                copy.append(
                    title,
                    date
                );


                button.append(
                    wrap,
                    copy
                );


                const titleCase =
                    createCaseController(
                        title,
                        project.title
                    );


                const dateCase =
                    createCaseController(
                        date,
                        project.date ||
                        ""
                    );


                button.addEventListener(
                    "mouseenter",
                    () => {

                        if (
                            hasHover()
                        ) {

                            titleCase.upper();

                            dateCase.upper();

                        }

                    }
                );


                button.addEventListener(
                    "mouseleave",
                    () => {

                        if (
                            hasHover()
                        ) {

                            titleCase.lower();

                            dateCase.lower();

                        }

                    }
                );


                button.addEventListener(
                    "click",
                    async event => {

                        if (
                            indexDragMoved
                        ) {

                            event.preventDefault();

                            event.stopPropagation();


                            return;

                        }


                        event.preventDefault();

                        event.stopPropagation();


                        await exitIndexToProject(
                            originalIndex
                        );

                    }
                );


                indexGrid.appendChild(
                    button
                );


                observePreview(
                    preview
                );

            }
        );

}


/* =====================================================
   INDEX WORD
   ===================================================== */

function renderIndexWord(
    state
) {

    indexWordState =
        state;


    indexButton.textContent =
        renderPrefixCase(
            indexWord,
            state
        );

}


function morphIndexTo(
    target
) {

    if (
        indexWordFrame !==
        null
    ) {

        cancelAnimationFrame(
            indexWordFrame
        );

    }


    const startState =
        indexWordState;


    if (
        startState ===
        target
    ) {

        renderIndexWord(
            target
        );


        return Promise.resolve();

    }


    const started =
        performance.now();


    return new Promise(
        resolve => {

            function frame(
                now
            ) {

                const progress =
                    Math.min(
                        1,
                        (
                            now -
                            started
                        ) /
                        INDEX_TRANSITION_DURATION
                    );


                renderIndexWord(
                    Math.round(
                        startState +
                        (
                            target -
                            startState
                        ) *
                        progress
                    )
                );


                if (
                    progress <
                    1
                ) {

                    indexWordFrame =
                        requestAnimationFrame(
                            frame
                        );

                }

                else {

                    renderIndexWord(
                        target
                    );


                    indexWordFrame =
                        null;


                    resolve();

                }

            }


            indexWordFrame =
                requestAnimationFrame(
                    frame
                );

        }
    );

}


/* =====================================================
   INDEX HOVER
   ===================================================== */

indexButton.addEventListener(
    "mouseenter",
    () => {

        if (
            !isPhoneLayout()
        ) {

            morphIndexTo(
                indexMode
                    ? 0
                    : indexWord.length
            );

        }

    }
);


indexButton.addEventListener(
    "mouseleave",
    () => {

        if (
            !isPhoneLayout()
        ) {

            morphIndexTo(
                indexMode
                    ? indexWord.length
                    : 0
            );

        }

    }
);


/* =====================================================
   INDEX POSITION
   ===================================================== */

function saveIndexPosition() {

    savedIndexScrollLeft =
        indexScroller.scrollLeft;

}


function restoreIndexPosition() {

    requestAnimationFrame(
        () => {

            indexScroller.scrollLeft =
                savedIndexScrollLeft;

        }
    );

}


/* =====================================================
   ENTER INDEX
   ===================================================== */

async function enterIndex() {

    if (
        indexMode ||
        interfaceAnimating
    ) {

        return;

    }


    interfaceAnimating =
        true;


    autoplayBeforeIndex =
        !video.paused;


    video.pause();


    if (
        projectAllMode
    ) {

        await leaveProjectAll(
            {
                resume:
                    false
            }
        );

    }


    indexMode =
        true;


    body.classList.add(
        "index-mode"
    );


    indexView.classList.add(
        "visible"
    );


    restoreIndexPosition();


    /*
        Let layout become visible first, then play.

        Metadata has already been warming in background,
        which is faster on mobile than starting everything
        from zero here.
    */

    requestAnimationFrame(
        () => {

            activatePreviewsIn(
                indexGrid
            );

        }
    );


    await morphIndexTo(
        indexWord.length
    );


    interfaceAnimating =
        false;

}


/* =====================================================
   RETURN FROM INDEX
   ===================================================== */

async function returnFromIndex() {

    if (
        !indexMode ||
        interfaceAnimating
    ) {

        return;

    }


    interfaceAnimating =
        true;


    saveIndexPosition();


    await morphIndexTo(
        0
    );


    stopAllPreviews();


    indexView.classList.remove(
        "visible"
    );


    indexMode =
        false;


    body.classList.remove(
        "index-mode"
    );


    if (
        autoplayBeforeIndex
    ) {

        video
            .play()
            .catch(
                () => {}
            );

    }


    interfaceAnimating =
        false;

}


/* =====================================================
   INDEX -> PROJECT
   ===================================================== */

async function exitIndexToProject(
    targetProjectIndex
) {

    if (
        !indexMode ||
        interfaceAnimating
    ) {

        return;

    }


    interfaceAnimating =
        true;


    saveIndexPosition();


    await morphIndexTo(
        0
    );


    stopAllPreviews();


    indexView.classList.remove(
        "visible"
    );


    indexMode =
        false;


    body.classList.remove(
        "index-mode"
    );


    currentProjectIndex =
        targetProjectIndex;


    currentVideoIndex =
        0;


    renderedProjectIndex =
        null;


    await loadCurrentVideo(
        true
    );


    interfaceAnimating =
        false;

}


/* =====================================================
   INDEX BUTTON
   ===================================================== */

indexButton.addEventListener(
    "click",
    async event => {

        event.stopPropagation();


        if (
            interfaceAnimating ||
            projectViewAnimating
        ) {

            return;

        }


        if (
            projectAllMode
        ) {

            await leaveProjectAll(
                {
                    resume:
                        false
                }
            );


            await enterIndex();


            return;

        }


        if (
            indexMode
        ) {

            await returnFromIndex();

        }

        else {

            await enterIndex();

        }

    }
);


/* =====================================================
   INDEX WHEEL
   ===================================================== */

indexScroller.addEventListener(
    "wheel",
    event => {

        if (
            !indexMode
        ) {

            return;

        }


        event.preventDefault();


        const movement =
            Math.abs(
                event.deltaX
            ) >
            Math.abs(
                event.deltaY
            )
                ? event.deltaX
                : event.deltaY;


        indexScroller.scrollLeft +=
            movement *
            INDEX_WHEEL_MULTIPLIER;

    },
    {
        passive:
            false
    }
);


/* =====================================================
   INDEX DRAG
   ===================================================== */

let indexDragging =
    false;

let indexDragStartX =
    0;

let indexDragStartScroll =
    0;

let indexDragDistance =
    0;


indexScroller.addEventListener(
    "mousedown",
    event => {

        if (
            event.button !==
            0
        ) {

            return;

        }


        indexDragging =
            true;


        indexDragMoved =
            false;


        indexDragDistance =
            0;


        indexDragStartX =
            event.clientX;


        indexDragStartScroll =
            indexScroller.scrollLeft;


        indexScroller.classList.add(
            "dragging"
        );

    }
);


window.addEventListener(
    "mousemove",
    event => {

        if (
            !indexDragging
        ) {

            return;

        }


        const delta =
            event.clientX -
            indexDragStartX;


        indexDragDistance =
            Math.max(
                indexDragDistance,
                Math.abs(
                    delta
                )
            );


        if (
            indexDragDistance >
            6
        ) {

            indexDragMoved =
                true;

        }


        indexScroller.scrollLeft =
            indexDragStartScroll -
            delta;

    }
);


window.addEventListener(
    "mouseup",
    () => {

        if (
            !indexDragging
        ) {

            return;

        }


        indexDragging =
            false;


        indexScroller.classList.remove(
            "dragging"
        );


        if (
            indexDragMoved
        ) {

            setTimeout(
                () => {

                    indexDragMoved =
                        false;

                },
                0
            );

        }

    }
);


/* =====================================================
   INDEX KEYBOARD
   ===================================================== */

indexScroller.addEventListener(
    "keydown",
    event => {

        if (
            event.key ===
            "ArrowRight"
        ) {

            event.preventDefault();


            indexScroller.scrollBy(
                {
                    left:
                        INDEX_KEY_STEP,

                    behavior:
                        "smooth"
                }
            );

        }


        else if (
            event.key ===
            "ArrowLeft"
        ) {

            event.preventDefault();


            indexScroller.scrollBy(
                {
                    left:
                        -INDEX_KEY_STEP,

                    behavior:
                        "smooth"
                }
            );

        }

    }
);


/* =====================================================
   GLOBAL KEYBOARD
   ===================================================== */

document.addEventListener(
    "keydown",
    event => {

        const target =
            event.target;


        if (
            target &&
            [
                "INPUT",
                "TEXTAREA",
                "SELECT"
            ].includes(
                target.tagName
            )
        ) {

            return;

        }


        if (
            event.code ===
            "Escape"
        ) {

            if (
                projectAllMode
            ) {

                event.preventDefault();


                leaveProjectAll(
                    {
                        resume:
                            true
                    }
                );


                return;

            }


            if (
                indexMode
            ) {

                event.preventDefault();


                returnFromIndex();


                return;

            }

        }


        if (
            indexMode ||
            projectAllMode
        ) {

            return;

        }


        if (
            event.code ===
            "Space"
        ) {

            event.preventDefault();


            togglePlayback();

        }


        else if (
            event.code ===
            "ArrowRight"
        ) {

            event.preventDefault();


            nextFilm();

        }


        else if (
            event.code ===
            "ArrowLeft"
        ) {

            event.preventDefault();


            previousFilm();

        }

    }
);


/* =====================================================
   MOBILE SWIPE
   ===================================================== */

video.addEventListener(
    "touchstart",
    event => {

        if (
            event.touches.length !==
            1
        ) {

            return;

        }


        const touch =
            event.touches[
                0
            ];


        touchStartX =
            touch.clientX;


        touchStartY =
            touch.clientY;


        touchStartTime =
            performance.now();


        touchMoved =
            false;

    },
    {
        passive:
            true
    }
);


video.addEventListener(
    "touchmove",
    event => {

        if (
            event.touches.length !==
            1
        ) {

            return;

        }


        const touch =
            event.touches[
                0
            ];


        if (
            Math.abs(
                touch.clientX -
                touchStartX
            ) >
            10 ||
            Math.abs(
                touch.clientY -
                touchStartY
            ) >
            10
        ) {

            touchMoved =
                true;

        }

    },
    {
        passive:
            true
    }
);


video.addEventListener(
    "touchend",
    event => {

        if (
            !event.changedTouches.length
        ) {

            return;

        }


        const touch =
            event.changedTouches[
                0
            ];


        const deltaX =
            touch.clientX -
            touchStartX;


        const deltaY =
            touch.clientY -
            touchStartY;


        const elapsed =
            performance.now() -
            touchStartTime;


        const swipe =
            Math.abs(
                deltaX
            ) >=
            50 &&
            Math.abs(
                deltaX
            ) >
            Math.abs(
                deltaY
            ) *
            1.25 &&
            elapsed <
            700;


        if (
            swipe
        ) {

            if (
                deltaX <
                0
            ) {

                nextFilm();

            }

            else {

                previousFilm();

            }


            setTimeout(
                () => {

                    touchMoved =
                        false;

                },
                150
            );


            return;

        }


        setTimeout(
            () => {

                touchMoved =
                    false;

            },
            150
        );

    },
    {
        passive:
            true
    }
);


/* =====================================================
   INDEX PREWARM
   ===================================================== */

/*
    Mobile browsers are more conservative about media
    networking and decoding.

    Index metadata is therefore warmed in small batches
    after the main slide is ready.

    We do NOT play all films here.
    We just make their initial metadata / range available.
*/

async function warmIndexPreviews() {

    const previews =
        [
            ...indexGrid.querySelectorAll(
                "video[data-src]"
            )
        ];


    for (
        let i = 0;
        i < previews.length;
        i += 3
    ) {

        const batch =
            previews.slice(
                i,
                i + 3
            );


        batch.forEach(
            preview => {

                if (
                    !preview.getAttribute(
                        "src"
                    )
                ) {

                    preview.src =
                        preview.dataset.src;


                    preview.preload =
                        "auto";


                    preview.load();

                }

            }
        );


        await wait(
            120
        );

    }

}


/* =====================================================
   LOAD PROJECTS
   ===================================================== */

async function loadProjects() {

    try {

        const response =
            await fetch(
                FILMS_JSON,
                {
                    cache:
                        "no-store"
                }
            );


        if (
            !response.ok
        ) {

            throw new Error(
                "films.json could not be loaded"
            );

        }


        const data =
            await response.json();


        projects =
            data.filter(
                project =>
                    project &&
                    typeof project.title ===
                        "string" &&
                    Array.isArray(
                        project.videos
                    ) &&
                    project.videos.length
            );


        if (
            !projects.length
        ) {

            return;

        }


        buildIndex();


        currentProjectIndex =
            0;


        currentVideoIndex =
            0;


        updateSoundButton(
            false
        );


        await loadCurrentVideo(
            true
        );


        /*
            Start Index preparation only after the main
            page has already received its first content.
        */

        requestAnimationFrame(
            () => {

                warmIndexPreviews();

            }
        );

    }

    catch (
        error
    ) {

        console.error(
            error
        );

    }

}


/* =====================================================
   RESIZE
   ===================================================== */

let resizeTimer =
    null;


window.addEventListener(
    "resize",
    () => {

        if (
            resizeTimer
        ) {

            clearTimeout(
                resizeTimer
            );

        }


        resizeTimer =
            setTimeout(
                () => {

                    fitMainVideo();


                    if (
                        projectAllMode
                    ) {

                        layoutProjectAllGrid();

                    }


                    document
                        .querySelectorAll(
                            ".project-card"
                        )
                        .forEach(
                            card => {

                                const preview =
                                    card.querySelector(
                                        "video"
                                    );


                                const wrap =
                                    card.querySelector(
                                        ".card-video-wrap"
                                    );


                                if (
                                    preview &&
                                    wrap
                                ) {

                                    syncIndexCardSize(
                                        preview,
                                        card,
                                        wrap
                                    );

                                }

                            }
                        );

                },
                100
            );

    }
);


/* =====================================================
   VISIBILITY
   ===================================================== */

/*
    Manually paused videos remain paused after changing
    browser tabs.

    Only a film that was genuinely playing before the
    tab became hidden is resumed.
*/

document.addEventListener(
    "visibilitychange",
    () => {

        if (
            document.hidden
        ) {

            resumeAfterVisibility =
                !video.paused &&
                !video.ended &&
                !indexMode &&
                !projectAllMode;


            video.pause();


            stopAllPreviews();


            return;

        }


        if (
            resumeAfterVisibility &&
            !indexMode &&
            !projectAllMode
        ) {

            video
                .play()
                .catch(
                    () => {}
                );

        }


        resumeAfterVisibility =
            false;


        if (
            indexMode
        ) {

            activatePreviewsIn(
                indexGrid
            );

        }


        if (
            projectAllMode
        ) {

            activatePreviewsIn(
                projectAllGrid
            );

        }

    }
);


/* =====================================================
   INIT
   ===================================================== */

renderIndexWord(
    0
);


loadProjects();

</script>

</body>
</html>
