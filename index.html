/* =====================================================
   RESET
   ===================================================== */

* {
    box-sizing: border-box;
}

html,

/* =====================================================

/* =====================================================
   BODY

/* =====================================================
   INFO
   ===================================================== */

    left: var(--side);

/* =====================================================
   LOGO
   ===================================================== */

.logo-name {

.logo-aybak {

/* =====================================================
   CONTACT
   ===================================================== */

.contact,

}

}

.info a {

}

.contact a:hover,

}


/* =====================================================
   PHOTOGRAPHY SWITCH
   ===================================================== */

.section-switch {

    top: var(--top);
    right: var(--side);

    z-index: 500;

    color: #000;
    text-decoration: none;

    font-size: var(--font-size);
    line-height: var(--line-height);

    -webkit-tap-highlight-color: transparent;
}


/* =====================================================
   VIDEO STAGE
   ===================================================== */

#video-stage {
    position: fixed;

    inset: 0;

    z-index: 10;

    pointer-events: none;
}

#video-block {
    position: absolute;

    top: 50%;
    left: 50%;

    transform: translate(-50%, -50%);

    display: flex;
    flex-direction: column;

    align-items: stretch;

    width: min(
        var(--video-max-width),
        calc(var(--visual-height) * 16 / 9)
    );

    max-width:
        calc(
            100vw -
            var(--side) * 2
        );

    pointer-events: none;
}


/* =====================================================
   MAIN VIDEO
   ===================================================== */

#film-video {
    display: block;

    width: 100%;
    height: auto;

    max-height: var(--visual-height);

    aspect-ratio: 16 / 9;

    object-fit: contain;

    background: transparent;

    cursor: pointer;

    pointer-events: auto;

    -webkit-tap-highlight-color: transparent;
}


/* =====================================================
   PROJECT META
   ===================================================== */

#project-meta {
    display: grid;

    grid-template-columns:
        minmax(0, 1fr)
        auto;

    grid-template-rows:
        auto
        auto;

    width: 100%;

    margin-top: var(--meta-top-gap);

    font-size: var(--font-size);
    line-height: var(--line-height);

    pointer-events: none;
}

#project-title {
    grid-column: 1;
    grid-row: 1;

    white-space: nowrap;
}

#project-date {
    grid-column: 1;
    grid-row: 2;

    white-space: nowrap;
}

#project-counter {
    grid-column: 2;
    grid-row: 1;

    justify-self: end;

    padding-left: 28px;

    white-space: nowrap;
}

#view-all-button {
    grid-column: 2;
    grid-row: 2;

    justify-self: end;

    -webkit-appearance: none;

    margin: 0;
    padding: 0;

    border: 0;
    outline: 0;

    background: transparent;
    color: inherit;

    line-height: inherit;

    cursor: pointer;

    pointer-events: auto;

    -webkit-tap-highlight-color: transparent;
}


/* =====================================================
   CONTROLS
   ===================================================== */

#controls {

/* =====================================================
   INDEX BUTTON
   ===================================================== */

#index-button {

/* =====================================================

body.index-mode #video-stage {

/* =====================================================

   ===================================================== */

#index-scroller {

    top: var(--index-content-top);
    left: 0;
    right: 0;

    cursor: grab;

}

#index-scroller::-webkit-scrollbar {
    display: none;
}

#index-scroller.dragging {

}


/* =====================================================
   INDEX RAIL

#index-grid {

/* =====================================================
   DATA
   ===================================================== */

const R2_BASE =
    "https://pub-14d397941aeb40e5bd3f66ac028fef80.r2.dev/films/";

const FILMS_JSON =
    "./films.json";


/* =====================================================
   TIMING
   ===================================================== */

const WORD_TRANSITION_DURATION =
    400;

const LOGO_STEP_DURATION =
    80;

const LOGO_MOBILE_HOLD =
    2000;

const PREVIEW_DURATION =
    5;


/* =====================================================
   ELEMENTS
   ===================================================== */

const body =
    document.body;

const video =
    document.getElementById(
        "film-video"
    );

const projectTitle =
    document.getElementById(
        "project-title"
    );

const projectDate =

    );

const projectCounter =

        "project-counter"
    );

const previousButton =

        "previous-button"
    );

const nextButton =
    document.getElementById(

    );

const soundButton =

    );

const viewAllButton =

    );

const projectAllView =

    );

const projectAllGrid =
    document.getElementById(
        "project-all-grid"
    );

const indexButton =
    document.getElementById(
        "index-button"
    );

const indexView =
    document.getElementById(
        "index-view"
    );

const indexScroller =
    document.getElementById(
        "index-scroller"
    );

const indexGrid =
    document.getElementById(
        "index-grid"
    );


/* =====================================================
   STATE
   ===================================================== */

let projects =
    [];

let currentProjectIndex =
    0;

let currentVideoIndex =
    0;

let soundEnabled =
    false;

let indexOpen =
    false;

let viewAllOpen =
    false;


/* =====================================================
   HELPERS
   ===================================================== */

function videoUrl(
    filename
) {

    return (
        R2_BASE +
        encodeURIComponent(
            filename
        )
    );

}


function currentProject() {

    return projects[
        currentProjectIndex
    ];

}


function currentFilename() {

    const project =
        currentProject();

    if (
        !project
    ) {
        return null;
    }

    return project.videos[
        currentVideoIndex
    ];

}


/* =====================================================
   CASE ANIMATION
   ===================================================== */

function renderCaseWord(
    word,
    upperCount
) {

    let result =
        "";

    let letterIndex =
        0;

    for (
        let i = 0;
        i < word.length;
        i++
    ) {

        const char =
            word[i];

        if (
            /[a-zA-Z]/.test(
                char
            )
        ) {

            result +=
                letterIndex <
                upperCount
                    ? char.toUpperCase()
                    : char.toLowerCase();

            letterIndex++;

        }

        else {

            result +=
                char;

        }

    }

    return result;

}


function letterCount(
    word
) {

    return (
        word.match(
            /[a-zA-Z]/g
        ) || []
    ).length;

}


function animateCaseControl(
    element,
    toUpper
) {

    const span =
        element.querySelector(
            "span"
        );

    if (
        !span
    ) {
        return;
    }

    const word =
        element.dataset.word;

    const total =
        letterCount(
            word
        );

    const start =
        performance.now();

    const from =
        toUpper
            ? 0
            : total;

    const to =
        toUpper
            ? total
            : 0;


    function frame(
        now
    ) {

        const progress =
            Math.min(
                1,
                (
                    now -
                    start
                ) /
                WORD_TRANSITION_DURATION
            );

        const count =
            Math.round(
                from +
                (
                    to -
                    from
                ) *
                progress
            );

        span.textContent =
            renderCaseWord(
                word,
                count
            );

        if (
            progress <
            1
        ) {

            requestAnimationFrame(
                frame
            );

        }

    }


    requestAnimationFrame(
        frame
    );

}


document
    .querySelectorAll(
        ".case-control"
    )
    .forEach(
        element => {

            element.addEventListener(
                "mouseenter",
                () => {

                    if (
                        window.matchMedia(
                            "(hover: hover)"
                        ).matches
                    ) {

                        animateCaseControl(
                            element,
                            true
                        );

                    }

                }
            );


            element.addEventListener(
                "mouseleave",
                () => {

                    if (
                        window.matchMedia(
                            "(hover: hover)"
                        ).matches
                    ) {

                        animateCaseControl(
                            element,
                            false
                        );

                    }

                }
            );

        }
    );


/* =====================================================
   LOGO
   ===================================================== */

const logo =
    document.getElementById(
        "logo"
    );

const logoName =
    document.getElementById(
        "logo-name"
    );

const logoLetters = [
    document.getElementById("letter-a"),
    document.getElementById("letter-y"),
    document.getElementById("letter-b"),
    document.getElementById("letter-a2"),
    document.getElementById("letter-k")
];

const lowercase = [
    "a",
    "y",
    "b",
    "a",
    "k"
];

const uppercase = [
    "A",
    "Y",
    "B",
    "A",
    "K"
];

let logoState =
    0;

let logoTarget =
    0;

let logoTimer =
    null;

let logoReturnTimer =
    null;


function setLogoState(
    state
) {

    logoState =
        state;

    logoName.textContent =
        state === 0
            ? "Denizalp"
            : "denizalp";


    for (
        let i = 0;
        i < logoLetters.length;
        i++
    ) {

        logoLetters[i]
            .textContent =
                i < state
                    ? uppercase[i]
                    : lowercase[i];

    }

}


function moveLogo() {

    if (
        logoState ===
        logoTarget
    ) {

        logoTimer =
            null;

        return;

    }


    setLogoState(
        logoState <
        logoTarget
            ? logoState + 1
            : logoState - 1
    );


    logoTimer =
        setTimeout(
            moveLogo,
            LOGO_STEP_DURATION
        );

}


function animateLogoTo(
    target
) {

    logoTarget =
        target;


    if (
        logoTimer !==
        null
    ) {

        clearTimeout(
            logoTimer
        );

    }


    moveLogo();

}


logo.addEventListener(
    "mouseenter",
    () => {

        if (
            window.matchMedia(
                "(hover: hover)"
            ).matches
        ) {

            animateLogoTo(5);

        }

    }
);


logo.addEventListener(
    "mouseleave",
    () => {

        if (
            window.matchMedia(
                "(hover: hover)"
            ).matches
        ) {

            animateLogoTo(0);

        }

    }
);


logo.addEventListener(
    "click",
    event => {

        event.preventDefault();


        if (
            window.matchMedia(
                "(hover: none)"
            ).matches
        ) {

            if (
                logoReturnTimer
            ) {

                clearTimeout(
                    logoReturnTimer
                );

            }


            animateLogoTo(5);


            logoReturnTimer =
                setTimeout(
                    () => {

                        animateLogoTo(0);

                    },
                    LOGO_MOBILE_HOLD
                );

        }

    }
);


setLogoState(0);


/* =====================================================
   META
   ===================================================== */

function updateMeta() {

    const project =
        currentProject();

    if (
        !project
    ) {
        return;
    }


    projectTitle.textContent =
        project.title;

    projectDate.textContent =
        project.date;

    projectCounter.textContent =
        `${currentVideoIndex + 1}/${project.videos.length}`;

}


/* =====================================================
   SOUND
   ===================================================== */

function updateSoundButton() {

    const text =
        soundEnabled
            ? "sound off"
            : "sound on";


    soundButton.dataset.word =
        text;

    soundButton
        .querySelector(
            "span"
        )
        .textContent =
            text;

}


function applySoundState() {

    video.muted =
        !soundEnabled;

}


function toggleSound() {

    soundEnabled =
        !soundEnabled;

    applySoundState();

    updateSoundButton();

}


/* =====================================================
   PLAY / PAUSE
   ===================================================== */

function togglePlayback() {

    if (
        video.paused
    ) {

        video
            .play()
            .catch(
                () => {}
            );

    }

    else {

        video.pause();

    }

}


/* =====================================================
   LOAD VIDEO
   ===================================================== */

function loadCurrentVideo(
    autoplay = true
) {

    const filename =
        currentFilename();

    if (
        !filename
    ) {
        return;
    }


    video.pause();

    video.src =
        videoUrl(
            filename
        );

    video.load();

    applySoundState();

    updateMeta();


    if (
        autoplay
    ) {

        const play =
            () => {

                video
                    .play()
                    .catch(
                        () => {}
                    );

                video.removeEventListener(
                    "canplay",
                    play
                );

            };


        video.addEventListener(
            "canplay",
            play
        );

    }

}


/* =====================================================
   NEXT / PREVIOUS
   ===================================================== */

function nextFilm() {

    const project =
        currentProject();

    if (
        !project
    ) {
        return;
    }


    if (
        currentVideoIndex <
        project.videos.length -
        1
    ) {

        currentVideoIndex++;

    }

    else {

        currentProjectIndex =
            (
                currentProjectIndex +
                1
            ) %
            projects.length;

        currentVideoIndex =
            0;

    }


    loadCurrentVideo(true);

}


function previousFilm() {

    if (
        projects.length ===
        0
    ) {
        return;
    }


    if (
        currentVideoIndex >
        0
    ) {

        currentVideoIndex--;

    }

    else {

        currentProjectIndex =
            (
                currentProjectIndex -
                1 +
                projects.length
            ) %
            projects.length;

        currentVideoIndex =
            projects[
                currentProjectIndex
            ].videos.length -
            1;

    }


    loadCurrentVideo(true);

}


/* =====================================================
   MAIN VIDEO EVENTS
   ===================================================== */

video.addEventListener(
    "click",
    event => {

        event.stopPropagation();

        togglePlayback();

    }
);


video.addEventListener(
    "ended",
    nextFilm
);


/* =====================================================
   CONTROL EVENTS
   ===================================================== */

previousButton.addEventListener(
    "click",
    event => {

        event.stopPropagation();

        previousFilm();

        previousButton.blur();

    }
);


nextButton.addEventListener(
    "click",
    event => {

        event.stopPropagation();

        nextFilm();

        nextButton.blur();

    }
);


soundButton.addEventListener(
    "click",
    event => {

        event.stopPropagation();

        toggleSound();

        soundButton.blur();

    }
);


/* =====================================================
   PREVIEW VIDEO
   ===================================================== */

function createPreviewVideo(
    filename
) {

    const preview =
        document.createElement(
            "video"
        );

    preview.dataset.src =
        videoUrl(
            filename
        );

    preview.muted =
        true;

    preview.defaultMuted =
        true;

    preview.playsInline =
        true;

    preview.preload =
        "metadata";

    preview.disablePictureInPicture =
        true;

    preview.setAttribute(
        "aria-hidden",
        "true"
    );


    preview.addEventListener(
        "timeupdate",
        () => {

            if (
                preview.currentTime >=
                PREVIEW_DURATION
            ) {

                preview.currentTime =
                    0;

                preview
                    .play()
                    .catch(
                        () => {}
                    );

            }

        }
    );


    return preview;

}


/* =====================================================
   PREVIEW OBSERVER
   ===================================================== */

const previewObserver =
    new IntersectionObserver(
        entries => {

            entries.forEach(
                entry => {

                    const preview =
                        entry.target;


                    if (
                        entry.isIntersecting
                    ) {

                        if (
                            !preview.src
                        ) {

                            preview.src =
                                preview.dataset.src;

                            preview.load();

                        }


                        preview
                            .play()
                            .catch(
                                () => {}
                            );

                    }

                    else {

                        preview.pause();

                    }

                }
            );

        },
        {
            rootMargin:
                "160px"
        }
    );


function observePreview(
    preview
) {

    previewObserver.observe(
        preview
    );

}


/* =====================================================
   STOP PREVIEWS
   ===================================================== */

function stopAllPreviews() {

    document
        .querySelectorAll(
            "#index-view video, #project-all-view video"
        )
        .forEach(
            preview => {

                preview.pause();

            }
        );

}


/* =====================================================
   VIEW ALL GRID
   ===================================================== */

function calculateViewAllGrid(
    count
) {

    if (
        count <= 1
    ) {

        return {
            columns: 1,
            rows: 1
        };

    }

    if (
        count === 2
    ) {

        return {
            columns: 2,
            rows: 1
        };

    }

    if (
        count <= 4
    ) {

        return {
            columns: 2,
            rows: 2
        };

    }

    return {
        columns: 3,
        rows: 2
    };

}


/* =====================================================
   BUILD VIEW ALL
   ===================================================== */

function buildViewAll() {

    const project =
        currentProject();

    if (
        !project
    ) {
        return;
    }


    projectAllGrid.innerHTML =
        "";


    const layout =
        calculateViewAllGrid(
            project.videos.length
        );


    projectAllGrid.style
        .gridTemplateColumns =
            `repeat(${layout.columns}, minmax(0, 1fr))`;

    projectAllGrid.style
        .gridTemplateRows =
            `repeat(${layout.rows}, minmax(0, 1fr))`;


    project.videos.forEach(
        (
            filename,
            videoIndex
        ) => {

            const button =
                document.createElement(
                    "button"
                );

            button.type =
                "button";

            button.className =
                "project-all-thumb";


            const preview =
                createPreviewVideo(
                    filename
                );


            button.appendChild(
                preview
            );


            button.addEventListener(
                "click",
                event => {

                    event.stopPropagation();

                    currentVideoIndex =
                        videoIndex;

                    closeViewAll(
                        false
                    );

                    loadCurrentVideo(
                        true
                    );

                }
            );


            projectAllGrid.appendChild(
                button
            );


            observePreview(
                preview
            );

        }
    );

}


/* =====================================================
   VIEW ALL OPEN / CLOSE
   ===================================================== */

function openViewAll() {

    if (
        indexOpen
    ) {
        return;
    }


    viewAllOpen =
        true;

    video.pause();

    buildViewAll();

    body.classList.add(
        "project-all-mode"
    );

    viewAllButton.dataset.word =
        "close";

    viewAllButton
        .querySelector(
            "span"
        )
        .textContent =
            "close";

}


function closeViewAll(
    resume = true
) {

    if (
        !viewAllOpen
    ) {
        return;
    }


    viewAllOpen =
        false;

    stopAllPreviews();


    body.classList.remove(
        "project-all-mode"
    );


    projectAllGrid.innerHTML =
        "";


    viewAllButton.dataset.word =
        "view all";

    viewAllButton
        .querySelector(
            "span"
        )
        .textContent =
            "view all";


    if (
        resume
    ) {

        video
            .play()
            .catch(
                () => {}
            );

    }

}


viewAllButton.addEventListener(
    "click",
    event => {

        event.stopPropagation();


        if (
            viewAllOpen
        ) {

            closeViewAll(true);

        }

        else {

            openViewAll();

        }


        viewAllButton.blur();

    }
);


/* =====================================================
   INDEX
   ===================================================== */

function buildIndex() {

    indexGrid.innerHTML =
        "";


    const ordered =
        projects
            .map(
                (
                    project,
                    projectIndex
                ) => ({
                    project,
                    projectIndex
                })
            )
            .sort(
                (
                    a,
                    b
                ) =>
                    (
                        a.project.indexOrder ??
                        999
                    ) -
                    (
                        b.project.indexOrder ??
                        999
                    )
            );


    ordered.forEach(
        item => {

            const {
                project,
                projectIndex
            } =
                item;


            const card =
                document.createElement(
                    "button"
                );

            card.type =
                "button";

            card.className =
                "project-card";


            const videoWrap =
                document.createElement(
                    "div"
                );

            videoWrap.className =
                "card-video-wrap";


            const preview =
                createPreviewVideo(
                    project.videos[0]
                );


            videoWrap.appendChild(
                preview
            );


            const copy =
                document.createElement(
                    "div"
                );

            copy.className =
                "card-copy";


            const title =
                document.createElement(
                    "span"
                );

            title.className =
                "card-title";

            title.textContent =
                project.title;


            const date =
                document.createElement(
                    "span"
                );

            date.className =
                "card-date";

            date.textContent =
                project.date;


            copy.appendChild(
                title
            );

            copy.appendChild(
                date
            );


            card.appendChild(
                videoWrap
            );

            card.appendChild(
                copy
            );


            card.addEventListener(
                "click",
                event => {

                    event.stopPropagation();

                    currentProjectIndex =
                        projectIndex;

                    currentVideoIndex =
                        0;

                    closeIndex(
                        false
                    );

                    loadCurrentVideo(
                        true
                    );

                }
            );


            indexGrid.appendChild(
                card
            );


            observePreview(
                preview
            );

        }
    );

}


/* =====================================================
   INDEX OPEN / CLOSE
   ===================================================== */

function openIndex() {

    if (
        viewAllOpen
    ) {

        closeViewAll(
            false
        );

    }


    indexOpen =
        true;

    video.pause();


    if (
        indexGrid.children.length ===
        0
    ) {

        buildIndex();

    }


    body.classList.add(
        "index-mode"
    );

    indexView.classList.add(
        "visible"
    );


    indexButton.dataset.word =
        "close";

    indexButton
        .querySelector(
            "span"
        )
        .textContent =
            "close";

}


function closeIndex(
    resume = true
) {

    if (
        !indexOpen
    ) {
        return;
    }


    indexOpen =
        false;

    stopAllPreviews();


    body.classList.remove(
        "index-mode"
    );

    indexView.classList.remove(
        "visible"
    );


    indexButton.dataset.word =
        "index";

    indexButton
        .querySelector(
            "span"
        )
        .textContent =
            "index";


    if (
        resume
    ) {

        video
            .play()
            .catch(
                () => {}
            );

    }

}


indexButton.addEventListener(
    "click",
    event => {

        event.stopPropagation();


        if (
            indexOpen
        ) {

            closeIndex(true);

        }

        else {

            openIndex();

        }


        indexButton.blur();

    }
);


/* =====================================================
   INDEX WHEEL
   ===================================================== */

indexScroller.addEventListener(
    "wheel",
    event => {

        if (
            !indexOpen
        ) {
            return;
        }


        event.preventDefault();


        indexScroller.scrollLeft +=
            Math.abs(
                event.deltaX
            ) >
            Math.abs(
                event.deltaY
            )
                ? event.deltaX
                : event.deltaY;

    },
    {
        passive: false
    }
);


/* =====================================================
   INDEX DRAG
   ===================================================== */

let dragging =
    false;

let dragStartX =
    0;

let dragStartScroll =
    0;


indexScroller.addEventListener(
    "pointerdown",
    event => {

        dragging =
            true;

        dragStartX =
            event.clientX;

        dragStartScroll =
            indexScroller.scrollLeft;

        indexScroller.classList.add(
            "dragging"
        );

        indexScroller.setPointerCapture(
            event.pointerId
        );

    }
);


indexScroller.addEventListener(
    "pointermove",
    event => {

        if (
            !dragging
        ) {
            return;
        }


        const delta =
            event.clientX -
            dragStartX;


        indexScroller.scrollLeft =
            dragStartScroll -
            delta;

    }
);


function stopIndexDrag() {

    dragging =
        false;

    indexScroller.classList.remove(
        "dragging"
    );

}


indexScroller.addEventListener(
    "pointerup",
    stopIndexDrag
);

indexScroller.addEventListener(
    "pointercancel",
    stopIndexDrag
);


/* =====================================================
   KEYBOARD
   ===================================================== */

document.addEventListener(
    "keydown",
    event => {

        const target =
            event.target;

        const isFormElement =
            target &&
            (
                target.tagName ===
                    "INPUT" ||
                target.tagName ===
                    "TEXTAREA" ||
                target.tagName ===
                    "SELECT"
            );


        if (
            isFormElement
        ) {
            return;
        }


        if (
            event.code ===
            "Escape"
        ) {

            if (
                viewAllOpen
            ) {

                event.preventDefault();

                closeViewAll(true);

                return;

            }


            if (
                indexOpen
            ) {

                event.preventDefault();

                closeIndex(true);

                return;

            }

        }


        if (
            indexOpen
        ) {

            if (
                event.code ===
                "ArrowRight"
            ) {

                event.preventDefault();

                indexScroller.scrollBy({
                    left: 320,
                    behavior: "smooth"
                });

            }

            else if (
                event.code ===
                "ArrowLeft"
            ) {

                event.preventDefault();

                indexScroller.scrollBy({
                    left: -320,
                    behavior: "smooth"
                });

            }


            return;

        }


        if (
            viewAllOpen
        ) {
            return;
        }


        if (
            event.code ===
            "Space"
        ) {

            event.preventDefault();

            togglePlayback();

        }

        else if (
            event.code ===
            "ArrowRight"
        ) {

            event.preventDefault();

            nextFilm();

        }

        else if (
            event.code ===
            "ArrowLeft"
        ) {

            event.preventDefault();

            previousFilm();

        }

    }
);


/* =====================================================
   MOBILE SWIPE
   ===================================================== */

let touchStartX =
    0;

let touchStartY =
    0;

let touchStartTime =
    0;

let touchMoved =
    false;


video.addEventListener(
    "touchstart",
    event => {

        if (
            event.touches.length !==
            1
        ) {
            return;
        }


        const touch =
            event.touches[0];


        touchStartX =
            touch.clientX;

        touchStartY =
            touch.clientY;

        touchStartTime =
            performance.now();

        touchMoved =
            false;

    },
    {
        passive: true
    }
);


video.addEventListener(
    "touchmove",
    event => {

        if (
            event.touches.length !==
            1
        ) {
            return;
        }


        const touch =
            event.touches[0];

        const dx =
            touch.clientX -
            touchStartX;

        const dy =
            touch.clientY -
            touchStartY;


        if (
            Math.abs(dx) >
            10 ||
            Math.abs(dy) >
            10
        ) {

            touchMoved =
                true;

        }

    },
    {
        passive: true
    }
);


video.addEventListener(
    "touchend",
    event => {

        if (
            !event.changedTouches.length
        ) {
            return;
        }


        const touch =
            event.changedTouches[0];

        const dx =
            touch.clientX -
            touchStartX;

        const dy =
            touch.clientY -
            touchStartY;

        const elapsed =
            performance.now() -
            touchStartTime;


        const horizontalSwipe =
            Math.abs(dx) >=
                50 &&
            Math.abs(dx) >
                Math.abs(dy) *
                1.25 &&
            elapsed <
                700;


        if (
            horizontalSwipe
        ) {

            if (
                dx <
                0
            ) {

                nextFilm();

            }

            else {

                previousFilm();

            }


            return;

        }


        if (
            !touchMoved
        ) {

            togglePlayback();

        }

    },
    {
        passive: true
    }
);


/* =====================================================
   LOAD DATA
   ===================================================== */

async function loadProjects() {

    try {

        const response =
            await fetch(
                FILMS_JSON,
                {
                    cache:
                        "no-store"
                }
            );


        if (
            !response.ok
        ) {

            throw new Error(
                "films.json could not be loaded"
            );

        }


        const data =
            await response.json();


        projects =
            data.filter(
                project =>
                    project &&
                    typeof project.title ===
                        "string" &&
                    Array.isArray(
                        project.videos
                    ) &&
                    project.videos.length >
                        0
            );


        if (
            projects.length ===
            0
        ) {
            return;
        }


        currentProjectIndex =
            0;

        currentVideoIndex =
            0;


        updateSoundButton();

        loadCurrentVideo(
            true
        );

    }

    catch (
        error
    ) {

        console.error(
            error
        );

    }

}


/* =====================================================
   VISIBILITY
   ===================================================== */

document.addEventListener(
    "visibilitychange",
    () => {

        if (
            document.hidden
        ) {

            video.pause();

            stopAllPreviews();

            return;

        }


        if (
            !indexOpen &&
            !viewAllOpen
        ) {

            video
                .play()
                .catch(
                    () => {}
                );

        }

    }
);


/* =====================================================
   INIT
   ===================================================== */

loadProjects();

</script>
