/* =====================================================
   RESET
   ===================================================== */

* {
    box-sizing: border-box;
}

html,
body {

/* =====================================================

/* =====================================================
   BODY
   ===================================================== */

body {

/* =====================================================
   INFO
   ===================================================== */

.info {
    position: fixed;

    top: var(--top);
    left: var(--side);

    z-index: 500;

    font-size: var(--font-size);
    line-height: var(--line-height);

/* =====================================================
   LOGO
   ===================================================== */

.logo {

    left: 0;

/* =====================================================

.info a {

}


/* =====================================================
   PHOTOGRAPHY SWITCH
   ===================================================== */

.section-switch {
    position: fixed;

    top: var(--top);
    right: var(--side);

    z-index: 500;

    color: #000;
    text-decoration: none;

    font-size: var(--font-size);
    line-height: var(--line-height);

    -webkit-tap-highlight-color: transparent;
}


/* =====================================================
   VIDEO STAGE
   ===================================================== */

#video-stage {
    position: fixed;

    inset: 0;

    z-index: 10;

    pointer-events: none;
}

#video-block {
    position: absolute;

    top: 50%;
    left: 50%;

    transform: translate(-50%, -50%);

    display: flex;
    flex-direction: column;

    align-items: stretch;

    width:
        min(
            var(--video-max-width),
            calc(
                var(--visual-height) *
                16 / 9
            )
        );

    max-width:
        calc(
            100vw -
            var(--side) * 2
        );

    pointer-events: none;
}


/* =====================================================
   MAIN VIDEO
   ===================================================== */

#film-video {
    display: block;

    width: 100%;
    height: auto;

    max-height:
        var(--visual-height);

    aspect-ratio: 16 / 9;

    object-fit: contain;

    background: transparent;

    cursor: pointer;

    pointer-events: auto;

    -webkit-tap-highlight-color: transparent;
}


/* =====================================================
   PROJECT META
   ===================================================== */

#project-meta {
    position: relative;

    z-index: 60;

    display: grid;

    grid-template-columns:
        minmax(0, 1fr)
        auto;

    grid-template-rows:
        auto
        auto;

    width: 100%;

    margin-top:
        var(--meta-top-gap);

    font-size:
        var(--font-size);

    line-height:
        var(--line-height);

    pointer-events: none;
}

#project-title {
    grid-column: 1;
    grid-row: 1;

    white-space: nowrap;
}

#project-date {
    grid-column: 1;
    grid-row: 2;

    white-space: nowrap;
}

#project-counter {
    grid-column: 2;
    grid-row: 1;

    justify-self: end;

    padding-left: 28px;

    white-space: nowrap;
}

#view-all-button {
    grid-column: 2;
    grid-row: 2;

    justify-self: end;

    appearance: none;
    -webkit-appearance: none;

    margin: 0;
    padding: 0;

    border: 0;
    outline: 0;

    background: transparent;
    color: inherit;

    line-height: inherit;

    text-align: right;

    white-space: nowrap;

    cursor: pointer;

    pointer-events: auto;

    -webkit-tap-highlight-color: transparent;
}


/* =====================================================
   CONTROLS
   ===================================================== */

#controls {
    display: grid;

    grid-template-columns:
        1fr
        auto
        1fr;

    align-items: center;

    width: 100%;

    margin-top: 10px;

    font-size:
        var(--font-size);

    line-height:
        var(--line-height);

    pointer-events: auto;
}

#controls button {

    -webkit-appearance: none;

    margin: 0;
    padding: 0;

    border: 0;
    outline: 0;

    background: transparent;
    color: #000;

    line-height: inherit;

    cursor: pointer;

    white-space: nowrap;

    -webkit-tap-highlight-color: transparent;
}

#previous-button {
    justify-self: start;
}

#sound-button {
    justify-self: center;
}

#next-button {
    justify-self: end;

   ===================================================== */

body.project-all-mode #film-video {

body.project-all-mode #controls {
    visibility: hidden;

/* =====================================================
   VIEW ALL
   ===================================================== */

#project-all-view {
    position: fixed;

    display: none;

    overflow: hidden;

    pointer-events: auto;
}

body.project-all-mode #project-all-view {
    display: block;
}


/* =====================================================
   VIEW ALL GRID
   ===================================================== */

#project-all-grid {
    display: grid;

    width: 100%;
    height: 100%;

    place-content: center;

    align-items: center;
    justify-items: center;

    gap: 7px;
}

.project-all-thumb {
    appearance: none;
    -webkit-appearance: none;

    display: flex;

    align-items: center;
    justify-content: center;

    width: 100%;
    height: 100%;

    min-width: 0;
    min-height: 0;

    margin: 0;
    padding: 0;

    border: 0;

    background: transparent;

    cursor: pointer;

    overflow: hidden;

.project-all-thumb video {

    max-height: 100%;

    height: auto;

    object-fit: contain;

    pointer-events: none;

/* =====================================================
   INDEX BUTTON
   ===================================================== */

#index-button {
    position: fixed;

    left: 50%;

    bottom:
        calc(
            var(--index-bottom) +
            env(safe-area-inset-bottom)

    padding: 0;

    cursor: pointer;

    -webkit-tap-highlight-color: transparent;

/* =====================================================
   INDEX VIEW
   ===================================================== */

#index-view {
    position: fixed;

    inset: 0;

    z-index: 100;

    display: none;

    background: #fff;
}

#index-view.visible {
    display: block;
}

body.index-mode #video-stage {
    visibility: hidden;
}


/* =====================================================
   INDEX SCROLLER
   ===================================================== */

#index-scroller {
    position: absolute;

    top:
        var(--index-content-top);

    left: 0;
    right: 0;

    bottom:
        calc(
            var(--index-bottom) +
            env(safe-area-inset-bottom) +
            34px
        );

    display: flex;

    align-items: center;

    overflow-x: auto;
    overflow-y: hidden;

    scrollbar-width: none;

    -webkit-overflow-scrolling: touch;

    user-select: none;

    cursor: grab;

    outline: none;

    pointer-events: auto;
}

#index-scroller::-webkit-scrollbar {
    display: none;
}

#index-scroller.dragging {
    cursor: grabbing;
}


/* =====================================================
   INDEX RAIL
   ===================================================== */

#index-grid {
    display: flex;

    flex-direction: row;
    flex-wrap: nowrap;

    align-items: center;

    gap: 54px;

    width: max-content;

    padding-left:
        var(--side);

    padding-right:
        var(--side);

    transform:

    padding: 0;

/* =====================================================

@media

function isPhonePortrait() {

function isPhoneLandscape() {

    return (

/* =====================================================
   SIMPLE SEQUENTIAL MORPH
   ===================================================== */

function morphSequential(
    element,
    nextText,
    duration =
        TEXT_MORPH_DURATION
) {

    const oldText =
        element.dataset.rawText !==
        undefined
            ? element.dataset.rawText
            : element.textContent;


    if (
        oldText ===
        nextText
    ) {

        element.textContent =
            nextText;

        element.dataset.rawText =
            nextText;

        return Promise.resolve();

    }


    const length =
        Math.max(
            oldText.length,
            nextText.length
        );


    const from =
        oldText
            .padEnd(
                length,
                " "
            )
            .split(
                ""
            );


    const to =
        nextText
            .padEnd(
                length,
                " "
            )
            .split(
                ""
            );


    const changedPositions =
        [];


    for (
        let i = 0;
        i < length;
        i++
    ) {

        if (
            from[i] !==
            to[i]
        ) {

            changedPositions.push(
                i
            );

        }

    }


    const originalWidth =
        element
            .getBoundingClientRect()
            .width;


    if (
        originalWidth > 0
    ) {

        element.style.minWidth =
            `${originalWidth}px`;

    }


    const start =
        performance.now();


    return new Promise(
        resolve => {

            function frame(
                now
            ) {

                const progress =
                    Math.min(
                        1,
                        (
                            now -
                            start
                        ) /
                        duration
                    );


                const completed =
                    Math.floor(
                        progress *
                        (
                            changedPositions.length +
                            1
                        )
                    );


                const current =
                    from.slice();


                for (
                    let i = 0;
                    i < completed;
                    i++
                ) {

                    const position =
                        changedPositions[
                            i
                        ];


                    if (
                        position ===
                        undefined
                    ) {

                        continue;

                    }


                    current[
                        position
                    ] =
                        to[
                            position
                        ];

                }


                element.textContent =
                    current
                        .join(
                            ""
                        )
                        .trimEnd();


                if (
                    progress <
                    1
                ) {

                    requestAnimationFrame(
                        frame
                    );

                }

                else {

                    element.textContent =
                        nextText;

                    element.dataset.rawText =
                        nextText;

                    element.style.minWidth =
                        "";

                    resolve();

                }

            }


            requestAnimationFrame(
                frame
            );

        }
    );

}


/* =====================================================
   CASE HELPERS
   ===================================================== */

function getLetterPositions(
    text
) {

    const result =
        [];


    for (
        let i = 0;
        i < text.length;
        i++
    ) {

        const character =
            text[i];


        if (
            character.toLowerCase() !==
            character.toUpperCase()
        ) {

            result.push(
                i
            );

        }

    }


    return result;

}


function renderPrefixCase(
    baseText,
    upperCount
) {

    const positions =
        getLetterPositions(
            baseText
        );


    const upper =
        new Set(
            positions.slice(
                0,
                upperCount
            )
        );


    return baseText
        .split(
            ""
        )
        .map(
            (
                character,
                index
            ) => {

                return upper.has(
                    index
                )
                    ? character.toUpperCase()
                    : character.toLowerCase();

            }
        )
        .join(
            ""
        );

}


/* =====================================================
   CASE ANIMATION
   ===================================================== */

function animateCase(
    element,
    baseText,
    toUpper,
    duration =
        CASE_DURATION
) {

    const base =
        baseText.toLowerCase();


    const positions =
        getLetterPositions(
            base
        );


    const total =
        positions.length;


    const currentText =
        element.textContent;


    let currentState =
        0;


    for (
        let i = 0;
        i < positions.length;
        i++
    ) {

        const position =
            positions[i];


        const character =
            currentText[
                position
            ];


        if (
            character &&
            character ===
            character.toUpperCase() &&
            character !==
            character.toLowerCase()
        ) {

            currentState++;

        }

        else {

            break;

        }

    }


    const target =
        toUpper
            ? total
            : 0;


    if (
        currentState ===
        target
    ) {

        element.textContent =
            renderPrefixCase(
                base,
                target
            );

        return Promise.resolve();

    }


    const start =
        performance.now();


    return new Promise(
        resolve => {

            function frame(
                now
            ) {

                const progress =
                    Math.min(
                        1,
                        (
                            now -
                            start
                        ) /
                        duration
                    );


                const state =
                    Math.round(
                        currentState +
                        (
                            target -
                            currentState
                        ) *
                        progress
                    );


                element.textContent =
                    renderPrefixCase(
                        base,
                        state
                    );


                if (
                    progress <
                    1
                ) {

                    requestAnimationFrame(
                        frame
                    );

                }

                else {

                    element.textContent =
                        renderPrefixCase(
                            base,
                            target
                        );

                    resolve();

                }

            }


            requestAnimationFrame(
                frame
            );

        }
    );

}

const logoLetters = [

    document.getElementById("letter-k")
];

const lowercase = [
    "a",

    "b",
    "a",
    "k"
];

const uppercase = [
    "A",
    "Y",
    "B",
    "A",
    "K"
];

let logoState =
    0;

let logoTarget =
    0;

let logoTimer =
    null;


function setLogoState(
    state
) {

    logoState =
        state;


    logoName.textContent =
        state === 0
            ? "Denizalp"
            : "denizalp";


    for (
        let i = 0;
        i < logoLetters.length;
        i++
    ) {

        logoLetters[i]
            .textContent =
                i < state
                    ? uppercase[i]
                    : lowercase[i];

    }

}


function animateLogoTo(
    target
) {

    return new Promise(
        resolve => {

            logoTarget =
                target;


            if (
                logoTimer !==
                null
            ) {

                clearTimeout(
                    logoTimer
                );

            }


            function step() {

                if (
                    logoState ===
                    logoTarget
                ) {

                    logoTimer =
                        null;

                    resolve();

                    return;

                }


                setLogoState(
                    logoState <
                    logoTarget
                        ? logoState + 1
                        : logoState - 1
                );


                logoTimer =
                    setTimeout(
                        step,
                        LOGO_STEP_DURATION
                    );

            }


            step();

        }
    );

}

        ) {

            tryPlay();

        }

        else {

            video.addEventListener(
                "canplay",

                {
                    once: true
                }
            );

        }

    }

}

function createPreviewVideo(
    filename
) {

    const preview =
        document.createElement(
            "video"
        );


    preview.dataset.src =
        videoUrl(
            filename
        );


    preview.muted =
        true;

    preview.defaultMuted =
        true;

    preview.playsInline =
        true;

    preview.preload =
        "metadata";


    preview.disablePictureInPicture =
        true;


    preview.setAttribute(
        "aria-hidden",
        "true"
    );


    preview.addEventListener(
        "timeupdate",
        () => {

            if (
                preview.currentTime >=
                PREVIEW_DURATION
            ) {

                preview.currentTime =
                    0;


                preview
                    .play()
                    .catch(
                        () => {}
                    );

            }

        }
    );


    return preview;

}


/* =====================================================
   PREVIEW OBSERVER
   ===================================================== */

const previewObserver =
    new IntersectionObserver(
        entries => {

            entries.forEach(
                entry => {

                    const preview =
                        entry.target;


                    if (
                        entry.isIntersecting
                    ) {

                        if (
                            !preview.getAttribute(
                                "src"
                            )
                        ) {

                            preview.src =
                                preview.dataset.src;

                            preview.load();

                        }


                        preview
                            .play()
                            .catch(
                                () => {}
                            );

                    }

                    else {

                        preview.pause();

                    }

                }
            );

        },
        {
            rootMargin:
                "180px"
        }
    );


function observePreview(
    preview
) {

    previewObserver.observe(
        preview
    );

}


function activatePreview(
    preview
) {

    if (
        !preview.getAttribute(
            "src"
        )
    ) {

        preview.src =
            preview.dataset.src;

        preview.preload =
            "auto";

        preview.load();

    }


    preview
        .play()
        .catch(
            () => {}
        );

}


function activatePreviewsIn(
    container
) {

    container
        .querySelectorAll(
            "video[data-src]"
        )
        .forEach(
            activatePreview
        );

}

/* =====================================================
   VIEW ALL BOUNDS
   ===================================================== */

function syncProjectAllBounds() {

    if (
        !projectAllMode
    ) {

        return;

    }


    const infoRect =
        info.getBoundingClientRect();


    const metaRect =
        projectMeta.getBoundingClientRect();


    const rootStyle =
        getComputedStyle(
            document.documentElement
        );


    const side =
        parseFloat(
            rootStyle.getPropertyValue(
                "--side"
            )
        ) || 48;


    let topGap =
        14;

    let bottomGap =
        14;


    if (
        isPhonePortrait()
    ) {

        topGap =
            10;

        bottomGap =
            10;

    }


    if (
        isPhoneLandscape()
    ) {

        topGap =
            4;

        bottomGap =
            6;

    }


    const top =
        Math.ceil(
            infoRect.bottom +
            topGap
        );


    const bottom =
        Math.floor(
            metaRect.top -
            bottomGap
        );


    projectAllView.style.left =
        `${side}px`;


    projectAllView.style.right =
        `${side}px`;


    projectAllView.style.top =
        `${top}px`;


    projectAllView.style.height =
        `${Math.max(
            80,
            bottom -
            top
        )}px`;

}


/* =====================================================
   VIEW ALL GRID LAYOUT
   ===================================================== */

function calculateProjectAllLayout(
    count
) {

    const rect =
        projectAllView
            .getBoundingClientRect();


    const gap =
        isPhoneLandscape()
            ? 4
            : (
                isPhonePortrait()
                    ? 5
                    : 7
            );


    let best =
        {
            columns: 1,
            rows: count,
            score: 0
        };


    for (
        let columns = 1;
        columns <= count;
        columns++
    ) {

        const rows =
            Math.ceil(
                count /
                columns
            );


        const usableWidth =
            rect.width -
            gap *
            (
                columns -
                1
            );


        const usableHeight =
            rect.height -
            gap *
            (
                rows -
                1
            );


        if (
            usableWidth <= 0 ||
            usableHeight <= 0
        ) {

            continue;

        }


        const cellWidth =
            usableWidth /
            columns;


        const cellHeight =
            usableHeight /
            rows;


        const visibleWidth =
            Math.min(
                cellWidth,
                cellHeight *
                16 / 9
            );


        const visibleHeight =
            Math.min(
                cellHeight,
                cellWidth *
                9 / 16
            );


        const score =
            visibleWidth *
            visibleHeight;


        if (
            score >
            best.score
        ) {

            best =
                {
                    columns,
                    rows,
                    score
                };

        }

    }


    return best;

}


function layoutProjectAllGrid() {

    syncProjectAllBounds();


    const project =
        currentProject();


    if (
        !project
    ) {

        return;

    }


    const layout =
        calculateProjectAllLayout(
            project.videos.length
        );


    projectAllGrid.style
        .gridTemplateColumns =
            `repeat(${layout.columns}, minmax(0, 1fr))`;


    projectAllGrid.style
        .gridTemplateRows =
            `repeat(${layout.rows}, minmax(0, 1fr))`;

}

/* =====================================================
   INDEX SORT
   ===================================================== */

function getChronologicalProjects() {

    return projects
        .map(
            (
                project,
                originalIndex
            ) => ({
                project,
                originalIndex
            })
        )
        .sort(
            (
                a,
                b
            ) => {

                const orderA =
                    Number.isFinite(
                        a.project.indexOrder
                    )
                        ? a.project.indexOrder
                        : 999;


                const orderB =
                    Number.isFinite(
                        b.project.indexOrder
                    )
                        ? b.project.indexOrder
                        : 999;


                if (
                    orderA !==
                    orderB
                ) {

                    return (
                        orderA -
                        orderB
                    );

                }


                return (
                    a.originalIndex -
                    b.originalIndex
                );

            }
        );

}


/* =====================================================
   INDEX CARD CASE CONTROLLER
   ===================================================== */

function createCaseController(
    element,
    baseText
) {

    const base =
        baseText.toLowerCase();


    let frame =
        null;


    function animate(
        toUpper
    ) {

        if (
            frame !==
            null
        ) {

            cancelAnimationFrame(
                frame
            );

            frame =
                null;

        }


        const positions =
            getLetterPositions(
                base
            );


        const total =
            positions.length;


        const currentText =
            element.textContent;


        let startState =
            0;


        for (
            let i = 0;
            i < positions.length;
            i++
        ) {

            const position =
                positions[i];


            const character =
                currentText[
                    position
                ];


            if (
                character &&
                character ===
                character.toUpperCase() &&
                character !==
                character.toLowerCase()
            ) {

                startState++;

            }

            else {

                break;

            }

        }


        const target =
            toUpper
                ? total
                : 0;


        const start =
            performance.now();


        function step(
            now
        ) {

            const progress =
                Math.min(
                    1,
                    (
                        now -
                        start
                    ) /
                    CASE_DURATION
                );


            const state =
                Math.round(
                    startState +
                    (
                        target -
                        startState
                    ) *
                    progress
                );


            element.textContent =
                renderPrefixCase(
                    base,
                    state
                );


            if (
                progress <
                1
            ) {

                frame =
                    requestAnimationFrame(
                        step
                    );

            }

            else {

                element.textContent =
                    renderPrefixCase(
                        base,
                        target
                    );


                frame =
                    null;

            }

        }


        frame =
            requestAnimationFrame(
                step
            );

    }


    return {

        upper() {

            animate(
                true
            );

        },

        lower() {

            animate(
                false
            );

        }

    };

}


/* =====================================================
   BUILD INDEX
   ===================================================== */

function buildIndex() {

    indexGrid.innerHTML =
        "";


    getChronologicalProjects()
        .forEach(
            item => {

                const project =
                    item.project;


                const originalIndex =
                    item.originalIndex;


                const button =
                    document.createElement(
                        "button"
                    );


                button.className =
                    "project-card";


                button.type =
                    "button";


                const videoWrap =
                    document.createElement(
                        "span"
                    );


                videoWrap.className =
                    "card-video-wrap";


                const preview =
                    createPreviewVideo(
                        project.videos[0]
                    );


                videoWrap.appendChild(
                    preview
                );


                const syncCardWidth =
                    () => {

                        if (
                            !preview.videoWidth ||
                            !preview.videoHeight
                        ) {

                            return;

                        }


                        const rootStyle =
                            getComputedStyle(
                                document.documentElement
                            );


                        const targetHeight =
                            parseFloat(
                                rootStyle.getPropertyValue(
                                    "--index-video-height"
                                )
                            );


                        if (
                            !targetHeight
                        ) {

                            return;

                        }


                        const targetWidth =
                            targetHeight *
                            preview.videoWidth /
                            preview.videoHeight;


                        button.style.width =
                            `${targetWidth}px`;


                        videoWrap.style.width =
                            `${targetWidth}px`;

                    };


                preview.addEventListener(
                    "loadedmetadata",
                    syncCardWidth
                );


                const copy =
                    document.createElement(
                        "span"
                    );


                copy.className =
                    "card-copy";


                const title =
                    document.createElement(
                        "span"
                    );


                title.className =
                    "card-title";


                const titleBase =
                    project.title
                        .toLowerCase();


                title.textContent =
                    titleBase;


                const date =
                    document.createElement(
                        "span"
                    );


                date.className =
                    "card-date";


                const dateBase =
                    (
                        project.date ||
                        ""
                    ).toLowerCase();


                date.textContent =
                    dateBase;


                copy.append(
                    title,
                    date
                );


                button.append(
                    videoWrap,
                    copy
                );


                const titleCase =
                    createCaseController(
                        title,
                        titleBase
                    );


                const dateCase =
                    createCaseController(
                        date,
                        dateBase
                    );


                button.addEventListener(
                    "mouseenter",
                    () => {

                        if (
                            !window.matchMedia(
                                "(hover: hover)"
                            ).matches
                        ) {

                            return;

                        }


                        titleCase.upper();

                        dateCase.upper();

                    }
                );


                button.addEventListener(
                    "mouseleave",
                    () => {

                        if (
                            !window.matchMedia(
                                "(hover: hover)"
                            ).matches
                        ) {

                            return;

                        }


                        titleCase.lower();

                        dateCase.lower();

                    }
                );


                button.addEventListener(
                    "click",
                    async event => {

                        if (
                            indexDragMoved
                        ) {

                            event.preventDefault();

                            event.stopPropagation();

                            return;

                        }


                        event.preventDefault();

                        event.stopPropagation();


                        await exitIndexToProject(
                            originalIndex
                        );

                    }
                );


                indexGrid.appendChild(
                    button
                );


                observePreview(
                    preview
                );

            }
        );

}


/* =====================================================
   INDEX WORD
   ===================================================== */

const indexWord =
    "index";


let indexWordState =
    0;


let indexWordFrame =
    null;


function renderIndexWord(
    state
) {

    indexWordState =
        state;


    indexButton.textContent =
        renderPrefixCase(
            indexWord,
            state
        );

}


/* =====================================================
   INDEX MORPH
   ===================================================== */

function morphIndexTo(
    target
) {

    if (
        indexWordFrame !==
        null
    ) {

        cancelAnimationFrame(
            indexWordFrame
        );

    }


    const startState =
        indexWordState;


    if (
        startState ===
        target
    ) {

        renderIndexWord(
            target
        );

        return Promise.resolve();

    }


    const start =
        performance.now();


    return new Promise(
        resolve => {

            function frame(
                now
            ) {

                const progress =
                    Math.min(
                        1,
                        (
                            now -
                            start
                        ) /
                        INDEX_TRANSITION_DURATION
                    );


                const state =
                    Math.round(
                        startState +
                        (
                            target -
                            startState
                        ) *
                        progress
                    );


                renderIndexWord(
                    state
                );


                if (
                    progress <
                    1
                ) {

                    indexWordFrame =
                        requestAnimationFrame(
                            frame
                        );

                }

                else {

                    renderIndexWord(
                        target
                    );


                    indexWordFrame =
                        null;


                    resolve();

                }

            }


            indexWordFrame =
                requestAnimationFrame(
                    frame
                );

        }
    );

}


/* =====================================================
   INDEX HOVER
   ===================================================== */

indexButton.addEventListener(
    "mouseenter",
    () => {

        if (
            isPhoneLayout()
        ) {

            return;

        }


        morphIndexTo(
            indexMode
                ? 0
                : indexWord.length
        );

    }
);


indexButton.addEventListener(
    "mouseleave",
    () => {

        if (
            isPhoneLayout()
        ) {

            return;

        }


        morphIndexTo(
            indexMode
                ? indexWord.length
                : 0
        );

    }
);


/* =====================================================
   INDEX POSITION
   ===================================================== */

function saveIndexPosition() {

    savedIndexScrollLeft =
        indexScroller.scrollLeft;

}


function restoreIndexPosition() {

    requestAnimationFrame(
        () => {

            indexScroller.scrollLeft =
                savedIndexScrollLeft;

        }
    );

}


/* =====================================================
   ENTER INDEX
   ===================================================== */

async function enterIndex() {

    if (
        indexMode ||
        interfaceAnimating
    ) {

        return;

    }


    interfaceAnimating =
        true;


    autoplayBeforeIndex =
        !video.paused;


    video.pause();


    if (
        projectAllMode
    ) {

        await leaveProjectAll(
            {
                resume: false
            }
        );

    }


    activatePreviewsIn(
        indexGrid
    );


    indexMode =
        true;


    body.classList.add(
        "index-mode"
    );


    indexView.classList.add(
        "visible"
    );


    restoreIndexPosition();


    await morphIndexTo(
        indexWord.length
    );


    interfaceAnimating =
        false;

}


/* =====================================================
   RETURN FROM INDEX
   ===================================================== */

async function returnFromIndex() {

    if (
        !indexMode ||
        interfaceAnimating
    ) {

        return;

    }


    interfaceAnimating =
        true;


    saveIndexPosition();


    await morphIndexTo(
        0
    );


    stopAllPreviews();


    indexView.classList.remove(
        "visible"
    );


    indexMode =
        false;


    body.classList.remove(
        "index-mode"
    );


    if (
        autoplayBeforeIndex
    ) {

        video
            .play()
            .catch(
                () => {}
            );

    }


    interfaceAnimating =
        false;

}


/* =====================================================
   INDEX -> PROJECT
   ===================================================== */

async function exitIndexToProject(
    targetProjectIndex
) {

    if (
        !indexMode ||
        interfaceAnimating
    ) {

        return;

    }


    interfaceAnimating =
        true;


    saveIndexPosition();


    await morphIndexTo(
        0
    );


    stopAllPreviews();


    indexView.classList.remove(
        "visible"
    );


    indexMode =
        false;


    body.classList.remove(
        "index-mode"
    );


    currentProjectIndex =
        targetProjectIndex;


    currentVideoIndex =
        0;


    renderedProjectIndex =
        null;


    await loadCurrentVideo(
        true
    );


    interfaceAnimating =
        false;

}


/* =====================================================
   INDEX BUTTON CLICK
   ===================================================== */

indexButton.addEventListener(
    "click",
    async event => {

        event.stopPropagation();


        if (
            interfaceAnimating ||
            projectViewAnimating
        ) {

            return;

        }


        if (
            projectAllMode
        ) {

            await leaveProjectAll(
                {
                    resume: false
                }
            );


            await enterIndex();

            return;

        }


        if (
            indexMode
        ) {

            await returnFromIndex();

        }

        else {

            await enterIndex();

        }

    }
);


/* =====================================================
   INDEX WHEEL
   ===================================================== */

indexScroller.addEventListener(
    "wheel",
    event => {

        if (
            !indexMode
        ) {

            return;

        }


        event.preventDefault();


        const movement =
            Math.abs(
                event.deltaX
            ) >
            Math.abs(
                event.deltaY
            )
                ? event.deltaX
                : event.deltaY;


        indexScroller.scrollLeft +=
            movement *
            INDEX_WHEEL_MULTIPLIER;

    },
    {
        passive: false
    }
);


/* =====================================================
   INDEX MOUSE DRAG
   ===================================================== */

let indexDragging =
    false;

let indexDragStartX =
    0;

let indexDragStartScroll =
    0;

let indexDragDistance =
    0;


indexScroller.addEventListener(
    "mousedown",
    event => {

        if (
            event.button !==
            0
        ) {

            return;

        }


        indexDragging =
            true;


        indexDragMoved =
            false;


        indexDragDistance =
            0;


        indexDragStartX =
            event.clientX;


        indexDragStartScroll =
            indexScroller.scrollLeft;


        indexScroller.classList.add(
            "dragging"
        );

    }
);


window.addEventListener(
    "mousemove",
    event => {

        if (
            !indexDragging
        ) {

            return;

        }


        const delta =
            event.clientX -
            indexDragStartX;


        indexDragDistance =
            Math.max(
                indexDragDistance,
                Math.abs(
                    delta
                )
            );


        if (
            indexDragDistance >
            6
        ) {

            indexDragMoved =
                true;

        }


        indexScroller.scrollLeft =
            indexDragStartScroll -
            delta;

    }
);


window.addEventListener(
    "mouseup",
    () => {

        if (
            !indexDragging
        ) {

            return;

        }


        indexDragging =
            false;


        indexScroller.classList.remove(
            "dragging"
        );


        if (
            indexDragMoved
        ) {

            setTimeout(
                () => {

                    indexDragMoved =
                        false;

                },
                0
            );

        }

    }
);


/* =====================================================
   INDEX KEYBOARD
   ===================================================== */

indexScroller.addEventListener(
    "keydown",
    event => {

        if (
            event.key ===
            "ArrowRight"
        ) {

            event.preventDefault();


            indexScroller.scrollBy(
                {
                    left:
                        INDEX_KEY_STEP,

                    behavior:
                        "smooth"
                }
            );

        }


        else if (
            event.key ===
            "ArrowLeft"
        ) {

            event.preventDefault();


            indexScroller.scrollBy(
                {
                    left:
                        -INDEX_KEY_STEP,

                    behavior:
                        "smooth"
                }
            );

        }

    }
);


/* =====================================================
   GLOBAL KEYBOARD
   ===================================================== */

document.addEventListener(
    "keydown",
    event => {

        const target =
            event.target;


        const isFormElement =
            target &&
            (
                target.tagName ===
                    "INPUT" ||
                target.tagName ===
                    "TEXTAREA" ||
                target.tagName ===
                    "SELECT"
            );


        if (
            isFormElement
        ) {

            return;

        }


        if (
            event.code ===
            "Escape"
        ) {

            if (
                projectAllMode
            ) {

                event.preventDefault();


                leaveProjectAll(
                    {
                        resume: true
                    }
                );


                return;

            }


            if (
                indexMode
            ) {

                event.preventDefault();


                returnFromIndex();


                return;

            }

        }


        if (
            indexMode ||
            projectAllMode
        ) {

            return;

        }


        if (
            event.code ===
            "Space"
        ) {

            event.preventDefault();

            togglePlayback();

        }


        else if (
            event.code ===
            "ArrowRight"
        ) {

            event.preventDefault();

            nextFilm();

        }


        else if (
            event.code ===
            "ArrowLeft"
        ) {

            event.preventDefault();

            previousFilm();

        }

    }
);


/* =====================================================
   MOBILE SWIPE
   ===================================================== */

video.addEventListener(
    "touchstart",
    event => {

        if (
            event.touches.length !==
            1
        ) {

            return;

        }


        const touch =
            event.touches[0];


        touchStartX =
            touch.clientX;


        touchStartY =
            touch.clientY;


        touchStartTime =
            performance.now();


        touchMoved =
            false;

    },
    {
        passive: true
    }
);


video.addEventListener(
    "touchmove",
    event => {

        if (
            event.touches.length !==
            1
        ) {

            return;

        }


        const touch =
            event.touches[0];


        const dx =
            touch.clientX -
            touchStartX;


        const dy =
            touch.clientY -
            touchStartY;


        if (
            Math.abs(dx) >
            10 ||
            Math.abs(dy) >
            10
        ) {

            touchMoved =
                true;

        }

    },
    {
        passive: true
    }
);


video.addEventListener(
    "touchend",
    event => {

        if (
            !event.changedTouches.length
        ) {

            return;

        }


        const touch =
            event.changedTouches[0];


        const dx =
            touch.clientX -
            touchStartX;


        const dy =
            touch.clientY -
            touchStartY;


        const elapsed =
            performance.now() -
            touchStartTime;


        const horizontalSwipe =
            Math.abs(dx) >=
                50 &&
            Math.abs(dx) >
                Math.abs(dy) *
                1.25 &&
            elapsed <
                700;


        if (
            horizontalSwipe
        ) {

            if (
                dx <
                0
            ) {

                nextFilm();

            }

            else {

                previousFilm();

            }


            setTimeout(
                () => {

                    touchMoved =
                        false;

                },
                150
            );


            return;

        }


        setTimeout(
            () => {

                touchMoved =
                    false;

            },
            150
        );

    },
    {
        passive: true
    }
);


/* =====================================================
   LOAD PROJECTS
   ===================================================== */

async function loadProjects() {

    try {

        const response =
            await fetch(
                FILMS_JSON,
                {
                    cache:
                        "no-store"
                }
            );


        if (
            !response.ok
        ) {

            throw new Error(
                "films.json could not be loaded"
            );

        }


        const data =
            await response.json();


        projects =
            data.filter(
                project =>
                    project &&
                    typeof project.title ===
                        "string" &&
                    Array.isArray(
                        project.videos
                    ) &&
                    project.videos.length >
                        0
            );


        if (
            projects.length ===
            0
        ) {

            return;

        }


        buildIndex();


        currentProjectIndex =
            0;


        currentVideoIndex =
            0;


        updateSoundButton();


        await loadCurrentVideo(
            true
        );

    }

    catch (
        error
    ) {

        console.error(
            error
        );

    }

}


/* =====================================================
   RESIZE
   ===================================================== */

let resizeTimer =
    null;


window.addEventListener(
    "resize",
    () => {

        if (
            resizeTimer !==
            null
        ) {

            clearTimeout(
                resizeTimer
            );

        }


        resizeTimer =
            setTimeout(
                () => {

                    if (
                        projectAllMode
                    ) {

                        layoutProjectAllGrid();

                    }


                    document
                        .querySelectorAll(
                            ".project-card video"
                        )
                        .forEach(
                            preview => {

                                if (
                                    !preview.videoWidth ||
                                    !preview.videoHeight
                                ) {

                                    return;

                                }


                                const targetHeight =
                                    parseFloat(
                                        getComputedStyle(
                                            document.documentElement
                                        ).getPropertyValue(
                                            "--index-video-height"
                                        )
                                    );


                                const targetWidth =
                                    targetHeight *
                                    preview.videoWidth /
                                    preview.videoHeight;


                                const card =
                                    preview.closest(
                                        ".project-card"
                                    );


                                const wrap =
                                    preview.closest(
                                        ".card-video-wrap"
                                    );


                                if (
                                    card
                                ) {

                                    card.style.width =
                                        `${targetWidth}px`;

                                }


                                if (
                                    wrap
                                ) {

                                    wrap.style.width =
                                        `${targetWidth}px`;

                                }

                            }
                        );

                },
                100
            );

    }
);


/* =====================================================
   VISIBILITY

   IMPORTANT:

   The previous version always called video.play()
   when the tab became visible again.

   That meant:

   user pauses video
   -> changes browser tab
   -> comes back
   -> video incorrectly starts playing

   Now we remember whether it was actually playing
   BEFORE the tab became hidden.

   Paused stays paused.
   Playing resumes.
   ===================================================== */

document.addEventListener(
    "visibilitychange",
    () => {

        if (
            document.hidden
        ) {

            /*
                Capture playback state BEFORE pause().
            */

            resumeAfterVisibility =
                !video.paused &&
                !video.ended &&
                !indexMode &&
                !projectAllMode;


            video.pause();


            stopAllPreviews();


            return;

        }


        /*
            Only resume if the film had genuinely been
            playing before the browser tab was hidden.

            A user-paused video therefore remains paused.
        */

        if (
            resumeAfterVisibility &&
            !indexMode &&
            !projectAllMode
        ) {

            video
                .play()
                .catch(
                    () => {}
                );

        }


        resumeAfterVisibility =
            false;

    }
);


/* =====================================================
   INIT
   ===================================================== */

renderIndexWord(
    0
);


loadProjects();

</script>
