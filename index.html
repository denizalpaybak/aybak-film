<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta
    name="viewport"

<title>Denizalp Aybak — Film</title>


<style>

/* =====================================================
   RESET
   ===================================================== */

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;

    width: 100%;
    height: 100%;

    overflow: hidden;

    background: #fff;
    color: #000;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    -webkit-text-size-adjust: 100%;
    text-size-adjust: 100%;
}

button {
    font: inherit;
}


/* =====================================================
   VARIABLES
   ===================================================== */

:root {

    --font-size: 15px;
    --line-height: 1.15;

    --side: 48px;
    --top: 32px;

    --index-bottom: 24px;

    --meta-gap: 6px;
    --meta-top-gap: 10px;

    --index-content-top: 130px;

    /*
        INDEX PRINCIPLE

        This is the common MEDIA AREA height.

        Portrait videos can fill it vertically.

        Landscape videos can become shorter inside it
        and are vertically centered.

        Copy always starts AFTER this common media area,
        so title/date baselines remain identical.
    */

    --index-media-height:
        clamp(
            250px,
            32vh,
            340px
        );

    /*
        Wide landscape films should not dominate
        desktop merely because of their aspect ratio.
    */

    --index-landscape-max-width:
        27vw;

    --index-gap:
        58px;

}


/* =====================================================
   BODY
   ===================================================== */

body {
    cursor: default;
}


/* =====================================================
   INFO
   ===================================================== */

.info {
    position: fixed;

    top: var(--top);
    left: var(--side);

    z-index: 500;

    font-size: var(--font-size);
    line-height: var(--line-height);
}


/* =====================================================
   LOGO
   ===================================================== */

.logo {
    position: relative;

    display: block;

    width: 190px;
    height: 52px;

    color: inherit;
    text-decoration: none;

    cursor: pointer;

    -webkit-tap-highlight-color: transparent;
}

.logo-name {
    position: absolute;

    top: 0;
    left: 0;

    white-space: nowrap;
}

.logo-aybak {
    position: absolute;

    top: 17px;
    left: 0;

    white-space: nowrap;
}


/* =====================================================
   CONTACT
   ===================================================== */

.contact,
.social {
    margin: 0;
    padding: 0;
}

.social {
    display: flex;
    flex-direction: column;
}

.info a {
    color: inherit;
    text-decoration: none;
}

.contact a:hover,
.social a:hover {
    text-decoration: underline;
}


/* =====================================================
   PHOTOGRAPHY
   ===================================================== */

.section-switch {
    position: fixed;

    top: var(--top);
    right: var(--side);

    z-index: 500;

    color: #000;
    text-decoration: none;

    font-size: var(--font-size);
    line-height: var(--line-height);

    -webkit-tap-highlight-color: transparent;
}


/* =====================================================
   VIDEO STAGE
   ===================================================== */

#video-stage {
    position: fixed;

    inset: 0;

    z-index: 10;

    pointer-events: none;
}


/* =====================================================
   VIDEO BLOCK
   ===================================================== */

#video-block {
    position: absolute;

    top: 50%;
    left: 50%;

    transform:
        translate(-50%, -50%);

    display: flex;
    flex-direction: column;

    align-items: stretch;

    max-width:
        calc(
            100vw -
            var(--side) * 2
        );

    pointer-events: none;
}


/* =====================================================
   MAIN VIDEO
   ===================================================== */

#film-video {
    display: block;

    width: 100%;
    height: auto;

    object-fit: contain;

    background: transparent;

    cursor: pointer;

    pointer-events: auto;

    -webkit-tap-highlight-color: transparent;
}


/* =====================================================
   PROJECT META
   ===================================================== */

#project-meta {
    position: relative;

    z-index: 60;

    display: grid;

    grid-template-columns:
        minmax(0, 1fr)
        auto;

    grid-template-rows:
        auto
        auto;

    width: 100%;

    margin-top:
        var(--meta-top-gap);

    font-size:
        var(--font-size);

    line-height:
        var(--line-height);

    pointer-events: none;
}

#project-title {
    grid-column: 1;
    grid-row: 1;

    white-space: nowrap;
}

#project-date {
    grid-column: 1;
    grid-row: 2;

    white-space: nowrap;
}

#project-counter {
    grid-column: 2;
    grid-row: 1;

    justify-self: end;

    padding-left: 28px;

    white-space: nowrap;
}

#view-all-button {
    grid-column: 2;
    grid-row: 2;

    justify-self: end;

    appearance: none;
    -webkit-appearance: none;

    margin: 0;
    padding: 0;

    border: 0;
    outline: 0;

    background: transparent;
    color: inherit;

    line-height: inherit;

    text-align: right;

    white-space: nowrap;

    cursor: pointer;

    pointer-events: auto;

    -webkit-tap-highlight-color: transparent;
}


/* =====================================================
   CONTROLS
   ===================================================== */

#controls {
    display: grid;

    grid-template-columns:
        1fr
        auto
        1fr;

    align-items: center;

    width: 100%;

    margin-top: 10px;

    font-size:
        var(--font-size);

    line-height:
        var(--line-height);

    pointer-events: auto;
}

#controls button {
    appearance: none;
    -webkit-appearance: none;

    margin: 0;
    padding: 0;

    border: 0;
    outline: 0;

    background: transparent;
    color: #000;

    line-height: inherit;

    cursor: pointer;

    white-space: nowrap;

    -webkit-tap-highlight-color: transparent;
}

#previous-button {
    justify-self: start;
}

#sound-button {
    justify-self: center;
}

#next-button {
    justify-self: end;
}


/* =====================================================
   VIEW ALL MODE
   ===================================================== */

body.project-all-mode #film-video {
    visibility: hidden;
}

body.project-all-mode #controls {
    visibility: hidden;
}


/* =====================================================
   VIEW ALL
   ===================================================== */

#project-all-view {
    position: fixed;

    z-index: 30;

    display: none;

    overflow: hidden;

    pointer-events: auto;
}

body.project-all-mode #project-all-view {
    display: block;
}


/* =====================================================
   VIEW ALL GRID
   ===================================================== */

#project-all-grid {
    display: grid;

    width: 100%;
    height: 100%;

    place-content: center;

    align-items: center;
    justify-items: center;

    gap: 7px;
}

.project-all-thumb {
    appearance: none;
    -webkit-appearance: none;

    display: flex;

    align-items: center;
    justify-content: center;

    width: 100%;
    height: 100%;

    min-width: 0;
    min-height: 0;

    margin: 0;
    padding: 0;

    border: 0;

    background: transparent;

    cursor: pointer;

    overflow: hidden;

    -webkit-tap-highlight-color: transparent;
}

.project-all-thumb video {
    display: block;

    max-width: 100%;
    max-height: 100%;

    width: auto;
    height: auto;

    object-fit: contain;

    pointer-events: none;
}


/* =====================================================
   INDEX BUTTON
   ===================================================== */

#index-button {
    position: fixed;

    left: 50%;

    bottom:
        calc(
            var(--index-bottom) +
            env(safe-area-inset-bottom)
        );

    z-index: 600;

    transform:
        translateX(-50%);

    appearance: none;
    -webkit-appearance: none;

    margin: 0;
    padding: 0;

    border: 0;
    outline: 0;

    background: transparent;
    color: #000;

    font-size:
        var(--font-size);

    line-height:
        var(--line-height);

    white-space: nowrap;

    cursor: pointer;

    -webkit-tap-highlight-color: transparent;
}


/* =====================================================
   INDEX VIEW
   ===================================================== */

#index-view {
    position: fixed;

    inset: 0;

    z-index: 100;

    display: none;

    background: #fff;
}

#index-view.visible {
    display: block;
}

body.index-mode #video-stage {
    visibility: hidden;
}


/* =====================================================
   INDEX SCROLLER
   ===================================================== */

#index-scroller {
    position: absolute;

    top:
        var(--index-content-top);

    left: 0;
    right: 0;

    bottom:
        calc(
            var(--index-bottom) +
            env(safe-area-inset-bottom) +
            34px
        );

    display: flex;

    align-items: center;

    overflow-x: auto;
    overflow-y: hidden;

    scrollbar-width: none;

    -webkit-overflow-scrolling: touch;

    user-select: none;

    cursor: grab;

    outline: none;

    pointer-events: auto;
}

#index-scroller::-webkit-scrollbar {
    display: none;
}

#index-scroller.dragging {
    cursor: grabbing;
}


/* =====================================================
   INDEX RAIL
   ===================================================== */

#index-grid {
    display: flex;

    flex-direction: row;
    flex-wrap: nowrap;

    /*
        Cards themselves have equal media-area height,
        so top alignment is correct here.
    */

    align-items: flex-start;

    gap:
        var(--index-gap);

    width: max-content;

    padding-left:
        var(--side);

    padding-right:
        var(--side);
}


/* =====================================================
   INDEX CARD
   ===================================================== */

.project-card {
    appearance: none;
    -webkit-appearance: none;

    flex: 0 0 auto;

    display: flex;
    flex-direction: column;

    align-items: flex-start;

    width: auto;

    margin: 0;
    padding: 0;

    border: 0;

    background: transparent;
    color: #000;

    text-align: left;

    cursor: pointer;

    position: relative;

    z-index: 1;

    -webkit-tap-highlight-color: transparent;
}


/* =====================================================
   INDEX MEDIA AREA
   ===================================================== */

/*
    This is the important part.

    Every project has the SAME media-area height.

    Portrait video:
        can fill this vertically.

    Landscape video:
        often shorter and sits in the vertical middle.

    The copy begins below the media area, not directly
    below the video.

    Therefore all title/date copy remains aligned.
*/

.card-video-wrap {
    display: flex;

    align-items: center;
    justify-content: flex-start;

    width: auto;

    height:
        var(--index-media-height);

    flex:
        0 0
        var(--index-media-height);

    pointer-events: none;
}

.project-card video {
    display: block;

    width: auto;
    height: auto;

    max-width: 100%;
    max-height: 100%;

    object-fit: contain;

    pointer-events: none;
}


/* =====================================================
   INDEX COPY
   ===================================================== */

.card-copy {
    display: flex;
    flex-direction: column;

    align-items: flex-start;

    width: 100%;

    margin-top:
        var(--meta-gap);

    font-size:
        var(--font-size);

    line-height:
        var(--line-height);

    text-align: left;

    pointer-events: none;
}

.card-title,
.card-date {
    display: block;

    margin: 0;
    padding: 0;

    max-width: 100%;

    white-space: nowrap;

    text-align: left;

    overflow: hidden;
}


/* =====================================================
   TABLET
   ===================================================== */

@media
    (min-width: 601px)
    and (max-width: 1366px) {

    :root {

        --index-media-height:
            clamp(
                225px,
                31vh,
                310px
            );

        --index-landscape-max-width:
            29vw;

        --index-gap:
            48px;

    }

}


/* =====================================================
   PHONE
   ===================================================== */

@media
    (max-width: 600px) {

    :root {

        --font-size: 13px;

        --side: 24px;
        --top: 20px;

        --index-bottom: 18px;

        --meta-gap: 5px;

        /*
            This is intentionally kept close to the
            mobile version you liked.

            Two substantial works can coexist.
        */

        --index-media-height:
            218px;

        --index-landscape-max-width:
            47vw;

        --index-gap:
            54px;

    }


    .logo {
        width: 160px;
        height: 45px;
    }


    .logo-aybak {
        top: 15px;
    }

}


/* =====================================================
   PHONE PORTRAIT
   ===================================================== */

@media
    (max-width: 600px)
    and (orientation: portrait) {

    /*
        JS controls the actual Y position of slide mode.

        We only remove vertical translate here because JS
        writes an exact safe top coordinate.
    */

    #video-block {
        transform:
            translateX(-50%);
    }


    #controls {
        margin-top: 9px;
    }


    #project-all-grid {
        gap: 5px;
    }


    #index-scroller {
        top: 190px;

        bottom:
            calc(
                var(--index-bottom) +
                env(safe-area-inset-bottom) +
                54px
            );

        align-items: center;
    }


    #index-grid {
        padding-left: 24px;
        padding-right: 24px;

        gap: 54px;
    }

}


/* =====================================================
   PHONE LANDSCAPE
   ===================================================== */

@media
    (max-height: 650px)
    and (orientation: landscape)
    and (max-width: 1000px) {

    :root {

        --font-size: 13px;

        --side: 24px;
        --top: 18px;

        --index-bottom: 14px;

        --index-media-height:
            48vh;

        --index-landscape-max-width:
            36vw;

        --index-gap:
            32px;

    }


    .logo {
        width: 160px;
        height: 45px;
    }


    .logo-aybak {
        top: 15px;
    }


    #video-block {
        top: 53%;
    }


    #project-meta,
    #controls {
        font-size: 13px;
    }


    #project-all-grid {
        gap: 4px;
    }


    #index-scroller {
        top: 92px;
    }

}


/* =====================================================
   REDUCED MOTION
   ===================================================== */

@media
    (prefers-reduced-motion: reduce) {

    * {
        scroll-behavior:
            auto !important;
    }

}

</style>

function wait(

) {

    return new Promise(
        resolve =>

                milliseconds
            )
    );

}


function hasHover() {

    return window
        .matchMedia(
            "(hover: hover) and (pointer: fine)"
        )
        .matches;

}


function isPhonePortrait() {

    return (
        window.innerWidth <= 600 &&
        window.innerHeight >=
        window.innerWidth
    );

}


function isPhoneLandscape() {

    return (
        window.innerHeight <= 650 &&
        window.innerWidth >
        window.innerHeight &&
        window.innerWidth <= 1000
    );

}


function isPhoneLayout() {

    return (
        isPhonePortrait() ||
        isPhoneLandscape()
    );

}

    filename
) {

        filename

    );

/* =====================================================
   LETTER HELPERS
   ===================================================== */

function getLetterPositions(
    text
) {

    const positions =
        [];


    for (
        let i = 0;
        i < text.length;
        i++
    ) {

        const character =
            text[i];


        if (
            character.toLowerCase() !==
            character.toUpperCase()
        ) {

            positions.push(
                i
            );

        }

    }


    return positions;

}


function renderPrefixCase(
    baseText,
    upperCount
) {

    const positions =
        getLetterPositions(
            baseText
        );


    const uppercasePositions =
        new Set(
            positions.slice(
                0,
                upperCount
            )
        );


    return baseText
        .split("")
        .map(
            (
                character,
                index
            ) => {

                return uppercasePositions
                    .has(
                        index
                    )
                        ? character
                            .toUpperCase()
                        : character
                            .toLowerCase();

            }
        )
        .join("");

}


function currentUpperPrefixCount(
    element,
    baseText
) {

    const positions =
        getLetterPositions(
            baseText
        );


    const current =
        element.textContent;


    let count =
        0;


    for (
        const position
        of positions
    ) {

        const character =
            current[
                position
            ];


        if (
            character &&
            character ===
                character.toUpperCase() &&
            character !==
                character.toLowerCase()
        ) {

            count++;

        }

        else {

            break;

        }

    }


    return count;

}


/* =====================================================
   CASE ANIMATION
   ===================================================== */

function animateCase(
    element,
    baseText,
    toUpper,
    duration =
        CASE_DURATION
) {

    const base =
        baseText
            .toLowerCase();


    const total =
        getLetterPositions(
            base
        ).length;


    const initial =
        currentUpperPrefixCount(
            element,
            base
        );


    const target =
        toUpper
            ? total
            : 0;


    if (
        initial ===
        target
    ) {

        element.textContent =
            renderPrefixCase(
                base,
                target
            );


        return Promise.resolve();

    }


    const start =
        performance.now();


    return new Promise(
        resolve => {

            function frame(
                now
            ) {

                const progress =
                    Math.min(
                        1,
                        (
                            now -
                            start
                        ) /
                        duration
                    );


                const state =
                    Math.round(
                        initial +
                        (
                            target -
                            initial
                        ) *
                        progress
                    );


                element.textContent =
                    renderPrefixCase(
                        base,
                        state
                    );


                if (
                    progress <
                    1
                ) {

                    requestAnimationFrame(
                        frame
                    );

                }

                else {

                    element.textContent =
                        renderPrefixCase(
                            base,
                            target
                        );


                    resolve();

                }

            }


            requestAnimationFrame(
                frame
            );

        }
    );

}


/* =====================================================
   SEQUENTIAL MORPH
   ===================================================== */

function morphSequential(
    element,
    nextText,
    duration =
        TEXT_MORPH_DURATION
) {

    const oldText =
        element.dataset.rawText !==
        undefined
            ? element.dataset.rawText
            : element.textContent;


    if (
        oldText ===
        nextText
    ) {

        element.textContent =
            nextText;


        element.dataset.rawText =
            nextText;


        return Promise.resolve();

    }


    const length =
        Math.max(
            oldText.length,
            nextText.length
        );


    const from =
        oldText
            .padEnd(
                length,
                " "
            )
            .split("");


    const to =
        nextText
            .padEnd(
                length,
                " "
            )
            .split("");


    const changed =
        [];


    for (
        let i = 0;
        i < length;
        i++
    ) {

        if (
            from[i] !==
            to[i]
        ) {

            changed.push(
                i
            );

        }

    }


    const start =
        performance.now();


    return new Promise(
        resolve => {

            function frame(
                now
            ) {

                const progress =
                    Math.min(
                        1,
                        (
                            now -
                            start
                        ) /
                        duration
                    );


                const completed =
                    Math.floor(
                        progress *
                        (
                            changed.length +
                            1
                        )
                    );


                const current =
                    from.slice();


                for (
                    let i = 0;
                    i < completed;
                    i++
                ) {

                    const position =
                        changed[
                            i
                        ];


                    if (
                        position !==
                        undefined
                    ) {

                        current[
                            position
                        ] =
                            to[
                                position
                            ];

                    }

                }


                element.textContent =
                    current
                        .join("")
                        .trimEnd();


                if (
                    progress <
                    1
                ) {

                    requestAnimationFrame(
                        frame
                    );

                }

                else {

                    element.textContent =
                        nextText;


                    element.dataset.rawText =
                        nextText;


                    resolve();

                }

            }


            requestAnimationFrame(
                frame
            );

        }
    );

}

function animateLogoTo(
    target
) {

    return new Promise(
        resolve => {

            logoTarget =
                target;


            if (
                logoTimer !==
                null
            ) {

                clearTimeout(
                    logoTimer
                );

            }


            function step() {

                if (
                    logoState ===
                    logoTarget
                ) {

                    logoTimer =
                        null;


                    resolve();


                    return;

                }


                setLogoState(
                    logoState <
                    logoTarget
                        ? logoState + 1
                        : logoState - 1
                );


                logoTimer =
                    setTimeout(
                        step,
                        LOGO_STEP_DURATION
                    );

            }


            step();

        }
    );

}

/* =====================================================
   MOBILE SLIDE SAFE AREA
   ===================================================== */

/*
    For portrait phones we use ACTUAL UI geometry.

    TOP LIMIT:
        contact block bottom

    BOTTOM LIMIT:
        INDEX button top

    Between those two boundaries, the video +
    metadata + controls can use almost everything.

    This means portrait video becomes much larger,
    but previous / sound / next can never collide
    with INDEX.
*/

function getPhonePortraitSlideBounds() {

    const infoRect =
        info.getBoundingClientRect();


    const indexRect =
        indexButton.getBoundingClientRect();


    const top =
        infoRect.bottom +
        20;


    const bottom =
        indexRect.top -
        18;


    return {
        top,
        bottom,

        height:
            Math.max(
                0,
                bottom -
                top
            )
    };

}


/* =====================================================
   POSITION PHONE SLIDE
   ===================================================== */

function positionPhonePortraitBlock() {

    if (
        !isPhonePortrait()
    ) {

        return;

    }


    const bounds =
        getPhonePortraitSlideBounds();


    requestAnimationFrame(
        () => {

            const blockHeight =
                videoBlock
                    .getBoundingClientRect()
                    .height;


            const freeSpace =
                Math.max(
                    0,
                    bounds.height -
                    blockHeight
                );


            /*
                Essentially centered in the safe area,
                very slightly higher than mathematical
                centre for a cleaner editorial balance.
            */

            const top =
                bounds.top +
                freeSpace *
                0.46;


            videoBlock.style.top =
                `${Math.round(
                    top
                )}px`;


            videoBlock.style.transform =
                "translateX(-50%)";

        }
    );

}


/* =====================================================
   FIT MAIN VIDEO
   ===================================================== */

function fitMainVideo() {

    if (
        !video.videoWidth ||
        !video.videoHeight
    ) {

        return;

    }


    const ratio =
        video.videoWidth /
        video.videoHeight;


    const viewportWidth =
        window.innerWidth;


    const viewportHeight =
        window.innerHeight;


    const side =
        parseFloat(
            getComputedStyle(
                document.documentElement
            ).getPropertyValue(
                "--side"
            )
        ) || 48;


    let maxWidth;
    let maxHeight;


    /* =================================================
       PHONE PORTRAIT
       ================================================= */

    if (
        isPhonePortrait()
    ) {

        const bounds =
            getPhonePortraitSlideBounds();


        maxWidth =
            viewportWidth -
            side * 2;


        /*
            Interface below video:

            metadata
            meta gap
            controls
            controls gap

            This is measured rather than guessed.
        */

        const interfaceHeight =
            projectMeta.offsetHeight +
            controls.offsetHeight +
            28;


        maxHeight =
            Math.max(
                120,
                bounds.height -
                interfaceHeight
            );


        /*
            Allow portrait clips to use almost the entire
            available vertical safe area.

            This is deliberately more generous than the
            previous 54–61vh rules.
        */

        if (
            ratio <
            1
        ) {

            maxHeight =
                Math.min(
                    maxHeight,
                    viewportHeight *
                    0.66
                );

        }

    }


    /* =================================================
       PHONE LANDSCAPE
       ================================================= */

    else if (
        isPhoneLandscape()
    ) {

        maxWidth =
            viewportWidth *
            0.62;


        maxHeight =
            viewportHeight *
            0.64;

    }


    /* =================================================
       DESKTOP
       ================================================= */

    else {

        maxWidth =
            Math.min(
                viewportWidth *
                0.76,

                viewportWidth -
                side * 2
            );


        maxHeight =
            viewportHeight *
            0.72;

    }


    let width =
        maxWidth;


    let height =
        width /
        ratio;


    if (
        height >
        maxHeight
    ) {

        height =
            maxHeight;


        width =
            height *
            ratio;

    }


    videoBlock.style.width =
        `${Math.max(
            1,
            width
        )}px`;


    video.style.width =
        "100%";


    video.style.height =
        "auto";


    if (
        isPhonePortrait()
    ) {

        positionPhonePortraitBlock();

    }

    else {

        videoBlock.style.top =
            isPhoneLandscape()
                ? "53%"
                : "50%";


        videoBlock.style.transform =
            "translate(-50%, -50%)";

    }

}


/* =====================================================
   LOAD CURRENT VIDEO
   ===================================================== */

async function loadCurrentVideo(
    autoplay =
        true
) {

    const filename =
        currentFilename();


    if (
        !filename
    ) {

        return;

    }


    video.pause();


    video.src =
        videoUrl(
            filename
        );


    video.load();


    video.muted =
        !soundEnabled;


    await updateMetadata(
        currentProjectIndex,
        currentVideoIndex
    );


    const fit =
        () => {

            fitMainVideo();

        };


    if (
        video.readyState >=
        1
    ) {

        fit();

    }

    else {

        video.addEventListener(
            "loadedmetadata",
            fit,
            {
                once: true
            }
        );

    }


    if (
        autoplay
    ) {

        const play =
            () => {

                video
                    .play()
                    .catch(
                        () => {}
                    );

            };


        if (
            video.readyState >=
            2
        ) {

            play();

        }

        else {

            video.addEventListener(
                "canplay",
                play,
                {
                    once: true
                }
            );

        }

    }

}

            );

    }


    loadCurrentVideo(

    );

   PREVIOUS
   ===================================================== */

function previousFilm() {

    if (
        projectAllMode ||
        indexMode ||
        !projects.length
    ) {

    if (

            );

    );

function createPreviewVideo(
    filename,
    {
        eagerMetadata =
            false
    } = {}
) {

    const preview =
        document.createElement(
            "video"
        );


    preview.dataset.src =
        videoUrl(
            filename
        );


    preview.muted =
        true;


    preview.defaultMuted =
        true;


    preview.playsInline =
        true;


    preview.preload =
        eagerMetadata
            ? "metadata"
            : "none";


    preview.disablePictureInPicture =
        true;


    preview.setAttribute(
        "aria-hidden",
        "true"
    );


    preview.addEventListener(
        "timeupdate",
        () => {

            if (
                preview.currentTime >=
                PREVIEW_DURATION
            ) {

                preview.currentTime =
                    0;


                preview
                    .play()
                    .catch(
                        () => {}
                    );

            }

        }
    );


    if (
        eagerMetadata
    ) {

        preview.src =
            preview.dataset.src;


        preview.load();

    }


    return preview;

}

/* =====================================================
   PREVIEW OBSERVER
   ===================================================== */

const previewObserver =
    new IntersectionObserver(
        entries => {

            entries.forEach(
                entry => {

                    const preview =
                        entry.target;


                    const allowed =
                        (
                            indexMode &&
                            indexView.contains(
                                preview
                            )
                        ) ||
                        (
                            projectAllMode &&
                            projectAllView.contains(
                                preview
                            )
                        );


                    if (
                        entry.isIntersecting &&
                        allowed
                    ) {

                        activatePreview(
                            preview
                        );

                    }

                    else {

                        preview.pause();

                    }

                }
            );

        },
        {
            rootMargin:
                "220px"
        }
    );


function observePreview(
    preview
) {

    previewObserver.observe(
        preview
    );

}


/* =====================================================
   VIEW ALL BOUNDS
   ===================================================== */

function syncProjectAllBounds() {

    if (
        !projectAllMode
    ) {

        return;

    }


    const infoRect =
        info
            .getBoundingClientRect();


    const metaRect =
        projectMeta
            .getBoundingClientRect();


    const side =
        parseFloat(
            getComputedStyle(
                document.documentElement
            ).getPropertyValue(
                "--side"
            )
        ) || 48;


    const topGap =
        isPhoneLandscape()
            ? 4
            : (
                isPhonePortrait()
                    ? 10
                    : 14
            );


    const bottomGap =
        isPhoneLandscape()
            ? 6
            : (
                isPhonePortrait()
                    ? 10
                    : 14
            );


    const top =
        Math.ceil(
            infoRect.bottom +
            topGap
        );


    const bottom =
        Math.floor(
            metaRect.top -
            bottomGap
        );


    projectAllView.style.left =
        `${side}px`;


    projectAllView.style.right =
        `${side}px`;


    projectAllView.style.top =
        `${top}px`;


    projectAllView.style.height =
        `${Math.max(
            80,
            bottom -
            top
        )}px`;

}


/* =====================================================
   VIEW ALL LAYOUT
   ===================================================== */

function calculateProjectAllLayout(
    count
) {

    const rect =
        projectAllView
            .getBoundingClientRect();


    const gap =
        isPhoneLandscape()
            ? 4
            : (
                isPhonePortrait()
                    ? 5
                    : 7
            );


    let best =
        {
            columns: 1,
            rows: count,
            score: 0
        };


    for (
        let columns = 1;
        columns <= count;
        columns++
    ) {

        const rows =
            Math.ceil(
                count /
                columns
            );


        const usableWidth =
            rect.width -
            gap *
            (
                columns -
                1
            );


        const usableHeight =
            rect.height -
            gap *
            (
                rows -
                1
            );


        if (
            usableWidth <= 0 ||
            usableHeight <= 0
        ) {

            continue;

        }


        const cellWidth =
            usableWidth /
            columns;


        const cellHeight =
            usableHeight /
            rows;


        const visibleWidth =
            Math.min(
                cellWidth,
                cellHeight *
                16 / 9
            );


        const visibleHeight =
            Math.min(
                cellHeight,
                cellWidth *
                9 / 16
            );


        const score =
            visibleWidth *
            visibleHeight;


        if (
            score >
            best.score
        ) {

            best =
                {
                    columns,
                    rows,
                    score
                };

        }

    }


    return best;

}

/* =====================================================
   INDEX ORDER
   ===================================================== */

function getChronologicalProjects() {

    return projects
        .map(
            (
                project,
                originalIndex
            ) => ({
                project,
                originalIndex
            })
        )
        .sort(
            (
                a,
                b
            ) => {

                const orderA =
                    Number.isFinite(
                        a.project.indexOrder
                    )
                        ? a.project.indexOrder
                        : 999;


                const orderB =
                    Number.isFinite(
                        b.project.indexOrder
                    )
                        ? b.project.indexOrder
                        : 999;


                return (
                    orderA -
                    orderB
                ) ||
                (
                    a.originalIndex -
                    b.originalIndex
                );

            }
        );

}


/* =====================================================
   CSS SIZE VALUE HELPER
   ===================================================== */

function cssLengthToPixels(
    value
) {

    const clean =
        value.trim();


    if (
        clean.endsWith(
            "vw"
        )
    ) {

        return (
            window.innerWidth *
            parseFloat(
                clean
            ) /
            100
        );

    }


    if (
        clean.endsWith(
            "vh"
        )
    ) {

        return (
            window.innerHeight *
            parseFloat(
                clean
            ) /
            100
        );

    }


    return (
        parseFloat(
            clean
        ) ||
        Infinity
    );

}


/* =====================================================
   INDEX METRICS
   ===================================================== */

/*
    THIS RESTORES THE MOBILE LOGIC YOU LIKED.

    Common media area:
        mediaHeight

    Portrait:
        tends to use full height.

    Landscape:
        limited by maximum width.
        Therefore its visible HEIGHT becomes shorter.

    It then sits vertically centered in the common
    media area.

    COPY STILL STARTS AFTER mediaHeight.

    Exactly the same system now applies on desktop.
*/

function getIndexMetrics(
    ratio
) {

    const styles =
        getComputedStyle(
            document.documentElement
        );


    const mediaHeight =
        cssLengthToPixels(
            styles.getPropertyValue(
                "--index-media-height"
            )
        );


    const landscapeMaxWidth =
        cssLengthToPixels(
            styles.getPropertyValue(
                "--index-landscape-max-width"
            )
        );


    /*
        Default:
        video uses common media height.
    */

    let displayHeight =
        mediaHeight;


    let displayWidth =
        mediaHeight *
        ratio;


    /*
        Landscape / very wide media:

        constrain width.

        This naturally reduces visible height, which
        produces the centred landscape look seen in the
        mobile reference.
    */

    if (
        displayWidth >
        landscapeMaxWidth
    ) {

        displayWidth =
            landscapeMaxWidth;


        displayHeight =
            displayWidth /
            ratio;

    }


    /*
        Card width should correspond to the visible film,
        not the larger invisible media area.
    */

    return {

        mediaHeight,

        displayWidth,

        displayHeight

    };

}


/* =====================================================
   SYNC INDEX CARD
   ===================================================== */

function syncIndexCardSize(
    preview,
    button,
    wrap
) {

    if (
        !preview.videoWidth ||
        !preview.videoHeight
    ) {

        return;

    }


    const ratio =
        preview.videoWidth /
        preview.videoHeight;


    const metrics =
        getIndexMetrics(
            ratio
        );


    button.style.width =
        `${metrics.displayWidth}px`;


    button.style.flexBasis =
        `${metrics.displayWidth}px`;


    button.style.minWidth =
        `${metrics.displayWidth}px`;


    wrap.style.width =
        `${metrics.displayWidth}px`;


    wrap.style.height =
        `${metrics.mediaHeight}px`;


    preview.style.width =
        `${metrics.displayWidth}px`;


    preview.style.height =
        `${metrics.displayHeight}px`;


    preview.style.maxWidth =
        "none";


    preview.style.maxHeight =
        "none";


    preview.style.objectFit =
        "contain";

}


/* =====================================================
   INDEX CASE CONTROLLER
   ===================================================== */

function createCaseController(
    element,
    baseText
) {

    return {

        upper() {

            animateCase(
                element,
                baseText,
                true
            );

        },


        lower() {

            animateCase(
                element,
                baseText,
                false
            );

        }

    };

}


/* =====================================================
   BUILD INDEX
   ===================================================== */

function buildIndex() {

    indexGrid.innerHTML =
        "";


    getChronologicalProjects()
        .forEach(
            ({
                project,
                originalIndex
            }) => {

                const button =
                    document.createElement(
                        "button"
                    );


                button.type =
                    "button";


                button.className =
                    "project-card";


                /*
                    Space reservation prevents mobile
                    Safari from stacking zero-width cards
                    while metadata arrives.
                */

                const fallbackWidth =
                    isPhonePortrait()
                        ? Math.round(
                            window.innerWidth *
                            0.40
                        )
                        : (
                            isPhoneLandscape()
                                ? Math.round(
                                    window.innerWidth *
                                    0.30
                                )
                                : Math.round(
                                    window.innerWidth *
                                    0.18
                                )
                        );


                button.style.width =
                    `${fallbackWidth}px`;


                button.style.flexBasis =
                    `${fallbackWidth}px`;


                button.style.minWidth =
                    `${fallbackWidth}px`;


                const wrap =
                    document.createElement(
                        "span"
                    );


                wrap.className =
                    "card-video-wrap";


                wrap.style.width =
                    `${fallbackWidth}px`;


                const preview =
                    createPreviewVideo(
                        project.videos[0],
                        {
                            eagerMetadata:
                                true
                        }
                    );


                wrap.appendChild(
                    preview
                );


                preview.addEventListener(
                    "loadedmetadata",
                    () => {

                        syncIndexCardSize(
                            preview,
                            button,
                            wrap
                        );

                    }
                );


                if (
                    preview.readyState >=
                    1
                ) {

                    syncIndexCardSize(
                        preview,
                        button,
                        wrap
                    );

                }


                const copy =
                    document.createElement(
                        "span"
                    );


                copy.className =
                    "card-copy";


                const title =
                    document.createElement(
                        "span"
                    );


                title.className =
                    "card-title";


                title.textContent =
                    project.title
                        .toLowerCase();


                const date =
                    document.createElement(
                        "span"
                    );


                date.className =
                    "card-date";


                date.textContent =
                    (
                        project.date ||
                        ""
                    ).toLowerCase();


                copy.append(
                    title,
                    date
                );


                button.append(
                    wrap,
                    copy
                );


                const titleCase =
                    createCaseController(
                        title,
                        project.title
                    );


                const dateCase =
                    createCaseController(
                        date,
                        project.date ||
                        ""
                    );


                button.addEventListener(
                    "mouseenter",
                    () => {

                        if (
                            !hasHover()
                        ) {

                            return;

                        }


                        titleCase.upper();


                        dateCase.upper();

                    }
                );


                button.addEventListener(
                    "mouseleave",
                    () => {

                        if (
                            !hasHover()
                        ) {

                            return;

                        }


                        titleCase.lower();


                        dateCase.lower();

                    }
                );


                button.addEventListener(
                    "click",
                    async event => {

                        if (
                            indexDragMoved
                        ) {

                            event.preventDefault();


                            event.stopPropagation();


                            return;

                        }


                        event.preventDefault();


                        event.stopPropagation();


                        await exitIndexToProject(
                            originalIndex
                        );

                    }
                );


                indexGrid.appendChild(
                    button
                );


                observePreview(
                    preview
                );

            }
        );

}


/* =====================================================
   INDEX WORD
   ===================================================== */

function renderIndexWord(
    state
) {

    indexWordState =
        state;


    indexButton.textContent =
        renderPrefixCase(
            indexWord,
            state
        );

}


/* =====================================================
   INDEX MORPH
   ===================================================== */

function morphIndexTo(
    target
) {

    if (
        indexWordFrame !==
        null
    ) {

        cancelAnimationFrame(
            indexWordFrame
        );

    }


    const initial =
        indexWordState;


    if (
        initial ===
        target
    ) {

        renderIndexWord(
            target
        );


        return Promise.resolve();

    }


    const start =
        performance.now();


    return new Promise(
        resolve => {

            function frame(
                now
            ) {

                const progress =
                    Math.min(
                        1,
                        (
                            now -
                            start
                        ) /
                        INDEX_TRANSITION_DURATION
                    );


                const state =
                    Math.round(
                        initial +
                        (
                            target -
                            initial
                        ) *
                        progress
                    );


                renderIndexWord(
                    state
                );


                if (
                    progress <
                    1
                ) {

                    indexWordFrame =
                        requestAnimationFrame(
                            frame
                        );

                }

                else {

                    renderIndexWord(
                        target
                    );


                    indexWordFrame =
                        null;


                    resolve();

                }

            }


            indexWordFrame =
                requestAnimationFrame(
                    frame
                );

        }
    );

}

/* =====================================================
   INDEX WHEEL
   ===================================================== */

indexScroller.addEventListener(
    "wheel",
    event => {

        if (
            !indexMode
        ) {

            return;

        }


        event.preventDefault();


        const movement =
            Math.abs(
                event.deltaX
            ) >
            Math.abs(
                event.deltaY
            )
                ? event.deltaX
                : event.deltaY;


        indexScroller.scrollLeft +=
            movement *
            INDEX_WHEEL_MULTIPLIER;

    },
    {
        passive:
            false
    }
);


/* =====================================================
   INDEX DRAG
   ===================================================== */

let indexDragging =
    false;


let indexDragStartX =
    0;


let indexDragStartScroll =
    0;


let indexDragDistance =
    0;


indexScroller.addEventListener(
    "mousedown",
    event => {

        if (
            event.button !==
            0
        ) {

            return;

        }


        indexDragging =
            true;


        indexDragMoved =
            false;


        indexDragDistance =
            0;


        indexDragStartX =
            event.clientX;


        indexDragStartScroll =
            indexScroller.scrollLeft;


        indexScroller.classList.add(
            "dragging"
        );

    }
);


window.addEventListener(
    "mousemove",
    event => {

        if (
            !indexDragging
        ) {

            return;

        }


        const delta =
            event.clientX -
            indexDragStartX;


        indexDragDistance =
            Math.max(
                indexDragDistance,
                Math.abs(
                    delta
                )
            );


        if (
            indexDragDistance >
            6
        ) {

            indexDragMoved =
                true;

        }


        indexScroller.scrollLeft =
            indexDragStartScroll -
            delta;

    }
);


window.addEventListener(
    "mouseup",
    () => {

        if (
            !indexDragging
        ) {

            return;

        }


        indexDragging =
            false;


        indexScroller.classList.remove(
            "dragging"
        );


        if (
            indexDragMoved
        ) {

            setTimeout(
                () => {

                    indexDragMoved =
                        false;

                },
                0
            );

        }

    }
);


/* =====================================================
   INDEX KEYBOARD
   ===================================================== */

indexScroller.addEventListener(
    "keydown",
    event => {

        if (
            event.key ===
            "ArrowRight"
        ) {

            event.preventDefault();


            indexScroller.scrollBy(
                {
                    left:
                        INDEX_KEY_STEP,

                    behavior:
                        "smooth"
                }
            );

        }


        else if (
            event.key ===
            "ArrowLeft"
        ) {

            event.preventDefault();


            indexScroller.scrollBy(
                {
                    left:
                        -INDEX_KEY_STEP,

                    behavior:
                        "smooth"
                }
            );

        }

    }
);


/* =====================================================
   GLOBAL KEYBOARD
   ===================================================== */

document.addEventListener(
    "keydown",
    event => {

        const target =
            event.target;


        if (
            target &&
            [
                "INPUT",
                "TEXTAREA",
                "SELECT"
            ].includes(
                target.tagName
            )
        ) {

            return;

        }


        if (
            event.code ===
            "Escape"
        ) {

            if (
                projectAllMode
            ) {

                event.preventDefault();


                leaveProjectAll(
                    {
                        resume:
                            true
                    }
                );


                return;

            }


            if (
                indexMode
            ) {

                event.preventDefault();


                returnFromIndex();


                return;

            }

        }


        if (
            indexMode ||
            projectAllMode
        ) {

            return;

        }


        if (
            event.code ===
            "Space"
        ) {

            event.preventDefault();


            togglePlayback();

        }


        else if (
            event.code ===
            "ArrowRight"
        ) {

            event.preventDefault();


            nextFilm();

        }


        else if (
            event.code ===
            "ArrowLeft"
        ) {

            event.preventDefault();


            previousFilm();

        }

    }
);


/* =====================================================
   MOBILE SWIPE
   ===================================================== */

video.addEventListener(
    "touchstart",
    event => {

        if (
            event.touches.length !==
            1
        ) {

            return;

        }


        const touch =
            event.touches[
                0
            ];


        touchStartX =
            touch.clientX;


        touchStartY =
            touch.clientY;


        touchStartTime =
            performance.now();


        touchMoved =
            false;

    },
    {
        passive:
            true
    }
);


video.addEventListener(
    "touchmove",
    event => {

        if (
            event.touches.length !==
            1
        ) {

            return;

        }


        const touch =
            event.touches[
                0
            ];


        if (
            Math.abs(
                touch.clientX -
                touchStartX
            ) >
            10 ||
            Math.abs(
                touch.clientY -
                touchStartY
            ) >
            10
        ) {

            touchMoved =
                true;

        }

    },
    {
        passive:
            true
    }
);


video.addEventListener(
    "touchend",
    event => {

        if (
            !event.changedTouches.length
        ) {

            return;

        }


        const touch =
            event.changedTouches[
                0
            ];


        const deltaX =
            touch.clientX -
            touchStartX;


        const deltaY =
            touch.clientY -
            touchStartY;


        const elapsed =
            performance.now() -
            touchStartTime;


        const swipe =
            Math.abs(
                deltaX
            ) >=
            50 &&
            Math.abs(
                deltaX
            ) >
            Math.abs(
                deltaY
            ) *
            1.25 &&
            elapsed <
            700;


        if (
            swipe
        ) {

            if (
                deltaX <
                0
            ) {

                nextFilm();

            }

            else {

                previousFilm();

            }


            setTimeout(
                () => {

                    touchMoved =
                        false;

                },
                150
            );


            return;

        }


        setTimeout(
            () => {

                touchMoved =
                    false;

            },
            150
        );

    },
    {
        passive:
            true
    }
);


/* =====================================================
   INDEX PREWARM
   ===================================================== */

async function warmIndexPreviews() {

    const previews =
        [
            ...indexGrid
                .querySelectorAll(
                    "video[data-src]"
                )
        ];


    for (
        let i = 0;
        i < previews.length;
        i++
    ) {

        const preview =
            previews[i];


        if (
            !preview.getAttribute(
                "src"
            )
        ) {

            preview.src =
                preview.dataset.src;


            preview.preload =
                i <
                4
                    ? "auto"
                    : "metadata";


            preview.load();

        }


        if (
            i %
            2 ===
            1
        ) {

            await wait(
                90
            );

        }

    }

}


/* =====================================================
   LOAD PROJECTS
   ===================================================== */

async function loadProjects() {

    try {

        const response =
            await fetch(
                FILMS_JSON,
                {
                    cache:
                        "no-store"
                }
            );


        if (
            !response.ok
        ) {

            throw new Error(
                "films.json could not be loaded"
            );

        }


        const data =
            await response.json();


        projects =
            data.filter(
                project =>
                    project &&
                    typeof project.title ===
                        "string" &&
                    Array.isArray(
                        project.videos
                    ) &&
                    project.videos.length
            );


        if (
            !projects.length
        ) {

            return;

        }


        buildIndex();


        currentProjectIndex =
            0;


        currentVideoIndex =
            0;


        setSoundLabelImmediately();


        await loadCurrentVideo(
            true
        );


        requestAnimationFrame(
            () => {

                warmIndexPreviews();

            }
        );

    }

    catch (
        error
    ) {

        console.error(
            error
        );

    }

}


/* =====================================================
   RESIZE
   ===================================================== */

let resizeTimer =
    null;


window.addEventListener(
    "resize",
    () => {

        if (
            resizeTimer
        ) {

            clearTimeout(
                resizeTimer
            );

        }


        resizeTimer =
            setTimeout(
                () => {

                    fitMainVideo();


                    if (
                        projectAllMode
                    ) {

                        layoutProjectAllGrid();

                    }


                    document
                        .querySelectorAll(
                            ".project-card"
                        )
                        .forEach(
                            card => {

                                const preview =
                                    card.querySelector(
                                        "video"
                                    );


                                const wrap =
                                    card.querySelector(
                                        ".card-video-wrap"
                                    );


                                if (
                                    preview &&
                                    wrap
                                ) {

                                    syncIndexCardSize(
                                        preview,
                                        card,
                                        wrap
                                    );

                                }

                            }
                        );

                },
                100
            );

    }
);


/* =====================================================
   VISIBILITY
   ===================================================== */

document.addEventListener(
    "visibilitychange",
    () => {

        if (
            document.hidden
        ) {

            resumeAfterVisibility =
                !video.paused &&
                !video.ended &&
                !indexMode &&
                !projectAllMode;


            video.pause();


            stopAllPreviews();


            return;

        }


        if (
            resumeAfterVisibility &&
            !indexMode &&
            !projectAllMode
        ) {

            video
                .play()
                .catch(
                    () => {}
                );

        }


        resumeAfterVisibility =
            false;


        if (
            indexMode
        ) {

            activatePreviewsIn(
                indexGrid
            );

        }


        if (
            projectAllMode
        ) {

            activatePreviewsIn(
                projectAllGrid
            );

        }

    }
);


/* =====================================================
   INIT
   ===================================================== */

renderIndexWord(
    0
);


loadProjects();

</script>
