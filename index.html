<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;

    width: 100%;
    height: 100%;

    background: transparent;

    overflow: hidden;
}

body {
    cursor: pointer;
}


/* =========================
   LEFT INFORMATION
   ========================= */

.info {
    position: fixed;

    top: 32px;
    left: 48px;

    z-index: 10;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    font-size: 15px;
    font-weight: 400;
    line-height: 1.15;
}


/* =========================
   LOGO
   ========================= */

.logo {
    position: relative;

    display: block;

    width: 190px;
    height: 52px;

    margin: 0;
    padding: 0;

    color: inherit;
    text-decoration: none;

    cursor: pointer;
}

.logo-name {
    position: absolute;

    top: 0;
    left: 0;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    font-size: 15px;
    font-weight: 400;
    line-height: 1.15;

    white-space: nowrap;
}

.logo-aybak {
    position: absolute;

    top: 17px;
    left: 0;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    font-size: 15px;
    font-weight: 400;
    line-height: 1.15;

    letter-spacing: normal;

    white-space: nowrap;
}

.logo-aybak span {
    display: inline;
}


/* =========================
   NAVIGATION
   ========================= */

.navigation {
    margin: 0;
    padding: 0;
}

.navigation a {
    display: block;

    color: inherit;
    text-decoration: none;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    font-size: 15px;
    font-weight: 400;
    line-height: 1.15;
}

.navigation a:hover {
    text-decoration: underline;
}


/* =========================
   CONTACT / SOCIAL
   ========================= */

.contact {
    margin: 0;
    padding: 0;
}

.social {
    display: flex;

    flex-direction: column;
    gap: 0;

    margin: 0;
    padding: 0;
}

.info a {
    color: inherit;
    text-decoration: none;
    font-weight: 400;
}

.info a:hover {
    text-decoration: underline;
}


/* =========================
   VIDEO
   ========================= */

#video-container {
    position: fixed;

    inset: 0;

    width: 100vw;
    height: 100vh;

    display: flex;

    align-items: center;
    justify-content: center;

    z-index: 1;
}


/*
   IMPORTANT:

   The interaction layer is exactly
   the size of the actual video.

   Therefore the white space above
   and below the video does NOT count
   as hover.
*/

#video-wrapper {
    position: relative;

    display: flex;

    align-items: center;
    justify-content: center;

    width: auto;
    height: auto;

    max-width: 100vw;
    max-height: 100vh;
}

#film-video {
    display: block;

    width: auto;
    height: auto;

    max-width: 90vw;
    max-height: 88vh;

    object-fit: contain;

    user-select: none;
    -webkit-user-select: none;

    cursor: pointer;
}


/* =========================
   MOBILE
   ========================= */

@media (max-width: 600px) {

    .info {
        top: 20px;
        left: 24px;

        font-size: 13px;
    }

    .logo {
        width: 160px;
        height: 45px;

        margin-bottom: 0;
    }

    .logo-name {
        font-size: 13px;
    }

    .logo-aybak {
        top: 15px;

        font-size: 13px;

        letter-spacing: normal;
    }

    #video-container {
        padding: 0 24px;
    }

    #film-video {
        max-width: 100%;
        max-height: 72vh;
    }
}

</style>

</head>


<body>


<!-- =====================================================
     INFORMATION
     ===================================================== -->

<div class="info">


    <!-- LOGO -->

    <a
        class="logo"
        href="https://denizalpaybak.com/"
        target="_self"
    >

        <span
            class="logo-name"
            id="logo-name"
        >
            Denizalp
        </span>

        <span class="logo-aybak">

            <span id="letter-a">a</span><span id="letter-y">y</span><span id="letter-b">b</span><span id="letter-a2">a</span><span id="letter-k">k</span>

        </span>

    </a>


    <!-- NAVIGATION -->

    <div class="navigation">

        <a
            href="https://photography.denizalpaybak.com"
            target="_self"
        >
            photography
        </a>

        <a
            href="https://film.denizalpaybak.com"
            target="_self"
        >
            film
        </a>

    </div>


    <!-- CONTACT -->

    <div class="contact">

        <a
            href="mailto:d@denizalpaybak.com"
            target="_blank"
            rel="noopener"
        >
            d@denizalpaybak.com
        </a>

    </div>


    <!-- SOCIAL -->

    <div class="social">

        <a
            href="https://www.instagram.com/denizalpaybak/"
            target="_blank"
            rel="noopener"
        >
            instagram @denizalpaybak
        </a>

        <a
            href="https://models.com/people/denizalp-aybak"
            target="_blank"
            rel="noopener"
        >
            models.com
        </a>

    </div>


</div>


<!-- =====================================================
     VIDEO
     ===================================================== -->

<div id="video-container">

    <div id="video-wrapper">

        <video
            id="film-video"
            muted
            autoplay
            playsinline
            preload="auto"
        ></video>

    </div>

</div>


<script>


/* =====================================================
   R2
   ===================================================== */

const R2_BASE =
    "https://pub-14d397941aeb40e5bd3f66ac028fef80.r2.dev/";


/*
   Temporary film list.

   We will replace this with films.json
   after the interaction system is confirmed.
*/

const films = [
    "001.mp4"
];


let currentFilm = 0;

let isMuted = true;


/* =====================================================
   ELEMENTS
   ===================================================== */

const video =
    document.getElementById(
        "film-video"
    );

const videoWrapper =
    document.getElementById(
        "video-wrapper"
    );


/* =====================================================
   LOAD FILM
   ===================================================== */

function loadFilm(
    index,
    autoplay = true
) {

    if (films.length === 0) {
        return;
    }


    if (index < 0) {

        index =
            films.length - 1;

    }


    if (
        index >= films.length
    ) {

        index = 0;

    }


    currentFilm = index;


    video.pause();


    video.src =
        R2_BASE +
        films[currentFilm];


    video.load();


    video.muted =
        isMuted;


    if (autoplay) {

        const promise =
            video.play();

        if (
            promise !== undefined
        ) {

            promise.catch(
                () => {}
            );

        }

    }

}


/* =====================================================
   NEXT
   ===================================================== */

function nextFilm() {

    currentFilm++;

    if (
        currentFilm >=
        films.length
    ) {

        currentFilm = 0;

    }

    loadFilm(
        currentFilm,
        true
    );

}


/* =====================================================
   PREVIOUS
   ===================================================== */

function previousFilm() {

    currentFilm--;

    if (
        currentFilm < 0
    ) {

        currentFilm =
            films.length - 1;

    }

    loadFilm(
        currentFilm,
        true
    );

}


/* =====================================================
   VIDEO END
   ===================================================== */

video.addEventListener(
    "ended",
    () => {

        nextFilm();

    }
);


/* =====================================================
   DESKTOP HOVER
   ===================================================== */


/*
   IMPORTANT:

   Hover is attached to the actual
   video element — NOT video-container.

   Therefore white space above/below
   the video does not trigger hover.
*/

video.addEventListener(
    "mouseenter",
    () => {

        if (
            window.innerWidth <= 600
        ) {
            return;
        }


        /*
           Hover ON:
           sound ON
        */

        isMuted = false;

        video.muted = false;

    }
);


video.addEventListener(
    "mouseleave",
    () => {

        if (
            window.innerWidth <= 600
        ) {
            return;
        }


        /*
           Hover OFF:
           sound OFF
        */

        isMuted = true;

        video.muted = true;

    }
);


/* =====================================================
   DESKTOP CLICK
   ===================================================== */


/*
   Only clicks on the actual video
   are handled.

   LEFT 25%   → PREVIOUS
   CENTER 50% → PLAY / PAUSE
   RIGHT 25%  → NEXT
*/

video.addEventListener(
    "click",
    (event) => {

        if (
            window.innerWidth <= 600
        ) {
            return;
        }


        const rect =
            video.getBoundingClientRect();


        const x =
            event.clientX -
            rect.left;


        const percentage =
            x / rect.width;


        /*
           LEFT 25%
        */

        if (
            percentage < 0.25
        ) {

            previousFilm();

            return;

        }


        /*
           RIGHT 25%
        */

        if (
            percentage > 0.75
        ) {

            nextFilm();

            return;

        }


        /*
           CENTER 50%
        */

        if (
            video.paused
        ) {

            const promise =
                video.play();

            if (
                promise !== undefined
            ) {

                promise.catch(
                    () => {}
                );

            }

        } else {

            video.pause();

        }

    }
);


/* =====================================================
   MOBILE TOUCH
   ===================================================== */

let touchStartX = 0;
let touchStartY = 0;


video.addEventListener(
    "touchstart",
    (event) => {

        if (
            window.innerWidth > 600
        ) {
            return;
        }


        const touch =
            event.changedTouches[0];


        touchStartX =
            touch.clientX;

        touchStartY =
            touch.clientY;

    },
    {
        passive: true
    }
);


video.addEventListener(
    "touchend",
    (event) => {

        if (
            window.innerWidth > 600
        ) {
            return;
        }


        const touch =
            event.changedTouches[0];


        const deltaX =
            touch.clientX -
            touchStartX;


        const deltaY =
            touch.clientY -
            touchStartY;


        const threshold = 50;


        /*
           SWIPE
        */

        if (
            Math.abs(deltaX) >
                threshold &&
            Math.abs(deltaX) >
                Math.abs(deltaY)
        ) {

            /*
               LEFT
            */

            if (
                deltaX < 0
            ) {

                nextFilm();

            }


            /*
               RIGHT
            */

            else {

                previousFilm();

            }


            return;

        }


        /*
           TAP
        */

        /*
           If muted:
           first tap enables sound
           and keeps video playing.
        */

        if (
            video.muted
        ) {

            isMuted = false;

            video.muted = false;


            const promise =
                video.play();

            if (
                promise !== undefined
            ) {

                promise.catch(
                    () => {}
                );

            }


            return;

        }


        /*
           Sound is already on:
           tap = play / pause.
        */

        if (
            video.paused
        ) {

            const promise =
                video.play();

            if (
                promise !== undefined
            ) {

                promise.catch(
                    () => {}
                );

            }

        }

        else {

            video.pause();

        }

    },
    {
        passive: true
    }
);


/* =====================================================
   PREVENT DOUBLE TAP ZOOM
   ===================================================== */

let lastTouchEnd = 0;


document.addEventListener(
    "touchend",
    (event) => {

        const now =
            Date.now();


        if (
            now -
            lastTouchEnd <=
            300
        ) {

            event.preventDefault();

        }


        lastTouchEnd = now;

    },
    {
        passive: false
    }
);


/* =====================================================
   LOGO ANIMATION
   ===================================================== */

const logo =
    document.querySelector(
        ".logo"
    );

const logoName =
    document.getElementById(
        "logo-name"
    );


const letters = [

    document.getElementById(
        "letter-a"
    ),

    document.getElementById(
        "letter-y"
    ),

    document.getElementById(
        "letter-b"
    ),

    document.getElementById(
        "letter-a2"
    ),

    document.getElementById(
        "letter-k"
    )

];


const lowercase = [
    "a",
    "y",
    "b",
    "a",
    "k"
];


const uppercase = [
    "A",
    "Y",
    "B",
    "A",
    "K"
];


let logoState = 0;

let logoTarget = 0;

let logoTimer = null;


/* =====================================================
   LOGO STATE
   ===================================================== */

function setLogoState(
    state
) {

    logoState = state;


    if (
        state === 0
    ) {

        logoName.textContent =
            "Denizalp";

    }

    else {

        logoName.textContent =
            "denizalp";

    }


    for (
        let i = 0;
        i < letters.length;
        i++
    ) {

        if (
            i < state
        ) {

            letters[i]
                .textContent =
                uppercase[i];

        }

        else {

            letters[i]
                .textContent =
                lowercase[i];

        }

    }

}


/* =====================================================
   CANCEL LOGO
   ===================================================== */

function cancelLogoAnimation() {

    if (
        logoTimer !== null
    ) {

        clearTimeout(
            logoTimer
        );

        logoTimer = null;

    }

}


/* =====================================================
   MOVE LOGO
   ===================================================== */

function moveLogo() {

    if (
        logoState ===
        logoTarget
    ) {

        logoTimer = null;

        return;

    }


    if (
        logoState <
        logoTarget
    ) {

        setLogoState(
            logoState + 1
        );

    }

    else {

        setLogoState(
            logoState - 1
        );

    }


    logoTimer =
        setTimeout(
            moveLogo,
            120
        );

}


/* =====================================================
   ANIMATE TO
   ===================================================== */

function animateTo(
    target
) {

    logoTarget =
        target;


    cancelLogoAnimation();


    moveLogo();

}


/* =====================================================
   DESKTOP LOGO
   ===================================================== */

logo.addEventListener(
    "mouseenter",
    () => {

        if (
            window.matchMedia(
                "(min-width: 601px)"
            ).matches
        ) {

            animateTo(5);

        }

    }
);


logo.addEventListener(
    "mouseleave",
    () => {

        if (
            window.matchMedia(
                "(min-width: 601px)"
            ).matches
        ) {

            animateTo(0);

        }

    }
);


/* =====================================================
   MOBILE LOGO
   ===================================================== */

let mobileCycleTimer =
    null;


function startMobileCycle() {

    mobileCycleTimer =
        setTimeout(
            () => {

                animateTo(5);


                mobileCycleTimer =
                    setTimeout(
                        () => {

                            animateTo(0);


                            mobileCycleTimer =
                                setTimeout(
                                    () => {

                                        startMobileCycle();

                                    },
                                    600 + 2000
                                );

                        },
                        600 + 2000
                    );

            },
            2000
        );

}


if (
    window.matchMedia(
        "(max-width: 600px)"
    ).matches
) {

    setLogoState(0);

    startMobileCycle();

}


/* =====================================================
   START
   ===================================================== */

setLogoState(0);

loadFilm(
    0,
    true
);


</script>

</body>
</html>
