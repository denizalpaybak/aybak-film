/* =====================================================
   PREVIEW VIDEO
   ===================================================== */

function createPreviewVideo(
    filename,
    {
        eagerMetadata =
            false
    } = {}
) {

    const preview =
        document.createElement(
            "video"
        );


    preview.dataset.masterSrc =
        videoUrl(
            filename
        );


    preview.dataset.src =
        previewVideoUrl(
            filename
        );


    /*
        Poster-first loading:

        The JPG appears immediately, before MP4 metadata or
        decoded video frames are ready. The browser keeps the
        poster visible until the preview has a drawable frame.
    */

    preview.poster =
        posterVideoUrl(
            filename
        );


    preview.dataset.usingFallback =
        "0";


    preview.muted =
        true;


    preview.defaultMuted =
        true;


    preview.playsInline =
        true;


    /*
        The files in /film-previews/ are already six-second
        web previews, so native loop is both simpler and
        smoother than seeking currentTime back to zero from
        a timeupdate handler.
    */

    preview.loop =
        true;


    preview.preload =
        eagerMetadata
            ? "metadata"
            : "none";


    preview.disablePictureInPicture =
        true;


    preview.setAttribute(
        "aria-hidden",
        "true"
    );


    /*
        Safety fallback:

        If one preview was accidentally not uploaded or was
        named differently, that one tile can still fall back
        to the original master instead of remaining blank.

        This should normally never run.
    */

    preview.addEventListener(
        "error",
        () => {

            if (
                preview.dataset.usingFallback ===
                "1"
            ) {

                return;

            }


            preview.dataset.usingFallback =
                "1";


            preview.dataset.src =
                preview.dataset.masterSrc;


            preview.dataset.previewReady =
                "0";


            preview.dataset.previewQueued =
                "0";


            preview.removeAttribute(
                "src"
            );


            preview.load();


            if (
                preview.dataset.previewWanted ===
                "1"
            ) {

                activatePreview(
                    preview
                );

            }

        }
    );


    if (
        eagerMetadata
    ) {

        preview.src =
            preview.dataset.src;


        preview.load();

    }


    return preview;

}


/* =====================================================
   POSTER PRELOAD
   ===================================================== */

const posterWarmCache =
    new Set();


function warmPoster(
    filename
) {

    const url =
        posterVideoUrl(
            filename
        );


    if (
        posterWarmCache.has(
            url
        )
    ) {

        return;

    }


    posterWarmCache.add(
        url
    );


    const image =
        new Image();


    image.decoding =
        "async";


    image.src =
        url;

}


function warmVisibleIndexPosters() {

    if (
        !projects.length
    ) {

        return;

    }


    const visibleCount =
        isPhoneLayout()
            ? 4
            : 7;


    getChronologicalProjects()
        .slice(
            0,
            visibleCount
        )
        .forEach(
            ({ project }) => {

                warmPoster(
                    project.videos[0]
                );

            }
        );

}


/* =====================================================
   PREVIEW ACTIVATION MANAGER
   ===================================================== */

/*
    The old site could ask many full-resolution MP4 files
    to initialise at the same moment.

    That is particularly expensive on mobile Safari:
    network range requests, metadata parsing and video
    decoder startup all compete with each other.

    We now limit only the EXPENSIVE INITIALISATION step.

    Once a preview is ready it can keep playing, but new
    previews enter through a small queue.
*/

const PREVIEW_INIT_CONCURRENCY =
    isPhoneLayout()
        ? 3
        : 6;


let previewInitActive =
    0;


const previewInitQueue =
    [];


function releasePreviewInitSlot() {

    previewInitActive =
        Math.max(
            0,
            previewInitActive - 1
        );


    processPreviewInitQueue();

}


function processPreviewInitQueue() {

    while (
        previewInitActive <
            PREVIEW_INIT_CONCURRENCY &&
        previewInitQueue.length
    ) {

        const preview =
            previewInitQueue.shift();


        if (
            preview
        ) {

            preview.dataset.previewQueued =
                "0";

        }


        if (
            !preview ||
            preview.dataset.previewWanted !==
                "1"
        ) {

            continue;

        }


        if (
            preview.dataset.previewReady ===
            "1"
        ) {

            preview
                .play()
                .catch(
                    () => {}
                );


            continue;

        }


        previewInitActive++;


        let released =
            false;


        const release =
            () => {

                if (
                    released
                ) {

                    return;

                }


                released =
                    true;


                preview.dataset.previewReady =
                    "1";


                releasePreviewInitSlot();

            };


        const onReady =
            () => {

                release();


                if (
                    preview.dataset.previewWanted ===
                    "1"
                ) {

                    preview
                        .play()
                        .catch(
                            () => {}
                        );

                }

            };


        const onError =
            () => {

                release();

            };


        preview.addEventListener(
            "canplay",
            onReady,
            {
                once: true
            }
        );


        preview.addEventListener(
            "error",
            onError,
            {
                once: true
            }
        );


        if (
            !preview.getAttribute(
                "src"
            )
        ) {

            preview.src =
                preview.dataset.src;

        }


        /*
            "auto" matters here.

            On the previous mobile implementation we often
            switched an intersecting preview only to
            preload="metadata" and immediately called play().
            Some browsers then took a long time before enough
            media bytes were fetched to actually display motion.
        */

        preview.preload =
            "auto";


        preview.load();


        /*
            Avoid a blocked queue forever on an unusually slow
            / failed media request.
        */

        setTimeout(
            release,
            isPhoneLayout()
                ? 2200
                : 1600
        );

    }

}


function activatePreview(
    preview
) {

    preview.dataset.previewWanted =
        "1";


    if (
        preview.dataset.previewReady ===
        "1"
    ) {

        preview
            .play()
            .catch(
                () => {}
            );


        return;

    }


    if (
        preview.dataset.previewQueued ===
        "1"
    ) {

        return;

    }


    preview.dataset.previewQueued =
        "1";


    previewInitQueue.push(
        preview
    );


    processPreviewInitQueue();

}


function deactivatePreview(
    preview
) {

    preview.dataset.previewWanted =
        "0";


    preview.pause();

}


function activatePreviewsIn(
    container
) {

    container
        .querySelectorAll(
            "video[data-src]"
        )
        .forEach(
            activatePreview
        );

}


function stopAllPreviews() {

    document
        .querySelectorAll(
            "#index-view video, #project-all-view video"
        )
        .forEach(
            deactivatePreview
        );

}


/* =====================================================
   PREVIEW OBSERVER
   ===================================================== */

const previewObserver =
    new IntersectionObserver(
        entries => {

            entries.forEach(
                entry => {

                    const preview =
                        entry.target;


                    const allowed =
                        (
                            indexMode &&
                            indexView.contains(
                                preview
                            )
                        ) ||
                        (
                            projectAllMode &&
                            projectAllView.contains(
                                preview
                            )
                        );


                    if (
                        entry.isIntersecting &&
                        allowed
                    ) {

                        activatePreview(
                            preview
                        );

                    }

                    else {

                        deactivatePreview(
                            preview
                        );

                    }

                }
            );

        },
        {
            /*
                Wake only near-visible videos.

                Desktop gets a little more look-ahead;
                phones keep this tight to save bandwidth.
            */
            rootMargin:
                isPhoneLayout()
                    ? "80px"
                    : "260px"
        }
    );


function observePreview(
    preview
) {

    previewObserver.observe(
        preview
    );

}


/* =====================================================
   VIEW ALL BOUNDS
   ===================================================== */

function syncProjectAllBounds() {

    if (
        !projectAllMode
    ) {

        return;

    }


    /*
        LANDSCAPE:
        match photography's broad central field.

        Previews are allowed to spread almost edge-to-edge
        horizontally. The info block remains above them,
        while the title/date + all/close row remains below.
    */

    if (
        isPhoneLandscape()
    ) {

        const infoRect =
            info.getBoundingClientRect();


        const metaRect =
            projectMeta.getBoundingClientRect();


        const top =
            Math.ceil(
                infoRect.bottom + 8
            );


        const bottom =
            Math.floor(
                metaRect.top - 8
            );


        projectAllView.style.left =
            "24px";


        projectAllView.style.right =
            "24px";


        projectAllView.style.top =
            `${top}px`;


        projectAllView.style.height =
            `${Math.max(
                82,
                bottom - top
            )}px`;


        return;

    }


    const infoRect =
        info
            .getBoundingClientRect();


    const metaRect =
        projectMeta
            .getBoundingClientRect();


    const side =
        parseFloat(
            getComputedStyle(
                document.documentElement
            ).getPropertyValue(
                "--side"
            )
        ) || 48;


    const topGap =
        isPhonePortrait()
            ? 10
            : 14;


    const bottomGap =
        isPhonePortrait()
            ? 10
            : 14;


    const top =
        Math.ceil(
            infoRect.bottom +
            topGap
        );


    const bottom =
        Math.floor(
            metaRect.top -
            bottomGap
        );


    projectAllView.style.left =
        `${side}px`;


    projectAllView.style.right =
        `${side}px`;


    projectAllView.style.top =
        `${top}px`;


    projectAllView.style.height =
        `${Math.max(
            80,
            bottom -
            top
        )}px`;

}


/* =====================================================
   VIEW ALL RATIOS
   ===================================================== */

function getProjectAllRatios() {

    return [
        ...projectAllGrid
            .querySelectorAll(
                "video"
            )
    ].map(
        preview => {

            const storedRatio =
                Number.parseFloat(
                    preview.dataset.ratio ||
                    ""
                );


            if (
                Number.isFinite(
                    storedRatio
                ) &&
                storedRatio > 0
            ) {

                return storedRatio;

            }


            if (
                preview.videoWidth &&
                preview.videoHeight
            ) {

                return (
                    preview.videoWidth /
                    preview.videoHeight
                );

            }


            return 16 / 9;

        }
    );

}


/* =====================================================
   SMART VIEW ALL LAYOUT
   ===================================================== */

/*
    VIEW ALL no longer uses equal-size CSS grid cells.

    Equal cells waste a lot of mobile space because a contained
    landscape video sitting inside a tall cell can only use a small
    fraction of that cell's width. Instead, we test every contiguous
    row grouping while preserving the film order.

    Inside a row all thumbnails share one visible height and keep
    their real aspect ratio. A row therefore behaves like a strip of
    contact-sheet frames rather than a set of empty boxes.

    Example with three landscape clips on a portrait phone:

        old: 3 equal-height grid rows -> narrow videos in the middle
        new: 1 full-width clip + 2 half-width clips

    The chosen arrangement is the one that gives the greatest total
    visible video area inside the available View All field.
*/

function getProjectAllGap() {

    return isPhoneLayout()
        ? 5
        : 7;

}


function getContiguousRowPartitions(
    count
) {

    if (
        count <= 0
    ) {

        return [];

    }


    const partitions =
        [];


    const breakCount =
        count - 1;


    const combinations =
        1 << breakCount;


    for (
        let mask = 0;
        mask < combinations;
        mask++
    ) {

        const rows =
            [];


        let start =
            0;


        for (
            let i = 0;
            i < breakCount;
            i++
        ) {

            if (
                mask &
                (1 << i)
            ) {

                rows.push(
                    [
                        start,
                        i + 1
                    ]
                );


                start =
                    i + 1;

            }

        }


        rows.push(
            [
                start,
                count
            ]
        );


        partitions.push(
            rows
        );

    }


    return partitions;

}


function calculateProjectAllLayout() {

    const rect =
        projectAllView
            .getBoundingClientRect();


    const ratios =
        getProjectAllRatios();


    const count =
        ratios.length;


    if (
        !count ||
        rect.width <= 0 ||
        rect.height <= 0
    ) {

        return null;

    }


    const gap =
        getProjectAllGap();


    /*
        Exhaustive row grouping is tiny for portfolio-sized projects,
        but keep a safe fallback if a future project contains many clips.
    */
    const partitions =
        count <= 12
            ? getContiguousRowPartitions(
                count
            )
            : [
                Array.from(
                    {
                        length:
                            Math.ceil(
                                count / 3
                            )
                    },
                    (_, rowIndex) => [
                        rowIndex * 3,
                        Math.min(
                            count,
                            rowIndex * 3 + 3
                        )
                    ]
                )
            ];


    let best =
        null;


    partitions.forEach(
        rows => {

            const rowData =
                rows.map(
                    ([start, end]) => {

                        const rowRatios =
                            ratios.slice(
                                start,
                                end
                            );


                        const horizontalGaps =
                            gap *
                            Math.max(
                                0,
                                rowRatios.length - 1
                            );


                        const availableRowWidth =
                            Math.max(
                                1,
                                rect.width -
                                horizontalGaps
                            );


                        const ratioSum =
                            rowRatios.reduce(
                                (
                                    sum,
                                    ratio
                                ) =>
                                    sum + ratio,
                                0
                            );


                        const fullWidthHeight =
                            availableRowWidth /
                            ratioSum;


                        return {
                            start,
                            end,
                            ratios:
                                rowRatios,
                            horizontalGaps,
                            fullWidthHeight
                        };

                    }
                );


            const verticalGaps =
                gap *
                Math.max(
                    0,
                    rowData.length - 1
                );


            const availableHeight =
                Math.max(
                    1,
                    rect.height -
                    verticalGaps
                );


            const naturalHeight =
                rowData.reduce(
                    (
                        sum,
                        row
                    ) =>
                        sum +
                        row.fullWidthHeight,
                    0
                );


            const scale =
                Math.min(
                    1,
                    availableHeight /
                    naturalHeight
                );


            let occupiedArea =
                0;


            let smallestHeight =
                Infinity;


            rowData.forEach(
                row => {

                    const height =
                        row.fullWidthHeight *
                        scale;


                    smallestHeight =
                        Math.min(
                            smallestHeight,
                            height
                        );


                    row.ratios.forEach(
                        ratio => {

                            occupiedArea +=
                                ratio *
                                height *
                                height;

                        }
                    );

                }
            );


            /*
                Area is the main goal. The tiny secondary term avoids
                pathological solutions containing an almost microscopic row
                when two layouts have practically identical visible area.
            */
            const score =
                occupiedArea +
                smallestHeight *
                0.01;


            if (
                !best ||
                score > best.score
            ) {

                best = {
                    rows:
                        rowData,
                    scale,
                    gap,
                    score,
                    verticalGaps
                };

            }

        }
    );


    if (
        !best
    ) {

        return null;

    }


    const usedHeight =
        best.rows.reduce(
            (
                sum,
                row
            ) =>
                sum +
                row.fullWidthHeight *
                best.scale,
            0
        ) +
        best.verticalGaps;


    let y =
        Math.max(
            0,
            (
                rect.height -
                usedHeight
            ) / 2
        );


    const items =
        new Array(
            count
        );


    best.rows.forEach(
        row => {

            const height =
                row.fullWidthHeight *
                best.scale;


            const visibleWidths =
                row.ratios.map(
                    ratio =>
                        ratio *
                        height
                );


            const rowWidth =
                visibleWidths.reduce(
                    (
                        sum,
                        width
                    ) =>
                        sum + width,
                    0
                ) +
                row.horizontalGaps;


            let x =
                Math.max(
                    0,
                    (
                        rect.width -
                        rowWidth
                    ) / 2
                );


            visibleWidths.forEach(
                (
                    width,
                    localIndex
                ) => {

                    const index =
                        row.start +
                        localIndex;


                    items[index] = {
                        left:
                            x,
                        top:
                            y,
                        width,
                        height
                    };


                    x +=
                        width +
                        best.gap;

                }
            );


            y +=
                height +
                best.gap;

        }
    );


    return {
        items
    };

}


/* =====================================================
   APPLY VIEW ALL
   ===================================================== */

function layoutProjectAllGrid() {

    syncProjectAllBounds();


    const layout =
        calculateProjectAllLayout();


    if (
        !layout
    ) {

        return;

    }


    const thumbs =
        [
            ...projectAllGrid
                .querySelectorAll(
                    ".project-all-thumb"
                )
        ];


    thumbs.forEach(
        (
            thumb,
            index
        ) => {

            const item =
                layout.items[
                    index
                ];


            if (
                !item
            ) {

                return;

            }


            thumb.style.left =
                `${item.left}px`;


            thumb.style.top =
                `${item.top}px`;


            thumb.style.width =
                `${item.width}px`;


            thumb.style.height =
                `${item.height}px`;

        }
    );

}


/* =====================================================
   BUILD VIEW ALL
   ===================================================== */

function buildProjectAllGrid() {

    const project =
        currentProject();


    projectAllGrid.innerHTML =
        "";


    project.videos.forEach(
        (
            filename,
            index
        ) => {

            const button =
                document.createElement(
                    "button"
                );


            button.type =
                "button";


            button.className =
                "project-all-thumb";


            const preview =
                createPreviewVideo(
                    filename,
                    {
                        /*
                            These are now lightweight /film-previews/
                            files. Resolve metadata immediately so View
                            All knows the real aspect ratios before it
                            chooses its grid.
                        */
                        eagerMetadata:
                            true
                    }
                );


            const posterProbe =
                new Image();


            posterProbe.decoding =
                "async";


            posterProbe.addEventListener(
                "load",
                () => {

                    if (
                        posterProbe.naturalWidth &&
                        posterProbe.naturalHeight
                    ) {

                        preview.dataset.ratio =
                            String(
                                posterProbe.naturalWidth /
                                posterProbe.naturalHeight
                            );


                        if (
                            projectAllMode
                        ) {

                            layoutProjectAllGrid();

                        }

                    }

                },
                {
                    once: true
                }
            );


            posterProbe.src =
                preview.poster;


            preview.addEventListener(
                "loadedmetadata",
                () => {

                    if (
                        preview.videoWidth &&
                        preview.videoHeight
                    ) {

                        preview.dataset.ratio =
                            String(
                                preview.videoWidth /
                                preview.videoHeight
                            );

                    }

                    if (
                        projectAllMode
                    ) {

                        layoutProjectAllGrid();

                    }

                }
            );


            button.appendChild(
                preview
            );


            button.addEventListener(
                "click",
                async event => {

                    event.stopPropagation();


                    await leaveProjectAll(
                        {
                            selectedIndex:
                                index,

                            resume:
                                false
                        }
                    );


                    loadCurrentVideo(
                        true
                    );

                }
            );


            projectAllGrid.appendChild(
                button
            );


            observePreview(
                preview
            );

        }
    );

}

/* =====================================================
   ENTER VIEW ALL
   ===================================================== */

async function enterProjectAll() {

    if (
        projectAllMode ||
        projectViewAnimating ||
        indexMode
    ) {

        return;

    }


    projectViewAnimating =
        true;


    autoplayBeforeProjectAll =
        !video.paused;


    video.pause();


    const project =
        currentProject();


    buildProjectAllGrid();


    projectAllMode =
        true;


    body.classList.add(
        "project-all-mode"
    );


    requestAnimationFrame(
        () => {

            layoutProjectAllGrid();


            /*
                Desktop may initialise the visible View All set
                immediately.

                On phones we deliberately do NOT wake every MP4.
                IntersectionObserver starts only previews actually
                inside / immediately next to the visible composition.
            */

            if (
                !isPhoneLayout()
            ) {

                activatePreviewsIn(
                    projectAllGrid
                );

            }

        }
    );


    const buttonTarget =
        (
            hasHover() &&
            viewButtonHovered
        )
            ? "CLOSE"
            : "close";


    await Promise.all(
        [

            animateCase(
                projectTitle,
                project.title,
                true
            ),

            animateCase(
                projectDate,
                project.date || "",
                true
            ),

            morphSequential(
                projectCounter,
                getAllCounterText(
                    project.videos.length
                ),
                STATE_MORPH_DURATION
            ),

            morphSequential(
                viewAllButton,
                buttonTarget,
                STATE_MORPH_DURATION
            )

        ]
    );


    projectViewAnimating =
        false;

}


/* =====================================================
   LEAVE VIEW ALL
   ===================================================== */

async function leaveProjectAll(
    {
        selectedIndex =
            null,

        resume =
            true
    } = {}
) {

    if (
        !projectAllMode ||
        projectViewAnimating
    ) {

        return;

    }


    projectViewAnimating =
        true;


    stopAllPreviews();


    const project =
        currentProject();


    if (
        selectedIndex !==
        null
    ) {

        currentVideoIndex =
            selectedIndex;


        /*
            A deliberate VIEW ALL selection means: show every remaining
            video in this project before returning to max-2 rotation.
        */
        fullProjectMode =
            true;


        fullProjectEndIndex =
            project.videos.length - 1;


        normalSequenceProjectIndex =
            null;


        normalSequenceVideos =
            [];


        normalSequencePosition =
            -1;


        syncProjectUrl(
            "push"
        );

    }


    const buttonTarget =
        (
            hasHover() &&
            viewButtonHovered
        )
            ? "VIEW ALL"
            : "view all";


    await Promise.all(
        [

            animateCase(
                projectTitle,
                project.title,
                false
            ),

            animateCase(
                projectDate,
                project.date || "",
                false
            ),

            morphSequential(
                projectCounter,
                getCounterText(
                    currentVideoIndex,
                    project.videos.length
                ),
                STATE_MORPH_DURATION
            ),

            morphSequential(
                viewAllButton,
                buttonTarget,
                STATE_MORPH_DURATION
            )

        ]
    );


    projectAllMode =
        false;


    body.classList.remove(
        "project-all-mode"
    );


    projectAllGrid.innerHTML =
        "";


    projectViewAnimating =
        false;


    if (
        selectedIndex !== null
    ) {

        projectAllOpenedFromIndex =
            false;

        indexSelectionBeforeProjectAll =
            null;

    }


    if (
        projectAllOpenedFromIndex &&
        selectedIndex === null
    ) {

        projectAllOpenedFromIndex =
            false;

        await enterIndex(
            {
                preserveSelection: true,
                preserveAutoplayState: true
            }
        );

        return;

    }


    if (
        resume &&
        autoplayBeforeProjectAll
    ) {

        video
            .play()
            .catch(
                () => {}
            );

    }

}

/* =====================================================
   INDEX ORDER
   ===================================================== */

function getChronologicalProjects() {

    return projects
        .map(
            (
                project,
                originalIndex
            ) => ({
                project,
                originalIndex
            })
        )
        .sort(
            (
                a,
                b
            ) => {

                const orderA =
                    Number.isFinite(
                        a.project.indexOrder
                    )
                        ? a.project.indexOrder
                        : 999;

                const orderB =
                    Number.isFinite(
                        b.project.indexOrder
                    )
                        ? b.project.indexOrder
                        : 999;

                return (
                    orderA -
                    orderB
                ) || (
                    a.originalIndex -
                    b.originalIndex
                );

            }
        );

}

/* =====================================================
   INDEX CASE CONTROLLER
   ===================================================== */

function createCaseController(
    element,
    baseText
) {

    const base =
        String(
            baseText
        ).toLowerCase();

    const positions =
        getMorphPositions(
            base
        );

    const total =
        positions.length;

    let state =
        0;

    let frameId =
        null;

    function render() {

        const activePositions =
            new Set(
                positions.slice(
                    0,
                    state
                )
            );

        renderInteractiveTypography(
            element,
            renderCaseFromActivePositions(
                base,
                activePositions
            ),
            activePositions
        );

    }

    function animateTo(
        target
    ) {

        if (
            frameId !== null
        ) {

            cancelAnimationFrame(
                frameId
            );

        }

        const startState =
            state;

        if (
            startState === target
        ) {

            render();
            return Promise.resolve();

        }

        const start =
            performance.now();

        return new Promise(
            resolve => {

                function frame(
                    now
                ) {

                    const progress =
                        Math.min(
                            1,
                            (
                                now -
                                start
                            ) /
                            CASE_DURATION
                        );

                    state =
                        Math.round(
                            startState +
                            (
                                target -
                                startState
                            ) *
                            progress
                        );

                    render();

                    if (
                        progress < 1
                    ) {

                        frameId =
                            requestAnimationFrame(
                                frame
                            );

                    }

                    else {

                        state =
                            target;

                        render();

                        frameId =
                            null;

                        resolve();

                    }

                }

                frameId =
                    requestAnimationFrame(
                        frame
                    );

            }
        );

    }

    render();

    return {
        upper() {
            return animateTo(
                total
            );
        },
        lower() {
            return animateTo(
                0
            );
        }
    };

}

function stopIndexPreview() {

    if (
        !indexPreviewVideo

        return;
